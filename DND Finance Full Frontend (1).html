                            }
                        }
                    } catch (e) {
                        this.showToast(this.lang === 'ID' ? 'Gagal memindai struk' : 'Receipt scan failed');
                    } finally {
                        this.isScanningReceipt = false;
                        event.target.value = '';
                    }
                },

                openWalletModal() {
                    this.newWalletName = '';
                    this.showWalletModal = true;
                },

                async addWallet() {
                    const name = this.newWalletName.trim();
                    if (!name || this.banks.includes(name)) return;
                    this.banks.push(name);
                    this.newWalletName = '';
                    this.saveLocalState();
                    this.syncWorkspaceToBackend();
                    this.updateAllCharts();
                    try {
                        await fetch('/api/banks', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name })
                        });
                    } catch (e) {}
                },

                async removeWallet(name) {
                    if (this.banks.length <= 1) return;
                    this.banks = this.banks.filter(b => b !== name);
                    this.saveLocalState();
                    this.syncWorkspaceToBackend();
                    this.updateAllCharts();
                    try {
                        await fetch(`/api/banks/${encodeURIComponent(name)}`, { method: 'DELETE' });
                    } catch (e) {}
                },

                openCategoryModal() {
                    this.newCategoryName = '';
                    this.showCategoryModal = true;
                },

                async addCategory() {
                    const name = this.newCategoryName.trim();
                    if (!name || this.categories.includes(name)) return;
                    this.categories.push(name);
                    this.newCategoryName = '';
                    this.saveLocalState();
                    this.syncWorkspaceToBackend();
                    try {
                        await fetch('/api/categories', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name })
                        });
                    } catch (e) {}
                },

                async removeCategory(name) {
                    if (this.categories.length <= 1) return;
                    this.categories = this.categories.filter(c => c !== name);
                    this.saveLocalState();
                    this.syncWorkspaceToBackend();
                    try {
                        await fetch(`/api/categories/${encodeURIComponent(name)}`, { method: 'DELETE' });
                    } catch (e) {}
                },

                openGoalModal() {
                    this.goalForm = { name: '', target: '', current: 0 };
                    this.showGoalModal = true;
                },

                saveGoal() {
                    if (!this.goalForm.name.trim() || Number(this.goalForm.target) <= 0) return;
                    this.goals.push({
                        id: 'goal_' + Date.now(),
                        name: this.goalForm.name.trim(),
                        target: Number(this.goalForm.target),
                        current: Number(this.goalForm.current || 0)
                    });
                    this.showGoalModal = false;
                    this.saveLocalState();
                    this.syncWorkspaceToBackend();
                    this.showToast(this.lang === 'ID' ? 'Target tabungan dibuat' : 'Savings goal created');
                },

                topUpGoal(id) {
                    const g = this.goals.find(item => item.id === id);
                    if (!g) return;
                    const step = this.currency === 'IDR' ? 100000 : 10;
                    g.current = Number(g.current || 0) + step;
                    this.saveLocalState();
                    this.syncWorkspaceToBackend();
                    this.showToast(`+${this.formatCurrency(step)} → ${g.name}`);
                },

                deleteGoal(id) {
                    this.goals = this.goals.filter(g => g.id !== id);
                    this.saveLocalState();
                    this.syncWorkspaceToBackend();
                },

                openBudgetModal() {
                    this.budgetForm = { category: this.categories[0] || 'Food', limit: '' };
                    this.showBudgetModal = true;
                },

                saveBudget() {
                    if (Number(this.budgetForm.limit) <= 0) return;
                    const existing = this.budgets.find(b => b.category === this.budgetForm.category);
                    if (existing) {
                        existing.limit = Number(this.budgetForm.limit);
                    } else {
                        this.budgets.push({
                            id: 'bud_' + Date.now(),
                            category: this.budgetForm.category,
                            limit: Number(this.budgetForm.limit)
                        });
                    }
                    this.showBudgetModal = false;
                    this.saveLocalState();
                    this.syncWorkspaceToBackend();
                    this.showToast(this.lang === 'ID' ? 'Anggaran kategori disimpan' : 'Category budget saved');
                },

                deleteBudget(id) {
                    this.budgets = this.budgets.filter(b => b.id !== id);
                    this.saveLocalState();
                    this.syncWorkspaceToBackend();
                },

                openAutomationModal() {
                    this.editingRuleId = null;
                    this.ruleForm = {
                        name: '',
                        actionType: 'auto_save_goal',
                        minAmount: 0,
                        percent: 20,
                        fixedAmount: 50000,
                        targetGoalName: this.goals[0]?.name || 'Dana Darurat',
                        targetCategory: this.categories[0] || 'Food',
                        sourceWallet: '',
                        destWallet: this.banks[1] || this.banks[0] || 'Bank Jago',
                        thresholdAmount: 500000
                    };
                    this.showAutomationModal = true;
                },

                openEditAutomationModal(rule) {
                    this.editingRuleId = rule.id;
                    this.ruleForm = {
                        name: rule.name || '',
                        actionType: rule.actionType || 'auto_save_goal',
                        minAmount: Number(rule.minAmount || 0),
                        percent: Number(rule.percent || 20),
                        fixedAmount: Number(rule.fixedAmount || 50000),
                        targetGoalName: rule.targetGoalName || 'Dana Darurat',
                        targetCategory: rule.targetCategory || (this.categories[0] || 'Food'),
                        sourceWallet: rule.sourceWallet || '',
                        destWallet: rule.destWallet || (this.banks[1] || this.banks[0] || 'Bank Jago'),
                        thresholdAmount: Number(rule.thresholdAmount || 500000)
                    };
                    this.showAutomationModal = true;
                },

                saveAutomationRule() {
                    if (!this.ruleForm.name.trim()) return;
                    if (this.editingRuleId) {
                        const idx = this.automationRules.findIndex(r => r.id === this.editingRuleId);
                        if (idx !== -1) {
                            this.automationRules[idx] = {
                                ...this.automationRules[idx],
                                ...this.ruleForm,
                                name: this.ruleForm.name.trim()
                            };
                        }
                        this.showToast(this.lang === 'ID' ? 'Aturan Autopilot diperbarui' : 'Autopilot rule updated');
                    } else {
                        this.automationRules.push({
                            id: 'rule_' + Date.now(),
                            ...this.ruleForm,
                            name: this.ruleForm.name.trim(),
                            enabled: true,
                            runCount: 0
                        });
                        this.showToast(this.lang === 'ID' ? 'Aturan Autopilot ditambahkan' : 'Autopilot rule added');
                    }
                    this.editingRuleId = null;
                    this.showAutomationModal = false;
                    this.saveLocalState();
                    this.syncWorkspaceToBackend();
                    this.$nextTick(() => this.refreshIcons());
                },

                activatePresetRule(presetKey) {
                    if (presetKey === 'save20') {
                        this.editingRuleId = null;
                        this.ruleForm = {
                            name: this.t('preset_save20_title'),
                            actionType: 'auto_save_goal',
                            minAmount: 0,
                            percent: 20,
                            fixedAmount: 50000,
                            targetGoalName: this.goals[0]?.name || 'Dana Darurat',
                            targetCategory: this.categories[0] || 'Food',
                            sourceWallet: '',
                            destWallet: this.banks[1] || this.banks[0] || 'Bank Jago',
                            thresholdAmount: 500000
                        };
                        this.showAutomationModal = true;
                    } else if (presetKey === 'alert500k') {
                        this.editingRuleId = null;
                        this.ruleForm = {
                            name: this.t('preset_alert_title'),
                            actionType: 'spend_alert',
                            minAmount: 0,
                            percent: 20,
                            fixedAmount: 50000,
                            targetGoalName: 'Dana Darurat',
                            targetCategory: this.categories[0] || 'Food',
                            sourceWallet: '',
                            destWallet: this.banks[0] || 'Bank BCA',
                            thresholdAmount: 500000
                        };
                        this.showAutomationModal = true;
                    }
                },

                toggleRule(id) {
                    const r = this.automationRules.find(item => item.id === id);
                    if (r) {
                        r.enabled = !r.enabled;
                        this.saveLocalState();
                        this.syncWorkspaceToBackend();
                    }
                },

                deleteRule(id) {
                    this.automationRules = this.automationRules.filter(r => r.id !== id);
                    this.saveLocalState();
                    this.syncWorkspaceToBackend();
                },

                describeRule(rule) {
                    if (rule.actionType === 'auto_save_goal') {
                        return `${rule.percent || 20}% ${this.t('income')} → ${rule.targetGoalName || 'Target'}`;
                    }
                    if (rule.actionType === 'fixed_save_goal') {
                        return `${this.formatCurrency(rule.fixedAmount || 50000)} / ${this.t('income')} → ${rule.targetGoalName || 'Target'}`;
                    }
                    if (rule.actionType === 'auto_transfer_wallet') {
                        return `${rule.percent || 10}% ${this.t('income')} → ${rule.destWallet || 'Wallet'}`;
                    }
                    if (rule.actionType === 'expense_save_goal') {
                        return `${rule.percent || 5}% ${this.t('expense')} → ${rule.targetGoalName || 'Target'}`;
                    }
                    if (rule.actionType === 'expense_transfer_wallet') {
                        return `${rule.percent || 5}% ${this.t('expense')} → ${rule.destWallet || 'Wallet'}`;
                    }
                    if (rule.actionType === 'category_spend_alert') {
                        return `${rule.targetCategory || 'Kategori'} > ${this.formatCurrency(rule.thresholdAmount || 500000)}`;
                    }
                    return `${this.t('expense')} > ${this.formatCurrency(rule.thresholdAmount || 500000)}`;
                },

                executeAutomationEngine(tx) {
                    for (const rule of this.automationRules) {
                        if (!rule.enabled) continue;

                        if (rule.actionType === 'auto_save_goal' && tx.type === 'income' && tx.amount >= Number(rule.minAmount || 0)) {
                            const alloc = Math.round(tx.amount * (Number(rule.percent || 20) / 100));
                            if (alloc > 0) {
                                let targetGoal = this.goals.find(g => g.name.toLowerCase() === (rule.targetGoalName || '').toLowerCase());
                                if (!targetGoal) {
                                    targetGoal = { id: 'goal_' + Date.now(), name: rule.targetGoalName || 'Dana Darurat', target: alloc * 5, current: 0 };
                                    this.goals.push(targetGoal);
                                }
                                targetGoal.current += alloc;
                                rule.runCount = (rule.runCount || 0) + 1;
                                this.showToast(`Autopilot: +${this.formatCurrency(alloc)} → ${targetGoal.name}`);
                            }
                        } else if (rule.actionType === 'fixed_save_goal' && tx.type === 'income' && tx.amount >= Number(rule.minAmount || 0)) {
                            const alloc = Math.round(Number(rule.fixedAmount || 0));
                            if (alloc > 0) {
                                let targetGoal = this.goals.find(g => g.name.toLowerCase() === (rule.targetGoalName || '').toLowerCase());
                                if (!targetGoal) {
                                    targetGoal = { id: 'goal_' + Date.now(), name: rule.targetGoalName || 'Tabungan Utama', target: alloc * 10, current: 0 };
                                    this.goals.push(targetGoal);
                                }
                                targetGoal.current += alloc;
                                rule.runCount = (rule.runCount || 0) + 1;
                                this.showToast(`Autopilot: +${this.formatCurrency(alloc)} → ${targetGoal.name}`);
                            }
                        } else if (rule.actionType === 'auto_transfer_wallet' && tx.type === 'income') {
                            if (!rule.sourceWallet || rule.sourceWallet === tx.account) {
                                const transferAmt = Math.round(tx.amount * (Number(rule.percent || 10) / 100));
                                if (transferAmt > 0 && rule.destWallet && rule.destWallet !== tx.account) {
                                    this.transactions.unshift({
                                        id: Date.now() + 1,
                                        amount: transferAmt,
                                        type: 'transfer',
                                        category: 'Transfer',
                                        account: tx.account,
                                        toAccount: rule.destWallet,
                                        adminFee: 0,
                                        note: `Autopilot: ${rule.name}`,
                                        currency: this.currency,
                                        date: tx.date
                                    });
                                    rule.runCount = (rule.runCount || 0) + 1;
                                }
                            }
                        } else if (rule.actionType === 'expense_save_goal' && tx.type === 'expense' && tx.amount >= Number(rule.minAmount || 0)) {
                            const alloc = Math.round(tx.amount * (Number(rule.percent || 5) / 100));
                            if (alloc > 0) {
                                let targetGoal = this.goals.find(g => g.name.toLowerCase() === (rule.targetGoalName || '').toLowerCase());
                                if (!targetGoal) {
                                    targetGoal = { id: 'goal_' + Date.now(), name: rule.targetGoalName || 'Dana Cashback', target: alloc * 20, current: 0 };
                                    this.goals.push(targetGoal);
                                }
                                targetGoal.current += alloc;
                                rule.runCount = (rule.runCount || 0) + 1;
                                this.showToast(`Autopilot: +${this.formatCurrency(alloc)} → ${targetGoal.name}`);
                            }
                        } else if (rule.actionType === 'expense_transfer_wallet' && tx.type === 'expense' && tx.amount >= Number(rule.minAmount || 0)) {
                            const transferAmt = Math.round(tx.amount * (Number(rule.percent || 5) / 100));
                            if (transferAmt > 0 && rule.destWallet && rule.destWallet !== tx.account) {
                                this.transactions.unshift({
                                    id: Date.now() + 1,
                                    amount: transferAmt,
                                    type: 'transfer',
                                    category: 'Transfer',
                                    account: tx.account,
                                    toAccount: rule.destWallet,
                                    adminFee: 0,
                                    note: `Autopilot: ${rule.name}`,
                                    currency: this.currency,
                                    date: tx.date
                                });
                                rule.runCount = (rule.runCount || 0) + 1;
                            }
                        } else if (rule.actionType === 'spend_alert' && tx.type === 'expense' && tx.amount >= Number(rule.thresholdAmount || 500000)) {
                            rule.runCount = (rule.runCount || 0) + 1;
                            this.showToast(`⚠️ ${rule.name}: ${this.formatCurrency(tx.amount)}`);
                        } else if (rule.actionType === 'category_spend_alert' && tx.type === 'expense' && tx.category === rule.targetCategory && tx.amount >= Number(rule.thresholdAmount || 500000)) {
                            rule.runCount = (rule.runCount || 0) + 1;
                            this.showToast(`⚠️ ${rule.targetCategory}: ${this.formatCurrency(tx.amount)}`);
                        }
                    }
                },

                buildFinancialContextString() {
                    const walletLines = this.banks.map(b => `${b}: ${this.formatCurrency(this.getWalletBalance(b))}`).join(', ');
                    const goalLines = this.goals.map(g => `${g.name} (${this.formatCurrency(g.current)}/${this.formatCurrency(g.target)})`).join(', ') || 'None';
                    return `Total Balance: ${this.formatCurrency(this.totalBalance)}, Income: ${this.formatCurrency(this.totalIncome)}, Expense: ${this.formatCurrency(this.totalExpense)}, Wallets: [${walletLines}], Goals: [${goalLines}], Transaction Count: ${this.transactions.length}`;
                },

                async runQuickAudit() {
                    await this.askAiPreset(this.t('ai_full_audit'));
                },

                async askAiPreset(promptText) {
                    this.aiInput = promptText;
                    await this.submitAiPrompt();
                },

                async submitAiPrompt() {
                    const q = this.aiInput.trim();
                    if (!q || this.isAiLoading) return;
                    this.aiMessages.push({ role: 'user', text: q });
                    this.aiInput = '';
                    this.isAiLoading = true;

                    try {
                        const res = await fetch('/api/ai/analyze', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                prompt: q,
                                lang: this.lang,
                                currency: this.currency,
                                financial_context: this.buildFinancialContextString(),
                                transactions: this.transactions
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            this.aiMessages.push({ role: 'ai', text: data.analysis || '' });
                        } else {
                            this.aiMessages.push({ role: 'ai', text: this.generateLocalAiFallback() });
                        }
                    } catch (e) {
                        this.aiMessages.push({ role: 'ai', text: this.generateLocalAiFallback() });
                    } finally {
                        this.isAiLoading = false;
                    }
                },

                generateLocalAiFallback() {
                    const ratio = this.totalIncome > 0 ? Math.max(0, Math.round(((this.totalIncome - this.totalExpense) / this.totalIncome) * 100)) : 0;
                    if (this.lang === 'ID') {
                        return `### Ringkasan Kondisi Keuangan\n- **Saldo Bersih:** ${this.formatCurrency(this.totalBalance)} (Rasio Sehat: **${ratio}%**)\n- **Pemasukan:** ${this.formatCurrency(this.totalIncome)} | **Pengeluaran:** ${this.formatCurrency(this.totalExpense)}\n- **Saran Utama:** Catat setiap transaksi secara rutin dan aktifkan aturan **Autopilot** untuk menjaga rasio tabungan.`;
                    }
                    return `### Financial Condition Summary\n- **Net Balance:** ${this.formatCurrency(this.totalBalance)} (Health Ratio: **${ratio}%**)\n- **Income:** ${this.formatCurrency(this.totalIncome)} | **Expense:** ${this.formatCurrency(this.totalExpense)}\n- **Key Advice:** Log transactions consistently and activate **Autopilot** rules to protect your savings rate.`;
                },

                formatMarkdownLight(text) {
                    return String(text || '')
                        .replace(/### (.*)/g, '<strong class="block text-sm font-bold text-royal-600 dark:text-royal-400 mb-1">$1</strong>')
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                },

                copyToClipboard(text) {
                    navigator.clipboard.writeText(text);
                    this.showToast(this.lang === 'ID' ? 'Disalin ke papan klip' : 'Copied to clipboard');
                },

                async exportToExcel() {
                    this.showToast(this.lang === 'ID' ? 'Menyiapkan laporan Excel...' : 'Preparing Excel report...');
                    try {
                        const emailParam = this.googleUser && this.googleUser.email ? `&email=${encodeURIComponent(this.googleUser.email)}` : '';
                        const res = await fetch(`/api/export/excel?lang=${this.lang}${emailParam}`);
                        if (res.ok) {
                            const blob = await res.blob();
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `DND_Finance_Report_${this.lang}.xlsx`;
                            document.body.appendChild(a);
                            a.click();
                            a.remove();
                            window.URL.revokeObjectURL(url);
                            return;
                        }
                    } catch (e) {}

                    if (window.XLSX) {
                        const wb = XLSX.utils.book_new();
                        const txRows = this.transactions.map(t => ({
                            Date: t.date,
                            Type: t.type,
                            Category: t.category,
                            Wallet: t.account,
                            Note: t.note,
                            Amount: t.amount
                        }));
                        const ws = XLSX.utils.json_to_sheet(txRows.length ? txRows : [{ Info: 'No transactions' }]);
                        XLSX.utils.book_append_sheet(wb, ws, 'Transactions');
                        XLSX.writeFile(wb, `DND_Finance_Report_${this.lang}.xlsx`);
                    }
                },

                async exportToPDF() {
                    this.showToast(this.lang === 'ID' ? 'Menyiapkan laporan PDF...' : 'Preparing PDF report...');
                    try {
                        const emailParam = this.googleUser && this.googleUser.email ? `&email=${encodeURIComponent(this.googleUser.email)}` : '';
                        const res = await fetch(`/api/export/pdf?lang=${this.lang}${emailParam}`);
                        if (res.ok) {
                            const blob = await res.blob();
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `DND_Finance_Report_${this.lang}.pdf`;
                            document.body.appendChild(a);
                            a.click();
                            a.remove();
                            window.URL.revokeObjectURL(url);
                            return;
                        }
                    } catch (e) {}

                    if (window.jspdf && window.jspdf.jsPDF) {
                        const doc = new window.jspdf.jsPDF();
                        doc.setFontSize(14);
                        doc.text('DND Finance Ledger Report', 14, 18);
                        doc.setFontSize(10);
                        doc.text(`Net Balance: ${this.formatCurrency(this.totalBalance)}`, 14, 26);
                        if (doc.autoTable) {
                            doc.autoTable({
                                startY: 32,
                                head: [['Date', 'Category', 'Type', 'Wallet', 'Amount']],
                                body: this.transactions.map(t => [t.date, t.category, t.type, t.account, this.formatCurrency(t.amount)])
                            });
                        }
                        doc.save(`DND_Finance_Report_${this.lang}.pdf`);
                    }
                },

                updateAllCharts() {
                    if (!window.Chart) return;
                    const textColor = this.isDarkMode ? '#94A3B8' : '#64748B';
                    const gridColor = this.isDarkMode ? 'rgba(255,255,255,0.06)' : 'rgba(15,23,42,0.06)';

                    const trendCtx = document.getElementById('dashboardTrendChart');
                    if (trendCtx) {
                        if (this.charts.trend) this.charts.trend.destroy();
                        const recent = [...this.transactions].slice(0, 7).reverse();
                        const labels = recent.length ? recent.map(t => this.formatDateShort(t.date).slice(5, 10)) : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
                        const incData = recent.length ? recent.map(t => t.type === 'income' ? Number(t.amount) : 0) : [0, 0, 0, 0, 0];
                        const expData = recent.length ? recent.map(t => (t.type === 'expense' || t.type === 'withdrawal') ? Number(t.amount) : 0) : [0, 0, 0, 0, 0];

                        this.charts.trend = new Chart(trendCtx, {
                            type: 'bar',
                            data: {
                                labels,
                                datasets: [
                                    { label: this.t('income'), data: incData, backgroundColor: '#10B981', borderRadius: 6 },
                                    { label: this.t('expense'), data: expData, backgroundColor: '#2563EB', borderRadius: 6 }
                                ]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { labels: { color: textColor, font: { size: 11 } } } },
                                scales: {
                                    x: { ticks: { color: textColor }, grid: { display: false } },
                                    y: { ticks: { color: textColor }, grid: { color: gridColor } }
                                }
                            }
                        });
                    }

                    const catCtx = document.getElementById('categoryDoughnutChart');
                    if (catCtx) {
                        if (this.charts.doughnut) this.charts.doughnut.destroy();
                        const catMap = {};
                        this.transactions.filter(t => t.type === 'expense').forEach(t => {
                            catMap[t.category] = (catMap[t.category] || 0) + Number(t.amount || 0);
                        });
                        const keys = Object.keys(catMap);
                        const vals = Object.values(catMap);
                        this.charts.doughnut = new Chart(catCtx, {
                            type: 'doughnut',
                            data: {
                                labels: keys.length ? keys : ['No Data'],
                                datasets: [{
                                    data: vals.length ? vals : [1],
                                    backgroundColor: vals.length ? ['#2563EB', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#06B6D4'] : ['#E2E8F0'],
                                    borderWidth: 0
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { position: 'bottom', labels: { color: textColor, font: { size: 11 } } } }
                            }
                        });
                    }

                    const walCtx = document.getElementById('walletBarChart');
                    if (walCtx) {
                        if (this.charts.wallet) this.charts.wallet.destroy();
                        const wLabels = this.banks;
                        const wVals = this.banks.map(b => this.getWalletBalance(b));
                        this.charts.wallet = new Chart(walCtx, {
                            type: 'bar',
                            data: {
                                labels: wLabels,
                                datasets: [{
                                    label: this.t('my_wallets'),
                                    data: wVals,
                                    backgroundColor: '#2563EB',
                                    borderRadius: 6
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { display: false } },
                                scales: {
                                    x: { ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } },
                                    y: { ticks: { color: textColor }, grid: { color: gridColor } }
                                }
                            }
                        });
                    }
                },

                showToast(msg) {
                    this.toastMessage = msg;
                    if (this.toastTimer) clearTimeout(this.toastTimer);
                    this.toastTimer = setTimeout(() => {
                        this.toastMessage = '';
                    }, 3200);
                },

                refreshIcons() {
                    if (window.lucide) {
                        window.lucide.createIcons();
                    }
                }
            };
        }
    </script>
</body>
</html>
