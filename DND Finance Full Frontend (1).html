<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DND Finance — Personal Wealth & Cashflow Ledger</title>
    
    <!-- PWA & Mobile App Meta -->
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        cream: {
                            50: '#FFFFFF',
                            100: '#F8FAFC',
                            200: '#E2E8F0',
                            300: '#CBD5E1',
                            400: '#94A3B8',
                            500: '#64748B',
                            700: '#334155',
                            900: '#0F172A',
                        },
                        obsidian: {
                            950: '#0A0D12',
                            900: '#10141B',
                            850: '#161C26',
                            800: '#1E2633',
                            700: '#2A3444',
                        },
                        royal: {
                            50: '#EFF6FF',
                            100: '#DBEAFE',
                            500: '#3B82F6',
                            600: '#2563EB',
                            700: '#1D4ED8',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(15, 23, 42, 0.05)',
                        'card': '0 2px 10px rgba(15, 23, 42, 0.03)',
                        'float': '0 10px 30px -5px rgba(37, 99, 235, 0.25)',
                    }
                }
            }
        }
    </script>

    <!-- Google Identity Services (FedCM & One-Tap) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <!-- SheetJS (Excel Export Fallback) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- jsPDF (PDF Export Fallback) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            background-color: #FFFFFF;
            color: #0F172A;
        }
        html.dark body {
            background-color: #0A0D12;
            color: #F8FAFC;
        }
        h1, h2, h3, .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .pt-safe {
            padding-top: env(safe-area-inset-top, 12px);
        }
        [x-cloak] {
            display: none !important;
        }
        .dnd-brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .dnd-brand-mark svg {
            width: 44px;
            height: 24px;
        }
    </style>
</head>
<body class="antialiased selection:bg-royal-600 selection:text-white transition-colors duration-200"
      x-data="dndFinanceApp()" 
      x-init="initApp()">

    <!-- ========================================== -->
    <!-- TOP HEADER NAVIGATION                      -->
    <!-- ========================================== -->
    <header class="sticky top-0 z-30 bg-white/95 dark:bg-obsidian-950/90 backdrop-blur-md border-b border-cream-200 dark:border-obsidian-800 pt-safe transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
            <!-- Brand Logo (Custom Interlocking DND Monogram) -->
            <div class="flex items-center gap-2.5 cursor-pointer shrink-0" @click="setTab('dashboard')">
                <div class="dnd-brand-mark text-cream-900 dark:text-white">
                    <svg viewBox="0 0 320 175" xmlns="http://www.w3.org/2000/svg" aria-label="DND Logo">
                        <!-- Left D Stem with Flared Serif Tips + Bottom Arc -->
                        <path fill="currentColor" d="M 10,12 C 26,18 32,28 32,48 L 32,126 C 32,146 26,156 10,162 L 66,162 C 110,162 132,138 132,108 C 132,90 124,76 112,66 L 112,92 C 115,99 116,105 116,112 C 116,138 98,155 64,155 L 36,155 C 45,147 49,136 49,120 L 49,20 L 66,20 C 78,20 89,24 98,32 L 185,144 C 194,155 206,162 224,162 L 244,162 C 288,162 312,131 312,87 C 312,43 288,12 244,12 L 210,12 L 210,20 L 242,20 C 276,20 293,48 293,87 C 293,126 276,154 242,154 L 224,154 C 213,154 205,149 197,139 L 111,29 C 100,16 86,12 66,12 Z" />
                        <!-- Center-Right Vertical Pillar of N/D -->
                        <path fill="currentColor" d="M 199,12 C 185,18 179,28 179,48 L 179,98 L 199,124 Z" />
                    </svg>
                </div>
                <span class="font-display font-bold text-sm sm:text-base tracking-tight text-cream-900 dark:text-white truncate max-w-[120px] sm:max-w-[180px]" x-text="pageTitle"></span>
            </div>

            <!-- Desktop Center Navigation -->
            <nav class="hidden md:flex items-center bg-cream-100 dark:bg-obsidian-900 p-1 rounded-xl border border-cream-200 dark:border-obsidian-800">
                <button @click="setTab('dashboard')" :class="activeTab === 'dashboard' ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-xs font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all" x-text="t('nav_home')"></button>
                <button @click="setTab('analytics')" :class="activeTab === 'analytics' ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-xs font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all" x-text="t('nav_analytics')"></button>
                <button @click="setTab('transactions')" :class="activeTab === 'transactions' ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-xs font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all" x-text="t('nav_records')"></button>
                <button @click="setTab('planning')" :class="activeTab === 'planning' ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-xs font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all" x-text="t('nav_goals')"></button>
                <button @click="setTab('automation')" :class="activeTab === 'automation' ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-xs font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all">Autopilot</button>
                <button @click="setTab('more')" :class="['more', 'tools', 'settings'].includes(activeTab) ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-xs font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all" x-text="t('nav_menu')"></button>
            </nav>

            <!-- Top Right Controls: Google Auth, Theme Toggle, Report Export -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <!-- Google Account Status Button (Public One-Click Sign In) -->
                <button @click="handleGoogleHeaderClick()" 
                        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full bg-cream-100 dark:bg-obsidian-900 hover:bg-cream-200/70 dark:hover:bg-obsidian-800 border border-cream-200 dark:border-obsidian-700 text-xs font-medium text-cream-900 dark:text-slate-200 transition-colors max-w-[140px] sm:max-w-[200px]">
                    <template x-if="!googleUser">
                        <span class="flex items-center gap-1.5 truncate">
                            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
                                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24Z"/>
                                <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14Z"/>
                                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96Z"/>
                            </svg>
                            <span class="truncate" x-text="t('sign_in_google')"></span>
                        </span>
                    </template>
                    <template x-if="googleUser">
                        <span class="flex items-center gap-1.5 truncate">
                            <img :src="googleUser.picture || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(displayUserName)" alt="Profile" class="w-4 h-4 rounded-full object-cover shrink-0">
                            <span class="truncate font-semibold" x-text="displayUserName"></span>
                        </span>
                    </template>
                </button>

                <!-- Theme Toggle Button -->
                <button @click="toggleTheme()" 
                        :title="isDarkMode ? t('theme_white') : t('theme_black')"
                        class="w-9 h-9 rounded-full bg-cream-100 dark:bg-obsidian-900 hover:bg-cream-200 dark:hover:bg-obsidian-800 border border-cream-200 dark:border-obsidian-700 flex items-center justify-center text-cream-700 dark:text-slate-300 transition-colors shrink-0">
                    <i data-lucide="moon" x-show="!isDarkMode" class="w-4 h-4"></i>
                    <i data-lucide="sun" x-show="isDarkMode" class="w-4 h-4 text-amber-400"></i>
                </button>

                <!-- Export Report Menu Button -->
                <div class="relative" x-data="{ openExport: false }">
                    <button @click="openExport = !openExport" 
                            class="w-9 h-9 rounded-full bg-royal-600 hover:bg-royal-700 text-white flex items-center justify-center shadow-xs transition-colors shrink-0" 
                            :title="t('export_report')">
                        <i data-lucide="download" class="w-4 h-4"></i>
                    </button>
                    <div x-show="openExport" @click.away="openExport = false" x-cloak
                         class="absolute right-0 mt-2 w-56 rounded-2xl bg-white dark:bg-obsidian-900 border border-cream-200 dark:border-obsidian-700 shadow-xl py-2 z-50">
                        <div class="px-3 py-1.5 text-[11px] font-semibold uppercase tracking-wider text-cream-400 dark:text-slate-500" x-text="t('export_report')"></div>
                        <button @click="exportToExcel(); openExport = false" class="w-full px-3.5 py-2.5 text-left text-xs font-medium text-cream-900 dark:text-slate-200 hover:bg-cream-100 dark:hover:bg-obsidian-800 flex items-center gap-2.5">
                            <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i>
                            <span x-text="t('export_excel')"></span>
                        </button>
                        <button @click="exportToPDF(); openExport = false" class="w-full px-3.5 py-2.5 text-left text-xs font-medium text-cream-900 dark:text-slate-200 hover:bg-cream-100 dark:hover:bg-obsidian-800 flex items-center gap-2.5">
                            <i data-lucide="file-text" class="w-4 h-4 text-rose-600"></i>
                            <span x-text="t('export_pdf')"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- MAIN CONTENT CONTAINER                     -->
    <!-- ========================================== -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-5 pb-28 md:pb-12">

        <!-- ========================================== -->
        <!-- 1. DASHBOARD VIEW                          -->
        <!-- ========================================== -->
        <div x-show="activeTab === 'dashboard'" x-transition.opacity.duration.200ms class="space-y-6">
            
            <!-- Welcome Greeting Banner when Google Signed In -->
            <div x-show="googleUser" x-cloak class="flex items-center justify-between bg-white dark:bg-obsidian-900 border border-cream-200 dark:border-obsidian-800 rounded-2xl px-4 py-3 shadow-xs">
                <div class="flex items-center gap-3 min-w-0">
                    <img :src="googleUser?.picture || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(displayUserName)" class="w-9 h-9 rounded-full object-cover border border-cream-200 dark:border-obsidian-700">
                    <div class="min-w-0">
                        <p class="text-xs text-cream-500 dark:text-slate-400" x-text="t('welcome_back')"></p>
                        <p class="text-sm font-bold text-cream-900 dark:text-white truncate" x-text="displayUserName"></p>
                    </div>
                </div>
                <button @click="openNicknameModal()" class="text-xs font-semibold text-royal-600 dark:text-royal-500 hover:underline shrink-0" x-text="t('edit_nickname')"></button>
            </div>

            <!-- Hero Net Balance Card (White & Royal Blue Accent) -->
            <div class="relative overflow-hidden rounded-3xl bg-white dark:bg-obsidian-900 border border-cream-200 dark:border-obsidian-800 p-6 sm:p-7 shadow-soft">
                <div class="absolute -right-10 -top-10 w-44 h-44 rounded-full bg-royal-500/10 blur-2xl pointer-events-none"></div>
                <div class="relative z-10 flex flex-col md:flex-row md:items-center md:justify-between gap-6">
                    <div>
                        <div class="flex items-center gap-2 mb-1.5">
                            <span class="text-xs font-semibold uppercase tracking-wider text-cream-500 dark:text-slate-400" x-text="t('net_total_balance')"></span>
                            <button @click="hideBalances = !hideBalances" class="text-cream-400 hover:text-cream-700 dark:hover:text-slate-200">
                                <i data-lucide="eye" x-show="!hideBalances" class="w-3.5 h-3.5"></i>
                                <i data-lucide="eye-off" x-show="hideBalances" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                        <h1 class="font-display text-3xl sm:text-4xl font-extrabold tracking-tight text-cream-900 dark:text-white">
                            <span x-text="hideBalances ? '••••••••' : formatCurrency(totalBalance)"></span>
                        </h1>
                        <p class="text-xs text-cream-500 dark:text-slate-400 mt-1.5 flex items-center gap-1.5">
                            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
                            <span x-text="transactions.length + ' ' + t('recorded_transactions')"></span>
                        </p>
                    </div>

                    <!-- Income & Expense Mini Summary Pills -->
                    <div class="grid grid-cols-2 gap-3 sm:w-auto">
                        <div class="bg-cream-50 dark:bg-obsidian-850 border border-cream-200/80 dark:border-obsidian-800 rounded-2xl p-3.5 min-w-[140px]">
                            <div class="flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400 text-xs font-semibold mb-1">
                                <i data-lucide="arrow-down-left" class="w-3.5 h-3.5"></i>
                                <span x-text="t('income')"></span>
                            </div>
                            <p class="font-display font-bold text-sm sm:text-base text-cream-900 dark:text-white" x-text="hideBalances ? '••••••' : formatCurrency(totalIncome)"></p>
                        </div>
                        <div class="bg-cream-50 dark:bg-obsidian-850 border border-cream-200/80 dark:border-obsidian-800 rounded-2xl p-3.5 min-w-[140px]">
                            <div class="flex items-center gap-1.5 text-rose-600 dark:text-rose-400 text-xs font-semibold mb-1">
                                <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
                                <span x-text="t('expense')"></span>
                            </div>
                            <p class="font-display font-bold text-sm sm:text-base text-cream-900 dark:text-white" x-text="hideBalances ? '••••••' : formatCurrency(totalExpense + totalWithdrawal)"></p>
                        </div>
                    </div>
                </div>

                <!-- Quick Action Buttons Row -->
                <div class="relative z-10 grid grid-cols-3 gap-2.5 mt-6 pt-5 border-t border-cream-200/80 dark:border-obsidian-800">
                    <button @click="openTxModal('income')" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-royal-600 hover:bg-royal-700 text-white text-xs sm:text-sm font-semibold shadow-xs transition-all active:scale-[0.98]">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span x-text="t('btn_income')"></span>
                    </button>
                    <button @click="openTxModal('expense')" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-cream-100 dark:bg-obsidian-800 hover:bg-cream-200 dark:hover:bg-obsidian-700 text-cream-900 dark:text-white text-xs sm:text-sm font-semibold transition-all active:scale-[0.98]">
                        <i data-lucide="minus-circle" class="w-4 h-4 text-rose-600 dark:text-rose-400"></i>
                        <span x-text="t('btn_expense')"></span>
                    </button>
                    <button @click="openTxModal('transfer')" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-cream-100 dark:bg-obsidian-800 hover:bg-cream-200 dark:hover:bg-obsidian-700 text-cream-900 dark:text-white text-xs sm:text-sm font-semibold transition-all active:scale-[0.98]">
                        <i data-lucide="arrow-left-right" class="w-4 h-4 text-royal-600 dark:text-royal-500"></i>
                        <span x-text="t('btn_transfer')"></span>
                    </button>
                </div>
            </div>

            <!-- Horizontal Wallets & Banks Strip -->
            <div>
                <div class="flex items-center justify-between mb-3">
                    <h2 class="font-display font-bold text-sm sm:text-base text-cream-900 dark:text-white" x-text="t('my_wallets')"></h2>
                    <button @click="openWalletModal()" class="text-xs font-semibold text-royal-600 dark:text-royal-500 hover:underline flex items-center gap-1">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span x-text="t('add_wallet')"></span>
                    </button>
                </div>
                <div class="flex gap-3 overflow-x-auto no-scrollbar pb-1">
                    <template x-for="bank in banks" :key="bank">
                        <div class="shrink-0 w-44 bg-white dark:bg-obsidian-900 border border-cream-200 dark:border-obsidian-800 rounded-2xl p-4 shadow-card hover:border-royal-500/50 transition-colors">
                            <div class="flex items-center justify-between mb-3">
                                <span class="w-8 h-8 rounded-xl bg-royal-50 dark:bg-royal-500/10 text-royal-600 dark:text-royal-500 flex items-center justify-center font-bold text-xs" x-text="bank.substring(0,2).toUpperCase()"></span>
                                <span class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-cream-100 dark:bg-obsidian-800 text-cream-500 dark:text-slate-400" x-text="currency"></span>
                            </div>
                            <p class="text-xs font-medium text-cream-500 dark:text-slate-400 truncate" x-text="bank"></p>
                            <p class="font-display font-bold text-sm text-cream-900 dark:text-white mt-0.5 truncate" x-text="hideBalances ? '••••••' : formatCurrency(getWalletBalance(bank))"></p>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Split Bill Calculator with Auto Camera & Receipt Scan (On Dashboard) -->
            <div id="dashboardSplitBill" class="bg-white dark:bg-obsidian-900 border border-cream-200 dark:border-obsidian-800 rounded-3xl p-5 sm:p-6 shadow-card space-y-4">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-2xl bg-royal-500/10 text-royal-600 dark:text-royal-400 flex items-center justify-center shrink-0">
                            <i data-lucide="users" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h3 class="font-display font-bold text-base text-cream-900 dark:text-white" x-text="t('split_bill')"></h3>
                        </div>
                    </div>

                    <!-- Auto Camera & Receipt Scan Buttons -->
                    <div class="flex items-center gap-2">
                        <button type="button" @click="startSplitCamera()" :disabled="isScanningSplitBill"
                                class="flex-1 sm:flex-initial px-3.5 py-2 rounded-xl bg-royal-600 hover:bg-royal-700 disabled:opacity-50 text-white text-xs font-semibold flex items-center justify-center gap-1.5 shadow-xs transition-all">
                            <i data-lucide="camera" class="w-3.5 h-3.5"></i>
                            <span x-text="isScanningSplitBill ? t('scanning_bill') : t('scan_bill_camera')"></span>
                        </button>
                        <label class="flex-1 sm:flex-initial px-3.5 py-2 rounded-xl bg-cream-100 dark:bg-obsidian-800 hover:bg-cream-200 dark:hover:bg-obsidian-700 text-cream-900 dark:text-white border border-cream-200 dark:border-obsidian-700 text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer transition-colors">
                            <i data-lucide="image-plus" class="w-3.5 h-3.5 text-royal-600 dark:text-royal-400"></i>
                            <span x-text="t('upload_bill_photo')"></span>
                            <input type="file" accept="image/*" capture="environment" @change="handleSplitBillScanUpload($event)" class="hidden">
                        </label>
                    </div>
                </div>

                <!-- Detected Scanned Receipt Summary & Items -->
                <div x-show="splitMerchant || splitItems.length > 0" x-cloak class="p-3.5 rounded-2xl bg-cream-50 dark:bg-obsidian-850 border border-cream-200/80 dark:border-obsidian-800 space-y-2">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                            <p class="text-xs font-bold text-cream-900 dark:text-white truncate" x-text="splitMerchant || t('detected_items')"></p>
                        </div>

                t(key) {
                    return (this.translations[this.lang] && this.translations[this.lang][key]) || key;
                },

                get pageTitle() {
                    if (this.activeTab === 'dashboard') return this.displayUserName || 'DND Finance';
                    const map = {
                        analytics: this.t('nav_analytics'),
                        transactions: this.t('nav_records'),
                        planning: this.t('nav_goals'),
                        automation: 'Autopilot',
                        more: this.t('nav_menu')
                    };
                    return map[this.activeTab] || 'DND Finance';
                },

                get displayUserName() {
                    if (!this.googleUser) return '';
                    return (this.googleUser.nickname && this.googleUser.nickname.trim())
                        ? this.googleUser.nickname.trim()
                        : (this.googleUser.name || this.googleUser.email.split('@')[0]);
                },

                get storageScope() {
                    return this.googleUser && this.googleUser.email
                        ? this.googleUser.email.toLowerCase()
                        : 'guest_local';
                },

                get totalIncome() {
                    return this.transactions
                        .filter(t => t.type === 'income')
                        .reduce((acc, t) => acc + Number(t.amount || 0), 0);
                },

                get totalExpense() {
                    return this.transactions
                        .filter(t => t.type === 'expense')
                        .reduce((acc, t) => acc + Number(t.amount || 0), 0);
                },

                get totalWithdrawal() {
                    return this.transactions
                        .filter(t => t.type === 'withdrawal')
                        .reduce((acc, t) => acc + Number(t.amount || 0), 0);
                },

                get totalTransferFees() {
                    return this.transactions
                        .filter(t => t.type === 'transfer')
                        .reduce((acc, t) => acc + Number(t.adminFee || 0), 0);
                },

                get totalBalance() {
                    return this.totalIncome - (this.totalExpense + this.totalWithdrawal + this.totalTransferFees);
                },

                get expenseTransactionsCount() {
                    return this.transactions.filter(t => t.type === 'expense').length;
                },

                get filteredTransactions() {
                    return this.transactions.filter(tx => {
                        const matchesType = this.filterType === 'all' || tx.type === this.filterType;
                        const q = this.searchQuery.trim().toLowerCase();
                        const matchesQuery = !q ||
                            (tx.note && tx.note.toLowerCase().includes(q)) ||
                            (tx.category && tx.category.toLowerCase().includes(q)) ||
                            (tx.account && tx.account.toLowerCase().includes(q)) ||
                            (tx.toAccount && tx.toAccount.toLowerCase().includes(q));
                        return matchesType && matchesQuery;
                    });
                },

                jumpToDashboardSplitBill() {
                    this.setTab('dashboard');
                    this.$nextTick(() => {
                        const el = document.getElementById('dashboardSplitBill');
                        if (el) {
                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    });
                },

                async recalculateSplitBillApi() {
                    const sub = Math.max(0, Number(this.splitSubtotal || 0));
                    const tax = Math.max(0, Number(this.splitTax || 0));
                    const ppl = Math.max(1, Number(this.splitPeople || 1));

                    const localGrand = sub + (sub * (tax / 100));
                    this.splitGrandTotal = localGrand;
                    this.splitPerPerson = localGrand / ppl;

                    try {
                        const res = await fetch('/api/engine/split-bill', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                subtotal: sub,
                                tax_percent: tax,
                                people: ppl
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (typeof data.grand_total === 'number') this.splitGrandTotal = data.grand_total;
                            if (typeof data.per_person === 'number') this.splitPerPerson = data.per_person;
                            if (data.engine) {
                                this.splitEngineBadge = data.engine === 'cpp17_native' ? 'C++17 API' : 'Auto API';
                            }
                        }
                    } catch (e) {}
                },

                async startSplitCamera() {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        this.showToast(this.lang === 'ID' ? 'Gunakan tombol Foto / Galeri untuk memindai struk' : 'Use Snap / Gallery button to scan receipt');
                        return;
                    }
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: { ideal: 'environment' } },
                            audio: false
                        });
                        this.splitCameraStream = stream;
                        this.showSplitCameraModal = true;
                        this.$nextTick(() => {
                            this.refreshIcons();
                            if (this.$refs.splitVideo) {
                                this.$refs.splitVideo.srcObject = stream;
                            }
                        });
                    } catch (e) {
                        this.showToast(this.lang === 'ID' ? 'Izin kamera ditolak, gunakan Foto / Galeri' : 'Camera permission denied, use Snap / Gallery');
                    }
                },

                stopSplitCamera() {
                    if (this.splitCameraStream) {
                        this.splitCameraStream.getTracks().forEach(track => track.stop());
                        this.splitCameraStream = null;
                    }
                    this.showSplitCameraModal = false;
                },

                async captureSplitCameraFrame() {
                    const video = this.$refs.splitVideo;
                    const canvas = this.$refs.splitCanvas;
                    if (!video || !canvas) return;
                    const w = video.videoWidth || 720;
                    const h = video.videoHeight || 960;
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
                    const base64 = dataUrl.split(',')[1];
                    this.stopSplitCamera();
                    await this.processSplitBillImageBase64(base64, 'image/jpeg');
                },

                async handleSplitBillScanUpload(event) {
                    const file = event.target.files && event.target.files[0];
                    if (!file) return;
                    try {
                        const base64 = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(String(reader.result).split(',')[1]);
                            reader.onerror = reject;
                            reader.readAsDataURL(file);
                        });
                        await this.processSplitBillImageBase64(base64, file.type || 'image/jpeg');
                    } finally {
                        event.target.value = '';
                    }
                },

                async processSplitBillImageBase64(base64, mimeType) {
                    this.isScanningSplitBill = true;
                    let extracted = null;

                    try {
                        const res = await fetch('/api/scan/receipt', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                image_base64: base64,
                                mime_type: mimeType
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data && (Number(data.amount) > 0 || Number(data.subtotal) > 0)) {
                                extracted = data;
                            }
                        }
                    } catch (e) {}

                    if (!extracted) {
                        extracted = await this.scanReceiptViaGeminiDirectApi(base64, mimeType);
                    }

                    if (extracted && (Number(extracted.amount) > 0 || Number(extracted.subtotal) > 0)) {
                        const detectedTotal = Number(extracted.amount || 0);
                        const detectedSub = Number(extracted.subtotal || 0);
                        const detectedTax = Number(extracted.tax_percent || 0);

                        if (detectedSub > 0) {
                            this.splitSubtotal = detectedSub;
                            this.splitTax = detectedTax >= 0 ? detectedTax : 0;
                        } else {
                            this.splitSubtotal = detectedTotal;
                            this.splitTax = 0;
                        }
                        this.splitMerchant = extracted.note || 'Struk Split Bill';
                        this.splitItems = Array.isArray(extracted.items) ? extracted.items : [];
                        await this.recalculateSplitBillApi();
                        this.showToast(this.lang === 'ID' ? 'Struk berhasil dipindai & dihitung otomatis!' : 'Receipt scanned & split automatically!');
                    } else {
                        this.showToast(this.lang === 'ID' ? 'Nominal struk tidak terbaca jelas, silakan isi manual.' : 'Could not detect receipt total clearly, please enter manually.');
                    }

                    this.isScanningSplitBill = false;
                },

                async scanReceiptViaGeminiDirectApi(base64Data, mimeType) {
                    const apiKey = "";
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                    const payload = {
                        contents: [{
                            role: 'user',
                            parts: [
                                { text: 'Extract subtotal before tax, tax percentage (if any), grand total amount, merchant name, and line items from this receipt image.' },
                                { inlineData: { mimeType: mimeType || 'image/jpeg', data: base64Data } }
                            ]
                        }],
                        generationConfig: {
                            responseMimeType: 'application/json',
                            responseSchema: {
                                type: 'OBJECT',
                                properties: {
                                    subtotal: { type: 'NUMBER' },
                                    tax_percent: { type: 'NUMBER' },
                                    amount: { type: 'NUMBER' },
                                    note: { type: 'STRING' },
                                    items: {
                                        type: 'ARRAY',
                                        items: {
                                            type: 'OBJECT',
                                            properties: {
                                                name: { type: 'STRING' },
                                                price: { type: 'NUMBER' }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    };

                    for (let attempt = 0; attempt < 3; attempt++) {
                        try {
                            const resp = await fetch(apiUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                            if (resp.ok) {
                                const result = await resp.json();
                                const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                                if (rawText) {
                                    return JSON.parse(rawText);
                                }
                            }
                        } catch (e) {}
                        await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
                    }
                    return null;
                },

                clearSplitScan() {
                    this.splitMerchant = '';
                    this.splitItems = [];
                },

                async recordMySplitShare() {
                    const shareAmount = Math.round(Number(this.splitPerPerson || 0));
                    if (shareAmount <= 0) return;

                    const now = new Date();
                    const localIso = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
                    this.txForm = {

                loadLocalState() {
                    try {
                        const savedTheme = localStorage.getItem(`${this.appId}_theme`);
                        this.isDarkMode = savedTheme === 'black' || savedTheme === 'dark';

                        const savedLang = localStorage.getItem(`${this.appId}_lang`);
                        if (savedLang === 'ID' || savedLang === 'EN') {
                            this.lang = savedLang;
                        } else {
                            const sysLang = (
                                (Array.isArray(navigator.languages) && navigator.languages[0]) ||
                                navigator.language ||
                                navigator.userLanguage ||
                                'id'
                            ).toLowerCase();
                            this.lang = sysLang.startsWith('id') ? 'ID' : 'EN';
                        }
                        document.documentElement.lang = this.lang === 'ID' ? 'id' : 'en';

                        const savedCurr = localStorage.getItem(`${this.appId}_currency`);
                        if (savedCurr) this.currency = savedCurr;

                        const savedUser = localStorage.getItem(`${this.appId}_google_user`);

                            this.googleUser = JSON.parse(savedUser);
                        }
                    } catch (e) {}

                    this.loadScopedLedgerData();

                loadScopedLedgerData() {
                    const scope = this.storageScope;
                    try {
                        const raw = localStorage.getItem(`${this.appId}_ledger_${scope}`);
                        if (raw) {
                            const parsed = JSON.parse(raw);
                            this.banks = Array.isArray(parsed.banks) && parsed.banks.length ? parsed.banks : ['Bank Mandiri', 'Bank BCA', 'Bank BNI', 'Bank Jago', 'SeaBank', 'Gopay', 'Cash'];
                            this.categories = Array.isArray(parsed.categories) && parsed.categories.length ? parsed.categories : ['Food', 'Transport', 'Trading', 'Online Shopping', 'Investment', 'Salary', 'Utilities'];
                            this.transactions = Array.isArray(parsed.transactions) ? parsed.transactions : [];
                            this.goals = Array.isArray(parsed.goals) ? parsed.goals : [];
                            this.budgets = Array.isArray(parsed.budgets) ? parsed.budgets : [];
                            this.automationRules = Array.isArray(parsed.automationRules)
                                ? parsed.automationRules.filter(r => r.actionType !== 'round_up_save')
                                : [];
                        } else {
                            this.transactions = [];
                            this.goals = [];
                            this.budgets = [];
                            this.automationRules = [];
                        }
                    } catch (e) {
                        this.transactions = [];
                    }
                },

                saveLocalState() {
                    try {
                        localStorage.setItem(`${this.appId}_theme`, this.isDarkMode ? 'black' : 'white');
                        localStorage.setItem(`${this.appId}_lang`, this.lang);
                        localStorage.setItem(`${this.appId}_currency`, this.currency);
                        if (this.googleUser) {
                            localStorage.setItem(`${this.appId}_google_user`, JSON.stringify(this.googleUser));
                        } else {
                            localStorage.removeItem(`${this.appId}_google_user`);
                        }

                        const scope = this.storageScope;
                        const payload = {
                            banks: this.banks,
                            categories: this.categories,
                            transactions: this.transactions,
                            goals: this.goals,
                            budgets: this.budgets,
                            automationRules: this.automationRules
                        };
                        localStorage.setItem(`${this.appId}_ledger_${scope}`, JSON.stringify(payload));
                    } catch (e) {}
                },

                async fetchBackendMetadata() {
                    try {
                        const cfgRes = await fetch('/api/auth/google/config');
                        if (cfgRes.ok) {
                            const cfg = await cfgRes.json();
                            if (cfg.client_id) this.googleClientId = cfg.client_id;
                        }
                    } catch (e) {}
                },

                async checkGoogleSession() {
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.has('google_auth_success') || urlParams.has('google_auth_error')) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }

                    try {
                        const res = await fetch('/api/auth/google/me');
                        if (res.ok) {
                            const data = await res.json();
                            if (data.authenticated && data.user) {
                                this.googleUser = data.user;
                                this.loadScopedLedgerData();
                                await this.pullWorkspaceFromBackend();
                                this.saveLocalState();
                                return;
                            }
                        }
                    } catch (e) {}

                    if (this.googleUser && this.googleUser.email) {
                        await this.pullWorkspaceFromBackend();
                    }
                },

                handleGoogleHeaderClick() {
                    if (!this.googleUser) {
                        this.initiateGoogleLogin();
                    } else {
                        this.setTab('more');
                    }
                },

                initiateGoogleLogin() {
                    if (window.google && google.accounts && google.accounts.id && this.googleClientId) {
                        try {
                            google.accounts.id.initialize({
                                client_id: this.googleClientId,
                                callback: (resp) => this.handleGoogleCredentialResponse(resp),
                                use_fedcm_for_prompt: true
                            });
                            google.accounts.id.prompt((notification) => {
                                if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                                    window.location.href = '/api/auth/google/login';
                                }
                            });
                            return;
                        } catch (e) {}
                    }
                    window.location.href = '/api/auth/google/login';
                },

                async handleGoogleCredentialResponse(response) {
                    if (!response || !response.credential) return;
                    try {
                        const res = await fetch('/api/auth/google/verify-token', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id_token: response.credential })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data.user) {
                                this.googleUser = data.user;
                                this.loadScopedLedgerData();
                                await this.pullWorkspaceFromBackend();
                                this.saveLocalState();
                                this.updateAllCharts();
                                this.showToast(`${this.t('welcome_back')} ${this.displayUserName}`);
                            }
                        }
                    } catch (e) {
                        this.showToast('Google sign-in sync failed');
                    }
                },

                        await fetch('/api/auth/google/logout', { method: 'POST' });

                    this.googleUser = null;
                    this.saveLocalState();
                    this.loadScopedLedgerData();
                    this.updateAllCharts();
                    this.showToast(this.lang === 'ID' ? 'Berhasil keluar dari akun Google' : 'Signed out from Google');

                    if (!this.googleUser || !this.googleUser.email) return;
                    try {
                        const res = await fetch(`/api/sync/pull?email=${encodeURIComponent(this.googleUser.email)}`);
                        if (res.ok) {

                formatCurrency(val) {
                    const num = Number(val || 0);
                    const locales = {
                        IDR: 'id-ID',
                        USD: 'en-US',
                        SGD: 'en-SG',
                        EUR: 'de-DE',
                        JPY: 'ja-JP'
                    };
                    try {
                        return new Intl.NumberFormat(locales[this.currency] || 'id-ID', {
                            style: 'currency',
                            currency: this.currency,
                            maximumFractionDigits: this.currency === 'IDR' || this.currency === 'JPY' ? 0 : 2
                        }).format(num);
                    } catch (e) {
                        return `${this.currency} ${num.toLocaleString()}`;
                    }
                },

                formatDateShort(dateStr) {
                    if (!dateStr) return '';
                    return String(dateStr).replace('T', ' ').substring(0, 16);
                },

                getWalletBalance(walletName) {
                    let bal = 0;
                    for (const tx of this.transactions) {
                        const amt = Number(tx.amount || 0);
                        const fee = Number(tx.adminFee || 0);
                        if (tx.type === 'income' && tx.account === walletName) {
                            bal += amt;
                        } else if ((tx.type === 'expense' || tx.type === 'withdrawal') && tx.account === walletName) {
                            bal -= amt;
                        } else if (tx.type === 'transfer') {
                            if (tx.account === walletName) bal -= (amt + fee);
                            if (tx.toAccount === walletName) bal += amt;
                        }
                    }
                    return bal;
                },

                getCategorySpent(catName) {
                    return this.transactions
                        .filter(t => t.type === 'expense' && t.category === catName)
                        .reduce((acc, t) => acc + Number(t.amount || 0), 0);
                },

                async saveTransaction() {
                    const amount = Number(this.txForm.amount || 0);
                    if (amount <= 0) return;

                    const cleanDate = (this.txForm.date || '').replace('T', ' ');
                    const newTx = {
                        id: Date.now(),
                        amount: amount,
                        type: this.txForm.type,
                        category: this.txForm.type === 'transfer' ? 'Transfer' : this.txForm.category,
                        account: this.txForm.account,
                        toAccount: this.txForm.type === 'transfer' ? this.txForm.toAccount : '',
                        adminFee: this.txForm.type === 'transfer' ? Number(this.txForm.adminFee || 0) : 0,
                        note: this.txForm.note.trim(),
                        currency: this.currency,
                        date: cleanDate
                    };

                    this.transactions.unshift(newTx);
                    this.executeAutomationEngine(newTx);

                    this.showTxModal = false;
                    this.saveLocalState();
                    this.syncWorkspaceToBackend();
                    this.updateAllCharts();
                    this.showToast(this.lang === 'ID' ? 'Transaksi berhasil dicatat' : 'Transaction recorded');

                    try {
                        await fetch('/api/transactions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-User-Email': this.googleUser ? this.googleUser.email : ''
                            },
                            body: JSON.stringify({
                                amount: newTx.amount,
                                type: newTx.type,
                                category: newTx.category,
                                account: newTx.account,
                                to_account: newTx.toAccount,
                                admin_fee: newTx.adminFee,
                                note: newTx.note,
                                currency: newTx.currency,
                                date: newTx.date
                            })
                        });
                    } catch (e) {}
                },

                async deleteTransaction(id) {
                    this.transactions = this.transactions.filter(t => t.id !== id);
                    this.saveLocalState();
                    this.syncWorkspaceToBackend();
                    this.updateAllCharts();
                    this.showToast(this.lang === 'ID' ? 'Transaksi dihapus' : 'Transaction deleted');
                    try {
                        await fetch(`/api/transactions/${id}`, {
                            method: 'DELETE',
                            headers: { 'X-User-Email': this.googleUser ? this.googleUser.email : '' }
                        });
                    } catch (e) {}
                },

                async handleReceiptUpload(event) {
                    const file = event.target.files && event.target.files[0];
                    if (!file) return;
                    this.isScanningReceipt = true;
                    try {
                        const base64 = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(String(reader.result).split(',')[1]);
                            reader.onerror = reject;
                            reader.readAsDataURL(file);

                        const res = await fetch('/api/scan/receipt', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                image_base64: base64,
                                mime_type: file.type || 'image/jpeg'
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data.amount && Number(data.amount) > 0) {
