                async saveAutomationRule() {
                    if (!this.ruleForm.name.trim()) return;
                    const existing = this.editingRuleId ? this.automationRules.find(r => r.id === this.editingRuleId) : null;
                    const rulePayload = {
                        id: this.editingRuleId || ('rule_' + Date.now()),
                        name: this.ruleForm.name.trim(),
                        actionType: this.ruleForm.actionType,
                        minAmount: Number(this.ruleForm.minAmount || 0),
                        percent: Number(this.ruleForm.percent || 20),
                        fixedAmount: Number(this.ruleForm.fixedAmount || 50000),
                        targetGoalName: (this.ruleForm.targetGoalName || 'Dana Darurat').trim(),
                        targetCategory: this.ruleForm.targetCategory || 'Food',
                        sourceWallet: this.ruleForm.sourceWallet || '',
                        destWallet: this.ruleForm.destWallet || '',
                        thresholdAmount: Number(this.ruleForm.thresholdAmount || 500000),
                        enabled: existing ? existing.enabled : true,
                        runCount: existing ? (existing.runCount || 0) : 0
                    };

                    if (existing) {
                        Object.assign(existing, rulePayload);
                    } else {
                        this.automationRules.push(rulePayload);
                    }

                    this.showAutomationModal = false;
                    this.editingRuleId = null;
                    this.saveLocalState();
                    this.$nextTick(() => this.refreshIcons());
                    this.showToast(this.lang === 'ID' ? 'Aturan Autopilot disimpan!' : 'Autopilot rule saved!');

                    try {
                        await fetch('/api/macros', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(rulePayload)
                        });
                    } catch (e) {}
                    await this.syncWorkspaceToBackend();
                },

                describeRule(rule) {
                    if (rule.actionType === 'auto_save_goal') {
                        return this.lang === 'ID'
                            ? `Jika Pemasukan ≥ ${this.formatCurrency(rule.minAmount)}, sisihkan ${rule.percent}% ke target "${rule.targetGoalName}"`
                            : `When Income ≥ ${this.formatCurrency(rule.minAmount)}, save ${rule.percent}% to "${rule.targetGoalName}"`;
                    }
                    if (rule.actionType === 'fixed_save_goal') {
                        return this.lang === 'ID'
                            ? `Jika Pemasukan ≥ ${this.formatCurrency(rule.minAmount)}, sisihkan tetap ${this.formatCurrency(rule.fixedAmount)} ke "${rule.targetGoalName}"`
                            : `When Income ≥ ${this.formatCurrency(rule.minAmount)}, save fixed ${this.formatCurrency(rule.fixedAmount)} to "${rule.targetGoalName}"`;
                    }
                    if (rule.actionType === 'auto_transfer_wallet') {
                        return this.lang === 'ID'
                            ? `Auto-transfer ${rule.percent}% dari setiap Pemasukan ke dompet ${rule.destWallet}`
                            : `Auto-transfer ${rule.percent}% of Income to ${rule.destWallet}`;
                    }
                    if (rule.actionType === 'expense_save_goal') {
                        return this.lang === 'ID'
                            ? `Setiap Pengeluaran ≥ ${this.formatCurrency(rule.minAmount)}, tabung ${rule.percent}% ke target "${rule.targetGoalName}"`
                            : `When Expense ≥ ${this.formatCurrency(rule.minAmount)}, save ${rule.percent}% to "${rule.targetGoalName}"`;
                    }
                    if (rule.actionType === 'expense_transfer_wallet') {
                        return this.lang === 'ID'
                            ? `Setiap Pengeluaran ≥ ${this.formatCurrency(rule.minAmount)}, transfer ${rule.percent}% ke dompet ${rule.destWallet}`
                            : `When Expense ≥ ${this.formatCurrency(rule.minAmount)}, transfer ${rule.percent}% to ${rule.destWallet}`;
                    }
                    if (rule.actionType === 'category_spend_alert') {
                        return this.lang === 'ID'
                            ? `Peringatan jika pengeluaran kategori "${rule.targetCategory}" ≥ ${this.formatCurrency(rule.thresholdAmount)}`
                            : `Alert when "${rule.targetCategory}" expense ≥ ${this.formatCurrency(rule.thresholdAmount)}`;
                    }
                    return this.lang === 'ID'
                        ? `Peringatan otomatis jika Pengeluaran ≥ ${this.formatCurrency(rule.thresholdAmount)}`
                        : `Alert when any Expense ≥ ${this.formatCurrency(rule.thresholdAmount)}`;
                },

                async toggleRule(ruleId) {
                    const rule = this.automationRules.find(r => r.id === ruleId);
                    if (!rule) return;
                    rule.enabled = !rule.enabled;
                    this.saveLocalState();
                    try {
                        await fetch('/api/macros', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(rule)
                        });
                    } catch (e) {}
                    await this.syncWorkspaceToBackend();
                },

                async deleteRule(ruleId) {
                    this.automationRules = this.automationRules.filter(r => r.id !== ruleId);
                    this.saveLocalState();
                    try {
                        await fetch(`/api/macros/${encodeURIComponent(ruleId)}`, { method: 'DELETE' });
                    } catch (e) {}
                    await this.syncWorkspaceToBackend();
                },

                async evaluateAutomationRules(tx) {
                    for (const rule of this.automationRules) {
                        if (!rule.enabled) continue;

                        if (rule.actionType === 'auto_save_goal' && tx.type === 'income' && tx.amount >= (rule.minAmount || 0)) {
                            const saveAmt = Math.round(tx.amount * ((rule.percent || 20) / 100));
                            if (saveAmt > 0) {
                                let targetGoal = this.goals.find(g => g.name.toLowerCase() === (rule.targetGoalName || '').toLowerCase());
                                if (!targetGoal) {
                                    targetGoal = { id: 'goal_' + Date.now(), name: rule.targetGoalName || 'Dana Darurat', target: saveAmt * 5, current: 0 };
                                    this.goals.push(targetGoal);
                                }
                                targetGoal.current = Number(targetGoal.current || 0) + saveAmt;
                                rule.runCount = (rule.runCount || 0) + 1;
                                this.showToast(`Autopilot: +${this.formatCurrency(saveAmt)} → ${targetGoal.name}`);
                            }
                        } else if (rule.actionType === 'fixed_save_goal' && tx.type === 'income' && tx.amount >= (rule.minAmount || 0)) {
                            const saveAmt = Math.round(Number(rule.fixedAmount || 50000));
                            if (saveAmt > 0) {
                                let targetGoal = this.goals.find(g => g.name.toLowerCase() === (rule.targetGoalName || '').toLowerCase());
                                if (!targetGoal) {
                                    targetGoal = { id: 'goal_' + Date.now(), name: rule.targetGoalName || 'Tabungan Utama', target: saveAmt * 10, current: 0 };
                                    this.goals.push(targetGoal);
                                }
                                targetGoal.current = Number(targetGoal.current || 0) + saveAmt;
                                rule.runCount = (rule.runCount || 0) + 1;
                                this.showToast(`Autopilot: +${this.formatCurrency(saveAmt)} → ${targetGoal.name}`);
                            }
                        } else if (rule.actionType === 'auto_transfer_wallet' && tx.type === 'income' && rule.destWallet && tx.account !== rule.destWallet) {
                            if (!rule.sourceWallet || rule.sourceWallet === tx.account) {
                                const moveAmt = Math.round(tx.amount * ((rule.percent || 10) / 100));
                                if (moveAmt > 0) {
                                    this.transactions.unshift({
                                        id: Date.now() + Math.floor(Math.random() * 999),
                                        amount: moveAmt,
                                        type: 'transfer',
                                        category: 'Transfer',
                                        account: tx.account,
                                        toAccount: rule.destWallet,
                                        adminFee: 0,
                                        note: `Autopilot: ${rule.name}`,
                                        currency: this.currency,
                                        date: tx.date
                                    });
                                    rule.runCount = (rule.runCount || 0) + 1;
                                    this.showToast(`Autopilot: Transfer ${this.formatCurrency(moveAmt)} → ${rule.destWallet}`);
                                }
                            }
                        } else if (rule.actionType === 'expense_save_goal' && tx.type === 'expense' && tx.amount >= (rule.minAmount || 0)) {
                            const saveAmt = Math.round(tx.amount * ((rule.percent || 10) / 100));
                            if (saveAmt > 0) {
                                let targetGoal = this.goals.find(g => g.name.toLowerCase() === (rule.targetGoalName || '').toLowerCase());
                                if (!targetGoal) {
                                    targetGoal = { id: 'goal_' + Date.now(), name: rule.targetGoalName || 'Dana Cashback', target: saveAmt * 10, current: 0 };
                                    this.goals.push(targetGoal);
                                }
                                targetGoal.current = Number(targetGoal.current || 0) + saveAmt;
                                rule.runCount = (rule.runCount || 0) + 1;
                                this.showToast(`Autopilot: +${this.formatCurrency(saveAmt)} → ${targetGoal.name}`);
                            }
                        } else if (rule.actionType === 'expense_transfer_wallet' && tx.type === 'expense' && tx.amount >= (rule.minAmount || 0) && rule.destWallet && tx.account !== rule.destWallet) {
                            const moveAmt = Math.round(tx.amount * ((rule.percent || 10) / 100));
                            if (moveAmt > 0) {
                                this.transactions.unshift({
                                    id: Date.now() + Math.floor(Math.random() * 999),
                                    amount: moveAmt,
                                    type: 'transfer',
                                    category: 'Transfer',
                                    account: tx.account,
                                    toAccount: rule.destWallet,
                                    adminFee: 0,
                                    note: `Autopilot: ${rule.name}`,
                                    currency: this.currency,
                                    date: tx.date
                                });
                                rule.runCount = (rule.runCount || 0) + 1;
                                this.showToast(`Autopilot: Transfer ${this.formatCurrency(moveAmt)} → ${rule.destWallet}`);
                            }
                        } else if (rule.actionType === 'spend_alert' && tx.type === 'expense' && tx.amount >= (rule.thresholdAmount || 500000)) {
                            rule.runCount = (rule.runCount || 0) + 1;
                            this.showToast(`⚠️ Autopilot: ${rule.name} (${this.formatCurrency(tx.amount)})`);
                        } else if (rule.actionType === 'category_spend_alert' && tx.type === 'expense' && tx.category === rule.targetCategory && tx.amount >= (rule.thresholdAmount || 200000)) {
                            rule.runCount = (rule.runCount || 0) + 1;
                            this.showToast(`⚠️ Autopilot [${tx.category}]: ${this.formatCurrency(tx.amount)}`);
                        }
                    }
                },

                buildFinancialContextString() {
                    const walletsSummary = this.banks.map(b => `${b}: ${this.formatCurrency(this.getWalletBalance(b))}`).join(', ');
                    const goalsSummary = this.goals.map(g => `${g.name} (${this.formatCurrency(g.current)}/${this.formatCurrency(g.target)})`).join(', ') || 'None';
                    const budgetsSummary = this.budgets.map(b => `${b.category}: spent ${this.formatCurrency(this.getCategorySpent(b.category))} / limit ${this.formatCurrency(b.limit)}`).join(', ') || 'None';
                    return [
                        `Currency: ${this.currency}`,
                        `Total Balance: ${this.formatCurrency(this.totalBalance)}`,
                        `Total Income: ${this.formatCurrency(this.totalIncome)}`,
                        `Total Expense: ${this.formatCurrency(this.totalExpense + this.totalWithdrawal)}`,
                        `Wallets: ${walletsSummary}`,
                        `Savings Goals: ${goalsSummary}`,
                        `Category Budgets: ${budgetsSummary}`,
                        `Transaction Count: ${this.transactions.length}`
                    ].join('\n');
                },

                async runQuickAudit() {
                    const promptText = this.lang === 'ID'
                        ? 'Lakukan audit keuangan pribadi lengkap berdasarkan saldo bersih, arus kas pemasukan vs pengeluaran, saldo tiap dompet, anggaran kategori, dan target tabungan.'
                        : 'Perform a comprehensive personal financial audit covering net balance, income vs expense cashflow, wallet balances, category budgets, and savings goals.';
                    await this.sendAiRequest(promptText);
                },

                async askAiPreset(presetQuestion) {
                    await this.sendAiRequest(presetQuestion);
                },

                async submitAiPrompt() {
                    const q = this.aiInput.trim();
                    if (!q) return;
                    this.aiInput = '';
                    await this.sendAiRequest(q);
                },

                async sendAiRequest(promptText) {
                    this.aiMessages.push({ role: 'user', text: promptText });
                    this.isAiLoading = true;
                    const contextStr = this.buildFinancialContextString();

                    try {
                        const res = await fetch('/api/ai/analyze', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                prompt: promptText,
                                lang: this.lang,
                                currency: this.currency,
                                financial_context: contextStr,
                                transactions: this.transactions
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data.analysis) {
                                this.aiMessages.push({ role: 'ai', text: data.analysis });
                                return;
                            }
                        }
                        throw new Error('Fallback local audit');
                    } catch (e) {
                        const inc = this.totalIncome;
                        const exp = this.totalExpense + this.totalWithdrawal;
                        const ratio = inc > 0 ? Math.max(0, Math.min(100, Math.round(((inc - exp) / inc) * 100))) : 0;
                        const localSummary = this.lang === 'ID'
                            ? `### Ringkasan Keuangan Lokal\n- **Total Saldo Bersih:** ${this.formatCurrency(this.totalBalance)} (Rasio Simpanan: **${ratio}%**)\n- **Pemasukan vs Pengeluaran:** ${this.formatCurrency(inc)} vs ${this.formatCurrency(exp)}\n- Aktifkan aturan **Autopilot** untuk menyisihkan dana tabungan secara otomatis.`
                            : `### Local Financial Summary\n- **Net Total Balance:** ${this.formatCurrency(this.totalBalance)} (Savings Ratio: **${ratio}%**)\n- **Income vs Expenses:** ${this.formatCurrency(inc)} vs ${this.formatCurrency(exp)}\n- Enable **Autopilot** rules to automate your savings allocations.`;
                        this.aiMessages.push({ role: 'ai', text: localSummary });
                    } finally {
                        this.isAiLoading = false;
                    }
                },

                formatMarkdownLight(text) {
                    if (!text) return '';
                    return String(text)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/^### (.*$)/gim, '<strong class="block text-sm font-bold text-royal-600 dark:text-royal-400 mt-2 mb-1">$1</strong>')
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                },

                copyToClipboard(text) {
                    navigator.clipboard.writeText(text);
                    this.showToast(this.lang === 'ID' ? 'Analisis disalin' : 'Analysis copied');
                },

                async exportToExcel() {
                    const emailParam = this.googleUser && this.googleUser.email ? `&email=${encodeURIComponent(this.googleUser.email)}` : '';
                    try {
                        const res = await fetch(`/api/export/excel?lang=${this.lang}${emailParam}`);
                        if (res.ok) {
                            const blob = await res.blob();
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `DND_Financial_Report_${this.lang}.xlsx`;
                            a.click();
                            URL.revokeObjectURL(url);
                            this.showToast(this.lang === 'ID' ? 'Laporan Excel diunduh' : 'Excel report downloaded');
                            return;
                        }
                    } catch (e) {}

                    if (window.XLSX) {
                        const wb = XLSX.utils.book_new();
                        const txRows = this.transactions.map(t => ({
                            Date: t.date,
                            Category: t.category,
                            Type: t.type,
                            Wallet: t.type === 'transfer' ? `${t.account} -> ${t.toAccount}` : t.account,
                            Note: t.note || '-',
                            Amount: Number(t.amount || 0)
                        }));
                        const ws = XLSX.utils.json_to_sheet(txRows.length ? txRows : [{ Info: 'No transactions recorded yet' }]);
                        XLSX.utils.book_append_sheet(wb, ws, 'All Transactions');
                        XLSX.writeFile(wb, `DND_Financial_Report_${this.lang}.xlsx`);
                    }
                },

                async exportToPDF() {
                    const emailParam = this.googleUser && this.googleUser.email ? `&email=${encodeURIComponent(this.googleUser.email)}` : '';
                    try {
                        const res = await fetch(`/api/export/pdf?lang=${this.lang}${emailParam}`);
                        if (res.ok) {
                            const blob = await res.blob();
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `DND_Financial_Report_${this.lang}.pdf`;
                            a.click();
                            URL.revokeObjectURL(url);
                            this.showToast(this.lang === 'ID' ? 'Laporan PDF diunduh' : 'PDF report downloaded');
                            return;
                        }
                    } catch (e) {}

                    if (window.jspdf) {
                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF();
                        doc.setFontSize(16);
                        doc.text('DND Finance — Personal Ledger Report', 14, 20);
                        doc.setFontSize(10);
                        doc.text(`Net Balance: ${this.formatCurrency(this.totalBalance)} | Income: ${this.formatCurrency(this.totalIncome)} | Expense: ${this.formatCurrency(this.totalExpense + this.totalWithdrawal)}`, 14, 28);
                        if (doc.autoTable) {
                            doc.autoTable({
                                startY: 35,
                                head: [['Date', 'Category', 'Type', 'Wallet', 'Amount']],
                                body: this.transactions.map(t => [t.date, t.category, t.type, t.account, this.formatCurrency(t.amount)])
                            });
                        }
                        doc.save(`DND_Financial_Report_${this.lang}.pdf`);
                    }
                },

                updateAllCharts() {
                    if (!window.Chart) return;
                    const textColor = this.isDarkMode ? '#94A3B8' : '#64748B';
                    const gridColor = this.isDarkMode ? 'rgba(255,255,255,0.06)' : 'rgba(15,23,42,0.06)';

                    const trendCanvas = document.getElementById('dashboardTrendChart');
                    if (trendCanvas) {
                        if (this.charts.trend) this.charts.trend.destroy();
                        const recent = [...this.transactions].slice(0, 7).reverse();
                        const labels = recent.length ? recent.map(t => this.formatDateShort(t.date)) : [''];
                        const incData = recent.length ? recent.map(t => t.type === 'income' ? Number(t.amount) : 0) : [0];
                        const expData = recent.length ? recent.map(t => (t.type === 'expense' || t.type === 'withdrawal') ? Number(t.amount) : 0) : [0];

                        this.charts.trend = new Chart(trendCanvas, {
                            type: 'bar',
                            data: {
                                labels,
                                datasets: [
                                    { label: this.t('income'), data: incData, backgroundColor: '#10B981', borderRadius: 6 },
                                    { label: this.t('expense'), data: expData, backgroundColor: '#2563EB', borderRadius: 6 }
                                ]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { labels: { color: textColor, font: { size: 11 } } } },
                                scales: {
                                    x: { ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } },
                                    y: { ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor } }
                                }
                            }
                        });
                    }

                    const doughnutCanvas = document.getElementById('categoryDoughnutChart');
                    if (doughnutCanvas) {
                        if (this.charts.doughnut) this.charts.doughnut.destroy();
                        const catTotals = {};
                        this.transactions.filter(t => t.type === 'expense').forEach(t => {
                            catTotals[t.category] = (catTotals[t.category] || 0) + Number(t.amount || 0);
                        });
                        const keys = Object.keys(catTotals);
                        const vals = Object.values(catTotals);

                        this.charts.doughnut = new Chart(doughnutCanvas, {
                            type: 'doughnut',
                            data: {
                                labels: keys.length ? keys : ['Empty'],
                                datasets: [{
                                    data: vals.length ? vals : [1],
                                    backgroundColor: vals.length
                                        ? ['#2563EB', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#06B6D4', '#EC4899']
                                        : [gridColor],
                                    borderWidth: 0
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                cutout: '68%',
                                plugins: {
                                    legend: {
                                        display: vals.length > 0,
                                        position: 'bottom',
                                        labels: { color: textColor, font: { size: 11 }, padding: 12 }
                                    }
                                }
                            }
                        });
                    }

                    const walletCanvas = document.getElementById('walletBarChart');
                    if (walletCanvas) {
                        if (this.charts.wallet) this.charts.wallet.destroy();
                        const wLabels = this.banks;
                        const wData = this.banks.map(b => this.getWalletBalance(b));

                        this.charts.wallet = new Chart(walletCanvas, {
                            type: 'bar',
                            data: {
                                labels: wLabels,
                                datasets: [{
                                    label: this.t('net_total_balance'),
                                    data: wData,
                                    backgroundColor: '#2563EB',
                                    borderRadius: 8
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { display: false } },
                                scales: {
                                    x: { ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } },
                                    y: { ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor } }
                                }
                            }
                        });
                    }
                }
            };
        }
    </script>
