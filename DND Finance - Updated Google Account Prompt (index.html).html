                    }

                    if (/\b(gaji|salary|alokasi|kelola gaji|atur keuangan)\b/i.test(lower)) {
                        const baseIncome = this.totalIncome > 0 ? this.totalIncome : 10000000;
                        const needs = baseIncome * 0.50;
                        const wants = baseIncome * 0.20;
                        const savings = baseIncome * 0.20;
                        const invest = baseIncome * 0.10;
                        if (this.lang === 'ID') {
                            return `${actionBanner}**Rencana Pengelolaan Gaji & Keuangan Cerdas (Formula 50 / 20 / 20 / 10)**\n\nBerdasarkan basis pemasukan sebesar **${this.formatCurrency(baseIncome)}**, berikut pembagian pos keuangan yang terukur:\n- **50% Kebutuhan Pokok (${this.formatCurrency(needs)}):** Biaya makan, tempat tinggal, listrik, air, internet, dan transportasi harian.\n- **20% Tabungan & Dana Darurat (${this.formatCurrency(savings)}):** Disisihkan otomatis di awal gajian menuju target Dana Darurat ideal Anda sebesar **${this.formatCurrency(this.quantIntel.emergency_fund_ideal)}**.\n- **20% Gaya Hidup & Fleksibel (${this.formatCurrency(wants)}):** Hiburan, kopi, belanja non-primer, dan kebutuhan sosial.\n- **10% Investasi Jangka Panjang (${this.formatCurrency(invest)}):** Instrumen bertumbuh dengan imbal hasil di atas inflasi terkini (**${this.realtimePulse.inflation_id_pct}%/thn**).\n\nAnda juga dapat memerintahkan saya langsung dengan kalimat seperti *"Catat gaji 8jt ke BCA"* atau *"Buat target Dana Darurat 15jt"*.`;
                        }
                        return `${actionBanner}**Smart Salary & Wealth Management Plan (50 / 20 / 20 / 10 Rule)**\n\nBased on an income baseline of **${this.formatCurrency(baseIncome)}**, here is a structured allocation framework:\n- **50% Essential Needs (${this.formatCurrency(needs)}):** Housing, groceries, utilities, internet, and daily transport.\n- **20% Savings & Emergency Fund (${this.formatCurrency(savings)}):** Automatically set aside on payday toward your ideal emergency buffer of **${this.formatCurrency(this.quantIntel.emergency_fund_ideal)}**.\n- **20% Lifestyle & Discretionary (${this.formatCurrency(wants)}):** Dining out, hobbies, and non-essential shopping.\n- **10% Long-Term Investments (${this.formatCurrency(invest)}):** Diversified assets designed to outpace live inflation (**${this.realtimePulse.inflation_id_pct}%/yr**).`;
                    }

                    if (this.lang === 'ID') {
                        return `${actionBanner}**Laporan Evaluasi Keuangan Real-Time DND AI AGENT**\n\n- **Total Saldo Bersih:** ${this.formatCurrency(this.totalBalance)}\n- **Nilai Riil Saldo 1 Tahun (Setelah Inflasi ${this.realtimePulse.inflation_id_pct}%):** ${this.formatCurrency(this.quantIntel.real_balance_1y)}\n- **Total Pemasukan:** ${this.formatCurrency(this.totalIncome)}\n- **Total Pengeluaran:** ${this.formatCurrency(this.totalExpense + this.totalWithdrawal)}\n- **Skor Kesehatan Finansial:** ${this.quantIntel.health_score} / 100 (${this.quantIntel.health_grade})\n- **Rasio Tabungan:** ${this.quantIntel.savings_rate_pct}%\n- **Burn Rate Harian:** ${this.formatCurrency(this.quantIntel.daily_burn_rate)} per hari\n- **Target Dana Darurat Ideal (6 Bulan):** ${this.formatCurrency(this.quantIntel.emergency_fund_ideal)}\n\n**Rekomendasi Praktis Untuk Anda:**\n1. Pertahankan rasio tabungan minimal 20% dari setiap pemasukan bulanan Anda.\n2. Batasi pengeluaran pada kategori terbesar saat ini (${this.quantIntel.top_category}) melalui menu **Target**.\n3. Anda dapat memerintahkan saya kapan saja, misalnya *"Catat makan siang 35rb pakai Gopay"*, *"Transfer 500rb dari BCA ke Gopay"*, *"Simulasi investasi 5 tahun"*, atau menanyakan topik ekonomi dan pengetahuan umum apa pun.`;
                    }
                    return `${actionBanner}**DND AI AGENT Real-Time Financial Evaluation Report**\n\n- **Net Total Balance:** ${this.formatCurrency(this.totalBalance)}\n- **Real 1-Year Balance (Inflation ${this.realtimePulse.inflation_id_pct}% Adjusted):** ${this.formatCurrency(this.quantIntel.real_balance_1y)}\n- **Total Income:** ${this.formatCurrency(this.totalIncome)}\n- **Total Expense:** ${this.formatCurrency(this.totalExpense + this.totalWithdrawal)}\n- **Financial Health Score:** ${this.quantIntel.health_score} / 100 (${this.quantIntel.health_grade})\n- **Savings Rate:** ${this.quantIntel.savings_rate_pct}%\n- **Daily Burn Rate:** ${this.formatCurrency(this.quantIntel.daily_burn_rate)} per day\n- **Ideal 6-Month Emergency Fund:** ${this.formatCurrency(this.quantIntel.emergency_fund_ideal)}\n\n**Practical Next Steps:**\n1. Maintain at least a 20% savings rate from every monthly inflow.\n2. Set a monthly cap on your top spending category (${this.quantIntel.top_category}) in the Goals tab.\n3. You can instruct me directly using phrases like *"Record lunch 20 USD via BCA"*, *"Convert 500 USD to IDR"*, *"5-year investment simulation"*, or ask any economic or general knowledge question.`;
                },

                formatMarkdownLight(text) {
                    const clean = stripAllEmojis(text || '');
                    const escaped = clean
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
                    return escaped
                        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.+?)\*/g, '<em>$1</em>')
                        .replace(/\n/g, '<br>');
                },

                copyToClipboard(text) {
                    const clean = stripAllEmojis(text || '');
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(clean);
                        this.showToast(this.lang === 'ID' ? 'Teks disalin ke clipboard.' : 'Copied to clipboard.');
                    }
                },

                // ==========================================
                // CHART.JS VISUALIZATION ENGINE
                // ==========================================
                updateAllCharts() {
                    if (!window.Chart) return;
                    this.renderTrendChart();
                    this.renderAnalyticsCashflowChart();
                    this.renderUnifiedCategoryChart();
                    this.renderWalletChart();
                },

                buildCashflowSeries(groupBy = 'date') {
                    if (this.transactions.length === 0) {
                        return {
                            labels: [this.lang === 'ID' ? 'Hari Ini' : 'Today'],
                            incomeData: [0],
                            expenseData: [0]
                        };
                    }

                    const chronological = [...this.transactions].reverse();
                    if (groupBy === 'tx') {
                        const recent = chronological.slice(-12);
                        return {
                            labels: recent.map(tx => (tx.note || tx.category || '').slice(0, 12)),
                            incomeData: recent.map(tx => tx.type === 'income' ? Number(tx.amount || 0) : 0),
                            expenseData: recent.map(tx => (tx.type === 'expense' || tx.type === 'withdrawal') ? Number(tx.amount || 0) : 0)
                        };
                    }

                    const map = {};
                    for (const tx of chronological) {
                        const d = String(tx.date || '').slice(0, 10) || 'Today';
                        if (!map[d]) map[d] = { inc: 0, exp: 0 };
                        if (tx.type === 'income') map[d].inc += Number(tx.amount || 0);
                        else if (tx.type === 'expense' || tx.type === 'withdrawal') map[d].exp += Number(tx.amount || 0);
                    }
                    const keys = Object.keys(map).slice(-10);
                    return {
                        labels: keys.map(k => k.length >= 10 ? k.slice(5) : k),
                        incomeData: keys.map(k => map[k].inc),
                        expenseData: keys.map(k => map[k].exp)
                    };
                },

                renderTrendChart() {
                    const canvas = document.getElementById('dashboardTrendChart');
                    if (!canvas || !window.Chart) return;
                    if (_dndChartInstances.trend) {
                        _dndChartInstances.trend.destroy();
                        _dndChartInstances.trend = null;
                    }
                    const { labels, incomeData, expenseData } = this.buildCashflowSeries('date');
                    const gridColor = this.isDarkMode ? 'rgba(148, 163, 184, 0.1)' : 'rgba(15, 23, 42, 0.06)';
                    const tickColor = this.isDarkMode ? '#94A3B8' : '#64748B';

                    _dndChartInstances.trend = new Chart(canvas.getContext('2d'), {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [
                                {
                                    label: this.t('income'),
                                    data: incomeData,
                                    backgroundColor: '#10B981',
                                    borderRadius: 6,
                                    barPercentage: 0.65
                                },
                                {
                                    label: this.t('expense'),
                                    data: expenseData,
                                    backgroundColor: '#F43F5E',
                                    borderRadius: 6,
                                    barPercentage: 0.65
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { grid: { display: false }, ticks: { color: tickColor, font: { size: 10 } } },
                                y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 10 } } }
                            }
                        }
                    });
                },

                renderAnalyticsCashflowChart() {
                    const canvas = document.getElementById('analyticsCashflowChart');
                    if (!canvas || !window.Chart) return;
                    if (_dndChartInstances.analyticsCashflow) {
                        _dndChartInstances.analyticsCashflow.destroy();
                        _dndChartInstances.analyticsCashflow = null;
                    }
                    const { labels, incomeData, expenseData } = this.buildCashflowSeries(this.cashflowChartGroup);
                    const gridColor = this.isDarkMode ? 'rgba(148, 163, 184, 0.1)' : 'rgba(15, 23, 42, 0.06)';
                    const tickColor = this.isDarkMode ? '#94A3B8' : '#64748B';

                    _dndChartInstances.analyticsCashflow = new Chart(canvas.getContext('2d'), {
                        type: 'line',
                        data: {
                            labels,
                            datasets: [
                                {
                                    label: this.t('income'),
                                    data: incomeData,
                                    borderColor: '#10B981',
                                    backgroundColor: 'rgba(16, 185, 129, 0.14)',
                                    fill: true,
                                    tension: 0.35
                                },
                                {
                                    label: this.t('expense'),
                                    data: expenseData,
                                    borderColor: '#F43F5E',
                                    backgroundColor: 'rgba(244, 63, 94, 0.14)',
                                    fill: true,
                                    tension: 0.35
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { labels: { color: tickColor, font: { size: 11 } } } },
                            scales: {
                                x: { grid: { display: false }, ticks: { color: tickColor, font: { size: 10 } } },
                                y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 10 } } }
                            }
                        }
                    });
                },

                renderUnifiedCategoryChart() {
                    const canvas = document.getElementById('unifiedCategoryChart');
                    if (!canvas || !window.Chart) return;
                    if (_dndChartInstances.unifiedCategory) {
                        _dndChartInstances.unifiedCategory.destroy();
                        _dndChartInstances.unifiedCategory = null;
                    }
                    const items = this.unifiedCategoryBreakdown;
                    const labels = items.length ? items.map(i => i.category) : ['No Data'];
                    const data = items.length ? items.map(i => i.amount) : [1];
                    const colors = items.length ? items.map(i => i.color) : [this.isDarkMode ? '#1E2633' : '#E2E8F0'];

                    _dndChartInstances.unifiedCategory = new Chart(canvas.getContext('2d'), {
                        type: 'doughnut',
                        data: {
                            labels,
                            datasets: [{
                                data,
                                backgroundColor: colors,
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '68%',
                            plugins: { legend: { display: false } }
                        }
                    });
                },

                renderWalletChart() {
                    const canvas = document.getElementById('walletBarChart');
                    if (!canvas || !window.Chart) return;
                    if (_dndChartInstances.wallet) {
                        _dndChartInstances.wallet.destroy();
                        _dndChartInstances.wallet = null;
                    }
                    const labels = this.banks;
                    const data = labels.map(b => this.getWalletBalance(b));
                    const tickColor = this.isDarkMode ? '#94A3B8' : '#64748B';
                    const gridColor = this.isDarkMode ? 'rgba(148, 163, 184, 0.1)' : 'rgba(15, 23, 42, 0.06)';

                    _dndChartInstances.wallet = new Chart(canvas.getContext('2d'), {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [{
                                label: this.t('net_total_balance'),
                                data,
                                backgroundColor: '#2563EB',
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { grid: { display: false }, ticks: { color: tickColor, font: { size: 10 } } },
                                y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 10 } } }
                            }
                        }
                    });
                }
            };
        }
    </script>
