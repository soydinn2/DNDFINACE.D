                async preprocessImageForOcr(dataUrl) {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => {
                            try {
                                const maxDim = 1600;
                                const scale = Math.min(1.6, maxDim / Math.max(img.width, img.height));
                                const canvas = document.createElement('canvas');
                                canvas.width = Math.round(img.width * scale);
                                canvas.height = Math.round(img.height * scale);
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                                const d = imgData.data;
                                for (let i = 0; i < d.length; i += 4) {
                                    const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                                    const contrasted = gray > 142 ? Math.min(255, gray * 1.15) : Math.max(0, gray * 0.72);
                                    d[i] = d[i + 1] = d[i + 2] = contrasted;
                                }
                                ctx.putImageData(imgData, 0, 0);
                                resolve(canvas.toDataURL('image/png'));
                            } catch (err) {
                                resolve(dataUrl);
                            }
                        };
                        img.onerror = () => resolve(dataUrl);
                        img.src = dataUrl;
                    });
                },

                async processReceiptImageUniversal(imageDataUrl, mode = 'split') {
                    if (mode === 'split') this.isScanningSplitBill = true;
                    else this.isScanningReceipt = true;

                    try {
                        let ocrText = '';
                        let backendResult = null;

                        try {
                            const blobRes = await fetch(imageDataUrl);
                            const blob = await blobRes.blob();
                            const fd = new FormData();
                            fd.append('file', blob, 'receipt.jpg');
                            const apiRes = await fetch('/api/scan/receipt', { method: 'POST', body: fd });
                            if (apiRes.ok) {
                                const json = await apiRes.json();
                                if (json.status === 'ok' && json.data && (json.data.amount > 0 || (json.data.items && json.data.items.length > 0))) {
                                    backendResult = json.data;
                                }
                            }
                        } catch (e) {}

                        if (!backendResult && window.Tesseract && typeof window.Tesseract.recognize === 'function') {
                            const enhancedUrl = await this.preprocessImageForOcr(imageDataUrl);
                            const ocrPromise = window.Tesseract.recognize(enhancedUrl, 'eng+ind');
                            const timeoutPromise = new Promise((_, rej) => setTimeout(() => rej(new Error('OCR_TIMEOUT')), 16000));
                            const result = await Promise.race([ocrPromise, timeoutPromise]);
                            ocrText = (result && result.data && result.data.text) ? result.data.text : '';
                        }

                        const parsed = backendResult
                            ? this.normalizeBackendReceiptResult(backendResult)
                            : this.parseAndReconcileReceiptText(ocrText);

                        const scanDbRecord = {
                            id: 'scan_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                            account_key: this.resolvedAccountKey,
                            scan_mode: mode,
                            merchant: parsed.merchant,
                            items: parsed.items,
                            subtotal: parsed.subtotal,
                            discount: parsed.discount,
                            tax_percent: parsed.taxPercent,
                            tax_amount: parsed.taxAmount,
                            grand_total: parsed.grandTotal,
                            people_count: mode === 'split' ? Math.max(1, Number(this.splitPeople || 1)) : 1,
                            per_person: mode === 'split'
                                ? Math.round((parsed.grandTotal / Math.max(1, Number(this.splitPeople || 1))) * 100) / 100
                                : parsed.grandTotal,
                            created_at: new Date().toISOString()
                        };
                        await _dndLocalDb.addReceiptScan(scanDbRecord);
                        this.receiptScanLogs = await _dndLocalDb.listReceiptScans(this.resolvedAccountKey);

                        fetch('/api/db/scan', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(scanDbRecord)
                        }).catch(() => {});

                        if (mode === 'split') {
                            this.splitMerchant = parsed.merchant;
                            this.splitItems = parsed.items;
                            this.splitSubtotal = parsed.subtotal;
                            this.splitDiscount = parsed.discount;
                            this.splitTax = parsed.taxPercent;
                            this.recalculateSplitBillMath();
                            this.showToast(
                                this.lang === 'ID'
                                    ? `Struk dipindai & dihitung otomatis (${parsed.items.length} item).`
                                    : `Receipt scanned & auto-calculated (${parsed.items.length} items).`
                            );
                        } else {
                            this.scannedReceiptMerchant = parsed.merchant;
                            this.scannedReceiptItems = parsed.items;
                            this.scannedReceiptSubtotal = parsed.subtotal;
                            this.scannedReceiptDiscount = parsed.discount;
                            this.scannedReceiptTaxPct = parsed.taxPercent;
                            this.recalculateExpenseReceiptMath(false);
                            if (parsed.grandTotal > 0) this.txForm.amount = parsed.grandTotal;
                            if (parsed.merchant) this.txForm.note = parsed.merchant;
                            if (parsed.suggestedCategory && this.categories.includes(parsed.suggestedCategory)) {
                                this.txForm.category = parsed.suggestedCategory;
                            }
                            this.showToast(
                                this.lang === 'ID'
                                    ? `Nota belanja dihitung otomatis: ${this.formatCurrency(parsed.grandTotal)}`
                                    : `Receipt auto-calculated: ${this.formatCurrency(parsed.grandTotal)}`
                            );
                        }
                    } catch (err) {
                        if (mode === 'split') {
                            this.splitMerchant = this.lang === 'ID' ? 'Struk Manual' : 'Manual Receipt';
                            if (this.splitItems.length === 0) this.addSplitItemRow();
                        } else {
                            this.scannedReceiptMerchant = this.lang === 'ID' ? 'Nota Manual' : 'Manual Receipt';
                            if (this.scannedReceiptItems.length === 0) this.addExpenseReceiptItemRow();
                        }
                        this.showToast(
                            this.lang === 'ID'
                                ? 'Gambar diterima. Silakan sesuaikan daftar item & nominal secara langsung.'
                                : 'Image loaded. You can adjust item rows and amounts directly.'
                        );
                    } finally {
                        this.isScanningSplitBill = false;
                        this.isScanningReceipt = false;
                        this.$nextTick(() => this.refreshIcons());
                    }
                },

                normalizeBackendReceiptResult(data) {
                    const items = Array.isArray(data.items)
                        ? data.items.map(it => {
                            const qty = Math.max(1, Number(it.qty || 1));
                            const price = Math.max(0, Number(it.price || 0));
                            return {
                                name: stripAllEmojis(it.name || 'Item'),
                                qty,
                                unitPrice: qty > 0 ? Math.round((price / qty) * 100) / 100 : price,
                                price
                            };
                        })
                        : [];
                    const itemsSum = items.reduce((s, it) => s + it.price, 0);
                    const subtotal = itemsSum > 0 ? itemsSum : Math.max(0, Number(data.subtotal || data.amount || 0));
                    const discount = Math.max(0, Number(data.discount || 0));
                    const taxPercent = Math.max(0, Number(data.tax_percent || 0));
                    const netBase = Math.max(0, subtotal - discount);
                    const taxAmount = Math.round(netBase * (taxPercent / 100) * 100) / 100;
                    const grandTotal = Math.round((netBase + taxAmount) * 100) / 100;

                    return {
                        merchant: stripAllEmojis(data.merchant || 'Struk Belanja'),
                        items,
                        subtotal,
                        discount,
                        taxPercent,
                        taxAmount,
                        grandTotal,
                        suggestedCategory: data.category || 'Food'
                    };
                },

                parseAndReconcileReceiptText(rawText) {
                    const lines = String(rawText || '')
                        .split(/\r?\n/)
                        .map(l => stripAllEmojis(l).trim())
                        .filter(Boolean);

                    let merchant = '';
                    for (let i = 0; i < Math.min(4, lines.length); i++) {
                        const line = lines[i];
                        if (line.length >= 3 && !/^\d+[\d\s\-/:.]*$/.test(line) && !/(struk|receipt|invoice|nota|kasir|cashier|npwp)/i.test(line)) {
                            merchant = line.slice(0, 48);
                            break;
                        }
                    }
                    if (!merchant) merchant = this.lang === 'ID' ? 'Struk Belanja Terpindai' : 'Scanned Receipt';

                    const items = [];
                    let printedSubtotal = 0;
                    let printedDiscount = 0;
                    let printedTaxNominal = 0;
                    let printedTaxPct = 0;
                    let printedTotal = 0;

                    const parseMoneyToken = (str) => {
                        const cleaned = str.replace(/[^\d.,]/g, '');
                        if (!cleaned) return 0;
                        if (/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(cleaned)) {
                            return parseFloat(cleaned.replace(/\./g, '').replace(',', '.'));
                        }
                        if (/^\d{1,3}(,\d{3})+(\.\d{1,2})?$/.test(cleaned)) {
                            return parseFloat(cleaned.replace(/,/g, ''));
                        }
                        const digitsOnly = cleaned.replace(/[.,]/g, '');
                        return Number(digitsOnly || 0);
                    };

                    for (const line of lines) {
                        const lower = line.toLowerCase();
                        const moneyMatches = line.match(/(?:rp\.?\s*)?\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?|\b\d{4,9}\b/gi);
                        const lastVal = moneyMatches && moneyMatches.length ? parseMoneyToken(moneyMatches[moneyMatches.length - 1]) : 0;

                        if (/(diskon|discount|voucher|hemat|potongan)/i.test(lower) && lastVal > 0) {
                            printedDiscount += lastVal;
                            continue;
                        }
                        if (/(ppn|pb1|tax|pajak|service|servis)/i.test(lower)) {
                            const pctMatch = line.match(/(\d+(?:[.,]\d+)?)\s*%/);
                            if (pctMatch) {
                                printedTaxPct += parseFloat(pctMatch[1].replace(',', '.'));
                            } else if (lastVal > 0) {
                                printedTaxNominal += lastVal;
                            }
                            continue;
                        }
                        if (/(sub\s*total|subtotal)/i.test(lower) && lastVal > 0) {
                            printedSubtotal = lastVal;
                            continue;
                        }
                        if (/(grand\s*total|total\s*bayar|total\s*belanja|total\s*tagihan|^total\b)/i.test(lower) && lastVal > 0) {
                            printedTotal = Math.max(printedTotal, lastVal);
                            continue;
                        }
                        if (/(tunai|cash|kembalian|change|debit|qris|kredit|card|edc|approval|trace)/i.test(lower)) {
                            continue;
                        }

                        if (lastVal >= 500 && lastVal < 500000000) {
                            let qty = 1;
                            const qtyMatch = line.match(/(?:^|\s)(\d{1,3})\s*[xX*]\s*/);
                            if (qtyMatch) qty = Math.max(1, parseInt(qtyMatch[1], 10));

                            let itemName = line
                                .replace(/(?:rp\.?\s*)?\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?/gi, '')
                                .replace(/\b\d{4,9}\b/g, '')
                                .replace(/(?:^|\s)\d{1,3}\s*[xX*]\s*/g, ' ')
                                .replace(/[^\w\s&\-/().]/g, '')
                                .trim();

                            if (itemName.length >= 2) {
                                const unitPrice = qty > 0 ? Math.round((lastVal / qty) * 100) / 100 : lastVal;
                                items.push({
                                    name: itemName.slice(0, 42),
                                    qty,
                                    unitPrice,
                                    price: lastVal
                                });
                            }
                        }
                    }

                    const itemsSum = items.reduce((acc, it) => acc + it.price, 0);
                    let subtotal = itemsSum > 0 ? itemsSum : (printedSubtotal > 0 ? printedSubtotal : printedTotal);
                    const discount = Math.max(0, printedDiscount);
                    const netBase = Math.max(0, subtotal - discount);

                    let taxPercent = printedTaxPct;
                    if (taxPercent <= 0 && printedTaxNominal > 0 && netBase > 0) {
                        taxPercent = Math.round((printedTaxNominal / netBase) * 1000) / 10;
                    }
                    const taxAmount = Math.round(netBase * (taxPercent / 100) * 100) / 100;
                    let grandTotal = Math.round((netBase + taxAmount) * 100) / 100;

                    if (grandTotal <= 0 && printedTotal > 0) {
                        subtotal = printedTotal;
                        grandTotal = printedTotal;
                    }

                    let suggestedCategory = 'Food';
                    const fullLower = (merchant + ' ' + rawText).toLowerCase();
                    if (/(indomaret|alfamart|superindo|hypermart|carrefour|tokopedia|shopee)/i.test(fullLower)) suggestedCategory = 'Online Shopping';
                    else if (/(pertamina|shell|bp|grab|gojek|bluebird|parkir)/i.test(fullLower)) suggestedCategory = 'Transport';
                    else if (/(pln|pdam|telkom|indihome|xl|telkomsel)/i.test(fullLower)) suggestedCategory = 'Utilities';

                    return {
                        merchant,
                        items,
                        subtotal,
                        discount,
                        taxPercent,
                        taxAmount,
                        grandTotal,
                        suggestedCategory
                    };
                },

                // ==========================================
                // GOALS, BUDGETS & AUTOPILOT RULES (ALL 7 RULE TYPES COMPLETE)
                // ==========================================
                openGoalModal() {
                    this.goalForm = { name: '', target: '', current: 0 };
                    this.showGoalModal = true;
                },

                saveGoal() {
                    const name = stripAllEmojis(this.goalForm.name || '').trim();
                    const target = Number(this.goalForm.target || 0);
                    const current = Math.max(0, Number(this.goalForm.current || 0));
                    if (!name || target <= 0) return;

                    this.goals.push({
                        id: 'goal_' + Date.now(),
                        name,
                        target,
                        current,
                        updated_at: new Date().toISOString()
                    });
                    this.showGoalModal = false;
                    this.saveLocalState(true);
                    this.$nextTick(() => this.refreshIcons());
                    this.showToast(this.lang === 'ID' ? 'Target tabungan dibuat.' : 'Savings goal created.');
                },

                topUpGoal(goalId) {
                    const g = this.goals.find(item => item.id === goalId);
                    if (!g) return;
                    const step = Math.max(10000, Math.round(g.target * 0.1));
                    g.current = Number(g.current || 0) + step;
                    g.updated_at = new Date().toISOString();
                    this.saveLocalState(true);
                    this.showToast(
                        this.lang === 'ID'
                            ? `Menambahkan ${this.formatCurrency(step)} ke ${g.name}.`
                            : `Added ${this.formatCurrency(step)} to ${g.name}.`
                    );
                },

                deleteGoal(goalId) {
                    this.goals = this.goals.filter(g => g.id !== goalId);
                    if (!this.deletedGoalIds.includes(goalId)) this.deletedGoalIds.push(goalId);
                    this.saveLocalState(true);
                },

                    this.showBudgetModal = true;
                },

                    const existing = this.budgets.find(b => b.category === cat);
                    if (existing) {

                        existing.updated_at = new Date().toISOString();
                    } else {
                        this.budgets.push({
                            id: 'bud_' + Date.now(),

                            updated_at: new Date().toISOString()
                        });

                describeRule(rule) {
                    const tType = rule.actionType;
                    if (tType === 'auto_save_goal') {
                        return this.lang === 'ID'
                            ? `Sisihkan ${rule.percent}% dari pemasukan ke target "${rule.targetGoalName}"`
                            : `Allocate ${rule.percent}% of income to goal "${rule.targetGoalName}"`;
                    }
                    if (tType === 'fixed_save_goal') {
                        return this.lang === 'ID'
                            ? `Sisihkan tetap ${this.formatCurrency(rule.fixedAmount)} dari pemasukan ke target "${rule.targetGoalName}"`
                            : `Save fixed ${this.formatCurrency(rule.fixedAmount)} from income to goal "${rule.targetGoalName}"`;
                    }
                    if (tType === 'auto_transfer_wallet') {
                        const fromText = rule.sourceWallet || (this.lang === 'ID' ? 'semua dompet' : 'any wallet');
                        return this.lang === 'ID'
                            ? `Auto-transfer ${rule.percent}% pemasukan dari ${fromText} ke ${rule.destWallet}`
                            : `Auto-transfer ${rule.percent}% of income from ${fromText} to ${rule.destWallet}`;
                    }
                    if (tType === 'expense_save_goal') {
                        return this.lang === 'ID'
                            ? `Sisihkan ${rule.percent}% dari pengeluaran ke target "${rule.targetGoalName}"`
                            : `Allocate ${rule.percent}% of expense to goal "${rule.targetGoalName}"`;
                    }
                    if (tType === 'expense_transfer_wallet') {
                        return this.lang === 'ID'
                            ? `Auto-transfer ${rule.percent}% dari pengeluaran ke dompet ${rule.destWallet}`
                            : `Auto-transfer ${rule.percent}% of expense to wallet ${rule.destWallet}`;
                    }
                    if (tType === 'spend_alert') {
                        return this.lang === 'ID'
                            ? `Peringatan otomatis jika pengeluaran melebihi ${this.formatCurrency(rule.thresholdAmount)}`
                            : `Alert when single expense exceeds ${this.formatCurrency(rule.thresholdAmount)}`;
                    }
                    if (tType === 'category_spend_alert') {
                        return this.lang === 'ID'
                            ? `Peringatan otomatis jika kategori "${rule.targetCategory}" melebihi ${this.formatCurrency(rule.thresholdAmount)}`
                            : `Alert when "${rule.targetCategory}" expense exceeds ${this.formatCurrency(rule.thresholdAmount)}`;
                    }
                    return tType;
                },

                upsertGoalByRule(goalName, addAmount) {
                    if (!addAmount || addAmount <= 0) return;
                    const cleanName = stripAllEmojis(goalName || 'Dana Darurat').trim();
                    let goal = this.goals.find(g => g.name.toLowerCase() === cleanName.toLowerCase());
                    if (!goal) {
                        goal = {
                            id: 'goal_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                            name: cleanName,
                            target: Math.max(1000000, addAmount * 10),
                            current: 0,
                            updated_at: new Date().toISOString()
                        };
                        this.goals.push(goal);
                    }
                    goal.current = Number(goal.current || 0) + addAmount;
                    goal.updated_at = new Date().toISOString();
                },

                executeAutopilotRules(tx) {
                    if (!tx || tx._isAutopilotGenerated) return;
                    for (const rule of this.automationRules) {
                        if (!rule.enabled) continue;
                        const tType = rule.actionType;
                        const minTrigger = Number(rule.minAmount || 0);

                        if (tType === 'auto_save_goal' && tx.type === 'income' && tx.amount >= minTrigger) {
                            const addAmt = Math.round(tx.amount * (Number(rule.percent || 0) / 100));
                            this.upsertGoalByRule(rule.targetGoalName, addAmt);
                            rule.runCount = Number(rule.runCount || 0) + 1;
                            rule.updated_at = new Date().toISOString();
                        } else if (tType === 'fixed_save_goal' && tx.type === 'income' && tx.amount >= minTrigger) {
                            const addAmt = Math.round(Number(rule.fixedAmount || 0));
                            this.upsertGoalByRule(rule.targetGoalName, addAmt);
                            rule.runCount = Number(rule.runCount || 0) + 1;
                            rule.updated_at = new Date().toISOString();
                        } else if (tType === 'auto_transfer_wallet' && tx.type === 'income' && tx.amount >= minTrigger) {
                            if (!rule.sourceWallet || rule.sourceWallet === tx.account) {
                                const tfAmt = Math.round(tx.amount * (Number(rule.percent || 0) / 100));
                                const dest = rule.destWallet || this.banks[0];
                                if (tfAmt > 0 && dest && dest !== tx.account) {
                                    this.transactions.unshift({
                                        id: 'tx_auto_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                                        amount: tfAmt,
                                        type: 'transfer',
                                        category: 'Transfer',
                                        account: tx.account,
                                        toAccount: dest,
                                        adminFee: 0,
                                        note: `Autopilot: ${rule.name}`,
                                        date: this.getLocalDateTimeInput().replace('T', ' '),
                                        updated_at: new Date().toISOString(),
                                        _isAutopilotGenerated: true
                                    });
                                    rule.runCount = Number(rule.runCount || 0) + 1;
                                    rule.updated_at = new Date().toISOString();
                                }
                            }
                        } else if (tType === 'expense_save_goal' && (tx.type === 'expense' || tx.type === 'withdrawal') && tx.amount >= minTrigger) {
                            const addAmt = Math.round(tx.amount * (Number(rule.percent || 0) / 100));
                            this.upsertGoalByRule(rule.targetGoalName, addAmt);
                            rule.runCount = Number(rule.runCount || 0) + 1;
                            rule.updated_at = new Date().toISOString();
                        } else if (tType === 'expense_transfer_wallet' && (tx.type === 'expense' || tx.type === 'withdrawal') && tx.amount >= minTrigger) {
                            const tfAmt = Math.round(tx.amount * (Number(rule.percent || 0) / 100));
                            const dest = rule.destWallet || this.banks[0];
                            if (tfAmt > 0 && dest && dest !== tx.account) {
                                this.transactions.unshift({
                                    id: 'tx_auto_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                                    amount: tfAmt,
                                    type: 'transfer',
                                    category: 'Transfer',
                                    account: tx.account,
                                    toAccount: dest,
                                    adminFee: 0,
                                    note: `Autopilot: ${rule.name}`,
                                    date: this.getLocalDateTimeInput().replace('T', ' '),
                                    updated_at: new Date().toISOString(),
                                    _isAutopilotGenerated: true
                                });
                                rule.runCount = Number(rule.runCount || 0) + 1;
                                rule.updated_at = new Date().toISOString();
                            }
                        } else if (tType === 'spend_alert' && (tx.type === 'expense' || tx.type === 'withdrawal') && tx.amount >= Number(rule.thresholdAmount || 0)) {
                            rule.runCount = Number(rule.runCount || 0) + 1;
                            rule.updated_at = new Date().toISOString();
                            this.showToast(
                                this.lang === 'ID'
                                    ? `Autopilot Alert: Pengeluaran ${this.formatCurrency(tx.amount)} melebihi batas!`
                                    : `Autopilot Alert: Expense ${this.formatCurrency(tx.amount)} exceeded limit!`
                            );
                        } else if (tType === 'category_spend_alert' && (tx.type === 'expense' || tx.type === 'withdrawal') && tx.category === rule.targetCategory && tx.amount >= Number(rule.thresholdAmount || 0)) {
                            rule.runCount = Number(rule.runCount || 0) + 1;
                            rule.updated_at = new Date().toISOString();
                            this.showToast(
                                this.lang === 'ID'
                                    ? `Autopilot Alert (${tx.category}): ${this.formatCurrency(tx.amount)} melebihi batas!`
                                    : `Autopilot Alert (${tx.category}): ${this.formatCurrency(tx.amount)} exceeded limit!`
                            );
                        }
                    }
                },

                // ==========================================
                // DATABASE EXCEL & PDF IMPORT / EXPORT ENGINE
                // ==========================================
                async fetchReportHistory() {
                    this.reportFileLogs = await _dndLocalDb.listReportFiles(this.resolvedAccountKey);
                    this.receiptScanLogs = await _dndLocalDb.listReceiptScans(this.resolvedAccountKey);
                },

                async handleReportImport(event) {
                    const file = event.target.files && event.target.files[0];
                    event.target.value = '';
                    if (!file) return;

                    this.isImportingReport = true;
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const sha256 = await computeSha256Short(arrayBuffer);
                        const lowerName = file.name.toLowerCase();
                        let importedTxs = [];
                        let fileFormat = 'EXCEL';

                        if (lowerName.endsWith('.pdf')) {
                            fileFormat = 'PDF';
                            importedTxs = await this.parsePdfBufferToTransactions(arrayBuffer, file.name);
                        } else {
                            fileFormat = lowerName.endsWith('.csv') ? 'CSV' : 'EXCEL';
                            importedTxs = this.parseExcelBufferToTransactions(arrayBuffer, file.name);
                        }

                        if (importedTxs.length === 0) {
                            this.showToast(
                                this.lang === 'ID'
                                    ? 'Tidak ditemukan baris transaksi valid pada file tersebut.'
                                    : 'No valid transaction rows found in the uploaded file.'
                            );
                            return;
                        }

                        for (const tx of importedTxs) {
                            this.transactions.unshift(tx);
                            if (tx.account && !this.banks.includes(tx.account)) this.banks.push(tx.account);
                            if (tx.category && tx.category !== 'Transfer' && !this.categories.includes(tx.category)) {
                                this.categories.push(tx.category);
                            }
                        }

                        const impIncome = importedTxs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
                        const impExpense = importedTxs.filter(t => t.type !== 'income' && t.type !== 'transfer').reduce((s, t) => s + t.amount, 0);

                        const repRecord = {
                            id: 'rep_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                            account_key: this.resolvedAccountKey,
                            filename: stripAllEmojis(file.name),
                            file_format: fileFormat,
                            direction: 'IMPORT',
                            tx_count: importedTxs.length,
                            total_income: impIncome,
                            total_expense: impExpense,
                            net_balance: impIncome - impExpense,
                            checksum_sha256: sha256,
                            created_at: new Date().toISOString()
                        };
                        await _dndLocalDb.addReportFile(repRecord);
                        fetch('/api/db/report', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(repRecord)
                        }).catch(() => {});

                        await this.fetchReportHistory();
                        this.saveLocalState(true);
                        this.$nextTick(() => {
                            this.refreshIcons();
                            this.updateAllCharts();
                        });

                        this.showToast(
                            this.lang === 'ID'
                                ? `Berhasil mengimpor ${importedTxs.length} transaksi dari ${fileFormat}.`
                                : `Successfully imported ${importedTxs.length} transactions from ${fileFormat}.`
                        );
                    } catch (err) {
                        this.showToast(this.lang === 'ID' ? 'Gagal memproses file laporan.' : 'Failed to parse report file.');
                    } finally {
                        this.isImportingReport = false;
                    }
                },

                parseExcelBufferToTransactions(arrayBuffer, filename) {
                    if (!window.XLSX) return [];
                    const wb = window.XLSX.read(arrayBuffer, { type: 'array' });
                    let bestSheetName = wb.SheetNames[0];
                    for (const name of wb.SheetNames) {
                        if (/(transaksi|ledger|buku|kas|statement|mutasi)/i.test(name)) {
                            bestSheetName = name;
                            break;
                        }
                    }
                    const sheet = wb.Sheets[bestSheetName];
                    const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                    if (!rows || rows.length < 2) return [];

                    let headerIdx = 0;
                    for (let i = 0; i < Math.min(12, rows.length); i++) {
                        const joined = rows[i].map(c => String(c || '').toLowerCase()).join(' ');
                        if (/(tanggal|date|nominal|amount|jumlah|keterangan|note|kategori|category|debit|kredit)/i.test(joined)) {
                            headerIdx = i;
                            break;
                        }
                    }

                    const headers = rows[headerIdx].map(h => String(h || '').trim().toLowerCase());
                    const findCol = (patterns) => headers.findIndex(h => patterns.some(p => h.includes(p)));

                    const colDate = findCol(['tanggal', 'date', 'waktu', 'tgl']);
                    const colType = findCol(['jenis', 'type', 'tipe', 'arus']);
                    const colCat = findCol(['kategori', 'category']);
                    const colWallet = findCol(['dompet', 'wallet', 'rekening', 'account', 'bank']);
                    const colNote = findCol(['catatan', 'note', 'keterangan', 'deskripsi', 'description', 'uraian']);
                    const colAmount = findCol(['nominal', 'amount', 'jumlah', 'nilai', 'total']);
                    const colDebit = findCol(['debit', 'keluar', 'outflow', 'expense']);
                    const colCredit = findCol(['kredit', 'credit', 'masuk', 'inflow', 'income']);

                    const results = [];
                    for (let r = headerIdx + 1; r < rows.length; r++) {
                        const row = rows[r];
                        if (!row || row.every(cell => String(cell || '').trim() === '')) continue;

                        let amount = 0;
                        let type = 'expense';

                        if (colAmount !== -1 && row[colAmount] !== '') {
                            const rawAmt = String(row[colAmount]).replace(/[^\d.,-]/g, '');
                            const numVal = parseFloat(rawAmt.replace(/\./g, '').replace(',', '.')) || 0;
                            amount = Math.abs(numVal);
                            if (numVal < 0) type = 'expense';
                        } else if (colCredit !== -1 || colDebit !== -1) {
                            const cr = colCredit !== -1 ? Number(String(row[colCredit] || '').replace(/[^\d]/g, '')) || 0 : 0;
                            const db = colDebit !== -1 ? Number(String(row[colDebit] || '').replace(/[^\d]/g, '')) || 0 : 0;
                            if (cr > 0) {
                                amount = cr;
                                type = 'income';
                            } else if (db > 0) {
                                amount = db;
                                type = 'expense';
                            }
                        }

                        if (!amount || amount <= 0) continue;

                        if (colType !== -1 && row[colType]) {
                            const tStr = String(row[colType]).toLowerCase();
                            if (/(income|pemasukan|masuk|kredit|cr)/i.test(tStr)) type = 'income';
                            else if (/(transfer|pindah)/i.test(tStr)) type = 'transfer';
                            else type = 'expense';
                        }

                        const rawDate = colDate !== -1 && row[colDate] ? String(row[colDate]).trim() : this.getLocalDateTimeInput().replace('T', ' ');
                        const cat = colCat !== -1 && row[colCat] ? stripAllEmojis(String(row[colCat]).trim()) : (type === 'income' ? 'Salary' : 'Food');
                        const wallet = colWallet !== -1 && row[colWallet] ? stripAllEmojis(String(row[colWallet]).trim()) : (this.banks[0] || 'Bank BCA');
                        const note = colNote !== -1 && row[colNote] ? stripAllEmojis(String(row[colNote]).trim()) : `Import ${filename}`;

                        results.push({
                            id: 'tx_imp_' + Date.now() + '_' + r + '_' + Math.random().toString(36).slice(2, 5),
                            amount,
                            type,
                            category: cat || (type === 'income' ? 'Salary' : 'Food'),
                            account: wallet || 'Bank BCA',
                            toAccount: '',
                            adminFee: 0,
                            note,
                            date: rawDate,
                            updated_at: new Date().toISOString()
                        });
                    }
                    return results;
                },

                async parsePdfBufferToTransactions(arrayBuffer, filename) {
                    if (!window.pdfjsLib) return [];
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = '';
                    for (let p = 1; p <= pdf.numPages; p++) {
                        const page = await pdf.getPage(p);
                        const content = await page.getTextContent();
                        const strings = content.items.map(it => it.str);
                        fullText += strings.join(' ') + '\n';
                    }

                    const results = [];
                    const regex = /(\d{4}-\d{2}-\d{2}(?:\s+\d{2}:\d{2})?|\d{2}[/-]\d{2}[/-]\d{4})\s+(.{3,65}?)\s+(?:Rp\.?\s*|USD\s*|\$\s*)?(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?)/gi;
                    let match;
                    let idx = 0;
                    while ((match = regex.exec(fullText)) !== null) {
                        idx++;
                        const dateStr = match[1].trim();
                        const desc = stripAllEmojis(match[2]).trim();
                        const amtRaw = match[3].replace(/\./g, '').replace(',', '.');
                        const amount = Math.abs(parseFloat(amtRaw) || 0);
                        if (amount <= 0) continue;

                        const isIncome = /(income|pemasukan|gaji|salary|kredit|\+cr|masuk)/i.test(desc);
                        results.push({
                            id: 'tx_pdf_' + Date.now() + '_' + idx,
                            amount,
                            type: isIncome ? 'income' : 'expense',
                            category: isIncome ? 'Salary' : 'Food',
                            account: this.banks[0] || 'Bank BCA',
                            toAccount: '',
                            adminFee: 0,
                            note: desc || `PDF Import ${filename}`,
                            date: dateStr,
                            updated_at: new Date().toISOString()
                        });
                    }
                    return results;
                },

                    try {

                // ==========================================
                // DND AI AGENT (MULTI-SOURCE OFFICIAL REAL-TIME INTELLIGENCE)

                askAiPreset(promptText) {

                runQuickAudit() {
                    this.aiInput = this.lang === 'ID'

                        : 'Perform a comprehensive financial analysis of my balances, savings rate, daily burn rate, ideal emergency fund gap, current inflation and interest rate impact on my purchasing power, and provide practical salary & investment steps.';

                },

                executeAutonomousFinancialCommands(userPrompt) {
                    const actions = [];
                    const raw = stripAllEmojis(userPrompt || '').trim();
                    const lower = raw.toLowerCase();

                    const isRecordCmd = /\b(catat|simpan|record|log|tambah transaksi|add expense|add income)\b/i.test(lower);
                    if (isRecordCmd) {
                        const amount = this.parseAmountShorthand(raw);
                        if (amount > 0) {
                            const isIncome = /\b(pemasukan|gaji|salary|income|bonus|masuk|terima|dapat)\b/i.test(lower);
                            const type = isIncome ? 'income' : 'expense';
                            let wallet = this.banks[0] || 'Bank BCA';
                            for (const b of this.banks) {
                                const bShort = b.toLowerCase().replace('bank ', '');
                                if (lower.includes(b.toLowerCase()) || lower.includes(bShort)) {
                                    wallet = b;
                                    break;
                                }
                            }
                            let category = isIncome ? 'Salary' : 'Food';
                            if (/\b(kopi|coffee|makan|lunch|dinner|cafe|resto)\b/i.test(lower)) category = 'Food';
                            else if (/\b(gojek|grab|bensin|parkir|tol|transport)\b/i.test(lower)) category = 'Transport';
                            else if (/\b(shopee|tokopedia|belanja|shopping)\b/i.test(lower)) category = 'Online Shopping';
                            else if (/\b(invest|saham|reksadana|emas|trading)\b/i.test(lower)) category = 'Investment';
                            else if (/\b(listrik|internet|wifi|pulsa|utilities)\b/i.test(lower)) category = 'Utilities';

                            const tx = {
                                id: 'tx_ai_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                                amount,
                                type,
                                category,
                                account: wallet,
                                toAccount: '',
                                adminFee: 0,
                                note: raw.replace(/^(catat|simpan|record|log)\s+(pengeluaran|pemasukan|expense|income)?\s*/i, '').slice(0, 60) || category,
                                date: this.getLocalDateTimeInput().replace('T', ' '),
                                updated_at: new Date().toISOString()
                            };
                            this.transactions.unshift(tx);
                            this.executeAutopilotRules(tx);
                            actions.push({
                                type: 'transaction',
                                label: this.lang === 'ID'
                                    ? `Tercatat ${type === 'income' ? 'Pemasukan' : 'Pengeluaran'}: ${this.formatCurrency(amount)} (${wallet})`
                                    : `Recorded ${type}: ${this.formatCurrency(amount)} (${wallet})`
                            });
                        }
                    }

                    const goalMatch = raw.match(/(?:buat\s+target|create\s+goal|target\s+tabungan)\s+([a-zA-Z0-9\s]+?)\s+(\d+(?:[.,]\d+)?\s*(?:jt|juta|m|rb|ribu|k)?|\d{4,12})/i);
                    if (goalMatch) {
                        const goalName = stripAllEmojis(goalMatch[1]).trim();
                        const targetAmt = this.parseAmountShorthand(goalMatch[2]);
                        if (goalName && targetAmt > 0) {
                            this.goals.push({
                                id: 'goal_ai_' + Date.now(),
                                name: goalName,
                                target: targetAmt,
                                current: 0,
                                updated_at: new Date().toISOString()
                            });
                            actions.push({
                                type: 'goal',
                                label: this.lang === 'ID'
                                    ? `Target Dibuat: ${goalName} (${this.formatCurrency(targetAmt)})`
                                    : `Goal Created: ${goalName} (${this.formatCurrency(targetAmt)})`
                            });
                        }
                    }

                    const budgetMatch = raw.match(/(?:atur\s+anggaran|set\s+budget)\s+([a-zA-Z\s]+?)\s+(\d+(?:[.,]\d+)?\s*(?:jt|juta|m|rb|ribu|k)?|\d{4,12})/i);
                    if (budgetMatch) {
                        const catRaw = stripAllEmojis(budgetMatch[1]).trim();
                        const limitAmt = this.parseAmountShorthand(budgetMatch[2]);
                        const matchedCat = this.categories.find(c => c.toLowerCase() === catRaw.toLowerCase()) || catRaw;
                        if (matchedCat && limitAmt > 0) {
                            if (!this.categories.includes(matchedCat)) this.categories.push(matchedCat);
                            const existing = this.budgets.find(b => b.category.toLowerCase() === matchedCat.toLowerCase());
                            if (existing) existing.limit = limitAmt;
                            else this.budgets.push({ id: 'bud_ai_' + Date.now(), category: matchedCat, limit: limitAmt });
                            actions.push({
                                type: 'budget',
                                label: this.lang === 'ID'
                                    ? `Anggaran ${matchedCat}: ${this.formatCurrency(limitAmt)}`
                                    : `Budget ${matchedCat}: ${this.formatCurrency(limitAmt)}`
                            });
                        }
                    }

                    return actions;
                },

                tryDirectCurrencyConversion(prompt) {
                    const match = prompt.match(/(?:konversi|convert|hitung|berapa)?\s*(\d+(?:[.,]\d+)?)\s*(usd|sgd|eur|jpy|aud|myr|idr|rupiah|dollar)\s*(?:ke|to|in|dalam|menjadi)?\s*(idr|rupiah|usd|sgd|eur|jpy|aud|myr|dollar)?/i);
                    if (!match) return null;
                    const amount = parseFloat(match[1].replace(',', '.'));
                    if (!Number.isFinite(amount) || amount <= 0) return null;

                    const normCode = (raw) => {
                        const up = String(raw || '').toUpperCase();
                        if (up === 'RUPIAH') return 'IDR';
                        if (up === 'DOLLAR') return 'USD';
                        return up;
                    };

                    const fromCode = normCode(match[2]);
                    let toCode = normCode(match[3] || (fromCode === 'IDR' ? 'USD' : 'IDR'));
                    if (fromCode === toCode) toCode = fromCode === 'IDR' ? 'USD' : 'IDR';

                    const ratesToIdr = {
                        IDR: 1,
                        USD: Number(this.realtimePulse.usd_idr || 16250),
                        SGD: Number(this.realtimePulse.sgd_idr || 12080),
                        EUR: Number(this.realtimePulse.eur_idr || 17540),
                        JPY: Number(this.realtimePulse.jpy_idr || 108.5),
                        AUD: Number(this.realtimePulse.aud_idr || 10540),
                        MYR: Number(this.realtimePulse.myr_idr || 3670)
                    };

                    if (!ratesToIdr[fromCode] || !ratesToIdr[toCode]) return null;
                    const inIdr = amount * ratesToIdr[fromCode];
                    const converted = inIdr / ratesToIdr[toCode];

                    if (this.lang === 'ID') {
                        return `**Konversi Mata Uang Real-Time (Sumber Resmi ECB / Open ER-API)**\n\n` +
                            `- **Nominal Awal:** ${amount.toLocaleString('id-ID')} ${fromCode}\n` +
                            `- **Hasil Konversi:** **${converted.toLocaleString('id-ID', { maximumFractionDigits: 2 })} ${toCode}**\n` +
                            `- **Kurs Referensi Live:** 1 ${fromCode} = Rp ${ratesToIdr[fromCode].toLocaleString('id-ID')} | 1 ${toCode} = Rp ${ratesToIdr[toCode].toLocaleString('id-ID')}\n\n` +
                            `Kurs diperbarui secara otomatis mengikuti indikator pasar valuta asing global terkini.`;
                    }
                    return `**Real-Time Currency Conversion (Official ECB / Open ER-API Reference)**\n\n` +
                        `- **Source Amount:** ${amount.toLocaleString('en-US')} ${fromCode}\n` +
                        `- **Converted Value:** **${converted.toLocaleString('en-US', { maximumFractionDigits: 2 })} ${toCode}**\n` +
                        `- **Live Reference Rate:** 1 ${fromCode} = Rp ${ratesToIdr[fromCode].toLocaleString('en-US')} | 1 ${toCode} = Rp ${ratesToIdr[toCode].toLocaleString('en-US')}\n\n` +
                        `Exchange rates update continuously from live global foreign exchange feeds.`;
                },

${financialContext}`;

                    try {

                            })

                            }
                        }
                    } catch (e) {}

                    const embeddedOpenModels = ['qwen-coder', 'mistral', 'openai-large'];
                    for (const modelTag of embeddedOpenModels) {
                        try {
                            const controller = new AbortController();
                            const timer = setTimeout(() => controller.abort(), 11000);
                            const res = await fetch('https://text.pollinations.ai/openai', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                signal: controller.signal,
                                body: JSON.stringify({
                                    model: modelTag,
                                    messages: [
                                        { role: 'system', content: eaSystemPrompt },
                                        { role: 'user', content: userPrompt }
                                    ],
                                    temperature: 0.4
                                })
                            });
                            clearTimeout(timer);
                            if (res.ok) {

                                    ? data.choices[0].message.content
                                    : '';

                        } catch (e) {}
                    }

                    const isFinancialOrMacroQuery = /\b(keuangan|uang|saldo|gaji|tabungan|nabung|investasi|cicilan|utang|hutang|anggaran|budget|pengeluaran|pemasukan|audit|analisis|burn rate|runway|inflasi|kurs|dollar|usd|sgd|eur|jpy|daya beli|finance|money|salary|saving|investment|debt|expense|income|inflation|fx|exchange|catat|target|darurat|emergency)\b/i.test(userPrompt);
                    if (isFinancialOrMacroQuery || executedActions.length > 0) {
                        return { text: this.generateLocalFinancialAdvisory(userPrompt, executedActions) };
                    }

                    const fullOfficialAnswer = await this.fetchOfficialMultiSourceKnowledge(userPrompt, false);
                    return { text: fullOfficialAnswer };
                },

                async fetchOfficialMultiSourceKnowledge(question, rawExtractOnly = false) {
                    const cleanTopic = question
                        .replace(/^(apa itu|jelaskan|bagaimana cara|siapa itu|mengapa|kenapa|sejarah|pengertian|what is|explain|how does|how to|who is|why is)\s+/i, '')
                        .replace(/[?!.]+$/g, '')
                        .trim();

                    const langCode = this.lang === 'ID' ? 'id' : 'en';
                    const queryTerm = cleanTopic || question;

                    const [wikiRes, ddgRes] = await Promise.allSettled([
                        (async () => {
                            const searchUrl = `https://${langCode}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(queryTerm)}&format=json&origin=*&srlimit=1`;
                            const sRes = await fetch(searchUrl);
                            if (!sRes.ok) return null;
                            const sData = await sRes.json();
                            const topHit = sData && sData.query && sData.query.search && sData.query.search[0];
                            if (!topHit || !topHit.title) return null;
                            const sumUrl = `https://${langCode}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(topHit.title)}`;
                            const sumRes = await fetch(sumUrl);
                            if (!sumRes.ok) return null;
                            const sumData = await sumRes.json();
                            if (sumData && sumData.extract) {
                                return {
                                    title: stripAllEmojis(sumData.title),
                                    extract: stripAllEmojis(sumData.extract),
                                    source: 'Wikipedia Official Knowledge'
                                };
                            }
                            return null;
                        })(),
                        (async () => {
                            const ddgUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(queryTerm)}&format=json&no_html=1&skip_disambig=1`;
                            const dRes = await fetch(ddgUrl);
                            if (!dRes.ok) return null;
                            const dData = await dRes.json();
                            const abstractText = stripAllEmojis(dData.AbstractText || '');
                            if (abstractText && abstractText.length > 20) {
                                return {
                                    title: stripAllEmojis(dData.Heading || queryTerm),
                                    extract: abstractText,
                                    source: stripAllEmojis(dData.AbstractSource || 'Official Reference')
                                };
                            }
                            return null;
                        })()
                    ]);

                    const wikiData = wikiRes.status === 'fulfilled' ? wikiRes.value : null;
                    const ddgData = ddgRes.status === 'fulfilled' ? ddgRes.value : null;
                    const best = wikiData || ddgData;

                    if (rawExtractOnly) {
                        return best ? `${best.title} (${best.source}): ${best.extract}` : '';
                    }

                    if (best) {
                        if (this.lang === 'ID') {
                            return `**Penjelasan Mengenai ${best.title}**\n\n${best.extract}\n\n**Ringkasan Utama (Referensi: ${best.source}):**\n- Pembahasan di atas merangkum definisi resmi dan konsep inti terkait **${best.title}**.\n- Jika Anda memerlukan penjelasan lanjutan atau penerapannya dalam perencanaan keuangan Anda, silakan tuliskan pertanyaan berikutnya.`;
                        }
                        return `**Explanation About ${best.title}**\n\n${best.extract}\n\n**Key Summary (Reference: ${best.source}):**\n- The summary above outlines the verified definition and core principles of **${best.title}**.\n- Feel free to ask follow-up questions if you would like deeper details or practical financial applications.`;
                    }

                    return this.lang === 'ID'
                        ? `**Jawaban DND AI AGENT**\n\nPertanyaan Anda mengenai "${question}" telah diproses:\n- Secara ringkas, topik tersebut dapat dipahami melalui prinsip dasar, mekanisme kerja, serta penerapannya secara praktis.\n- Silakan ajukan pertanyaan lanjutan dengan kata kunci yang lebih spesifik agar saya dapat memberikan rincian yang lebih mendalam.`
                        : `**DND AI AGENT Response**\n\nYour question regarding "${question}" has been processed:\n- In summary, this topic is best understood through its core principles, mechanism, and practical real-world application.\n- Feel free to ask a more specific follow-up question for deeper details.`;
                },

                generateLocalFinancialAdvisory(prompt, executedActions = []) {
                    const lower = prompt.toLowerCase();
                    const actionBanner = executedActions.length > 0
                        ? (this.lang === 'ID'
                            ? `**Tindakan Otomatis Berhasil Dijalankan:**\n${executedActions.map(a => `- ${a.label}`).join('\n')}\n\n`
                            : `**Automated Actions Executed:**\n${executedActions.map(a => `- ${a.label}`).join('\n')}\n\n`)
                        : '';

                    if (/\b(inflasi|kurs|dollar|usd|sgd|eur|jpy|aud|myr|bi-rate|gdp|inflation|fx|exchange|daya beli)\b/i.test(lower)) {
                        if (this.lang === 'ID') {
                            return `${actionBanner}**Indikator Ekonomi & Kurs Mata Uang Real-Time Resmi (DND AI AGENT)**\n\n- **Inflasi Tahunan (World Bank CPI YoY):** ${this.realtimePulse.inflation_id_pct}% per tahun (Rata-rata global: ${this.realtimePulse.inflation_global_pct}%)\n- **Suku Bunga Acuan (BI-Rate):** ${this.realtimePulse.bi_rate_pct}%\n- **Pertumbuhan Ekonomi (GDP YoY):** ${this.realtimePulse.gdp_id_pct}%\n- **Kurs Live USD / IDR:** Rp ${Math.round(this.realtimePulse.usd_idr).toLocaleString('id-ID')}\n- **Kurs Live SGD / IDR:** Rp ${Math.round(this.realtimePulse.sgd_idr).toLocaleString('id-ID')}\n- **Kurs Live EUR / IDR:** Rp ${Math.round(this.realtimePulse.eur_idr).toLocaleString('id-ID')}\n- **Kurs Live AUD / IDR:** Rp ${Math.round(this.realtimePulse.aud_idr).toLocaleString('id-ID')}\n- **Kurs Live MYR / IDR:** Rp ${Math.round(this.realtimePulse.myr_idr).toLocaleString('id-ID')}\n\n**Dampak Terhadap Saldo Anda (${this.formatCurrency(this.totalBalance)}):**\n- Dengan tingkat inflasi **${this.realtimePulse.inflation_id_pct}%**, kas yang tidak diinvestasikan berpotensi mengalami penurunan daya beli sekitar **${this.formatCurrency(this.quantIntel.inflation_erosion_1y)}** dalam 1 tahun (nilai riil menjadi **${this.formatCurrency(this.quantIntel.real_balance_1y)}**).\n- **Strategi Praktis:** Pertahankan dana darurat ideal sebesar **${this.formatCurrency(this.quantIntel.emergency_fund_ideal)}** (6x pengeluaran bulanan) di instrumen likuid, lalu alokasikan kelebihannya ke aset dengan imbal hasil di atas inflasi seperti SBN Ritel atau Reksadana Pasar Uang.`;
                        }
                        return `${actionBanner}**Official Real-Time Economic & FX Indicators (DND AI AGENT)**\n\n- **Annual Inflation (World Bank CPI YoY):** ${this.realtimePulse.inflation_id_pct}% per year (Global avg: ${this.realtimePulse.inflation_global_pct}%)\n- **Policy Rate (BI-Rate):** ${this.realtimePulse.bi_rate_pct}%\n- **GDP Growth (YoY):** ${this.realtimePulse.gdp_id_pct}%\n- **Live USD / IDR:** Rp ${Math.round(this.realtimePulse.usd_idr).toLocaleString('en-US')}\n- **Live SGD / IDR:** Rp ${Math.round(this.realtimePulse.sgd_idr).toLocaleString('en-US')}\n- **Live EUR / IDR:** Rp ${Math.round(this.realtimePulse.eur_idr).toLocaleString('en-US')}\n\n**Impact on Your Net Balance (${this.formatCurrency(this.totalBalance)}):**\n- At an annual inflation rate of **${this.realtimePulse.inflation_id_pct}%**, idle cash loses roughly **${this.formatCurrency(this.quantIntel.inflation_erosion_1y)}** in purchasing power over 12 months (real value: **${this.formatCurrency(this.quantIntel.real_balance_1y)}**).\n- **Practical Strategy:** Maintain your ideal emergency buffer of **${this.formatCurrency(this.quantIntel.emergency_fund_ideal)}** (6x monthly burn) in liquid accounts, and deploy excess cash into inflation-beating instruments.`;
                    }

                    if (/\b(gaji|salary|alokasi|kelola gaji|atur keuangan)\b/i.test(lower)) {
                        const baseIncome = this.totalIncome > 0 ? this.totalIncome : 10000000;
                        const needs = baseIncome * 0.50;
                        const wants = baseIncome * 0.20;
                        const savings = baseIncome * 0.20;
                        const invest = baseIncome * 0.10;
                        if (this.lang === 'ID') {
                            return `${actionBanner}**Rencana Pengelolaan Gaji & Keuangan Cerdas (Formula 50 / 20 / 20 / 10)**\n\nBerdasarkan basis pemasukan sebesar **${this.formatCurrency(baseIncome)}**, berikut pembagian pos keuangan yang terukur:\n- **50% Kebutuhan Pokok (${this.formatCurrency(needs)}):** Biaya makan, tempat tinggal, listrik, air, internet, dan transportasi harian.\n- **20% Tabungan & Dana Darurat (${this.formatCurrency(savings)}):** Disisihkan otomatis di awal gajian menuju target Dana Darurat ideal Anda sebesar **${this.formatCurrency(this.quantIntel.emergency_fund_ideal)}**.\n- **20% Gaya Hidup & Fleksibel (${this.formatCurrency(wants)}):** Hiburan, kopi, belanja non-primer, dan kebutuhan sosial.\n- **10% Investasi Jangka Panjang (${this.formatCurrency(invest)}):** Instrumen bertumbuh dengan imbal hasil di atas inflasi terkini (**${this.realtimePulse.inflation_id_pct}%/thn**).\n\nAnda juga dapat meminta saya langsung dengan perintah seperti *"Catat gaji 8jt ke BCA"* atau *"Buat target Dana Darurat 15jt"*.`;
                        }
                        return `${actionBanner}**Smart Salary & Wealth Management Plan (50 / 20 / 20 / 10 Rule)**\n\nBased on an income baseline of **${this.formatCurrency(baseIncome)}**, here is a structured allocation framework:\n- **50% Essential Needs (${this.formatCurrency(needs)}):** Housing, groceries, utilities, internet, and daily transport.\n- **20% Savings & Emergency Fund (${this.formatCurrency(savings)}):** Automatically set aside on payday toward your ideal emergency buffer of **${this.formatCurrency(this.quantIntel.emergency_fund_ideal)}**.\n- **20% Lifestyle & Discretionary (${this.formatCurrency(wants)}):** Dining out, hobbies, and non-essential shopping.\n- **10% Long-Term Investments (${this.formatCurrency(invest)}):** Diversified assets designed to outpace live inflation (**${this.realtimePulse.inflation_id_pct}%/yr**).`;
                    }

                    if (this.lang === 'ID') {
                        return `${actionBanner}**Laporan Evaluasi Keuangan Real-Time DND AI AGENT**\n\n- **Total Saldo Bersih:** ${this.formatCurrency(this.totalBalance)}\n- **Nilai Riil Saldo 1 Tahun (Setelah Inflasi ${this.realtimePulse.inflation_id_pct}%):** ${this.formatCurrency(this.quantIntel.real_balance_1y)}\n- **Total Pemasukan:** ${this.formatCurrency(this.totalIncome)}\n- **Total Pengeluaran:** ${this.formatCurrency(this.totalExpense + this.totalWithdrawal)}\n- **Skor Kesehatan Finansial:** ${this.quantIntel.health_score} / 100 (${this.quantIntel.health_grade})\n- **Rasio Tabungan:** ${this.quantIntel.savings_rate_pct}%\n- **Burn Rate Harian:** ${this.formatCurrency(this.quantIntel.daily_burn_rate)} per hari\n- **Target Dana Darurat Ideal (6 Bulan):** ${this.formatCurrency(this.quantIntel.emergency_fund_ideal)}\n\n**Rekomendasi Praktis Untuk Anda:**\n1. Pertahankan rasio tabungan minimal 20% dari setiap pemasukan bulanan Anda.\n2. Batasi pengeluaran pada kategori terbesar saat ini (${this.quantIntel.top_category}) melalui menu **Target**.\n3. Anda dapat memerintahkan saya kapan saja, misalnya *"Catat makan siang 35rb pakai Gopay"*, *"Konversi 500 USD ke Rupiah"*, atau menanyakan topik ekonomi dan pengetahuan umum apa pun.`;
                    }
                    return `${actionBanner}**DND AI AGENT Real-Time Financial Evaluation Report**\n\n- **Net Total Balance:** ${this.formatCurrency(this.totalBalance)}\n- **Real 1-Year Balance (Inflation ${this.realtimePulse.inflation_id_pct}% Adjusted):** ${this.formatCurrency(this.quantIntel.real_balance_1y)}\n- **Total Income:** ${this.formatCurrency(this.totalIncome)}\n- **Total Expense:** ${this.formatCurrency(this.totalExpense + this.totalWithdrawal)}\n- **Financial Health Score:** ${this.quantIntel.health_score} / 100 (${this.quantIntel.health_grade})\n- **Savings Rate:** ${this.quantIntel.savings_rate_pct}%\n- **Daily Burn Rate:** ${this.formatCurrency(this.quantIntel.daily_burn_rate)} per day\n- **Ideal 6-Month Emergency Fund:** ${this.formatCurrency(this.quantIntel.emergency_fund_ideal)}\n\n**Practical Next Steps:**\n1. Maintain at least a 20% savings rate from every monthly inflow.\n2. Set a monthly cap on your top spending category (${this.quantIntel.top_category}) in the Goals tab.\n3. You can instruct me directly using phrases like *"Record lunch 20 USD via BCA"*, *"Convert 500 USD to IDR"*, or ask any economic or general knowledge question.`;
                },

                formatMarkdownLight(text) {
                    const clean = stripAllEmojis(text || '');
                    const escaped = clean
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
                    return escaped
                        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.+?)\*/g, '<em>$1</em>')
                        .replace(/\n/g, '<br>');
                },

                copyToClipboard(text) {
                    const clean = stripAllEmojis(text || '');
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(clean);
                        this.showToast(this.lang === 'ID' ? 'Teks disalin ke clipboard.' : 'Copied to clipboard.');
                    }
                },

                // ==========================================
                // CHART.JS VISUALIZATION ENGINE
                // ==========================================
                updateAllCharts() {
                    if (!window.Chart) return;
                    this.renderTrendChart();
                    this.renderAnalyticsCashflowChart();
                    this.renderUnifiedCategoryChart();
                    this.renderWalletChart();
                },

                buildCashflowSeries(groupBy = 'date') {
                    if (this.transactions.length === 0) {
                        return {
                            labels: [this.lang === 'ID' ? 'Hari Ini' : 'Today'],
                            incomeData: [0],
                            expenseData: [0]
                        };
                    }

                    const chronological = [...this.transactions].reverse();
                    if (groupBy === 'tx') {
                        const recent = chronological.slice(-12);
                        return {
                            labels: recent.map(tx => (tx.note || tx.category || '').slice(0, 12)),
                            incomeData: recent.map(tx => tx.type === 'income' ? Number(tx.amount || 0) : 0),
                            expenseData: recent.map(tx => (tx.type === 'expense' || tx.type === 'withdrawal') ? Number(tx.amount || 0) : 0)
                        };
                    }

                    const map = {};
                    for (const tx of chronological) {
                        const d = String(tx.date || '').slice(0, 10) || 'Today';
                        if (!map[d]) map[d] = { inc: 0, exp: 0 };
                        if (tx.type === 'income') map[d].inc += Number(tx.amount || 0);
                        else if (tx.type === 'expense' || tx.type === 'withdrawal') map[d].exp += Number(tx.amount || 0);
                    }
                    const keys = Object.keys(map).slice(-10);
                    return {
                        labels: keys.map(k => k.length >= 10 ? k.slice(5) : k),
                        incomeData: keys.map(k => map[k].inc),
                        expenseData: keys.map(k => map[k].exp)
                    };
                },

                renderTrendChart() {
                    const canvas = document.getElementById('dashboardTrendChart');
                    if (!canvas || !window.Chart) return;
                    if (_dndChartInstances.trend) {
                        _dndChartInstances.trend.destroy();
                        _dndChartInstances.trend = null;
                    }
                    const { labels, incomeData, expenseData } = this.buildCashflowSeries('date');
                    const gridColor = this.isDarkMode ? 'rgba(148, 163, 184, 0.1)' : 'rgba(15, 23, 42, 0.06)';
                    const tickColor = this.isDarkMode ? '#94A3B8' : '#64748B';

                    _dndChartInstances.trend = new Chart(canvas.getContext('2d'), {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [
                                {
                                    label: this.t('income'),
                                    data: incomeData,
                                    backgroundColor: '#10B981',
                                    borderRadius: 6,
                                    barPercentage: 0.65
                                },
                                {
                                    label: this.t('expense'),
                                    data: expenseData,
                                    backgroundColor: '#F43F5E',
                                    borderRadius: 6,
                                    barPercentage: 0.65
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { grid: { display: false }, ticks: { color: tickColor, font: { size: 10 } } },
                                y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 10 } } }
                            }
                        }
                    });
                },

                renderAnalyticsCashflowChart() {
                    const canvas = document.getElementById('analyticsCashflowChart');
                    if (!canvas || !window.Chart) return;
                    if (_dndChartInstances.analyticsCashflow) {
                        _dndChartInstances.analyticsCashflow.destroy();
                        _dndChartInstances.analyticsCashflow = null;
                    }
                    const { labels, incomeData, expenseData } = this.buildCashflowSeries(this.cashflowChartGroup);
                    const gridColor = this.isDarkMode ? 'rgba(148, 163, 184, 0.1)' : 'rgba(15, 23, 42, 0.06)';
                    const tickColor = this.isDarkMode ? '#94A3B8' : '#64748B';

                    _dndChartInstances.analyticsCashflow = new Chart(canvas.getContext('2d'), {
                        type: 'line',
                        data: {
                            labels,
                            datasets: [
                                {
                                    label: this.t('income'),
                                    data: incomeData,
                                    borderColor: '#10B981',
                                    backgroundColor: 'rgba(16, 185, 129, 0.14)',
                                    fill: true,
                                    tension: 0.35
                                },
                                {
                                    label: this.t('expense'),
                                    data: expenseData,
                                    borderColor: '#F43F5E',
                                    backgroundColor: 'rgba(244, 63, 94, 0.14)',
                                    fill: true,
                                    tension: 0.35
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { labels: { color: tickColor, font: { size: 11 } } } },
                            scales: {
                                x: { grid: { display: false }, ticks: { color: tickColor, font: { size: 10 } } },
                                y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 10 } } }
                            }
                        }
                    });
                },

                renderUnifiedCategoryChart() {
                    const canvas = document.getElementById('unifiedCategoryChart');
                    if (!canvas || !window.Chart) return;
                    if (_dndChartInstances.unifiedCategory) {
                        _dndChartInstances.unifiedCategory.destroy();
                        _dndChartInstances.unifiedCategory = null;
                    }
                    const items = this.unifiedCategoryBreakdown;
                    const labels = items.length ? items.map(i => i.category) : ['No Data'];
                    const data = items.length ? items.map(i => i.amount) : [1];
                    const colors = items.length ? items.map(i => i.color) : [this.isDarkMode ? '#1E2633' : '#E2E8F0'];

                    _dndChartInstances.unifiedCategory = new Chart(canvas.getContext('2d'), {
                        type: 'doughnut',
                        data: {
                            labels,
                            datasets: [{
                                data,
                                backgroundColor: colors,
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '68%',
                            plugins: { legend: { display: false } }
                        }
                    });
                },

                renderWalletChart() {
                    const canvas = document.getElementById('walletBarChart');
                    if (!canvas || !window.Chart) return;
                    if (_dndChartInstances.wallet) {
                        _dndChartInstances.wallet.destroy();
                        _dndChartInstances.wallet = null;
                    }
                    const labels = this.banks;
                    const data = labels.map(b => this.getWalletBalance(b));
                    const tickColor = this.isDarkMode ? '#94A3B8' : '#64748B';
                    const gridColor = this.isDarkMode ? 'rgba(148, 163, 184, 0.1)' : 'rgba(15, 23, 42, 0.06)';

                    _dndChartInstances.wallet = new Chart(canvas.getContext('2d'), {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [{
                                label: this.t('net_total_balance'),
                                data,
                                backgroundColor: '#2563EB',
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { grid: { display: false }, ticks: { color: tickColor, font: { size: 10 } } },
                                y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 10 } } }
                            }
                        }
                    });
                }
            };
        }
    </script>
</body>
</html>
