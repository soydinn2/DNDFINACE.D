<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DND Finance — Manajemen Kekayaan Pribadi & DND AI AGENT</title>
    
    <!-- PWA & Mobile App Meta -->
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        cream: {
                            50: '#FFFFFF',
                            100: '#F8FAFC',
                            200: '#E2E8F0',
                            300: '#CBD5E1',
                            400: '#94A3B8',
                            500: '#64748B',
                            700: '#334155',
                            900: '#0F172A',
                        },
                        obsidian: {
                            950: '#0A0D12',
                            900: '#10141B',
                            850: '#161C26',
                            800: '#1E2633',
                            700: '#2A3444',
                        },
                        royal: {
                            50: '#EFF6FF',
                            100: '#DBEAFE',
                            500: '#3B82F6',
                            600: '#2563EB',
                            700: '#1D4ED8',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(15, 23, 42, 0.05)',
                        'card': '0 2px 10px rgba(15, 23, 42, 0.03)',
                        'float': '0 10px 30px -5px rgba(37, 99, 235, 0.25)',
                    }
                }
            }
        }
    </script>

    <!-- Direct Google Identity Services (Login Google Langsung di Browser, Tanpa Firebase Auth) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
            onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';document.head.appendChild(s);"></script>
    
    <!-- SheetJS (Excel .xlsx / .xls / .csv Import & Multi-Sheet Export) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- jsPDF & AutoTable (PDF Report Export) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <!-- PDF.js (Client-Side PDF Report Parser & Importer) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- Tesseract.js (Client-Side Receipt & Split Bill OCR Engine) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            background-color: #FFFFFF;
            color: #0F172A;
        }
        html.dark body {
            background-color: #0A0D12;
            color: #F8FAFC;
        }
        h1, h2, h3, .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .pt-safe {
            padding-top: env(safe-area-inset-top, 12px);
        }
        [x-cloak] {
            display: none !important;
        }
        .dnd-brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .dnd-brand-mark svg {
            width: 40px;
            height: 22px;
        }
    </style>
</head>
<body class="antialiased selection:bg-royal-600 selection:text-white transition-colors duration-200"
      x-data="dndFinanceApp()" 
      x-init="initApp()">

    <!-- ========================================== -->
    <!-- TOP HEADER NAVIGATION                      -->
    <!-- ========================================== -->
    <header class="sticky top-0 z-30 bg-white/95 dark:bg-obsidian-950/90 backdrop-blur-md border-b border-cream-200 dark:border-obsidian-800 pt-safe transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 h-16 flex items-center justify-between gap-1.5 sm:gap-2">
            <!-- Brand Logo -->
            <div class="flex items-center gap-2 cursor-pointer shrink-0" @click="setTab('dashboard')">
                <div class="dnd-brand-mark text-cream-900 dark:text-white">
                    <svg viewBox="0 0 320 175" xmlns="http://www.w3.org/2000/svg" aria-label="DND Logo">
                        <path fill="currentColor" d="M 10,12 C 26,18 32,28 32,48 L 32,126 C 32,146 26,156 10,162 L 66,162 C 110,162 132,138 132,108 C 132,90 124,76 112,66 L 112,92 C 115,99 116,105 116,112 C 116,138 98,155 64,155 L 36,155 C 45,147 49,136 49,120 L 49,20 L 66,20 C 78,20 89,24 98,32 L 185,144 C 194,155 206,162 224,162 L 244,162 C 288,162 312,131 312,87 C 312,43 288,12 244,12 L 210,12 L 210,20 L 242,20 C 276,20 293,48 293,87 C 293,126 276,154 242,154 L 224,154 C 213,154 205,149 197,139 L 111,29 C 100,16 86,12 66,12 Z" />
                        <path fill="currentColor" d="M 199,12 C 185,18 179,28 179,48 L 179,98 L 199,124 Z" />
                    </svg>
                </div>
                <span class="font-display font-bold text-xs sm:text-base tracking-tight text-cream-900 dark:text-white truncate max-w-[125px] sm:max-w-[200px]" x-text="pageTitle"></span>
            </div>

            <!-- Desktop Center Navigation -->
            <nav class="hidden md:flex items-center bg-cream-100 dark:bg-obsidian-900 p-1 rounded-xl border border-cream-200 dark:border-obsidian-800">
                <button @click="setTab('dashboard')" :class="activeTab === 'dashboard' ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-sm font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all" x-text="t('nav_home')"></button>
                <button @click="setTab('analytics')" :class="activeTab === 'analytics' ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-sm font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all" x-text="t('nav_analytics')"></button>
                <button @click="setTab('transactions')" :class="activeTab === 'transactions' ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-sm font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all" x-text="t('nav_records')"></button>
                <button @click="setTab('planning')" :class="activeTab === 'planning' ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-sm font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all" x-text="t('nav_goals')"></button>
                <button @click="setTab('automation')" :class="activeTab === 'automation' ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-sm font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all">Autopilot</button>
                <button @click="setTab('more')" :class="['more', 'tools', 'settings'].includes(activeTab) ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-sm font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all" x-text="t('nav_menu')"></button>
            </nav>

            <!-- Top Right Controls -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <!-- Quick Bilingual ID / EN Switcher -->
                <button @click="toggleLanguage()"
                        :title="lang === 'ID' ? 'Switch to English' : 'Ganti ke Bahasa Indonesia'"
                        class="h-8 sm:h-9 px-2.5 rounded-full bg-cream-100 dark:bg-obsidian-900 hover:bg-royal-50 dark:hover:bg-obsidian-800 border border-cream-200 dark:border-obsidian-700 flex items-center gap-1 text-[11px] font-bold tracking-wide text-cream-800 dark:text-slate-200 transition-colors shrink-0">
                    <span :class="lang === 'ID' ? 'text-royal-600 dark:text-royal-400' : 'opacity-45'">ID</span>
                    <span class="opacity-30">/</span>
                    <span :class="lang === 'EN' ? 'text-royal-600 dark:text-royal-400' : 'opacity-45'">EN</span>
                </button>

                <!-- Direct Google Browser Authentication Button -->
                <button @click="handleGoogleHeaderClick()" :disabled="isGoogleSigningIn"
                        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full bg-cream-100 dark:bg-obsidian-900 hover:bg-cream-200/70 dark:hover:bg-obsidian-800 border border-cream-200 dark:border-obsidian-700 text-[11px] sm:text-xs font-medium text-cream-900 dark:text-slate-200 transition-colors max-w-[130px] sm:max-w-[190px] disabled:opacity-60">
                    <template x-if="!googleUser">
                        <span class="flex items-center gap-1.5 truncate">
                            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
                                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24Z"/>
                                <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14Z"/>
                                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96Z"/>
                            </svg>
                            <span class="truncate" x-text="isGoogleSigningIn ? t('connecting_google') : t('sign_in_google')"></span>
                        </span>
                    </template>
                    <template x-if="googleUser">
                        <span class="flex items-center gap-1.5 truncate">
                            <img :src="googleUser.picture || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(displayUserName)" alt="Profile" class="w-4 h-4 rounded-full object-cover shrink-0">
                            <span class="truncate font-semibold" x-text="displayUserName"></span>
                        </span>
                    </template>
                </button>

                <!-- Theme Toggle Button -->
                <button @click="toggleTheme()" 
                        :title="isDarkMode ? t('theme_white') : t('theme_black')"
                        class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-cream-100 dark:bg-obsidian-900 hover:bg-cream-200 dark:hover:bg-obsidian-800 border border-cream-200 dark:border-obsidian-700 flex items-center justify-center text-cream-700 dark:text-slate-300 transition-colors shrink-0">
                    <i data-lucide="moon" x-show="!isDarkMode" class="w-4 h-4"></i>
                    <i data-lucide="sun" x-show="isDarkMode" class="w-4 h-4 text-amber-400"></i>
                </button>

                <!-- Import & Export Excel / PDF Menu Button -->
                <div class="relative" x-data="{ openExport: false }">
                    <button @click="openExport = !openExport" 
                            class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-royal-600 hover:bg-royal-700 text-white flex items-center justify-center shadow-sm transition-colors shrink-0" 
                            :title="t('export_report')">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                    </button>
                    <div x-show="openExport" @click.away="openExport = false" x-cloak
                         class="absolute right-0 mt-2 w-64 rounded-2xl bg-white dark:bg-obsidian-900 border border-cream-200 dark:border-obsidian-700 shadow-xl py-2 z-50">
                        <div class="px-3.5 py-1 text-[10px] font-bold uppercase tracking-wider text-cream-400 dark:text-slate-500" x-text="t('import_report_section')"></div>
                        <label class="w-full px-3.5 py-2.5 text-left text-xs font-medium text-cream-900 dark:text-slate-200 hover:bg-cream-100 dark:hover:bg-obsidian-800 flex items-center gap-2.5 cursor-pointer">
                            <i data-lucide="upload" class="w-4 h-4 text-royal-600"></i>
                            <span x-text="isImportingReport ? t('importing_report') : t('import_excel_pdf')"></span>
                            <input type="file" accept=".xlsx,.xls,.csv,.pdf" @change="handleReportImport($event); openExport = false" class="hidden">
                        </label>
                        <div class="my-1 border-t border-cream-200/70 dark:border-obsidian-800"></div>
                        <div class="px-3.5 py-1 text-[10px] font-bold uppercase tracking-wider text-cream-400 dark:text-slate-500" x-text="t('export_report')"></div>
                        <button @click="exportToExcel(); openExport = false" class="w-full px-3.5 py-2.5 text-left text-xs font-medium text-cream-900 dark:text-slate-200 hover:bg-cream-100 dark:hover:bg-obsidian-800 flex items-center gap-2.5">
                            <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i>
                            <span x-text="t('export_excel')"></span>
                        </button>
                        <button @click="exportToPDF(); openExport = false" class="w-full px-3.5 py-2.5 text-left text-xs font-medium text-cream-900 dark:text-slate-200 hover:bg-cream-100 dark:hover:bg-obsidian-800 flex items-center gap-2.5">
                            <i data-lucide="file-text" class="w-4 h-4 text-rose-600"></i>
                            <span x-text="t('export_pdf')"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- MAIN CONTENT CONTAINER                     -->
    <!-- ========================================== -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-5 pb-28 md:pb-12">

        <!-- ========================================== -->
        <!-- 1. DASHBOARD VIEW                          -->
        <!-- ========================================== -->
        <div x-show="activeTab === 'dashboard'" x-transition.opacity.duration.200ms class="space-y-5">
            
            <!-- Minimalist Stacked Time Greeting & DND AI AGENT Quick Button -->
            <div class="flex items-center justify-between gap-3 px-0.5">
                <div @click="openNicknameModal()" class="min-w-0 cursor-pointer">
                    <p class="text-xs sm:text-sm font-medium text-cream-500 dark:text-slate-400" x-text="timeGreeting"></p>
                    <h2 class="font-display text-lg sm:text-xl font-bold tracking-tight text-cream-900 dark:text-white truncate" x-text="displayGreetingName"></h2>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button @click="openAiAgentHub()"
                            class="px-3.5 py-1.5 rounded-full bg-royal-600 hover:bg-royal-700 text-white text-xs font-semibold transition-colors flex items-center gap-1.5 shadow-sm">
                        <i data-lucide="cpu" class="w-3.5 h-3.5"></i>
                        <span>DND AI AGENT</span>
                    </button>
                    <button @click="openNicknameModal()"
                            class="px-3.5 py-1.5 rounded-full bg-white dark:bg-obsidian-900 hover:bg-cream-50 dark:hover:bg-obsidian-800 border border-cream-200 dark:border-obsidian-700 text-xs font-medium text-cream-600 dark:text-slate-300 transition-colors"
                            x-text="t('edit_nickname')"></button>
                </div>
            </div>

            <!-- Hero Net Balance Card -->
            <div class="relative overflow-hidden rounded-3xl bg-white dark:bg-obsidian-900 border border-cream-200 dark:border-obsidian-800 p-6 sm:p-7 shadow-soft">
                <div class="absolute -right-10 -top-10 w-44 h-44 rounded-full bg-royal-500/10 blur-2xl pointer-events-none"></div>
                <div class="relative z-10 flex flex-col md:flex-row md:items-center md:justify-between gap-6">
                    <div>
                        <div class="flex items-center gap-2 mb-1.5">
                            <span class="text-xs font-semibold uppercase tracking-wider text-cream-500 dark:text-slate-400" x-text="t('net_total_balance')"></span>
                            <button @click="hideBalances = !hideBalances" class="text-cream-400 hover:text-cream-700 dark:hover:text-slate-200">
                                <i data-lucide="eye" x-show="!hideBalances" class="w-3.5 h-3.5"></i>
                                <i data-lucide="eye-off" x-show="hideBalances" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                        <h1 class="font-display text-3xl sm:text-4xl font-extrabold tracking-tight text-cream-900 dark:text-white">
                            <span x-text="hideBalances ? '••••••••' : formatCurrency(totalBalance)"></span>
                        </h1>
                        <div class="flex flex-wrap items-center gap-3 mt-1.5 text-xs text-cream-500 dark:text-slate-400">
                            <span class="flex items-center gap-1.5">
                                <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
                                <span x-text="transactions.length + ' ' + t('recorded_transactions')"></span>
                            </span>
                            <span class="text-cream-300 dark:text-obsidian-700">|</span>
                            <span class="flex items-center gap-1.5">
                                <span class="inline-block w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                                <span x-text="(lang === 'ID' ? 'Inflasi: ' : 'Inflation: ') + realtimePulse.inflation_id_pct + '% YoY'"></span>
                            </span>
                            <span class="text-cream-300 dark:text-obsidian-700">|</span>
                            <span class="flex items-center gap-1.5">
                                <span class="inline-block w-2 h-2 rounded-full bg-royal-500"></span>
                                <span x-text="'USD: Rp ' + Math.round(realtimePulse.usd_idr).toLocaleString('id-ID') + ' | SGD: Rp ' + Math.round(realtimePulse.sgd_idr).toLocaleString('id-ID')"></span>
                            </span>
                        </div>
                    </div>

                    <!-- Income & Expense Mini Summary Pills -->
                    <div class="grid grid-cols-2 gap-3 sm:w-auto">
                        <div class="bg-cream-50 dark:bg-obsidian-850 border border-cream-200/80 dark:border-obsidian-800 rounded-2xl p-3.5 min-w-[140px]">
                            <div class="flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400 text-xs font-semibold mb-1">
                                <i data-lucide="arrow-down-left" class="w-3.5 h-3.5"></i>
                                <span x-text="t('income')"></span>
                            </div>
                            <p class="font-display font-bold text-sm sm:text-base text-cream-900 dark:text-white" x-text="hideBalances ? '••••••' : formatCurrency(totalIncome)"></p>
                        </div>
                        <div class="bg-cream-50 dark:bg-obsidian-850 border border-cream-200/80 dark:border-obsidian-800 rounded-2xl p-3.5 min-w-[140px]">
                            <div class="flex items-center gap-1.5 text-rose-600 dark:text-rose-400 text-xs font-semibold mb-1">
                                <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
                                <span x-text="t('expense')"></span>
                            </div>
                            <p class="font-display font-bold text-sm sm:text-base text-cream-900 dark:text-white" x-text="hideBalances ? '••••••' : formatCurrency(totalExpense + totalWithdrawal)"></p>
                        </div>
                    </div>
                </div>

                <!-- Quick Action Buttons Row -->
                <div class="relative z-10 grid grid-cols-2 sm:grid-cols-4 gap-2.5 mt-6 pt-5 border-t border-cream-200/80 dark:border-obsidian-800">
                    <button @click="openTxModal('income')" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-royal-600 hover:bg-royal-700 text-white text-xs sm:text-sm font-semibold shadow-sm transition-all active:scale-[0.98]">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M8 12h8"></path>
                            <path d="M12 8v8"></path>
                        </svg>
                        <span x-text="t('btn_income')"></span>
                    </button>
                    <button @click="openTxModal('expense')" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-cream-100 dark:bg-obsidian-800 hover:bg-cream-200 dark:hover:bg-obsidian-700 text-cream-900 dark:text-white text-xs sm:text-sm font-semibold transition-all active:scale-[0.98]">
                        <svg class="w-4 h-4 shrink-0 text-rose-600 dark:text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M8 12h8"></path>
                        </svg>
                        <span x-text="t('btn_expense')"></span>
                    </button>
                    <button @click="openExpenseReceiptScanner()" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-rose-50 dark:bg-rose-500/15 hover:bg-rose-100 dark:hover:bg-rose-500/25 border border-rose-200/80 dark:border-rose-500/25 text-rose-700 dark:text-rose-300 text-xs sm:text-sm font-semibold transition-all active:scale-[0.98]">
                        <i data-lucide="scan-line" class="w-4 h-4 shrink-0"></i>
                        <span x-text="t('btn_scan_receipt')"></span>
                    </button>
                    <button @click="openTxModal('transfer')" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-cream-100 dark:bg-obsidian-800 hover:bg-cream-200 dark:hover:bg-obsidian-700 text-cream-900 dark:text-white text-xs sm:text-sm font-semibold transition-all active:scale-[0.98]">

    <script>
        class DNDIndexedDatabase {
            constructor() {
                this.dbName = 'DND_Finance_Relational_DB_v10';
                this.version = 1;
                this.db = null;
            }

            async open() {
                if (this.db) return this.db;
                if (typeof indexedDB === 'undefined') return null;
                return new Promise((resolve) => {
                    try {
                        const req = indexedDB.open(this.dbName, this.version);
                        req.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains('workspaces')) {
                                db.createObjectStore('workspaces', { keyPath: 'account_key' });
                            }
                            if (!db.objectStoreNames.contains('receipt_scans')) {
                                const scanStore = db.createObjectStore('receipt_scans', { keyPath: 'id' });
                                scanStore.createIndex('account_key', 'account_key', { unique: false });
                            }
                            if (!db.objectStoreNames.contains('report_files')) {
                                const repStore = db.createObjectStore('report_files', { keyPath: 'id' });
                                repStore.createIndex('account_key', 'account_key', { unique: false });
                            }
                        };
                        req.onsuccess = (e) => {
                            this.db = e.target.result;
                            resolve(this.db);
                        };
                        req.onerror = () => resolve(null);
                    } catch (err) {
                        resolve(null);
                    }
                });
            }

            async saveWorkspace(accountKey, statePayload) {
                const db = await this.open();
                if (!db) return;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction(['workspaces'], 'readwrite');
                        tx.objectStore('workspaces').put({
                            account_key: accountKey,
                            state: statePayload,
                            updated_at: new Date().toISOString()
                        });
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    } catch (e) {
                        resolve(false);
                    }
                });
            }

            async loadWorkspace(accountKey) {
                const db = await this.open();
                if (!db) return null;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction(['workspaces'], 'readonly');
                        const req = tx.objectStore('workspaces').get(accountKey);
                        req.onsuccess = () => resolve(req.result ? req.result.state : null);
                        req.onerror = () => resolve(null);
                    } catch (e) {
                        resolve(null);
                    }
                });
            }

            async addReceiptScan(scanRecord) {
                const db = await this.open();
                if (!db) return;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction(['receipt_scans'], 'readwrite');
                        tx.objectStore('receipt_scans').put(scanRecord);
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    } catch (e) {
                        resolve(false);
                    }
                });
            }

            async listReceiptScans(accountKey) {
                const db = await this.open();
                if (!db) return [];
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction(['receipt_scans'], 'readonly');
                        const idx = tx.objectStore('receipt_scans').index('account_key');
                        const req = idx.getAll(accountKey);
                        req.onsuccess = () => {
                            const rows = Array.isArray(req.result) ? req.result : [];
                            rows.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
                            resolve(rows.slice(0, 30));
                        };
                        req.onerror = () => resolve([]);
                    } catch (e) {
                        resolve([]);
                    }
                });
            }

            async addReportFile(reportRecord) {
                const db = await this.open();
                if (!db) return;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction(['report_files'], 'readwrite');
                        tx.objectStore('report_files').put(reportRecord);
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    } catch (e) {
                        resolve(false);
                    }
                });
            }

            async listReportFiles(accountKey) {
                const db = await this.open();
                if (!db) return [];
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction(['report_files'], 'readonly');
                        const idx = tx.objectStore('report_files').index('account_key');
                        const req = idx.getAll(accountKey);
                        req.onsuccess = () => {
                            const rows = Array.isArray(req.result) ? req.result : [];
                            rows.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
                            resolve(rows.slice(0, 40));
                        };
                        req.onerror = () => resolve([]);
                    } catch (e) {
                        resolve([]);
                    }
                });
            }
        }

        function stripAllEmojis(text) {
            if (!text) return '';
            return String(text)
                .replace(/[\u{1F1E0}-\u{1F1FF}\u{1F300}-\u{1F9FF}\u{1FA00}-\u{1FAFF}\u{2600}-\u{27BF}\u{2300}-\u{23FF}\u{24C2}-\u{1F251}\u{FE00}-\u{FE0F}\u{200D}]/gu, '')
                .replace(/[ \t]{2,}/g, ' ')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
        }

        async function computeSha256Short(arrayBuffer) {
            try {
                if (window.crypto && window.crypto.subtle && arrayBuffer) {
                    const hashBuffer = await window.crypto.subtle.digest('SHA-256', arrayBuffer);
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 20).toUpperCase();
                }
            } catch (e) {}
            return 'DB-' + Date.now().toString(16).toUpperCase();
        }
