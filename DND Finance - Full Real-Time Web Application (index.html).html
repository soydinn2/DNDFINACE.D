                t(key) {
                    const dict = this.translations[this.lang] || this.translations.ID;
                    return dict[key] || this.translations.ID[key] || key;
                },

                get resolvedAccountKey() {
                    if (this.googleUser && this.googleUser.email) {
                        return this.googleUser.email.trim().toLowerCase();
                    }
                    return 'shared_default_ledger';
                },

                get pageTitle() {
                    if (this.activeTab === 'dashboard') return 'DND Finance';
                    if (this.activeTab === 'analytics') return this.t('nav_analytics');
                    if (this.activeTab === 'transactions') return this.t('nav_records');
                    if (this.activeTab === 'planning') return this.t('nav_goals');
                    if (this.activeTab === 'automation') return 'Autopilot';
                    return this.t('nav_menu');
                },

                get timeGreeting() {
                    const h = this.currentHour;
                    if (h >= 4 && h < 11) return this.t('greet_morning');
                    if (h >= 11 && h < 15) return this.t('greet_afternoon');
                    if (h >= 15 && h < 18) return this.t('greet_evening');
                    return this.t('greet_night');
                },

                get displayUserName() {
                    if (this.customNickname && this.customNickname.trim()) {
                        return this.customNickname.trim();
                    }
                    if (this.googleUser) {
                        return this.googleUser.nickname || this.googleUser.name || (this.googleUser.email ? this.googleUser.email.split('@')[0] : this.t('default_guest_name'));
                    }
                    return this.t('default_guest_name');
                },

                get displayGreetingName() {
                    return this.displayUserName;
                },

                get totalIncome() {
                    return this.transactions
                        .filter(tx => tx.type === 'income')
                        .reduce((acc, tx) => acc + Number(tx.amount || 0), 0);
                },

                get totalExpense() {
                    return this.transactions
                        .filter(tx => tx.type === 'expense')
                        .reduce((acc, tx) => acc + Number(tx.amount || 0), 0);
                },

                get totalWithdrawal() {
                    return this.transactions
                        .filter(tx => tx.type === 'withdrawal')
                        .reduce((acc, tx) => acc + Number(tx.amount || 0), 0);
                },

                get totalBalance() {
                    return this.totalIncome - (this.totalExpense + this.totalWithdrawal);
                },

                get expenseCategoryBreakdown() {
                    const palette = ['#2563EB', '#F43F5E', '#F59E0B', '#8B5CF6', '#06B6D4', '#EC4899', '#6366F1', '#14B8A6'];
                    const totals = {};
                    let grand = 0;
                    for (const tx of this.transactions) {
                        if (tx.type === 'expense' || tx.type === 'withdrawal') {
                            const amt = Number(tx.amount || 0);
                            if (amt > 0) {
                                const cat = tx.category || 'Other';
                                totals[cat] = (totals[cat] || 0) + amt;
                                grand += amt;
                            }
                        }
                    }
                    return Object.entries(totals)
                        .sort((a, b) => b[1] - a[1])
                        .map(([category, amount], idx) => ({
                            category,
                            amount,
                            percent: grand > 0 ? Math.max(1, Math.round((amount / grand) * 100)) : 0,
                            color: palette[idx % palette.length]
                        }));
                },

                get incomeCategoryBreakdown() {
                    const palette = ['#10B981', '#0EA5E9', '#8B5CF6', '#F59E0B', '#14B8A6', '#2563EB', '#EC4899', '#6366F1'];
                    const totals = {};
                    let grand = 0;
                    for (const tx of this.transactions) {
                        if (tx.type === 'income') {
                            const amt = Number(tx.amount || 0);
                            if (amt > 0) {
                                const cat = tx.category || 'Salary';
                                totals[cat] = (totals[cat] || 0) + amt;
                                grand += amt;
                            }
                        }
                    }
                    return Object.entries(totals)
                        .sort((a, b) => b[1] - a[1])
                        .map(([category, amount], idx) => ({
                            category,
                            amount,
                            percent: grand > 0 ? Math.max(1, Math.round((amount / grand) * 100)) : 0,
                            color: palette[idx % palette.length]
                        }));
                },

                get allCategorySummary() {
                    const inc = this.incomeCategoryBreakdown.map(i => ({ ...i, type: 'income' }));
                    const exp = this.expenseCategoryBreakdown.map(e => ({ ...e, type: 'expense' }));
                    return [...inc, ...exp].sort((a, b) => b.amount - a.amount);
                },

                get unifiedCategoryBreakdown() {
                    const mode = this.categoryChartFilter || 'all';
                    let list = [];
                    if (mode === 'income') {
                        list = this.incomeCategoryBreakdown.map(i => ({ ...i, type: 'income' }));
                    } else if (mode === 'expense') {
                        list = this.expenseCategoryBreakdown.map(e => ({ ...e, type: 'expense' }));
                    } else {
                        list = this.allCategorySummary;
                    }

                    const total = list.reduce((sum, item) => sum + Number(item.amount || 0), 0);
                    return list.map(item => ({
                        ...item,
                        percent: total > 0 ? Math.max(1, Math.round((Number(item.amount || 0) / total) * 100)) : 0
                    }));
                },

                get filteredTransactions() {
                    const q = (this.searchQuery || '').toLowerCase().trim();
                    return this.transactions.filter(tx => {
                        const matchType = this.filterType === 'all' || tx.type === this.filterType;
                        if (!matchType) return false;
                        if (!q) return true;
                        return (
                            (tx.note || '').toLowerCase().includes(q) ||
                            (tx.category || '').toLowerCase().includes(q) ||
                            (tx.account || '').toLowerCase().includes(q) ||
                            (tx.toAccount || '').toLowerCase().includes(q)
                        );
                    });
                },

                async initApp() {
                    if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) {
                        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                    }

                    this.restoreCachedGoogleUser();
                    this.loadLocalState();
                    await this.loadFromIndexedDB();
                    this.applyThemeClass();

                    this.greetingInterval = setInterval(() => {
                        this.currentHour = new Date().getHours();
                    }, 30000);

                    await this.refreshRealtimeChipset(false);
                    this.realtimeTimer = setInterval(() => {
                        this.refreshRealtimeChipset(false);
                    }, 60000);

                    await this.fetchGoogleConfigAndSession();
                    await this.syncWithServer();
                    this.computeQuantitativeIntelligenceLocal();
                    await this.fetchReportHistory();

                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.setupChartResizeObservers();
                        this.updateAllCharts();
                    });
                    setTimeout(() => this.updateAllCharts(), 300);

                    document.addEventListener('visibilitychange', () => {
                        if (document.visibilityState === 'visible') {
                            this.syncWithServer();
                            this.refreshRealtimeChipset(false);
                        }
                    });
                },

                async refreshRealtimeChipset(notifyUser = false) {
                    let serverOk = false;
                    try {
                        const res = await fetch('/api/realtime/pulse?force=' + (notifyUser ? 'true' : 'false'));
                        if (res.ok) {
                            const data = await res.json();
                            if (data && data.status === 'ok' && data.pulse) {
                                this.realtimePulse = { ...this.realtimePulse, ...data.pulse };
                                serverOk = true;
                            }
                        }
                    } catch (e) {}

                    if (!serverOk) {
                        try {
                            const [fxRes, wbInfRes, wbGdpRes] = await Promise.allSettled([
                                fetch('https://open.er-api.com/v6/latest/USD'),
                                fetch('https://api.worldbank.org/v2/country/IDN/indicator/FP.CPI.TOTL.ZG?format=json&per_page=3'),
                                fetch('https://api.worldbank.org/v2/country/IDN/indicator/NY.GDP.MKTP.KD.ZG?format=json&per_page=3')
                            ]);

                            if (fxRes.status === 'fulfilled' && fxRes.value.ok) {
                                const fx = await fxRes.value.json();
                                const rates = fx && fx.rates ? fx.rates : {};
                                const usdIdr = Number(rates.IDR || this.realtimePulse.usd_idr);
                                this.realtimePulse.usd_idr = Math.round(usdIdr * 100) / 100;
                                if (rates.SGD) this.realtimePulse.sgd_idr = Math.round((usdIdr / Number(rates.SGD)) * 100) / 100;
                                if (rates.EUR) this.realtimePulse.eur_idr = Math.round((usdIdr / Number(rates.EUR)) * 100) / 100;
                                if (rates.JPY) this.realtimePulse.jpy_idr = Math.round((usdIdr / Number(rates.JPY)) * 100) / 100;
                                if (rates.AUD) this.realtimePulse.aud_idr = Math.round((usdIdr / Number(rates.AUD)) * 100) / 100;
                                if (rates.MYR) this.realtimePulse.myr_idr = Math.round((usdIdr / Number(rates.MYR)) * 100) / 100;
                            }

                            if (wbInfRes.status === 'fulfilled' && wbInfRes.value.ok) {
                                const wbInf = await wbInfRes.value.json();
                                if (Array.isArray(wbInf) && Array.isArray(wbInf[1])) {
                                    const valid = wbInf[1].find(e => e && e.value !== null && e.value !== undefined);
                                    if (valid) this.realtimePulse.inflation_id_pct = Math.round(Number(valid.value) * 100) / 100;
                                }
                            }

                            if (wbGdpRes.status === 'fulfilled' && wbGdpRes.value.ok) {
                                const wbGdp = await wbGdpRes.value.json();
                                if (Array.isArray(wbGdp) && Array.isArray(wbGdp[1])) {
                                    const valid = wbGdp[1].find(e => e && e.value !== null && e.value !== undefined);
                                    if (valid) this.realtimePulse.gdp_id_pct = Math.round(Number(valid.value) * 100) / 100;
                                }
                            }

                            this.realtimePulse.updated_at = new Date().toISOString();
                        } catch (e) {}
                    }

                    this.computeQuantitativeIntelligenceLocal();
                    if (notifyUser) {
                        this.showToast(
                            this.lang === 'ID'
                                ? `Data ekonomi real-time diperbarui: Inflasi ${this.realtimePulse.inflation_id_pct}% | USD Rp ${Math.round(this.realtimePulse.usd_idr).toLocaleString('id-ID')}`
                                : `Live economic data updated: Inflation ${this.realtimePulse.inflation_id_pct}% | USD Rp ${Math.round(this.realtimePulse.usd_idr).toLocaleString('id-ID')}`
                        );
                    }
                },

                async loadFromIndexedDB() {
                    try {
                        const idbState = await _dndLocalDb.loadWorkspace(this.resolvedAccountKey);
                        if (idbState && typeof idbState === 'object') {
                            if ((!this.transactions || this.transactions.length === 0) && Array.isArray(idbState.transactions)) {
                                this.transactions = idbState.transactions;
                            }
                            if ((!this.goals || this.goals.length === 0) && Array.isArray(idbState.goals)) {
                                this.goals = idbState.goals;
                            }
                            if ((!this.budgets || this.budgets.length === 0) && Array.isArray(idbState.budgets)) {
                                this.budgets = idbState.budgets;
                            }
                            if ((!this.automationRules || this.automationRules.length === 0) && Array.isArray(idbState.automationRules)) {
                                this.automationRules = idbState.automationRules;
                            }
                        }
                        this.reportFileLogs = await _dndLocalDb.listReportFiles(this.resolvedAccountKey);
                        this.receiptScanLogs = await _dndLocalDb.listReceiptScans(this.resolvedAccountKey);
                    } catch (e) {}
                },

                openAiAgentHub() {
                    this.setTab('analytics');
                    this.$nextTick(() => {
                        const el = document.getElementById('aiAgentHubSection');
                        if (el) {
                            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    });
                },

                setupChartResizeObservers() {
                    if (typeof ResizeObserver === 'undefined') return;
                    const ids = [
                        'dashboardTrendChart',
                        'analyticsCashflowChart',
                        'unifiedCategoryChart',
                        'walletBarChart'
                    ];
                    ids.forEach(id => {
                        const canvas = document.getElementById(id);
                        if (canvas && canvas.parentElement && !canvas.parentElement._dndObserved) {
                            canvas.parentElement._dndObserved = true;
                            const ro = new ResizeObserver((entries) => {
                                for (const entry of entries) {
                                    if (entry.contentRect.width > 20 && entry.contentRect.height > 20) {
                                        this.renderSingleChartById(id);
                                    }
                                }
                            });
                            ro.observe(canvas.parentElement);
                        }
                    });
                },

                renderSingleChartById(id) {
                    if (id === 'dashboardTrendChart') this.renderTrendChart();
                    else if (id === 'analyticsCashflowChart') this.renderAnalyticsCashflowChart();
                    else if (id === 'unifiedCategoryChart') this.renderUnifiedCategoryChart();
                    else if (id === 'walletBarChart') this.renderWalletChart();
                },

                refreshIcons() {
                    if (window.lucide && typeof window.lucide.createIcons === 'function') {
                        window.lucide.createIcons();
                    }
                },

                showToast(msg) {
                    this.toastMessage = stripAllEmojis(msg);
                    if (this.toastTimer) clearTimeout(this.toastTimer);
                    this.toastTimer = setTimeout(() => {
                        this.toastMessage = '';
                    }, 3400);
                },

                restoreCachedGoogleUser() {
                    try {
                        const cached = localStorage.getItem(`${this.appId}_google_user`);
                        if (cached) {
                            const parsed = JSON.parse(cached);
                            if (parsed && parsed.email) {
                                this.googleUser = parsed;
                                if (parsed.nickname) {
                                    this.customNickname = parsed.nickname;
                                }
                            }
                        }
                    } catch (e) {}
                },

                persistCachedGoogleUser() {
                    try {
                        if (this.googleUser && this.googleUser.email) {
                            localStorage.setItem(`${this.appId}_google_user`, JSON.stringify({
                                ...this.googleUser,
                                nickname: this.customNickname || this.googleUser.nickname || ''
                            }));
                        } else {
                            localStorage.removeItem(`${this.appId}_google_user`);
                        }
                    } catch (e) {}
                },

                getStorageKey() {
                    return `${this.appId}_state_${this.resolvedAccountKey}`;
                },

                loadLocalState() {
                    try {
                        const prefsRaw = localStorage.getItem(`${this.appId}_prefs`);
                        if (prefsRaw) {
                            const prefs = JSON.parse(prefsRaw);
                            if (typeof prefs.isDarkMode === 'boolean') this.isDarkMode = prefs.isDarkMode;
                            if (prefs.lang) this.lang = prefs.lang;
                            if (prefs.currency) this.currency = prefs.currency;
                            if (typeof prefs.customNickname === 'string') this.customNickname = prefs.customNickname;
                        }

                        const raw = localStorage.getItem(this.getStorageKey());
                        if (raw) {
                            const data = JSON.parse(raw);
                            if (Array.isArray(data.banks) && data.banks.length) this.banks = data.banks;
                            if (Array.isArray(data.categories) && data.categories.length) this.categories = data.categories;
                            if (Array.isArray(data.transactions)) this.transactions = data.transactions;
                            if (Array.isArray(data.goals)) this.goals = data.goals;
                            if (Array.isArray(data.budgets)) this.budgets = data.budgets;
                            if (Array.isArray(data.automationRules)) this.automationRules = data.automationRules;
                            if (Array.isArray(data.deletedTxIds)) this.deletedTxIds = data.deletedTxIds;
                            if (Array.isArray(data.deletedGoalIds)) this.deletedGoalIds = data.deletedGoalIds;
                            if (Array.isArray(data.deletedBudgetIds)) this.deletedBudgetIds = data.deletedBudgetIds;
                            if (Array.isArray(data.deletedRuleIds)) this.deletedRuleIds = data.deletedRuleIds;
                            if (Array.isArray(data.deletedBanks)) this.deletedBanks = data.deletedBanks;
                            if (Array.isArray(data.deletedCategories)) this.deletedCategories = data.deletedCategories;
                            if (typeof data.customNickname === 'string' && data.customNickname.trim()) {
                                this.customNickname = data.customNickname.trim();
                            }
                        }
                    } catch (e) {}
                },

                buildClientStatePayload() {
                    return {
                        banks: this.banks,
                        categories: this.categories,
                        transactions: this.transactions,
                        goals: this.goals,
                        budgets: this.budgets,
                        automationRules: this.automationRules,
                        customNickname: this.customNickname,
                        deletedTxIds: this.deletedTxIds.slice(-500),
                        deletedGoalIds: this.deletedGoalIds.slice(-200),
                        deletedBudgetIds: this.deletedBudgetIds.slice(-200),
                        deletedRuleIds: this.deletedRuleIds.slice(-200),
                        deletedBanks: this.deletedBanks.slice(-100),
                        deletedCategories: this.deletedCategories.slice(-100)
                    };
                },

                persistToLocalStorageOnly() {
                    try {
                        localStorage.setItem(`${this.appId}_prefs`, JSON.stringify({
                            isDarkMode: this.isDarkMode,
                            lang: this.lang,
                            currency: this.currency,
                            customNickname: this.customNickname
                        }));
                        this.persistCachedGoogleUser();
                        const payload = this.buildClientStatePayload();
                        localStorage.setItem(this.getStorageKey(), JSON.stringify(payload));
                        _dndLocalDb.saveWorkspace(this.resolvedAccountKey, payload);
                    } catch (e) {}
                },

                saveLocalState(triggerServerSync = true) {
                    this.persistToLocalStorageOnly();
                    if (triggerServerSync) {
                        this.syncWithServer();
                    }
                    this.computeQuantitativeIntelligenceLocal();
                },

                async syncWithServer() {
                    if (this.isSyncing) return;
                    this.isSyncing = true;
                    try {
                        const headers = { 'Content-Type': 'application/json' };
                        if (this.googleAccessToken) {
                            headers['Authorization'] = `Bearer ${this.googleAccessToken}`;
                        }
                        const res = await fetch('/api/sync/merge', {
                            method: 'POST',
                            headers,
                            body: JSON.stringify({
                                account_key: this.resolvedAccountKey,
                                google_email: this.googleUser ? this.googleUser.email : '',
                                google_sub: this.googleUser ? this.googleUser.sub : '',
                                client_revision: this.serverRevision,
                                state: this.buildClientStatePayload()
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data.status === 'ok' && data.state) {
                                if (typeof data.revision === 'number') this.serverRevision = data.revision;
                                this.applyCanonicalServerState(data.state);
                                this.$nextTick(() => {
                                    this.refreshIcons();
                                    this.updateAllCharts();
                                });
                            }
                        }
                    } catch (e) {
                    } finally {
                        this.isSyncing = false;
                    }
                },

                applyCanonicalServerState(st) {
                    if (!st || typeof st !== 'object') return;
                    if (Array.isArray(st.banks) && st.banks.length) this.banks = st.banks;
                    if (Array.isArray(st.categories) && st.categories.length) this.categories = st.categories;
                    if (Array.isArray(st.transactions)) this.transactions = st.transactions;
                    if (Array.isArray(st.goals)) this.goals = st.goals;
                    if (Array.isArray(st.budgets)) this.budgets = st.budgets;
                    if (Array.isArray(st.automationRules)) this.automationRules = st.automationRules;
                    if (Array.isArray(st.deletedTxIds)) this.deletedTxIds = st.deletedTxIds;
                    if (Array.isArray(st.deletedGoalIds)) this.deletedGoalIds = st.deletedGoalIds;
                    if (Array.isArray(st.deletedBudgetIds)) this.deletedBudgetIds = st.deletedBudgetIds;
                    if (Array.isArray(st.deletedRuleIds)) this.deletedRuleIds = st.deletedRuleIds;
                    if (Array.isArray(st.deletedBanks)) this.deletedBanks = st.deletedBanks;
                    if (Array.isArray(st.deletedCategories)) this.deletedCategories = st.deletedCategories;
                    if (typeof st.customNickname === 'string' && st.customNickname.trim() && !this.customNickname) {
                        this.customNickname = st.customNickname.trim();
                    }
                    this.persistToLocalStorageOnly();
                },

                applyThemeClass() {
                    if (this.isDarkMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                },

                toggleTheme() {
                    this.isDarkMode = !this.isDarkMode;
                    this.applyThemeClass();
                    this.saveLocalState(false);
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });
                },

                toggleLanguage() {
                    this.lang = this.lang === 'ID' ? 'EN' : 'ID';
                    document.documentElement.lang = this.lang.toLowerCase();
                    this.saveLocalState(false);
                    this.computeQuantitativeIntelligenceLocal();
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });
                },

                setTab(tab) {
                    this.activeTab = tab;
                    this.$nextTick(() => {
                        this.refreshIcons();
                        if (tab === 'dashboard' || tab === 'analytics') {
                            this.updateAllCharts();
                            requestAnimationFrame(() => this.updateAllCharts());
                            setTimeout(() => this.updateAllCharts(), 150);
                        }
                        if (tab === 'analytics') {
                            this.computeQuantitativeIntelligenceLocal();
                        }
                        if (tab === 'transactions') {
                            this.fetchReportHistory();
                        }
                    });
                },

                formatCurrency(amount) {
                    const num = Number(amount || 0);
                    const safeNum = Number.isFinite(num) ? num : 0;
                    const curr = (this.currency || 'IDR').toUpperCase();
                    const isNeg = safeNum < 0;
                    const absVal = Math.abs(safeNum);
                    const sign = isNeg ? '-' : '';

                    if (curr === 'IDR') {
                        return `${sign}Rp ${Math.round(absVal).toLocaleString('id-ID')}`;
                    }
                    if (curr === 'JPY') {
                        return `${sign}¥${Math.round(absVal).toLocaleString('en-US')}`;
                    }
                    const symbols = { USD: '$', SGD: 'S$', EUR: '€' };
                    const sym = symbols[curr] || `${curr} `;
                    return `${sign}${sym}${absVal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                },

                formatDateShort(dateStr) {
                    if (!dateStr) return '';
                    const clean = String(dateStr).replace('T', ' ').trim();
                    return clean.length >= 16 ? clean.slice(5, 16) : clean;
                },

                getLocalDateTimeInput(d = new Date()) {
                    const pad = n => String(n).padStart(2, '0');
                    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
                },

                getWalletBalance(bankName) {
                    let bal = 0;
                    for (const tx of this.transactions) {
                        const amt = Number(tx.amount || 0);
                        const fee = Number(tx.adminFee || tx.admin_fee || 0);
                        if (tx.type === 'income' && tx.account === bankName) {
                            bal += amt;
                        } else if ((tx.type === 'expense' || tx.type === 'withdrawal') && tx.account === bankName) {
                            bal -= amt;
                        } else if (tx.type === 'transfer') {
                            if (tx.account === bankName) bal -= (amt + fee);
                            if (tx.toAccount === bankName) bal += amt;
                        }
                    }
                    return bal;
                },

                getCategorySpent(categoryName) {
                    return this.transactions
                        .filter(tx => (tx.type === 'expense' || tx.type === 'withdrawal') && tx.category === categoryName)
                        .reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
                },

                computeQuantitativeIntelligenceLocal() {
                    const inc = this.totalIncome;
                    const exp = this.totalExpense + this.totalWithdrawal;
                    const bal = this.totalBalance;
                    const infRate = Number(this.realtimePulse.inflation_id_pct || 2.68) / 100;

                    const uniqueDates = new Set(
                        this.transactions
                            .filter(tx => tx.type === 'expense' || tx.type === 'withdrawal')
                            .map(tx => String(tx.date || '').slice(0, 10))
                            .filter(Boolean)
                    );
                    const activeDays = Math.max(1, uniqueDates.size);
                    const dailyBurn = exp / activeDays;
                    const monthlyBurnEst = dailyBurn * 30;
                    const emergencyIdeal = Math.round(monthlyBurnEst * 6);
                    const emergencyGap = Math.max(0, emergencyIdeal - Math.max(0, bal));
                    const savingsRate = inc > 0 ? Math.max(-100, Math.min(100, Math.round(((inc - exp) / inc) * 100))) : 0;
                    const runwayDays = dailyBurn > 0 ? Math.max(0, Math.round(Math.max(0, bal) / dailyBurn)) : 999;

                    let score = 50;
                    if (inc > 0) {
                        score += Math.min(30, Math.max(-25, Math.round(savingsRate * 0.8)));
                    }
                    if (bal > 0) score += 10;
                    if (this.goals.length > 0) score += 5;
                    if (this.automationRules.some(r => r.enabled)) score += 5;
                    score = Math.max(5, Math.min(100, score));

                    let grade = this.lang === 'ID' ? 'Stabil / Bertumbuh' : 'Stable / Growing';
                    if (score >= 80) grade = this.lang === 'ID' ? 'Sangat Sehat (Prima)' : 'Excellent Health';
                    else if (score >= 60) grade = this.lang === 'ID' ? 'Sehat & Terkendali' : 'Healthy & Controlled';
                    else if (score < 40) grade = this.lang === 'ID' ? 'Perlu Penghematan' : 'Needs Optimization';

                    const catGroups = {};
                    for (const tx of this.transactions) {
                        if (tx.type === 'expense' || tx.type === 'withdrawal') {
                            const c = tx.category || 'Other';
                            if (!catGroups[c]) catGroups[c] = [];
                            catGroups[c].push(tx);
                        }
                    }
                    const anomalies = [];
                    for (const [cat, list] of Object.entries(catGroups)) {
                        if (list.length >= 2) {
                            const avg = list.reduce((s, t) => s + Number(t.amount || 0), 0) / list.length;
                            for (const tx of list) {
                                const amt = Number(tx.amount || 0);
                                if (avg > 0 && amt >= avg * 2.3 && amt >= 100000) {
                                    anomalies.push({
                                        note: tx.note || cat,
                                        category: cat,
                                        amount: amt,
                                        multiplier: (amt / avg).toFixed(1)
                                    });
                                }
                            }
                        }
                    }

                    const monthlyNet = inc - exp;
                    const monthlySmartSave = inc > 0 ? inc * 0.20 : Math.max(0, monthlyNet);
                    const realBalance1y = bal > 0 ? Math.round(bal / (1 + infRate)) : bal;
                    const erosion1y = bal > 0 ? Math.round(bal - realBalance1y) : 0;

                    this.quantIntel = {
                        health_score: score,
                        health_grade: grade,
                        savings_rate_pct: savingsRate,
                        daily_burn_rate: Math.round(dailyBurn),
                        monthly_burn_est: Math.round(monthlyBurnEst),
                        runway_days: runwayDays,
                        emergency_fund_ideal: emergencyIdeal,
                        emergency_fund_gap: emergencyGap,
                        real_balance_1y: realBalance1y,
                        inflation_erosion_1y: erosion1y,
                        top_category: this.expenseCategoryBreakdown[0] ? this.expenseCategoryBreakdown[0].category : '-',
                        top_category_amount: this.expenseCategoryBreakdown[0] ? this.expenseCategoryBreakdown[0].amount : 0,
                        anomalies: anomalies.slice(0, 3),
                        forecast: {
                            current_pace_6m: Math.round(bal + Math.max(0, monthlyNet) * 6),
                            current_pace_12m: Math.round(bal + Math.max(0, monthlyNet) * 12),
                            smart_20pct_6m: Math.round(bal + monthlySmartSave * 6),
                            smart_20pct_12m: Math.round(bal + monthlySmartSave * 12)
                        }
                    };
                },

                // ==========================================
                // DIRECT GOOGLE BROWSER OAUTH2 (NO FIREBASE AUTH)
                // ==========================================
                async fetchGoogleConfigAndSession() {
                    try {
                        const infoRes = await fetch('/api/app/info');
                        if (infoRes.ok) {
                            const info = await infoRes.json();
                            if (info.google_client_id) this.googleClientId = info.google_client_id;
                            this.appMeta = {
                                platform: info.platform || this.appMeta.platform,
                                developer: info.developer || this.appMeta.developer,
                                instagram_handle: info.instagram_handle || this.appMeta.instagram_handle,
                                instagram_url: info.instagram_url || this.appMeta.instagram_url
                            };
                        }
                    } catch (e) {}

                    try {
                        const meRes = await fetch('/api/auth/google/me');
                        if (meRes.ok) {
                            const meData = await meRes.json();
                            if (meData.authenticated && meData.user && meData.user.email) {
                                this.googleUser = meData.user;
                                if (meData.user.nickname) {
                                    this.customNickname = meData.user.nickname;
                                }
                                this.persistCachedGoogleUser();
                            }
                        }
                    } catch (e) {}

                    this.initGoogleIdentityServices();
                },

                initGoogleIdentityServices(attempt = 0) {
                    if (this.googleInitialized) return;
                    if (!window.google || !window.google.accounts) {
                        if (attempt < 20) {
                            setTimeout(() => this.initGoogleIdentityServices(attempt + 1), 300);
                        }
                        return;
                    }
                    try {
                        this.googleInitialized = true;
                        window.google.accounts.id.initialize({
                            client_id: this.googleClientId,
                            callback: (resp) => this.handleGoogleCredentialResponse(resp),
                            auto_select: false,
                            use_fedcm_for_prompt: true
                        });

                        if (window.google.accounts.oauth2) {
                            this.googleTokenClient = window.google.accounts.oauth2.initTokenClient({
                                client_id: this.googleClientId,
                                scope: 'openid email profile',
                                callback: (tokenResp) => this.handleGoogleOAuthTokenResponse(tokenResp),
                                error_callback: () => {
                                    this.isGoogleSigningIn = false;
                                    if (this.googleWatchdogTimer) clearTimeout(this.googleWatchdogTimer);
                                }
                            });
                        }
                    } catch (e) {}
                },

                parseJwtPayload(token) {
                    try {
                        const parts = String(token || '').split('.');
                        if (parts.length < 2) return null;
                        const base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                        const padded = base64 + '='.repeat((4 - (base64.length % 4)) % 4);
                        const jsonStr = decodeURIComponent(
                            atob(padded)
                                .split('')
                                .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                                .join('')
                        );
                        return JSON.parse(jsonStr);
                    } catch (e) {
                        return null;
                    }
                },

                async verifyGoogleSessionWithBackend(payload) {
                    try {
                        const res = await fetch('/api/auth/google/verify', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data.status === 'ok' && data.user && data.user.email) {
                                this.googleUser = {
                                    ...data.user,
                                    nickname: this.customNickname || data.user.nickname || ''
                                };
                                this.persistCachedGoogleUser();
                            }
                        }
                    } catch (e) {}
                },

                async handleGoogleCredentialResponse(response) {
                    if (!response || !response.credential) return;
                    if (this.googleWatchdogTimer) clearTimeout(this.googleWatchdogTimer);
                    this.isGoogleSigningIn = true;
                    this.googleIdCredential = response.credential;
                    const decoded = this.parseJwtPayload(response.credential);
                    if (decoded && decoded.email) {
                        this.googleUser = {
                            sub: decoded.sub || decoded.email,
                            email: decoded.email,
                            name: decoded.name || decoded.email.split('@')[0],
                            nickname: this.customNickname || '',
                            picture: decoded.picture || ''
                        };
                        this.persistCachedGoogleUser();
                    }
                    await this.verifyGoogleSessionWithBackend({ id_token: response.credential });
                    await this.loadFromIndexedDB();
                    await this.syncWithServer();
                    this.isGoogleSigningIn = false;
                    this.showToast(this.lang === 'ID' ? `Selamat datang, ${this.displayUserName}!` : `Welcome, ${this.displayUserName}!`);
                },

                async handleGoogleOAuthTokenResponse(tokenResponse) {
                    if (this.googleWatchdogTimer) clearTimeout(this.googleWatchdogTimer);
                    if (!tokenResponse || !tokenResponse.access_token) {
                        this.isGoogleSigningIn = false;
                        return;
                    }
                    this.googleAccessToken = tokenResponse.access_token;
                    try {
                        const uRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                            headers: { Authorization: `Bearer ${tokenResponse.access_token}` }
                        });
                        if (uRes.ok) {
                            const profile = await uRes.json();
                            if (profile && profile.email) {
                                this.googleUser = {
                                    sub: profile.sub || profile.email,
                                    email: profile.email,
                                    name: profile.name || profile.email.split('@')[0],
                                    nickname: this.customNickname || '',
                                    picture: profile.picture || ''
                                };
                                this.persistCachedGoogleUser();
                            }
                        }
                        await this.verifyGoogleSessionWithBackend({ access_token: tokenResponse.access_token });
                        await this.loadFromIndexedDB();
                        await this.syncWithServer();
                        this.showToast(this.lang === 'ID' ? `Berhasil masuk sebagai ${this.displayUserName}` : `Signed in as ${this.displayUserName}`);
                    } catch (e) {
                        this.showToast(this.lang === 'ID' ? 'Gagal menghubungkan akun Google.' : 'Failed to connect Google account.');
                    } finally {
                        this.isGoogleSigningIn = false;
                    }
                },

                handleGoogleHeaderClick() {
                    if (this.googleUser) {
                        this.openNicknameModal();
                    } else {
                        this.initiateGoogleLogin();
                    }
                },

                initiateGoogleLogin() {
                    if (this.isGoogleSigningIn) return;
                    this.isGoogleSigningIn = true;
                    this.initGoogleIdentityServices();

                    if (this.googleWatchdogTimer) clearTimeout(this.googleWatchdogTimer);
                    this.googleWatchdogTimer = setTimeout(() => {
                        this.isGoogleSigningIn = false;
                    }, 12000);

                    if (this.googleTokenClient) {
                        try {
                            this.googleTokenClient.requestAccessToken({ prompt: 'select_account' });
                            return;
                        } catch (e) {}
                    }
                    if (window.google && window.google.accounts && window.google.accounts.id) {
                        try {
                            window.google.accounts.id.prompt();
                            setTimeout(() => { this.isGoogleSigningIn = false; }, 1800);
                            return;
                        } catch (e) {}
                    }
                    setTimeout(() => {
                        this.isGoogleSigningIn = false;
                        this.openNicknameModal();
                    }, 800);
                },

                async logoutGoogle() {
                    try {
                        await fetch('/api/auth/google/logout', { method: 'POST' });
                    } catch (e) {}
                    this.googleUser = null;
                    this.googleAccessToken = '';
                    this.googleIdCredential = '';
                    this.persistCachedGoogleUser();
                    this.transactions = [];
                    this.goals = [];
                    this.budgets = [];
                    this.loadLocalState();
                    await this.loadFromIndexedDB();
                    this.updateAllCharts();
                    this.showToast(this.lang === 'ID' ? 'Berhasil keluar dari akun Google.' : 'Signed out of Google account.');
                },

                openNicknameModal() {
                    this.nicknameInput = this.customNickname || (this.googleUser ? (this.googleUser.nickname || this.googleUser.name || '') : '');
                    this.showNicknameModal = true;
                },

                async saveNickname() {
                    const clean = stripAllEmojis(this.nicknameInput || '').trim().slice(0, 40);
                    this.customNickname = clean;
                    this.showNicknameModal = false;
                    this.saveLocalState(true);
                    this.showToast(this.lang === 'ID' ? 'Nickname diperbarui.' : 'Nickname updated.');
                },

                async resetNickname() {
                    this.customNickname = '';
                    this.nicknameInput = '';
                    this.showNicknameModal = false;
                    this.saveLocalState(true);
                    this.showToast(this.lang === 'ID' ? 'Nickname direset.' : 'Nickname reset.');
                },

                // ==========================================
                // WALLETS & CATEGORIES MANAGEMENT
                // ==========================================
                openWalletModal() {
                    this.newWalletName = '';
                    this.showWalletModal = true;
                    this.$nextTick(() => this.refreshIcons());
                },

                addWallet() {
                    const name = stripAllEmojis(this.newWalletName || '').trim();
                    if (!name) return;
                    this.deletedBanks = this.deletedBanks.filter(b => b !== name);
                    if (!this.banks.includes(name)) {
                        this.banks.push(name);
                    }
                    this.newWalletName = '';
                    this.saveLocalState(true);
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });
                    this.showToast(this.lang === 'ID' ? `Dompet "${name}" ditambahkan.` : `Wallet "${name}" added.`);
                },

                removeWallet(name) {
                    if (this.banks.length <= 1) return;
                    this.banks = this.banks.filter(b => b !== name);
                    if (!this.deletedBanks.includes(name)) this.deletedBanks.push(name);
                    this.saveLocalState(true);
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });
                },

                openCategoryModal() {
                    this.newCategoryName = '';
                    this.showCategoryModal = true;
                    this.$nextTick(() => this.refreshIcons());
                },

                addCategory() {
                    const name = stripAllEmojis(this.newCategoryName || '').trim();
                    if (!name) return;
                    this.deletedCategories = this.deletedCategories.filter(c => c !== name);
                    if (!this.categories.includes(name)) {
                        this.categories.push(name);
                    }
                    this.newCategoryName = '';
                    this.saveLocalState(true);
                    this.$nextTick(() => this.refreshIcons());
                    this.showToast(this.lang === 'ID' ? `Kategori "${name}" ditambahkan.` : `Category "${name}" added.`);
                },

                removeCategory(name) {
                    if (this.categories.length <= 1) return;
                    this.categories = this.categories.filter(c => c !== name);
                    if (!this.deletedCategories.includes(name)) this.deletedCategories.push(name);
                    this.saveLocalState(true);
                    this.$nextTick(() => this.refreshIcons());
                },

                // ==========================================
                // TRANSACTIONS & AUTOPILOT EXECUTION
                // ==========================================
                openTxModal(defaultType = 'expense') {
                    this.smartTxInput = '';
                    this.txForm = {
                        amount: '',
                        type: defaultType,
                        category: defaultType === 'income' ? 'Salary' : (this.categories[0] || 'Food'),
                        account: this.banks[0] || 'Bank BCA',
                        toAccount: this.banks[1] || this.banks[0] || 'Bank Mandiri',
                        adminFee: 0,
                        note: '',
                        date: this.getLocalDateTimeInput()
                    };
                    this.showTxModal = true;
                    this.$nextTick(() => this.refreshIcons());
                },

                openExpenseReceiptScanner() {
                    this.openTxModal('expense');
                    this.$nextTick(() => {
                        this.startExpenseReceiptCamera();
                    });
                },

                saveTransaction() {
                    const amt = Number(this.txForm.amount || 0);
                    if (!Number.isFinite(amt) || amt <= 0) {
                        this.showToast(this.lang === 'ID' ? 'Masukkan nominal lebih dari 0.' : 'Enter an amount greater than 0.');
                        return;
                    }

                    let noteText = stripAllEmojis(this.txForm.note || '');
                    if (!noteText && this.scannedReceiptMerchant) {
                        noteText = this.scannedReceiptMerchant;
                    }
                    if (this.txForm.type === 'expense' && this.scannedReceiptItems.length > 0) {
                        const summaryItems = this.scannedReceiptItems.slice(0, 3).map(it => `${it.name} x${it.qty}`).join(', ');
                        noteText = noteText ? `${noteText} (${summaryItems})` : summaryItems;
                    }

                    const tx = {
                        id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                        amount: amt,
                        type: this.txForm.type,
                        category: this.txForm.type === 'transfer' ? 'Transfer' : (this.txForm.category || 'Food'),
                        account: this.txForm.account || this.banks[0],
                        toAccount: this.txForm.type === 'transfer' ? (this.txForm.toAccount || this.banks[0]) : '',
                        adminFee: this.txForm.type === 'transfer' ? Number(this.txForm.adminFee || 0) : 0,
                        note: noteText,
                        date: (this.txForm.date || this.getLocalDateTimeInput()).replace('T', ' '),
                        updated_at: new Date().toISOString()
                    };

                    this.transactions.unshift(tx);
                    this.executeAutopilotRules(tx);
                    this.clearExpenseReceiptScan();
                    this.showTxModal = false;
                    this.saveLocalState(true);

                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });
                    this.showToast(this.lang === 'ID' ? 'Transaksi berhasil disimpan.' : 'Transaction saved.');
                },

                deleteTransaction(txId) {
                    this.transactions = this.transactions.filter(t => t.id !== txId);
                    if (!this.deletedTxIds.includes(txId)) this.deletedTxIds.push(txId);
                    this.saveLocalState(true);
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });
                    this.showToast(this.lang === 'ID' ? 'Transaksi dihapus.' : 'Transaction deleted.');
                },

                parseAmountShorthand(rawText) {
                    const lower = String(rawText || '').toLowerCase();
                    const unitMatch = lower.match(/(\d+(?:[.,]\d+)?)\s*(jt|juta|m|rb|ribu|k)\b/);
                    if (unitMatch) {
                        const num = parseFloat(unitMatch[1].replace(',', '.'));
                        const unit = unitMatch[2];
                        if (['jt', 'juta', 'm'].includes(unit)) return Math.round(num * 1000000);
                        if (['rb', 'ribu', 'k'].includes(unit)) return Math.round(num * 1000);
                    }
                    const plainMatch = String(rawText || '').replace(/\./g, '').match(/(\d{3,12})/);
                    if (plainMatch) return Number(plainMatch[1]);
                    const smallMatch = String(rawText || '').match(/\b(\d+(?:[.,]\d+)?)\b/);
                    if (smallMatch) return parseFloat(smallMatch[1].replace(',', '.'));
                    return 0;
                },

                parseNaturalLanguageTx() {
                    const raw = stripAllEmojis(this.smartTxInput || '').trim();
                    if (!raw) return;
                    this.isParsingSmartTx = true;

                    try {
                        const lower = raw.toLowerCase();
                        let type = 'expense';
                        if (/\b(gaji|salary|terima|dapat|masuk|income|bonus|profit|dividen)\b/.test(lower)) {
                            type = 'income';
                        } else if (/\b(transfer|tf|kirim|pindah)\b/.test(lower)) {
                            type = 'transfer';
                        }

                        const amount = this.parseAmountShorthand(raw);

                        let matchedWallet = this.txForm.account;
                        for (const b of this.banks) {
                            const bShort = b.toLowerCase().replace('bank ', '');
                            if (lower.includes(b.toLowerCase()) || lower.includes(bShort)) {
                                matchedWallet = b;
                                break;
                            }
                        }

                        let matchedCat = type === 'income' ? 'Salary' : 'Food';
                        if (/\b(kopi|makan|lunch|dinner|sarapan|minum|cafe|resto|bakso|ayam|nasi|coffee)\b/.test(lower)) matchedCat = 'Food';
                        else if (/\b(gojek|grab|bensin|parkir|tol|kereta|mrt|taxi|transport)\b/.test(lower)) matchedCat = 'Transport';
                        else if (/\b(shopee|tokopedia|lazada|beli|belanja|shopping)\b/.test(lower)) matchedCat = 'Online Shopping';
                        else if (/\b(saham|crypto|reksadana|invest|emas|trading)\b/.test(lower)) matchedCat = 'Investment';
                        else if (/\b(listrik|air|internet|wifi|pulsa|tagihan|pln)\b/.test(lower)) matchedCat = 'Utilities';

                        if (amount > 0) this.txForm.amount = amount;
                        this.txForm.type = type;
                        this.txForm.account = matchedWallet;
                        this.txForm.category = matchedCat;
                        this.txForm.note = raw;
                        this.showToast(this.lang === 'ID' ? 'Formulir terisi otomatis.' : 'Form auto-filled.');
                    } finally {
                        this.isParsingSmartTx = false;
                    }
                },

                // ==========================================
                // SCAN NOTA & SPLIT BILL (AUTO-MATH + DB)
                // ==========================================
                sendScannedReceiptToSplitBill() {
                    this.splitMerchant = this.scannedReceiptMerchant;
                    this.splitItems = JSON.parse(JSON.stringify(this.scannedReceiptItems || []));
                    this.splitSubtotal = this.scannedReceiptSubtotal;
                    this.splitDiscount = this.scannedReceiptDiscount;
                    this.splitTax = this.scannedReceiptTaxPct;
                    this.recalculateSplitBillMath();
                    this.showTxModal = false;
                    this.setTab('dashboard');
                    this.$nextTick(() => {
                        const el = document.getElementById('dashboardSplitBill');
                        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    });
                    this.showToast(this.lang === 'ID' ? 'Struk dipindahkan ke kalkulator Split Bill.' : 'Receipt sent to Split Bill calculator.');
                },

                recalculateSplitItemLine(idx) {
                    const item = this.splitItems[idx];
                    if (!item) return;
                    const qty = Math.max(1, Number(item.qty || 1));
                    const unit = Math.max(0, Number(item.unitPrice || item.price || 0));
                    item.qty = qty;
                    item.unitPrice = unit;
                    item.price = Math.round(qty * unit * 100) / 100;
                    this.recalculateSplitFromItems();
                },

                recalculateSplitFromItems() {
                    const itemsSum = this.splitItems.reduce((sum, it) => sum + Math.max(0, Number(it.price || 0)), 0);
                    if (this.splitItems.length > 0) {
                        this.splitSubtotal = Math.round(itemsSum * 100) / 100;
                    }
                    this.recalculateSplitBillMath();
                },

                recalculateSplitBillMath() {
                    const sub = Math.max(0, Number(this.splitSubtotal || 0));
                    const disc = Math.max(0, Number(this.splitDiscount || 0));
                    const taxPct = Math.max(0, Number(this.splitTax || 0));
                    const ppl = Math.max(1, Math.floor(Number(this.splitPeople || 1)));

                    const netBase = Math.max(0, sub - disc);
                    const taxNominal = netBase * (taxPct / 100);
                    const grand = netBase + taxNominal;
                    const perPerson = grand / ppl;

                    this.splitTaxAmount = Math.round(taxNominal * 100) / 100;
                    this.splitGrandTotal = Math.round(grand * 100) / 100;
                    this.splitPerPerson = Math.round(perPerson * 100) / 100;
                },

                addSplitItemRow() {
                    this.splitItems.push({ name: 'Item Baru', qty: 1, unitPrice: 0, price: 0 });
                },

                removeSplitItemRow(idx) {
                    this.splitItems.splice(idx, 1);
                    this.recalculateSplitFromItems();
                },

                clearSplitScan() {
                    this.splitMerchant = '';
                    this.splitItems = [];
                    this.splitSubtotal = 0;
                    this.splitDiscount = 0;
                    this.splitTax = 0;
                    this.splitTaxAmount = 0;
                    this.splitGrandTotal = 0;
                    this.splitPerPerson = 0;
                },

                recordMySplitShare() {
                    if (this.splitPerPerson <= 0) return;
                    const merchantLabel = this.splitMerchant ? `Split Bill - ${this.splitMerchant}` : 'Split Bill';
                    const tx = {
                        id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                        amount: this.splitPerPerson,
                        type: 'expense',
                        category: 'Food',
                        account: this.banks[0] || 'Bank BCA',
                        toAccount: '',
                        adminFee: 0,
                        note: `${merchantLabel} (1/${this.splitPeople} dari ${this.formatCurrency(this.splitGrandTotal)})`,
                        date: this.getLocalDateTimeInput().replace('T', ' '),
                        updated_at: new Date().toISOString()
                    };
                    this.transactions.unshift(tx);
                    this.executeAutopilotRules(tx);
                    this.saveLocalState(true);
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });
                    this.showToast(this.lang === 'ID' ? 'Bagian split bill Anda tercatat.' : 'Your split share recorded.');
                },

                recalculateExpenseItemLine(idx) {
                    const item = this.scannedReceiptItems[idx];
                    if (!item) return;
                    const qty = Math.max(1, Number(item.qty || 1));
                    const unit = Math.max(0, Number(item.unitPrice || item.price || 0));
                    item.qty = qty;
                    item.unitPrice = unit;
                    item.price = Math.round(qty * unit * 100) / 100;
                    this.recalculateExpenseReceiptMath(true);
                },

                recalculateExpenseReceiptMath(recomputeFromItems = true) {
                    if (recomputeFromItems && this.scannedReceiptItems.length > 0) {
                        const sum = this.scannedReceiptItems.reduce((acc, it) => acc + Math.max(0, Number(it.price || 0)), 0);
                        this.scannedReceiptSubtotal = Math.round(sum * 100) / 100;
                    }
                    const sub = Math.max(0, Number(this.scannedReceiptSubtotal || 0));
                    const disc = Math.max(0, Number(this.scannedReceiptDiscount || 0));
                    const taxPct = Math.max(0, Number(this.scannedReceiptTaxPct || 0));
                    const netBase = Math.max(0, sub - disc);
                    const taxNom = netBase * (taxPct / 100);
                    const total = Math.round((netBase + taxNom) * 100) / 100;
                    if (total > 0) {
                        this.txForm.amount = total;
                    }
                },

                addExpenseReceiptItemRow() {
                    this.scannedReceiptItems.push({ name: 'Item Belanja', qty: 1, unitPrice: 0, price: 0 });
                },

                removeExpenseReceiptItemRow(idx) {
                    this.scannedReceiptItems.splice(idx, 1);
                    this.recalculateExpenseReceiptMath(true);
                },

                clearExpenseReceiptScan() {
                    this.scannedReceiptMerchant = '';
                    this.scannedReceiptItems = [];
                    this.scannedReceiptSubtotal = 0;
                    this.scannedReceiptDiscount = 0;
                    this.scannedReceiptTaxPct = 0;
                },

                async startExpenseReceiptCamera() {
