                        id: 'rule_' + Date.now(),
                        name: (this.autoForm.name || '').trim() || this.formatMacroAction(this.autoForm),
                        actionType: this.autoForm.actionType,
                        minAmount: Number(this.autoForm.minAmount) || 0,
                        percent: Number(this.autoForm.percent) || 20,
                        targetGoalName: (this.autoForm.targetGoalName || '').trim() || 'Dana Darurat',
                        sourceWallet: this.autoForm.sourceWallet || this.availableAccounts[0],
                        destWallet: this.autoForm.destWallet || this.availableAccounts[1] || this.availableAccounts[0],
                        thresholdAmount: Number(this.autoForm.thresholdAmount) || 500000,
                        enabled: true,
                        runCount: 0
                    };
                    this.macros.push(rule);
                    this.isAutomationModalOpen = false;
                    await this.persistMacroRule(rule);
                    await this.syncStateToServer();
                    this.showToast(this.lang === 'ID' ? 'Aturan otomasi aktif' : 'Automation rule activated');
                },

                async applyAutomationPreset(presetKey) {
                    let rule = null;
                    if (presetKey === 'save20') {
                        rule = {
                            id: 'rule_' + Date.now(),
                            name: this.t('preset_save20_title'),
                            actionType: 'auto_save_goal',
                            minAmount: 0,
                            percent: 20,
                            targetGoalName: this.lang === 'ID' ? 'Dana Darurat' : 'Emergency Fund',
                            enabled: true,
                            runCount: 0
                        };
                    } else if (presetKey === 'roundup') {
                        rule = {
                            id: 'rule_' + Date.now(),
                            name: this.t('preset_roundup_title'),
                            actionType: 'round_up_save',
                            targetGoalName: this.lang === 'ID' ? 'Tabungan Receh' : 'Round-Up Savings',
                            enabled: true,
                            runCount: 0
                        };
                    } else if (presetKey === 'guard500') {
                        rule = {
                            id: 'rule_' + Date.now(),
                            name: this.t('preset_guard_title'),
                            actionType: 'spend_alert',
                            thresholdAmount: 500000,
                            enabled: true,
                            runCount: 0
                        };
                    }
                    if (!rule) return;
                    this.macros.push(rule);
                    await this.persistMacroRule(rule);
                    await this.syncStateToServer();
                    this.showToast(this.lang === 'ID' ? `Template "${rule.name}" diaktifkan` : `Template "${rule.name}" activated`);
                },

                async persistMacroRule(rule) {
                    if (!this.isBackendApiOnline) return;
                    try {
                        await fetch(`${this.apiBaseUrl}/api/macros`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(rule)
                        });
                    } catch (e) {}
                },

                async toggleMacroEnabled(macro) {
                    macro.enabled = macro.enabled === false ? true : false;
                    await this.persistMacroRule(macro);
                    await this.syncStateToServer();
                },

                async deleteMacro(id) {
                    this.macros = this.macros.filter(m => m.id !== id);
                    if (this.isBackendApiOnline) {
                        try {
                            await fetch(`${this.apiBaseUrl}/api/macros/${encodeURIComponent(id)}`, { method: 'DELETE' });
                        } catch (e) {}
                    }
                    await this.syncStateToServer();
                },

                async executeAutomationsForTransaction(tx) {
                    if (!Array.isArray(this.macros) || this.macros.length === 0) return;
                    for (const rule of this.macros) {
                        if (rule.enabled === false) continue;

                        if (rule.actionType === 'auto_save_goal' && tx.type === 'income' && tx.amount >= (Number(rule.minAmount) || 0)) {
                            const alloc = Math.round(tx.amount * ((Number(rule.percent) || 20) / 100));
                            if (alloc > 0) {
                                const gName = rule.targetGoalName || 'Dana Darurat';
                                let goal = this.goals.find(g => g.name.toLowerCase() === gName.toLowerCase());
                                if (!goal) {
                                    goal = { id: 'goal_' + Date.now(), name: gName, target: Math.max(alloc * 5, 1000000), current: 0 };
                                    this.goals.push(goal);
                                }
                                goal.current = Number(goal.current || 0) + alloc;
                                rule.runCount = (rule.runCount || 0) + 1;
                                await this.persistMacroRule(rule);
                                this.showToast(`Otomasi: +${this.formatCurrency(alloc)} → ${goal.name}`);
                            }
                        } else if (rule.actionType === 'round_up_save' && tx.type === 'expense') {
                            const unit = this.currency === 'IDR' ? 10000 : 10;
                            const rem = tx.amount % unit;
                            if (rem > 0) {
                                const spare = unit - rem;
                                const gName = rule.targetGoalName || 'Tabungan Receh';
                                let goal = this.goals.find(g => g.name.toLowerCase() === gName.toLowerCase());
                                if (!goal) {
                                    goal = { id: 'goal_' + Date.now(), name: gName, target: this.currency === 'IDR' ? 1000000 : 500, current: 0 };
                                    this.goals.push(goal);
                                }
                                goal.current = Number(goal.current || 0) + spare;
                                rule.runCount = (rule.runCount || 0) + 1;
                                await this.persistMacroRule(rule);
                                this.showToast(`Round-Up: +${this.formatCurrency(spare)} → ${goal.name}`);
                            }
                        } else if (rule.actionType === 'auto_transfer_wallet' && tx.type === 'income' && tx.amount >= (Number(rule.minAmount) || 0)) {
                            const alloc = Math.round(tx.amount * ((Number(rule.percent) || 20) / 100));
                            if (alloc > 0 && rule.sourceWallet && rule.destWallet && rule.sourceWallet !== rule.destWallet) {
                                this.transactions.unshift({
                                    id: Date.now() + 1,
                                    amount: alloc,
                                    type: 'transfer',
                                    category: 'Transfer',
                                    account: rule.sourceWallet,
                                    toAccount: rule.destWallet,
                                    adminFee: 0,
                                    note: `Auto-Transfer (${rule.name})`,
                                    currency: this.currency,
                                    date: tx.date
                                });
                                rule.runCount = (rule.runCount || 0) + 1;
                                await this.persistMacroRule(rule);
                            }
                        } else if (rule.actionType === 'spend_alert' && tx.type === 'expense') {
                            const limit = Number(rule.thresholdAmount) || 500000;
                            if (tx.amount >= limit) {
                                rule.runCount = (rule.runCount || 0) + 1;
                                await this.persistMacroRule(rule);
                                this.showToast(
                                    this.lang === 'ID'
                                        ? `Peringatan Otomasi: Pengeluaran melebihi ${this.formatCurrency(limit)}`
                                        : `Automation Alert: Expense exceeded ${this.formatCurrency(limit)}`
                                );
                            }
                        }
                    }
                },

                formatMacroTrigger(macro) {
                    if (macro.actionType === 'auto_save_goal' || macro.actionType === 'auto_transfer_wallet') {
                        return this.lang === 'ID'
                            ? `Setiap Pemasukan ≥ ${this.formatCurrency(macro.minAmount || 0)}`
                            : `Every Income ≥ ${this.formatCurrency(macro.minAmount || 0)}`;
                    }
                    if (macro.actionType === 'round_up_save') {
                        return this.lang === 'ID' ? 'Setiap Transaksi Pengeluaran' : 'Every Expense Transaction';
                    }
                    return this.lang === 'ID'
                        ? `Pengeluaran ≥ ${this.formatCurrency(macro.thresholdAmount || 500000)}`
                        : `Expense ≥ ${this.formatCurrency(macro.thresholdAmount || 500000)}`;
                },

                formatMacroAction(macro) {
                    if (macro.actionType === 'auto_save_goal') {
                        return this.lang === 'ID'
                            ? `Sisihkan ${macro.percent || 20}% ke Target "${macro.targetGoalName || 'Dana Darurat'}"`
                            : `Allocate ${macro.percent || 20}% to "${macro.targetGoalName || 'Emergency Fund'}"`;
                    }
                    if (macro.actionType === 'round_up_save') {
                        return this.lang === 'ID'
                            ? `Bulatkan ke kelipatan 10rb & simpan selisih ke "${macro.targetGoalName || 'Tabungan Receh'}"`
                            : `Round up to nearest 10 & save difference to "${macro.targetGoalName || 'Round-Up Savings'}"`;
                    }
                    if (macro.actionType === 'auto_transfer_wallet') {
                        return this.lang === 'ID'
                            ? `Transfer ${macro.percent || 20}% dari ${macro.sourceWallet} → ${macro.destWallet}`
                            : `Transfer ${macro.percent || 20}% from ${macro.sourceWallet} → ${macro.destWallet}`;
                    }
                    return this.lang === 'ID'
                        ? `Tampilkan peringatan real-time saat batas terlampaui`
                        : `Trigger real-time alert when limit is exceeded`;
                },

                buildFinancialContextString() {
                    const inc = this.calculateTotal('income');
                    const exp = this.calculateTotal('expense');
                    const wd = this.calculateTotal('withdrawal');
                    const bal = this.calculateTotal('balance');
                    const wallets = this.accountBalances.map(w => `${w.name}: ${this.formatCurrency(w.balance)}`).join(', ');
                    const goalsStr = this.goals.map(g => `${g.name} (${this.formatCurrency(g.current)}/${this.formatCurrency(g.target)})`).join(', ') || 'None';
                    const budgetsStr = this.budgets.map(b => `${b.category} (Spent ${this.formatCurrency(this.getBudgetSpent(b.category))}/${this.formatCurrency(b.limit)})`).join(', ') || 'None';
                    return `Currency: ${this.currency} | Balance: ${this.formatCurrency(bal)} | Income: ${this.formatCurrency(inc)} | Expense: ${this.formatCurrency(exp)} | Withdrawal: ${this.formatCurrency(wd)} | Wallets: [${wallets}] | Goals: [${goalsStr}] | Budgets: [${budgetsStr}]`;
                },

                async runFullAiAnalysis() {
                    const prompt = this.lang === 'ID'
                        ? 'Lakukan audit keuangan menyeluruh berdasarkan seluruh transaksi, saldo wallet, anggaran, dan target tabungan.'
                        : 'Perform a comprehensive financial audit across all transactions, wallet balances, budgets, and savings goals.';
                    await this.askAiPrompt(prompt, this.t('ai_full_audit_btn'));
                },

                async askAiPrompt(prompt, displayLabel) {
                    if (this.isAiLoading) return;
                    this.aiMessages.push({ role: 'user', text: displayLabel || prompt });
                    this.isAiLoading = true;

                    try {
                        if (this.isBackendApiOnline) {
                            const res = await fetch(`${this.apiBaseUrl}/api/ai/analyze`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    prompt,
                                    lang: this.lang,
                                    currency: this.currency,
                                    financial_context: this.buildFinancialContextString(),
                                    transactions: this.transactions
                                })
                            });
                            if (res.ok) {
                                const data = await res.json();
                                if (data.analysis) {
                                    this.aiMessages.push({ role: 'ai', text: data.analysis });
                                    return;
                                }
                            }
                        }

                        const inc = this.calculateTotal('income');
                        const exp = this.calculateTotal('expense') + this.calculateTotal('withdrawal');
                        const bal = this.calculateTotal('balance');
                        const ratio = inc > 0 ? Math.max(0, Math.min(100, Math.round(((inc - exp) / inc) * 100))) : 0;
                        const catMap = {};
                        this.transactions.filter(t => t.type === 'expense').forEach(t => {
                            catMap[t.category] = (catMap[t.category] || 0) + (Number(t.amount) || 0);
                        });
                        const topCat = Object.entries(catMap).sort((a, b) => b[1] - a[1])[0];

                        const localReport = this.lang === 'ID'
                            ? `### Ringkasan Audit Finansial\n- **Total Saldo Bersih:** ${this.formatCurrency(bal)} (Rasio Simpanan: **${ratio}%**)\n- **Pemasukan vs Pengeluaran:** ${this.formatCurrency(inc)} vs ${this.formatCurrency(exp)}\n- **Kategori Pengeluaran Terbesar:** ${topCat ? `${this.formatCategoryLabel(topCat[0])} (${this.formatCurrency(topCat[1])})` : 'Belum ada pengeluaran'}\n### Rekomendasi Strategis\n- Alokasikan minimal **20%** dari setiap pemasukan ke target tabungan Anda menggunakan fitur **Otomasi**.`
                            : `### Financial Audit Summary\n- **Net Total Balance:** ${this.formatCurrency(bal)} (Savings Ratio: **${ratio}%**)\n- **Income vs Expenses:** ${this.formatCurrency(inc)} vs ${this.formatCurrency(exp)}\n- **Top Expense Category:** ${topCat ? `${topCat[0]} (${this.formatCurrency(topCat[1])})` : 'No expenses recorded'}\n### Strategic Recommendations\n- Allocate at least **20%** of every income entry to your savings goal via **Automation**.`;
                        this.aiMessages.push({ role: 'ai', text: localReport });
                    } finally {
                        this.isAiLoading = false;
                    }
                },

                async submitCustomAiQuery() {
                    const q = (this.aiCustomInput || '').trim();
                    if (!q) return;
                    this.aiCustomInput = '';
                    await this.askAiPrompt(q, q);
                },

                copyAiResult(text) {
                    this.copyTextSafe(text);
                    this.showToast(this.lang === 'ID' ? 'Hasil analisis disalin' : 'Analysis copied');
                },

                formatAiMarkdown(raw) {
                    const esc = String(raw || '')
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
                    return esc
                        .replace(/^### (.*)$/gm, '<h4 class="font-bold text-dndInk text-sm mt-2">$1</h4>')
                        .replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-dndInk">$1</strong>')
                        .replace(/^- (.*)$/gm, '<div class="flex items-start gap-2"><span class="text-dndCobalt font-bold">•</span><span>$1</span></div>')
                        .replace(/\n/g, '<br>');
                },

                submitModal() {
                    if (typeof this.modalConfig.onConfirm === 'function') {
                        this.modalConfig.onConfirm(this.modalConfig.fields);
                    }
                    this.modalConfig.isOpen = false;
                },

                updateAllCharts() {
                    if (typeof echarts === 'undefined') return;
                    this.renderGaugeChart();
                    this.renderComboChart();
                    this.renderAllocationDonutChart();
                    this.goals.forEach(g => this.renderGoalDonut(g));
                },

                renderGaugeChart() {
                    const el = document.getElementById('gaugeChart');
                    if (!el) return;
                    const chart = echarts.getInstanceByDom(el) || echarts.init(el);
                    const inc = this.calculateTotal('income');
                    const out = this.calculateTotal('expense') + this.calculateTotal('withdrawal');
                    const score = inc > 0 ? Math.max(0, Math.min(100, Math.round(((inc - out) / inc) * 100))) : 0;
                    const inkColor = this.isDarkMode ? '#F4F4F6' : '#141518';
                    const trackColor = this.isDarkMode ? '#262933' : '#E6E4DD';
                    const brandColor = score >= 50 ? '#047857' : (score >= 20 ? '#1D4ED8' : '#BE123C');

                    chart.setOption({
                        series: [{
                            type: 'gauge',
                            startAngle: 180,
                            endAngle: 0,
                            min: 0,
                            max: 100,
                            radius: '105%',
                            center: ['50%', '76%'],
                            progress: { show: true, width: 10, roundCap: true, itemStyle: { color: brandColor } },
                            pointer: { show: false },
                            axisLine: { lineStyle: { width: 10, color: [[1, trackColor]] } },
                            axisTick: { show: false },
                            splitLine: { show: false },
                            axisLabel: { show: false },
                            detail: {
                                valueAnimation: true,
                                offsetCenter: [0, '-12%'],
                                fontSize: 20,
                                fontWeight: 700,
                                fontFamily: 'JetBrains Mono',
                                color: inkColor,
                                formatter: '{value}%'
                            },
                            data: [{ value: score }]
                        }]
                    }, true);
                },

                renderComboChart() {
                    const el = document.getElementById('comboChart');
                    if (!el) return;
                    const chart = echarts.getInstanceByDom(el) || echarts.init(el);
                    const subtleColor = this.isDarkMode ? '#9CA3AF' : '#686A6F';
                    const gridLine = this.isDarkMode ? '#262933' : '#ECEAE3';

                    const dayMap = {};
                    [...this.transactions].reverse().forEach(tx => {
                        const day = String(tx.date || '').split(' ')[0] || 'Today';
                        if (!dayMap[day]) dayMap[day] = { inc: 0, exp: 0 };
                        const amt = (Number(tx.amount) || 0) * (this.rates[this.currency] || 1);
                        if (tx.type === 'income') dayMap[day].inc += amt;
                        else if (tx.type === 'expense' || tx.type === 'withdrawal') dayMap[day].exp += amt;
                    });

                    const labels = Object.keys(dayMap).slice(-7);
                    const incData = labels.map(d => Math.round(dayMap[d].inc));
                    const expData = labels.map(d => Math.round(dayMap[d].exp));

                    chart.setOption({
                        tooltip: { trigger: 'axis' },
                        legend: {
                            data: [this.t('income'), this.t('expense')],
                            bottom: 0,
                            textStyle: { color: subtleColor, fontSize: 11 }
                        },
                        grid: { top: 18, left: 10, right: 10, bottom: 32, containLabel: true },
                        xAxis: {
                            type: 'category',
                            data: labels.length ? labels : ['-'],
                            axisLine: { lineStyle: { color: gridLine } },
                            axisLabel: { color: subtleColor, fontSize: 10 }
                        },
                        yAxis: {
                            type: 'value',
                            splitLine: { lineStyle: { color: gridLine } },
                            axisLabel: { color: subtleColor, fontSize: 10 }
                        },
                        series: [
                            {
                                name: this.t('income'),
                                type: 'bar',
                                barMaxWidth: 22,
                                itemStyle: { color: '#1D4ED8', borderRadius: [6, 6, 0, 0] },
                                data: incData.length ? incData : [0]
                            },
                            {
                                name: this.t('expense'),
                                type: 'bar',
                                barMaxWidth: 22,
                                itemStyle: { color: '#BE123C', borderRadius: [6, 6, 0, 0] },
                                data: expData.length ? expData : [0]
                            }
                        ]
                    }, true);
                },

                renderAllocationDonutChart() {
                    const el = document.getElementById('allocationDonutChart');
                    if (!el) return;
                    const chart = echarts.getInstanceByDom(el) || echarts.init(el);
                    const items = this.cashAllocationSummary;
                    const hasData = items.some(i => i.amount > 0);
                    const emptyColor = this.isDarkMode ? '#262933' : '#E6E4DD';

                    chart.setOption({
                        tooltip: { trigger: 'item' },
                        series: [{
                            type: 'pie',
                            radius: ['58%', '82%'],
                            avoidLabelOverlap: false,
                            label: { show: false },
                            data: hasData
                                ? items.map(i => ({ value: i.amount, name: i.label, itemStyle: { color: i.color } }))
                                : [{ value: 1, name: this.t('no_data_label'), itemStyle: { color: emptyColor } }]
                        }]
                    }, true);
                },

                renderGoalDonut(goal) {
                    const el = document.getElementById('goalChart_' + goal.id);
                    if (!el || typeof echarts === 'undefined') return;
                    const chart = echarts.getInstanceByDom(el) || echarts.init(el);
                    const pct = Math.min(100, Math.round(((Number(goal.current) || 0) / Math.max(1, Number(goal.target) || 1)) * 100));
                    const track = this.isDarkMode ? '#262933' : '#E6E4DD';
                    chart.setOption({
                        series: [{
                            type: 'pie',
                            radius: ['68%', '92%'],
                            silent: true,
                            label: {
                                show: true,
                                position: 'center',
                                formatter: `${pct}%`,
                                fontSize: 10,
                                fontWeight: 700,
                                color: this.isDarkMode ? '#F4F4F6' : '#141518'
                            },
                            data: [
                                { value: pct, itemStyle: { color: '#047857' } },
                                { value: Math.max(0, 100 - pct), itemStyle: { color: track } }
                            ]
                        }]
                    }, true);
                },

                async exportExcel() {
                    if (this.isBackendApiOnline) {
                        const url = `${this.apiBaseUrl}/api/export/excel?lang=${encodeURIComponent(this.lang)}&email=${encodeURIComponent(this.userEmail || '')}`;
                        window.open(url, '_blank');
                        return;
                    }
                    if (typeof ExcelJS === 'undefined' || typeof saveAs === 'undefined') return;
                    const wb = new ExcelJS.Workbook();
                    const ws = wb.addWorksheet(this.t('report_ledger_sheet'));
                    ws.addRow([this.t('col_date'), this.t('category_label'), 'Type', this.t('col_account'), 'Note', this.t('col_amount')]);
                    this.transactions.forEach(tx => {
                        ws.addRow([tx.date, tx.category, tx.type, tx.account, tx.note || '', Number(tx.amount) || 0]);
                    });
                    const buf = await wb.xlsx.writeBuffer();
                    saveAs(new Blob([buf]), `DND_Finance_Report_${this.lang}.xlsx`);
                    this.showToast(this.lang === 'ID' ? 'Laporan Excel diunduh' : 'Excel report downloaded');
                },

                exportPDF() {
                    if (this.isBackendApiOnline) {
                        const url = `${this.apiBaseUrl}/api/export/pdf?lang=${encodeURIComponent(this.lang)}&email=${encodeURIComponent(this.userEmail || '')}`;
                        window.open(url, '_blank');
                        return;
                    }
                    if (!window.jspdf) return;
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    doc.setFontSize(14);
                    doc.text(this.t('report_title'), 14, 18);
                    doc.setFontSize(10);
                    doc.text(`${this.t('balance')}: ${this.formatCurrency(this.calculateTotal('balance'))}`, 14, 26);
                    doc.autoTable({
                        startY: 32,
                        head: [[this.t('col_date'), this.t('category_label'), 'Type', this.t('col_account'), this.t('col_amount')]],
                        body: this.transactions.map(tx => [
                            tx.date,
                            this.formatCategoryLabel(tx.category),
                            tx.type,
                            tx.account,
                            this.formatCurrency(tx.amount)
                        ])
                    });
                    doc.save(`DND_Finance_Report_${this.lang}.pdf`);
                    this.showToast(this.lang === 'ID' ? 'Laporan PDF diunduh' : 'PDF report downloaded');
                }
            }));
        });
    </script>
</body>
</html>
