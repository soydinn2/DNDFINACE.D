<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DND — Minimalist Financial Ledger & Analytics</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Google Identity Services (FedCM & One-Tap Auto-Detect for All Public Users) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Export & OCR Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'], 
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    colors: { 
                        dndCanvas: 'rgb(var(--bg-canvas-rgb) / <alpha-value>)',
                        dndSurface: 'rgb(var(--bg-card-rgb) / <alpha-value>)',
                        dndMuted: 'rgb(var(--bg-muted-rgb) / <alpha-value>)',
                        dndBorder: 'rgb(var(--border-hairline-rgb) / <alpha-value>)',
                        dndInk: 'rgb(var(--ink-primary-rgb) / <alpha-value>)',
                        dndSubtle: 'rgb(var(--ink-secondary-rgb) / <alpha-value>)',
                        dndCobalt: 'rgb(var(--brand-cobalt-rgb) / <alpha-value>)',
                        dndJade: 'rgb(var(--brand-jade-rgb) / <alpha-value>)',
                        dndCrimson: 'rgb(var(--brand-crimson-rgb) / <alpha-value>)',
                        dndOchre: 'rgb(var(--brand-ochre-rgb) / <alpha-value>)'
                    }
                }
            }
        }
    </script>

    <style>
        :root, body.theme-light {
            --bg-canvas-rgb: 248 247 244;
            --bg-card-rgb: 255 255 255;
            --bg-muted-rgb: 241 239 233;
            --border-hairline-rgb: 230 228 221;
            --border-hover: #D2CFC6;
            --ink-primary-rgb: 20 21 24;
            --ink-secondary-rgb: 104 106 111;
            --brand-cobalt-rgb: 29 78 216;
            --brand-ochre-rgb: 180 83 9;
            --brand-jade-rgb: 4 120 87;
            --brand-crimson-rgb: 190 18 60;
            --card-shadow: 0 1px 2px rgba(20, 21, 24, 0.025);
            color-scheme: light;
        }

        body.theme-black {
            --bg-canvas-rgb: 10 11 14;
            --bg-card-rgb: 18 20 26;
            --bg-muted-rgb: 27 30 38;
            --border-hairline-rgb: 38 41 51;
            --border-hover: #3B4050;
            --ink-primary-rgb: 244 244 246;
            --ink-secondary-rgb: 156 163 175;
            --brand-cobalt-rgb: 59 130 246;
            --brand-ochre-rgb: 245 158 11;
            --brand-jade-rgb: 16 185 129;
            --brand-crimson-rgb: 244 63 94;
            --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
            color-scheme: dark;
        }

        html, body {
            height: 100dvh;
            background-color: rgb(var(--bg-canvas-rgb));
            color: rgb(var(--ink-primary-rgb));
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-overflow-scrolling: touch;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }

        @media screen and (max-width: 768px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }

        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }

        .num-tabular {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        .dnd-card {
            background: rgb(var(--bg-card-rgb));
            border: 1px solid rgb(var(--border-hairline-rgb));
            box-shadow: var(--card-shadow);
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        .dnd-card:hover {
            border-color: var(--border-hover);
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }
        .dnd-logo-svg {
            color: rgb(var(--ink-primary-rgb));
            overflow: visible;
        }
        body.theme-black .dnd-logo-svg {
            color: #FFFFFF !important;
        }
        body.theme-black .dnd-brand-text {
            color: #FFFFFF !important;
        }

        .btn-tactile {
            transition: opacity 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn-tactile:active:not(:disabled) {
            opacity: 0.88;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 99px; }

        [x-cloak] { display: none !important; }
        .chart-container { width: 100%; height: 100%; min-height: 240px; position: relative; }
    </style>

    <script>
        window.addEventListener('error', function(e) {
            if (e.message && (e.message.includes('ResizeObserver') || e.message.includes('undelivered'))) {
                e.stopImmediatePropagation();
            }
        });
    </script>
</head>

<body x-data="dndApp()" x-init="initApp()" :class="isDarkMode ? 'theme-black' : 'theme-light'" class="h-[100dvh] flex flex-col md:flex-row selection:bg-dndCobalt selection:text-white font-sans relative overflow-hidden">
    
    <!-- Minimalist Toast Notification -->
    <div x-show="toastMsg !== ''" style="display: none;"
         x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" 
         x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" 
         class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[300] bg-dndInk text-dndCanvas px-4 py-2 rounded-full shadow-md flex items-center gap-2 pointer-events-none max-w-[92vw]">
        <span class="w-2 h-2 rounded-full bg-dndCobalt flex-shrink-0"></span>
        <span x-text="toastMsg" class="text-xs font-semibold tracking-wide truncate"></span>
    </div>

    <!-- Clean Minimalist Splash Screen -->
    <div x-show="isDbLoading" 
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         class="fixed inset-0 z-[200] bg-dndCanvas flex flex-col items-center justify-center px-6 text-center">
        <svg class="w-36 h-20 dnd-logo-svg mx-auto block" viewBox="30 12 200 98" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M36 18 H64 V101 H82 V104 H36 V103 C47 102 52 97 52 88 V33 C52 24 47 19 36 18 Z"/>
            <path d="M82 101 C102 101 111 85 109 63 L113 68 C115 90 104 104 82 104 Z"/>
            <path d="M64 18 H84 C99 18 109 25 119 39 L154 86 C162 96 170 101 184 101 V104 H176 C162 104 152 97 142 83 L107 36 C99 25 91 20 78 20 H64 Z"/>
            <path d="M139 25 C139 20 144 18 151 18 V73 L139 58 Z"/>
            <path d="M156 18 H178 C209 18 225 37 225 61 C225 85 209 104 178 104 H175 V101 C199 101 210 84 210 61 C210 38 199 20 177 20 H156 Z"/>
        </svg>
        <h1 class="dnd-brand-text mt-3 pl-[0.26em] text-xs font-extrabold text-dndInk uppercase tracking-[0.26em]">DND FINANCE</h1>
    </div>

    <!-- Minimalist Sidebar (Desktop) -->
    <aside class="hidden md:flex w-60 flex-col bg-dndSurface border-r border-dndBorder z-20">
        <div class="h-18 flex items-center justify-between px-6 py-5 border-b border-dndBorder">
            <div class="brand-mark cursor-pointer" @click="switchView('dashboard')">
                <svg class="w-14 h-7 dnd-logo-svg" viewBox="30 12 200 98" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M36 18 H64 V101 H82 V104 H36 V103 C47 102 52 97 52 88 V33 C52 24 47 19 36 18 Z"/>
                    <path d="M82 101 C102 101 111 85 109 63 L113 68 C115 90 104 104 82 104 Z"/>
                    <path d="M64 18 H84 C99 18 109 25 119 39 L154 86 C162 96 170 101 184 101 V104 H176 C162 104 152 97 142 83 L107 36 C99 25 91 20 78 20 H64 Z"/>
                    <path d="M139 25 C139 20 144 18 151 18 V73 L139 58 Z"/>
                    <path d="M156 18 H178 C209 18 225 37 225 61 C225 85 209 104 178 104 H175 V101 C199 101 210 84 210 61 C210 38 199 20 177 20 H156 Z"/>
                </svg>
                <span class="dnd-brand-text text-xs font-extrabold tracking-[0.18em] text-dndInk">FINANCE</span>
            </div>
            <span class="text-[10px] font-mono font-semibold uppercase px-2 py-0.5 rounded bg-dndMuted text-dndSubtle">Ledger</span>
        </div>

        <nav class="flex-1 py-4 flex flex-col gap-1 px-3 overflow-y-auto">
            <template x-for="item in menuItems" :key="item.id">
                <a href="#" @click.prevent="switchView(item.id)" 
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm transition-colors"
                   :class="activeMenu === item.id ? 'bg-dndInk text-dndCanvas font-semibold' : 'text-dndSubtle hover:bg-dndMuted/70 hover:text-dndInk font-medium'">
                    <div x-html="item.icon" class="w-4 h-4 flex-shrink-0"></div>
                    <span class="tracking-tight" x-text="t(item.label_key)"></span>
                </a>
            </template>
        </nav>
        
        <!-- Google Account Auth Status / Sign-In -->
        <div class="p-4 border-t border-dndBorder">
            <template x-if="!isGoogleLoggedIn">
                <div class="space-y-2">
                    <div id="g_id_signin_sidebar" class="w-full flex justify-center"></div>
                    <button @click="triggerGoogleSignIn(true)" class="w-full bg-dndCanvas hover:bg-dndMuted border border-dndBorder rounded-xl p-2.5 flex items-center justify-center gap-2.5 btn-tactile">
                        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.58c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        <span class="text-xs font-semibold text-dndInk" x-text="t('sign_in_google')"></span>
                    </button>
                </div>
            </template>

            <template x-if="isGoogleLoggedIn">
                <div class="bg-dndCanvas rounded-xl p-2.5 flex items-center justify-between border border-dndBorder">
                    <div class="flex items-center gap-2.5 overflow-hidden cursor-pointer" @click="isAccountModalOpen = true">
                        <img x-show="userPhoto" :src="userPhoto" alt="Profile" class="w-8 h-8 rounded-full border border-dndBorder object-cover">
                        <div x-show="!userPhoto" class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white bg-dndCobalt flex-shrink-0">
                            <span x-text="displayGreetingName.charAt(0).toUpperCase()"></span>
                        </div>
                        <div class="flex-1 overflow-hidden">
                            <p class="text-xs font-bold text-dndInk truncate" x-text="displayGreetingName"></p>
                            <p class="text-[10px] text-dndSubtle truncate" x-text="userEmail"></p>
                        </div>
                    </div>
                    <button @click="logoutGoogle()" class="p-1.5 rounded-lg text-dndSubtle hover:text-dndCrimson hover:bg-dndCrimson/10 transition-colors" :title="t('sign_out')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </button>
                </div>
            </template>
        </div>
    </aside>

    <!-- Bottom Nav (Mobile) -->
    <nav class="md:hidden fixed bottom-0 left-0 w-full bg-dndSurface/95 backdrop-blur-md border-t border-dndBorder z-40 flex justify-around items-center pt-1.5 pb-safe px-1">
        <template x-for="item in menuItems.slice(0, 4)" :key="item.id">
            <a href="#" @click.prevent="switchView(item.id); isMobileDrawerOpen = false" 
               class="flex flex-col items-center justify-center flex-1 py-1.5 min-h-[54px] transition-colors"
               :class="activeMenu === item.id ? 'text-dndCobalt font-bold' : 'text-dndSubtle hover:text-dndInk'">
                <div x-html="item.icon" class="w-4 h-4 mb-1"></div>
                <span class="text-[10px] tracking-tight truncate w-full text-center px-0.5" x-text="t(item.short_label_key || item.label_key)"></span>
            </a>
        </template>
        <button type="button" @click="isMobileDrawerOpen = !isMobileDrawerOpen"
                class="flex flex-col items-center justify-center flex-1 py-1.5 min-h-[54px] transition-colors"
                :class="isMobileDrawerOpen ? 'text-dndCobalt font-bold' : 'text-dndSubtle hover:text-dndInk'">
            <svg class="w-4 h-4 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            <span class="text-[10px] tracking-tight truncate w-full text-center px-0.5" x-text="t('more_menu')"></span>
        </button>
    </nav>

    <!-- Mobile Full Navigation & Preferences Drawer -->
    <div x-show="isMobileDrawerOpen" style="display: none;" class="md:hidden fixed inset-0 z-50 flex flex-col justify-end">
        <div x-show="isMobileDrawerOpen" x-transition.opacity class="absolute inset-0 bg-black/50 backdrop-blur-sm" @click="isMobileDrawerOpen = false"></div>
        <div x-show="isMobileDrawerOpen"
             x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
             class="relative bg-dndSurface border-t border-dndBorder rounded-t-3xl p-5 pb-safe z-10 max-h-[84dvh] overflow-y-auto space-y-4">
            <div class="w-10 h-1 bg-dndBorder rounded-full mx-auto mb-1"></div>
            <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold uppercase tracking-widest text-dndSubtle" x-text="t('all_features')"></span>
                <button @click="isMobileDrawerOpen = false" class="p-1.5 rounded-lg bg-dndCanvas border border-dndBorder text-dndSubtle">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <template x-for="item in menuItems" :key="item.id + '_mob'">
                    <button type="button" @click="switchView(item.id); isMobileDrawerOpen = false"
                            class="flex items-center gap-2.5 p-3 rounded-xl border text-left transition-colors"
                            :class="activeMenu === item.id ? 'bg-dndInk text-dndCanvas border-dndInk font-bold' : 'bg-dndCanvas border-dndBorder text-dndInk font-medium'">
                        <div x-html="item.icon" class="w-4 h-4 flex-shrink-0"></div>
                        <span class="text-xs truncate" x-text="t(item.label_key)"></span>
                    </button>
                </template>
            </div>

            <!-- Language & Currency Controls on Mobile -->
            <div class="pt-3 border-t border-dndBorder grid grid-cols-2 gap-2">
                <button type="button" @click="toggleLanguage()" class="bg-dndCanvas border border-dndBorder rounded-xl py-2.5 px-3 flex items-center justify-center gap-2 text-xs font-semibold text-dndInk">
                    <span class="font-mono font-bold text-dndCobalt" x-text="lang"></span>
                    <span x-text="lang === 'ID' ? 'Bahasa Indonesia' : 'English (US)'"></span>
                </button>
                <div class="bg-dndCanvas border border-dndBorder rounded-xl px-3 flex items-center justify-between">
                    <span class="text-[11px] font-semibold text-dndSubtle" x-text="t('currency_label')"></span>
                    <select x-model="currency" @change="updateAllCharts()" class="bg-transparent text-xs font-bold text-dndInk outline-none py-2 cursor-pointer">
                        <option value="IDR">IDR</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                    </select>
                </div>
            </div>

            <!-- Google Account on Mobile Drawer -->
            <div class="pt-1">
                <template x-if="!isGoogleLoggedIn">
                    <button @click="isMobileDrawerOpen = false; triggerGoogleSignIn(true)" class="w-full bg-dndCanvas border border-dndBorder rounded-xl p-3 flex items-center justify-center gap-2.5 text-xs font-semibold text-dndInk">
                        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.58c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        <span x-text="t('sign_in_google')"></span>
                    </button>
                </template>
                <template x-if="isGoogleLoggedIn">
                    <div class="bg-dndCanvas rounded-xl p-3 flex items-center justify-between border border-dndBorder">
                        <div class="truncate" @click="isAccountModalOpen = true; isMobileDrawerOpen = false">
                            <p class="text-xs font-bold text-dndInk truncate" x-text="displayGreetingName"></p>
                            <p class="text-[10px] text-dndSubtle truncate" x-text="userEmail"></p>
                        </div>
                        <button @click="logoutGoogle(); isMobileDrawerOpen = false" class="text-xs font-semibold text-dndCrimson px-3 py-1.5 rounded-lg bg-dndCrimson/10" x-text="t('sign_out')"></button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col relative h-full overflow-y-auto pb-28 md:pb-10">
        
        <!-- Clean Minimalist Top Header -->
        <header class="pt-safe min-h-[62px] md:min-h-[72px] border-b border-dndBorder bg-dndSurface/95 backdrop-blur-md flex items-center justify-between px-4 sm:px-6 md:px-10 z-20 sticky top-0 gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="md:hidden brand-mark cursor-pointer flex-shrink-0" @click="switchView('dashboard')">
                    <svg class="w-11 h-6 dnd-logo-svg" viewBox="30 12 200 98" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M36 18 H64 V101 H82 V104 H36 V103 C47 102 52 97 52 88 V33 C52 24 47 19 36 18 Z"/>
                        <path d="M82 101 C102 101 111 85 109 63 L113 68 C115 90 104 104 82 104 Z"/>
                        <path d="M64 18 H84 C99 18 109 25 119 39 L154 86 C162 96 170 101 184 101 V104 H176 C162 104 152 97 142 83 L107 36 C99 25 91 20 78 20 H64 Z"/>
                        <path d="M139 25 C139 20 144 18 151 18 V73 L139 58 Z"/>
                        <path d="M156 18 H178 C209 18 225 37 225 61 C225 85 209 104 178 104 H175 V101 C199 101 210 84 210 61 C210 38 199 20 177 20 H156 Z"/>
                    </svg>
                </div>
                <div class="min-w-0">
                    <h2 class="text-sm sm:text-base md:text-lg font-bold text-dndInk tracking-tight truncate" x-text="t(activeMenu)"></h2>
                </div>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
                <!-- Google Auth Button / Active Profile Trigger -->
                <template x-if="!isGoogleLoggedIn">
                    <button @click="triggerGoogleSignIn(true)" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-dndBorder bg-dndCanvas hover:bg-dndMuted text-xs font-semibold text-dndInk btn-tactile" :title="t('sign_in_google')">
                        <svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.58c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        <span x-text="t('header_login_btn')"></span>
                    </button>
                </template>
                <template x-if="isGoogleLoggedIn">
                    <button @click="isAccountModalOpen = true" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border border-dndCobalt/30 bg-dndCobalt/10 text-xs font-semibold text-dndInk btn-tactile" :title="userEmail">
                        <img x-show="userPhoto" :src="userPhoto" alt="Google" class="w-4 h-4 rounded-full object-cover flex-shrink-0">
                        <span x-show="!userPhoto" class="w-4 h-4 rounded-full bg-dndCobalt text-white text-[10px] font-bold flex items-center justify-center flex-shrink-0" x-text="displayGreetingName.charAt(0).toUpperCase()"></span>
                        <span class="max-w-[110px] truncate" x-text="displayGreetingName"></span>
                    </button>
                </template>

                <!-- Theme Switcher -->
                <button @click="toggleTheme()" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border border-dndBorder bg-dndCanvas hover:bg-dndMuted text-xs font-semibold text-dndInk btn-tactile" :title="isDarkMode ? t('theme_black') : t('theme_light')">
                    <template x-if="!isDarkMode">
                        <svg class="w-3.5 h-3.5 text-dndOchre" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"></path></svg>
                    </template>
                    <template x-if="isDarkMode">
                        <svg class="w-3.5 h-3.5 text-dndCobalt" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
                    </template>
                    <span class="hidden sm:inline" x-text="isDarkMode ? t('theme_black') : t('theme_light')"></span>
                </button>

                <!-- Desktop Language & Currency -->
                <button @click="toggleLanguage()" class="hidden md:flex items-center justify-center w-8 h-8 rounded-xl bg-dndCanvas border border-dndBorder hover:bg-dndMuted text-xs font-bold text-dndInk uppercase btn-tactile">
                    <span x-text="lang"></span>
                </button>

                <select x-model="currency" @change="updateAllCharts()" class="hidden md:block bg-dndCanvas border border-dndBorder text-xs font-semibold rounded-xl px-2.5 py-1.5 text-dndInk outline-none cursor-pointer hover:bg-dndMuted">
                    <option value="IDR">IDR</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                </select>

                <!-- Export Report (Excel & PDF) -->
                <div class="relative" x-data="{ exportOpen: false }">
                    <button @click="exportOpen = !exportOpen" @click.outside="exportOpen = false" class="bg-dndCobalt hover:opacity-95 text-white font-semibold text-xs px-3 py-1.5 md:px-3.5 md:py-2 rounded-xl flex items-center gap-1.5 btn-tactile">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span class="hidden sm:inline" x-text="t('export_pro')"></span>
                    </button>
                    <div x-show="exportOpen" x-transition.opacity style="display: none;" class="absolute right-0 mt-2 w-52 bg-dndSurface border border-dndBorder rounded-xl shadow-lg overflow-hidden z-50">
                        <button @click="exportExcel(); exportOpen = false" class="w-full text-left px-4 py-2.5 text-xs font-medium text-dndInk hover:bg-dndCanvas flex items-center gap-2 border-b border-dndBorder">
                            <span class="w-2 h-2 rounded-full bg-dndJade"></span>
                            <span x-text="t('export_excel_menu')"></span>
                        </button>
                        <button @click="exportPDF(); exportOpen = false" class="w-full text-left px-4 py-2.5 text-xs font-medium text-dndInk hover:bg-dndCanvas flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-dndCrimson"></span>
                            <span x-text="t('export_pdf_menu')"></span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div class="p-4 sm:p-6 md:p-8 lg:p-10 max-w-7xl w-full mx-auto space-y-6">
            
            <!-- VIEW 1: DASHBOARD -->
            <div x-show="activeMenu === 'dashboard'" class="space-y-6">
                
                <!-- Dynamic Time-Based Greeting Header -->
                <div class="flex items-center justify-between gap-3 px-0.5">
                    <h2 class="text-xl sm:text-2xl md:text-3xl font-extrabold text-dndInk tracking-tight">
                        <span x-text="timeGreeting"></span><span x-show="displayGreetingName" x-text="', ' + displayGreetingName"></span>
                    </h2>
                    <button x-show="isGoogleLoggedIn" @click="isAccountModalOpen = true" class="px-3 py-1.5 rounded-xl border border-dndBorder bg-dndSurface hover:bg-dndMuted text-[11px] font-semibold text-dndSubtle hover:text-dndInk btn-tactile flex-shrink-0" x-text="t('edit_nickname_btn')"></button>
                </div>

                <!-- Minimalist Quick Action Grid -->
                <div class="grid grid-cols-2 sm:flex sm:flex-wrap items-center gap-2.5">
                    <button @click="openModal('expense')" class="bg-dndCobalt text-white px-3.5 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 btn-tactile">
                        <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                        <span class="truncate" x-text="t('quick_add')"></span>
                    </button>
                    <button @click="openSplitBillModal()" class="bg-dndSurface border border-dndBorder hover:bg-dndMuted text-dndInk px-3.5 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 btn-tactile">
                        <svg class="w-3.5 h-3.5 text-dndCobalt flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span class="truncate" x-text="t('split_bill_short')"></span>
                    </button>
                    <button @click="openModal('transfer')" class="bg-dndSurface border border-dndBorder hover:bg-dndMuted text-dndInk px-3.5 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 btn-tactile">
                        <svg class="w-3.5 h-3.5 text-dndOchre flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                        <span class="truncate" x-text="t('type_transfer')"></span>
                    </button>
                    <button @click="switchView('ai_analyst')" class="bg-dndSurface border border-dndBorder hover:bg-dndMuted text-dndInk px-3.5 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 btn-tactile">
                        <svg class="w-3.5 h-3.5 text-dndCobalt flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                        <span class="truncate" x-text="t('ai_analyst')"></span>
                    </button>
                </div>

                <!-- Primary KPI Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 md:gap-5">
                    <div class="dnd-card rounded-2xl p-5 flex flex-col justify-between">
                        <div>
                            <p class="text-dndSubtle text-[11px] font-semibold uppercase tracking-wider mb-1.5" x-text="t('balance')"></p>
                            <h3 class="text-xl sm:text-2xl font-bold text-dndInk num-tabular tracking-tight truncate" x-text="formatCurrency(calculateTotal('balance'))"></h3>
                        </div>
                        <div class="mt-4 flex items-center gap-2 text-[11px] text-dndSubtle font-medium">
                            <span class="px-1.5 py-0.5 rounded bg-dndMuted font-mono text-dndInk" x-text="transactions.length + ' ' + t('tx_unit')"></span>
                            <span x-text="t('kpi_balance_sub')"></span>
                        </div>
                    </div>
                    
                    <div class="dnd-card rounded-2xl p-5 flex flex-col justify-between">
                        <div>
                            <p class="text-dndSubtle text-[11px] font-semibold uppercase tracking-wider mb-1.5 flex justify-between items-center">
                                <span x-text="t('income')"></span>
                                <span class="text-dndCobalt text-xs">↗</span>
                            </p>
                            <h3 class="text-xl sm:text-2xl font-bold text-dndCobalt num-tabular tracking-tight truncate" x-text="formatCurrency(calculateTotal('income'))"></h3>
                        </div>
                        <p class="mt-4 text-[11px] text-dndSubtle" x-text="t('kpi_income_sub')"></p>
                    </div>

                    <div class="dnd-card rounded-2xl p-5 flex flex-col justify-between">
                        <div>
                            <p class="text-dndSubtle text-[11px] font-semibold uppercase tracking-wider mb-1.5 flex justify-between items-center">
                                <span x-text="t('expense')"></span>
                                <span class="text-dndCrimson text-xs">↘</span>
                            </p>
                            <h3 class="text-xl sm:text-2xl font-bold text-dndCrimson num-tabular tracking-tight truncate" x-text="formatCurrency(calculateTotal('expense'))"></h3>
                        </div>
                        <p class="mt-4 text-[11px] text-dndSubtle" x-text="t('kpi_expense_sub')"></p>
                    </div>

                    <div class="dnd-card rounded-2xl p-4 flex flex-col items-center justify-center relative">
                        <p class="text-dndSubtle text-[11px] font-semibold uppercase tracking-wider mb-[-6px] z-10" x-text="t('health_score')"></p>
                        <div id="gaugeChart" class="w-full h-28 chart-container !min-h-[110px]"></div>
                    </div>
                </div>

                <!-- Wallet / Bank / Cash Balances Strip -->
                <div class="dnd-card rounded-2xl p-5">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3.5">
                        <span class="text-xs font-bold uppercase tracking-wider text-dndSubtle" x-text="t('bank_dist_title')"></span>
                        <div class="flex items-center gap-2.5">
                            <button @click="openBankManager()" class="text-xs font-semibold text-dndInk bg-dndCanvas hover:bg-dndMuted border border-dndBorder px-3 py-1.5 rounded-xl btn-tactile" x-text="t('custom_bank_btn')"></button>
                            <button @click="openModal('transfer')" class="text-xs font-semibold text-dndCobalt bg-dndCobalt/10 hover:bg-dndCobalt/15 px-3 py-1.5 rounded-xl btn-tactile" x-text="t('transfer_funds_btn')"></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                        <template x-for="acc in accountBalances" :key="acc.name">
                            <div class="bg-dndCanvas rounded-xl p-3.5 border border-dndBorder">
                                <div class="flex items-center justify-between gap-1">
                                    <p class="text-[11px] font-semibold text-dndSubtle truncate" x-text="acc.name"></p>
                                    <span class="text-[9px] font-mono uppercase px-1.5 py-0.5 rounded bg-dndSurface border border-dndBorder text-dndSubtle" x-text="getWalletTypeLabel(acc.name)"></span>
                                </div>
                                <p class="text-sm font-bold num-tabular mt-1.5 truncate" :class="acc.balance < 0 ? 'text-dndCrimson' : 'text-dndInk'" x-text="formatCurrency(acc.balance)"></p>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Analytical Charts -->
                <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">
                    <div class="xl:col-span-7 dnd-card rounded-2xl p-5 md:p-6 flex flex-col">
                        <div class="flex justify-between items-start gap-2 mb-4">
                            <div>
                                <h3 class="text-sm md:text-base font-bold text-dndInk" x-text="t('rev_vs_exp')"></h3>
                                <p class="text-xs text-dndSubtle mt-0.5" x-text="t('rev_vs_exp_sub')"></p>
                            </div>
                            <span class="text-[10px] font-mono font-semibold text-dndSubtle uppercase bg-dndCanvas border border-dndBorder px-2.5 py-1 rounded-lg" x-text="t('live_badge')"></span>
                        </div>
                        <div class="relative flex-1 min-h-[260px]">
                            <div id="comboChart" class="chart-container min-h-[260px]"></div>
                            <div x-show="transactions.length === 0" class="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <span class="px-3.5 py-1.5 rounded-full bg-dndCanvas/95 border border-dndBorder text-xs font-semibold text-dndSubtle" x-text="t('chart_empty_hint')"></span>
                            </div>
                        </div>
                    </div>

                    <div class="xl:col-span-5 dnd-card rounded-2xl p-5 md:p-6 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-2">
                                <div>
                                    <h3 class="text-sm md:text-base font-bold text-dndInk" x-text="t('cash_flow')"></h3>
                                    <p class="text-xs text-dndSubtle mt-0.5" x-text="t('cash_flow_sub')"></p>
                                </div>
                            </div>
                            <div id="allocationDonutChart" class="chart-container !min-h-[210px] h-[210px]"></div>
                        </div>

                        <div class="space-y-2.5 pt-3 border-t border-dndBorder">
                            <template x-for="item in cashAllocationSummary" :key="item.key">
                                <div class="space-y-1">
                                    <div class="flex items-center justify-between text-xs">
                                        <span class="flex items-center gap-2 font-semibold text-dndInk">
                                            <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" :style="'background-color:' + item.color"></span>
                                            <span x-text="item.label"></span>
                                        </span>
                                        <div class="flex items-center gap-2 num-tabular">
                                            <span class="font-bold text-dndInk" x-text="formatCurrency(item.amount)"></span>
                                            <span class="text-[11px] font-mono text-dndSubtle w-10 text-right" x-text="item.pct + '%'"></span>
                                        </div>
                                    </div>
                                    <div class="w-full h-1.5 rounded-full bg-dndMuted overflow-hidden">
                                        <div class="h-full rounded-full" :style="'width:' + item.pct + '%; background-color:' + item.color"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- VIEW 2: GENERAL LEDGER -->
            <div x-show="activeMenu === 'transactions'" style="display: none;" class="dnd-card rounded-2xl p-5 md:p-6 space-y-5">
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                    <div>
                        <h3 class="text-base md:text-lg font-bold text-dndInk" x-text="t('records_title')"></h3>
                        <p class="text-xs text-dndSubtle mt-0.5" x-text="t('records_sub')"></p>
                    </div>
                    <div class="flex items-center gap-2 w-full lg:w-auto">
                        <div class="relative flex-1 lg:w-64">
                            <input type="text" x-model="searchQuery" :placeholder="t('search')" class="w-full bg-dndCanvas border border-dndBorder rounded-xl pl-9 pr-4 py-2 text-xs md:text-sm text-dndInk focus:border-dndCobalt outline-none">
                            <svg class="w-4 h-4 text-dndSubtle absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <button @click="openModal()" class="bg-dndCobalt text-white px-4 py-2 rounded-xl text-xs font-semibold btn-tactile whitespace-nowrap" x-text="t('new_entry_btn')"></button>
                    </div>
                </div>

                <!-- Filter Chips -->
                <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                    <button @click="txFilterType = 'all'" class="px-3 py-1.5 rounded-lg text-xs font-semibold" :class="txFilterType === 'all' ? 'bg-dndInk text-dndCanvas' : 'bg-dndCanvas border border-dndBorder text-dndSubtle hover:text-dndInk'" x-text="t('filter_all')"></button>
                    <button @click="txFilterType = 'income'" class="px-3 py-1.5 rounded-lg text-xs font-semibold" :class="txFilterType === 'income' ? 'bg-dndCobalt text-white' : 'bg-dndCanvas border border-dndBorder text-dndSubtle hover:text-dndInk'" x-text="t('type_income')"></button>
                    <button @click="txFilterType = 'expense'" class="px-3 py-1.5 rounded-lg text-xs font-semibold" :class="txFilterType === 'expense' ? 'bg-dndCrimson text-white' : 'bg-dndCanvas border border-dndBorder text-dndSubtle hover:text-dndInk'" x-text="t('type_expense')"></button>
                    <button @click="txFilterType = 'transfer'" class="px-3 py-1.5 rounded-lg text-xs font-semibold" :class="txFilterType === 'transfer' ? 'bg-sky-600 text-white' : 'bg-dndCanvas border border-dndBorder text-dndSubtle hover:text-dndInk'" x-text="t('type_transfer')"></button>
                    <button @click="txFilterType = 'withdrawal'" class="px-3 py-1.5 rounded-lg text-xs font-semibold" :class="txFilterType === 'withdrawal' ? 'bg-dndOchre text-white' : 'bg-dndCanvas border border-dndBorder text-dndSubtle hover:text-dndInk'" x-text="t('type_withdrawal')"></button>
                </div>

                <div class="overflow-x-auto rounded-xl border border-dndBorder">
                    <table class="w-full text-left border-collapse min-w-[660px]">
                        <thead class="bg-dndCanvas border-b border-dndBorder">
                            <tr class="text-[11px] uppercase text-dndSubtle tracking-wider font-semibold">
                                <th class="p-3.5" x-text="t('col_date')"></th>
                                <th class="p-3.5" x-text="t('col_cat_note')"></th>
                                <th class="p-3.5" x-text="t('col_account')"></th>
                                <th class="p-3.5 text-right" x-text="t('col_amount')"></th>
                                <th class="p-3.5 text-center" x-text="t('col_action')"></th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-dndBorder">
                            <template x-if="filteredTransactions.length === 0">
                                <tr><td colspan="5" class="p-10 text-center text-dndSubtle text-sm" x-text="t('empty_records')"></td></tr>
                            </template>
                            <template x-for="tx in filteredTransactions" :key="tx.id">
                                <tr class="hover:bg-dndCanvas/70">
                                    <td class="p-3.5 text-xs font-mono text-dndSubtle whitespace-nowrap" x-text="tx.date"></td>
                                    <td class="p-3.5">
                                        <div class="flex items-center gap-2 flex-wrap">
                                            <span class="px-2 py-0.5 rounded-md text-[10px] font-bold tracking-wide uppercase"
                                                  :class="{
                                                      'bg-dndCobalt/10 text-dndCobalt': tx.type === 'income',
                                                      'bg-dndCrimson/10 text-dndCrimson': tx.type === 'expense',
                                                      'bg-dndOchre/10 text-dndOchre': tx.type === 'withdrawal' || tx.type === 'transfer'
                                                  }"
                                                  x-text="tx.type === 'withdrawal' ? (t('type_withdrawal') + ' • ' + formatCategoryLabel(tx.category)) : (tx.type === 'transfer' ? t('type_transfer') : formatCategoryLabel(tx.category))"></span>
                                        </div>
                                        <p x-show="tx.note" class="text-xs text-dndSubtle mt-1 line-clamp-1" x-text="tx.note"></p>
                                    </td>
                                    <td class="p-3.5 text-xs text-dndInk font-medium">
                                        <template x-if="tx.type === 'transfer'">
                                            <span class="inline-flex items-center gap-1.5 font-semibold text-dndOchre">
                                                <span x-text="tx.account"></span>
                                                <span>→</span>
                                                <span x-text="tx.toAccount || t('dest_account_fallback')"></span>
                                            </span>
                                        </template>
                                        <template x-if="tx.type !== 'transfer'">
                                            <span x-text="tx.account"></span>
                                        </template>
                                    </td>
                                    <td class="p-3.5 text-right num-tabular font-bold text-sm"
                                        :class="{
                                            'text-dndCobalt': tx.type === 'income',
                                            'text-dndCrimson': tx.type === 'expense',
                                            'text-dndOchre': tx.type === 'withdrawal' || tx.type === 'transfer'
                                        }">
                                        <span x-text="tx.type === 'income' ? '+' : (tx.type === 'transfer' ? '⇄ ' : '-')"></span>
                                        <span x-text="formatCurrency(tx.amount)"></span>
