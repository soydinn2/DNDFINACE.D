                t(key) {
                    return (this.translations[this.lang] && this.translations[this.lang][key]) || key;
                },

                getApiHeaders(includeJson = false) {
                    const headers = {};
                    if (includeJson) headers['Content-Type'] = 'application/json';
                    if (this.isGoogleLoggedIn && this.userEmail) {
                        headers['X-User-Email'] = this.userEmail;
                    }
                    return headers;
                },

                get timeGreeting() {
                    const hr = new Date().getHours();
                    if (this.lang === 'ID') {
                        if (hr >= 4 && hr < 11) return 'Selamat pagi';
                        if (hr >= 11 && hr < 15) return 'Selamat siang';
                        if (hr >= 15 && hr < 18) return 'Selamat sore';
                        return 'Selamat malam';
                    }
                    if (hr >= 5 && hr < 12) return 'Good morning';
                    if (hr >= 12 && hr < 17) return 'Good afternoon';
                    if (hr >= 17 && hr < 21) return 'Good evening';
                    return 'Good night';
                },

                get displayGreetingName() {
                    if (!this.isGoogleLoggedIn) return '';
                    const nick = (this.customNickname || '').trim();
                    if (nick) return nick;
                    return (this.userName || '').trim();
                },

                get quickAmountPresets() {
                    if (this.currency === 'IDR') {
                        return this.lang === 'ID'
                            ? [
                                { label: '+25rb', val: 25000 },
                                { label: '+50rb', val: 50000 },
                                { label: '+100rb', val: 100000 },
                                { label: '+500rb', val: 500000 },
                                { label: '+1jt', val: 1000000 }
                              ]
                            : [
                                { label: '+25k', val: 25000 },
                                { label: '+50k', val: 50000 },
                                { label: '+100k', val: 100000 },
                                { label: '+500k', val: 500000 },
                                { label: '+1M', val: 1000000 }
                              ];
                    }
                    return [
                        { label: '+10', val: 10 },
                        { label: '+25', val: 25 },
                        { label: '+50', val: 50 },
                        { label: '+100', val: 100 },
                        { label: '+500', val: 500 }
                    ];
                },

                get activeCategoryOptions() {
                    const base = this.txForm.type === 'income'
                        ? ['Salary', 'Trading', 'Investment', 'Bonus', 'Freelance']
                        : ['Food', 'Transport', 'Utilities', 'Online Shopping', 'Health & Lifestyle', 'Shopping', 'Investment'];
                    const merged = [...base, ...(this.customCategories || [])];
                    return [...new Set(merged)].filter(c => !['otomotif', 'automotive'].includes(String(c).toLowerCase()));
                },

                formatCategoryLabel(cat) {
                    if (!cat) return '';
                    const mapId = {
                        'Food': 'Makanan & Minuman',
                        'Transport': 'Transportasi',
                        'Utilities': 'Tagihan & Utilitas',
                        'Online Shopping': 'Belanja Online',
                        'Health & Lifestyle': 'Kesehatan & Gaya Hidup',
                        'Shopping': 'Belanja',
                        'Investment': 'Investasi',
                        'Salary': 'Gaji',
                        'Trading': 'Trading',
                        'Bonus': 'Bonus',
                        'Freelance': 'Freelance'
                    };
                    if (this.lang === 'ID' && mapId[cat]) return mapId[cat];
                    return cat;
                },

                get accountBalances() {
                    const map = {};
                    this.availableAccounts.forEach(a => { map[a] = 0; });
                    this.transactions.forEach(tx => {
                        const amt = Number(tx.amount) || 0;
                        const fee = Number(tx.adminFee) || 0;
                        const src = tx.account || this.availableAccounts[0];
                        if (map[src] === undefined) map[src] = 0;
                        if (tx.type === 'income') {
                            map[src] += amt;
                        } else if (tx.type === 'expense' || tx.type === 'withdrawal') {
                            map[src] -= amt;
                        } else if (tx.type === 'transfer') {
                            const dst = tx.toAccount || '';
                            map[src] -= (amt + fee);
                            if (dst) {
                                if (map[dst] === undefined) map[dst] = 0;
                                map[dst] += amt;
                            }
                        }
                    });
                    return Object.keys(map).map(name => ({ name, balance: map[name] }));
                },

                getWalletBalance(name) {
                    const found = this.accountBalances.find(a => a.name === name);
                    return found ? found.balance : 0;
                },

                getWalletTypeLabel(name) {
                    const low = String(name || '').toLowerCase();
                    if (low.includes('cash') || low.includes('tunai')) return 'Cash';
                    if (low.includes('gopay') || low.includes('ovo') || low.includes('dana') || low.includes('shopeepay')) return 'E-Wallet';
                    return 'Bank';
                },

                get formattedTxDateDisplay() {
                    const todayStr = new Date().toISOString().split('T')[0];
                    const yest = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                    const d = this.txForm.date || todayStr;
                    const tm = this.txForm.time || '00:00';
                    if (d === todayStr) return `${this.t('today_label')} · ${tm}`;
                    if (d === yest) return `${this.t('yesterday_label')} · ${tm}`;
                    return `${d} · ${tm}`;
                },

                get filteredTransactions() {
                    const q = (this.searchQuery || '').toLowerCase().trim();
                    return this.transactions.filter(tx => {
                        if (this.txFilterType !== 'all' && tx.type !== this.txFilterType) return false;
                        if (!q) return true;
                        const hay = `${tx.category || ''} ${tx.note || ''} ${tx.account || ''} ${tx.toAccount || ''} ${tx.date || ''}`.toLowerCase();
                        return hay.includes(q);
                    });
                },

                get cashAllocationSummary() {
                    const inc = this.calculateTotal('income');
                    const exp = this.calculateTotal('expense');
                    const wd = this.calculateTotal('withdrawal');
                    const sav = Math.max(0, inc - exp - wd);
                    const base = inc > 0 ? inc : Math.max(1, sav + exp + wd);
                    const total = sav + exp + wd;
                    if (total === 0) {
                        return [
                            { key: 'sav', label: this.t('saving_legend'), amount: 0, pct: 0, color: '#047857' },
                            { key: 'exp', label: this.t('type_expense'), amount: 0, pct: 0, color: '#BE123C' },
                            { key: 'wd', label: this.t('type_withdrawal'), amount: 0, pct: 0, color: '#B45309' }
                        ];
                    }
                    return [
                        { key: 'sav', label: this.t('saving_legend'), amount: sav, pct: Math.min(100, Math.round((sav / base) * 100)), color: '#047857' },
                        { key: 'exp', label: this.t('type_expense'), amount: exp, pct: Math.min(100, Math.round((exp / base) * 100)), color: '#BE123C' },
                        { key: 'wd', label: this.t('type_withdrawal'), amount: wd, pct: Math.min(100, Math.round((wd / base) * 100)), color: '#B45309' }
                    ];
                },

                get splitCalculated() {
                    const sub = Math.max(0, Number(this.splitForm.totalAmount) || 0);
                    const tax = Math.max(0, Number(this.splitForm.taxPercent) || 0);
                    const ppl = Math.max(1, Number(this.splitForm.people) || 1);
                    const grandTotal = sub + (sub * (tax / 100));
                    const perPerson = grandTotal / ppl;
                    return { grandTotal, perPerson };
                },

                showToast(msg) {
                    this.toastMsg = msg;
                    clearTimeout(this._toastTimer);
                    this._toastTimer = setTimeout(() => { this.toastMsg = ''; }, 3200);
                },

                async initApp() {
                    try {
                        const savedTheme = localStorage.getItem('dnd_theme');
                        if (savedTheme === 'black') this.isDarkMode = true;
                        const savedLang = localStorage.getItem('dnd_lang');
                        if (savedLang === 'EN' || savedLang === 'ID') this.lang = savedLang;

                        const savedGoogleUser = localStorage.getItem('dnd_google_user');
                        if (savedGoogleUser) {
                            const u = JSON.parse(savedGoogleUser);
                            if (u && u.email) {
                                this.isGoogleLoggedIn = true;
                                this.userName = u.name || u.email.split('@')[0];
                                this.customNickname = u.nickname || localStorage.getItem(`dnd_nickname_${u.sub || u.email}`) || '';
                                this.nicknameDraft = this.customNickname;
                                this.userEmail = u.email;
                                this.userPhoto = u.picture || '';
                                this.userId = u.sub || u.email;
                            }
                        }
                    } catch (e) {}

                    const splashStart = Date.now();
                    let splashDone = false;
                    const finishSplash = () => {
                        if (splashDone) return;
                        splashDone = true;
                        const elapsed = Date.now() - splashStart;
                        const minDuration = 300;
                        setTimeout(() => {
                            this.isDbLoading = false;
                            requestAnimationFrame(() => this.updateAllCharts());
                        }, Math.max(0, minDuration - elapsed));
                    };
                    setTimeout(() => finishSplash(), 900);

                    this.loadSavedBanksLocal();

                    window.addEventListener('resize', () => {
                        if (typeof echarts === 'undefined') return;
                        requestAnimationFrame(() => {
                            ['allocationDonutChart', 'gaugeChart', 'comboChart'].forEach(id => {
                                const el = document.getElementById(id);
                                const inst = el ? echarts.getInstanceByDom(el) : null;
                                if (inst) inst.resize();
                            });
                            this.goals.forEach(g => {
                                const el = document.getElementById('goalChart_' + g.id);
                                const inst = el ? echarts.getInstanceByDom(el) : null;
                                if (inst) inst.resize();
                            });
                        });
                    });

                    try {
                        const ctrl = new AbortController();
                        const timer = setTimeout(() => ctrl.abort(), 1500);
                        const healthRes = await fetch(`${this.apiBaseUrl}/api/health`, { signal: ctrl.signal });
                        clearTimeout(timer);
                        if (healthRes.ok) {
                            this.isBackendApiOnline = true;
                        }
                    } catch (e) {
                        this.isBackendApiOnline = false;
                    }

                    this.initGoogleIdentityFedCM();
                    await this.handleOAuthRedirectCallback();

                    if (this.isBackendApiOnline) {
                        await this.loadGoogleOAuthConfig();
                        if (!this.isGoogleLoggedIn) {
                            await this.autoDetectServerGoogleSession();
                        }
                        if (this.isGoogleLoggedIn && this.userEmail) {
                            await this.pullStateFromServer(this.userEmail);
                        } else {
                            await this.loadFastApiData();
                        }
                    } else {
                        this.loadLocalStateOrSeed();
                    }

                    this.initGoogleIdentityFedCM();
                    finishSplash();
                },

                async loadGoogleOAuthConfig() {
                    try {
                        const res = await fetch(`${this.apiBaseUrl}/api/auth/google/config`);
                        if (res.ok) {
                            const cfg = await res.json();
                            if (cfg.client_id && cfg.client_id.trim()) {
                                this.googleClientId = cfg.client_id.trim();
                            }
                            this.googleHasClientSecret = Boolean(cfg.has_client_secret);
                        }
                    } catch (e) {}
                },

                initGoogleIdentityFedCM() {
                    if (!this.googleClientId) return;
                    const tryInit = () => {
                        if (window.google && window.google.accounts && window.google.accounts.id && !this.gisInitialized) {
                            this.gisInitialized = true;
                            window.google.accounts.id.initialize({
                                client_id: this.googleClientId,
                                callback: async (response) => {
                                    if (response && response.credential) {
                                        await this.verifyGoogleTokenWithBackend({ id_token: response.credential });
                                    }
                                },
                                auto_select: true,
                                use_fedcm_for_prompt: true,
                                cancel_on_tap_outside: true
                            });

                            const sidebarEl = document.getElementById('g_id_signin_sidebar');
                            if (sidebarEl && !this.isGoogleLoggedIn) {
                                window.google.accounts.id.renderButton(sidebarEl, {
                                    theme: this.isDarkMode ? 'filled_black' : 'outline',
                                    size: 'large',
                                    width: 205,
                                    shape: 'pill'
                                });
                            }

                            if (!this.isGoogleLoggedIn && sessionStorage.getItem('dnd_google_logged_out') !== '1') {
                                window.google.accounts.id.prompt();
                            }
                            return true;
                        }
                        return false;
                    };

                    if (!tryInit()) {
                        let attempts = 0;
                        const poll = setInterval(() => {
                            attempts += 1;
                            if (tryInit() || attempts > 20) {
                                clearInterval(poll);
                            }
                        }, 250);
                    }
                },

                async triggerGoogleSignIn(forceAccountPicker = true) {
                    sessionStorage.removeItem('dnd_google_logged_out');
                    if (this.isBackendApiOnline && !this.googleClientId) {
                        await this.loadGoogleOAuthConfig();
                    }

                    if (this.googleClientId) {
                        if (window.google && window.google.accounts && window.google.accounts.id) {
                            this.initGoogleIdentityFedCM();
                            window.google.accounts.id.prompt((notification) => {
                                if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                                    this.redirectToGoogleOAuth(forceAccountPicker);
                                }
                            });
                            return;
                        }
                        this.redirectToGoogleOAuth(forceAccountPicker);
                        return;
                    }

                    if (this.isBackendApiOnline) {
                        window.location.href = `${this.apiBaseUrl}/api/auth/google/login`;
                    }
                },

                redirectToGoogleOAuth(forceAccountPicker = true) {
                    if (!this.googleClientId) return;
                    if (this.isBackendApiOnline && this.googleHasClientSecret) {
                        window.location.href = `${this.apiBaseUrl}/api/auth/google/login`;
                        return;
                    }
                    const state = Math.random().toString(36).substring(2) + Date.now().toString(36);
                    sessionStorage.setItem('dnd_google_oauth_state', state);
                    const redirectUri = `${window.location.origin}${window.location.pathname}`;
                    const params = new URLSearchParams({
                        client_id: this.googleClientId,
                        redirect_uri: redirectUri,
                        response_type: 'token',
                        scope: 'openid email profile',
                        include_granted_scopes: 'true',
                        state,
                        prompt: forceAccountPicker ? 'select_account' : 'consent select_account'
                    });
                    window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?${params.toString()}`;
                },

                async handleOAuthRedirectCallback() {
                    const hashStr = window.location.hash ? window.location.hash.substring(1) : '';
                    if (hashStr) {
                        const hashParams = new URLSearchParams(hashStr);
                        const accessToken = hashParams.get('access_token');
                        const idToken = hashParams.get('id_token');
                        if (accessToken || idToken) {
                            window.history.replaceState({}, document.title, window.location.pathname + window.location.search);
                            await this.verifyGoogleTokenWithBackend({ access_token: accessToken, id_token: idToken });
                            return;
                        }
                    }

                    const queryParams = new URLSearchParams(window.location.search);
                    const authErr = queryParams.get('google_auth_error');
                    if (authErr) {
                        queryParams.delete('google_auth_error');
                        const cleanSearch = queryParams.toString();
                        window.history.replaceState({}, document.title, window.location.pathname + (cleanSearch ? '?' + cleanSearch : ''));
                        this.showToast(
                            this.lang === 'ID'
                                ? `Gagal autentikasi Google: ${authErr}`
                                : `Google authentication failed: ${authErr}`
                        );
                        return;
                    }
                    if (queryParams.get('google_auth_success') === '1') {
                        queryParams.delete('google_auth_success');
                        const cleanSearch = queryParams.toString();
                        window.history.replaceState({}, document.title, window.location.pathname + (cleanSearch ? '?' + cleanSearch : ''));
                        await this.autoDetectServerGoogleSession();
                    }
                },

                async verifyGoogleTokenWithBackend(tokenPayload) {
                    if (this.isBackendApiOnline) {
                        try {
                            const res = await fetch(`${this.apiBaseUrl}/api/auth/google/verify-token`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                credentials: 'include',
                                body: JSON.stringify(tokenPayload)
                            });
                            if (res.ok) {
                                const data = await res.json();
                                if (data && data.user && data.user.email) {
                                    await this.applyGoogleUserProfile(data.user);
                                    this.showToast(
                                        this.lang === 'ID'
                                            ? `Masuk sebagai ${data.user.email}`
                                            : `Signed in as ${data.user.email}`
                                    );
                                    return;
                                }
                            }
                        } catch (e) {}
                    }

                    if (tokenPayload.id_token) {
                        try {
                            const parts = tokenPayload.id_token.split('.');
                            if (parts.length >= 2) {
                                const payloadJson = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
                                if (payloadJson && payloadJson.email) {
                                    await this.applyGoogleUserProfile({
                                        sub: payloadJson.sub || payloadJson.email,
                                        email: payloadJson.email,
                                        name: payloadJson.name || payloadJson.email.split('@')[0],
                                        picture: payloadJson.picture || ''
                                    });
                                    this.showToast(
                                        this.lang === 'ID'
                                            ? `Masuk sebagai ${payloadJson.email}`
                                            : `Signed in as ${payloadJson.email}`
                                    );
                                    return;
                                }
                            }
                        } catch (e) {}
                    }

                    if (tokenPayload.access_token) {
                        try {
                            const uRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                                headers: { Authorization: `Bearer ${tokenPayload.access_token}` }
                            });
                            if (uRes.ok) {
                                const info = await uRes.json();
                                if (info && info.email) {
                                    await this.applyGoogleUserProfile({
                                        sub: info.sub || info.email,
                                        email: info.email,
                                        name: info.name || info.email.split('@')[0],
                                        picture: info.picture || ''
                                    });
                                    this.showToast(
                                        this.lang === 'ID'
                                            ? `Masuk sebagai ${info.email}`
                                            : `Signed in as ${info.email}`
                                    );
                                }
                            }
                        } catch (e) {}
                    }
                },

                copyTextSafe(text) {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    try {
                        document.execCommand('copy');
                    } catch (e) {}
                    document.body.removeChild(ta);
                },

                async autoDetectServerGoogleSession() {
                    try {
                        const res = await fetch(`${this.apiBaseUrl}/api/auth/google/me`, { credentials: 'include' });
                        if (res.ok) {
                            const data = await res.json();
                            if (data && data.authenticated && data.user && data.user.email) {
                                await this.applyGoogleUserProfile(data.user);
                                return true;
                            }
                        }
                    } catch (e) {}
                    return false;
                },

                async applyGoogleUserProfile(profile) {
                    const sub = profile.sub || profile.email;
                    const email = profile.email;
                    const name = profile.name || email.split('@')[0];
                    const savedNick = profile.nickname || localStorage.getItem(`dnd_nickname_${sub}`) || '';
                    this.isGoogleLoggedIn = true;
                    this.userId = sub;
                    this.userEmail = email;
                    this.userName = name;
                    this.customNickname = savedNick;
                    this.nicknameDraft = savedNick;
                    this.userPhoto = profile.picture || '';

                    localStorage.setItem('dnd_google_user', JSON.stringify({
                        sub,
                        email,
                        name,
                        nickname: savedNick,
                        picture: this.userPhoto
                    }));

                    await this.pullStateFromServer(email);
                },

                async saveGoogleNickname() {
                    const nick = (this.nicknameDraft || '').trim();
                    this.customNickname = nick;
                    if (this.userId) {
                        localStorage.setItem(`dnd_nickname_${this.userId}`, nick);
                    }
                    const savedRaw = localStorage.getItem('dnd_google_user');
                    if (savedRaw) {
                        try {
                            const obj = JSON.parse(savedRaw);
                            obj.nickname = nick;
                            localStorage.setItem('dnd_google_user', JSON.stringify(obj));
                        } catch (e) {}
                    }
                    if (this.isBackendApiOnline && this.userEmail) {
                        try {
                            await fetch(`${this.apiBaseUrl}/api/auth/google/nickname`, {
                                method: 'POST',
                                headers: this.getApiHeaders(true),
                                credentials: 'include',
                                body: JSON.stringify({ email: this.userEmail, nickname: nick })
                            });
                        } catch (e) {}
                    }
                    this.isAccountModalOpen = false;
                    this.showToast(this.lang === 'ID' ? 'Nama panggilan diperbarui' : 'Nickname updated');
                },

                async logoutGoogle() {
                    sessionStorage.setItem('dnd_google_logged_out', '1');
                    if (window.google && window.google.accounts && window.google.accounts.id) {
                        try {
                            window.google.accounts.id.disableAutoSelect();
                        } catch (e) {}
                    }
                    if (this.isBackendApiOnline) {
                        try {
                            await fetch(`${this.apiBaseUrl}/api/auth/google/logout`, {
                                method: 'POST',
                                credentials: 'include'
                            });
                        } catch (e) {}
                    }
                    this.isGoogleLoggedIn = false;
                    this.userId = 'guest';
                    this.userName = 'Guest';
                    this.customNickname = '';
                    this.nicknameDraft = '';
                    this.userEmail = '';
                    this.userPhoto = '';
                    this.transactions = [];
                    this.goals = [];
                    this.budgets = [];
                    this.macros = [];
                    localStorage.removeItem('dnd_google_user');
                    this.updateAllCharts();
                    this.showToast(this.lang === 'ID' ? 'Keluar dari akun Google' : 'Signed out of Google account');
                },

                getUserStorageKey() {
                    return this.isGoogleLoggedIn && this.userEmail
                        ? `dnd_workspace_state_${this.userEmail.toLowerCase()}`
                        : 'dnd_workspace_state_guest';
                },

                async pullStateFromServer(email) {
                    if (!email) return;
                    if (this.isBackendApiOnline) {
                        try {
                            const res = await fetch(`${this.apiBaseUrl}/api/sync/pull?email=${encodeURIComponent(email)}`, {
                                headers: this.getApiHeaders(false),
                                credentials: 'include'
                            });
                            if (res.ok) {
                                const data = await res.json();
                                if (data.status === 'ok' && data.state) {
                                    const st = data.state;
                                    this.transactions = Array.isArray(st.transactions) ? st.transactions : [];
                                    this.goals = Array.isArray(st.goals) ? st.goals : [];
                                    this.budgets = Array.isArray(st.budgets) ? st.budgets : [];
                                    this.macros = Array.isArray(st.macros) ? st.macros : [];
                                    if (Array.isArray(st.availableAccounts) && st.availableAccounts.length) {
                                        this.availableAccounts = st.availableAccounts;
                                    }
                                    this.saveLocalState();
                                    this.updateAllCharts();
                                    return;
                                }
                            }
                        } catch (e) {}
                    }
                    this.loadLocalStateOrSeed();
                    this.updateAllCharts();
                },

                async syncStateToServer() {
                    this.saveLocalState();
                    if (!this.isBackendApiOnline || !this.isGoogleLoggedIn || !this.userEmail) return;
                    try {
                        await fetch(`${this.apiBaseUrl}/api/sync/push`, {
                            method: 'POST',
                            headers: this.getApiHeaders(true),
                            credentials: 'include',
                            body: JSON.stringify({
                                email: this.userEmail,
                                state: {
                                    transactions: this.transactions,
                                    goals: this.goals,
                                    budgets: this.budgets,
                                    macros: this.macros,
                                    availableAccounts: this.availableAccounts
                                }
                            })
                        });
                    } catch (e) {}
                },

                async loadFastApiData() {
                    try {
                        const opts = { headers: this.getApiHeaders(false), credentials: 'include' };
                        const [txRes, bankRes, catRes, macroRes] = await Promise.all([
                            fetch(`${this.apiBaseUrl}/api/transactions`, opts),
                            fetch(`${this.apiBaseUrl}/api/banks`, opts),
                            fetch(`${this.apiBaseUrl}/api/categories`, opts),
                            fetch(`${this.apiBaseUrl}/api/macros`, opts)
                        ]);
                        if (bankRes.ok) {
                            const bData = await bankRes.json();
                            if (Array.isArray(bData.banks) && bData.banks.length > 0) {
                                this.availableAccounts = bData.banks.filter(b => b !== 'Corporate Bank');
                            }
                        }
                        if (catRes.ok) {
                            const cData = await catRes.json();
                            if (Array.isArray(cData.categories)) {
                                this.customCategories = cData.categories.filter(c => !['otomotif', 'automotive'].includes(c.toLowerCase()));
                            }
                        }
                        if (txRes.ok) {
                            const tData = await txRes.json();
                            if (Array.isArray(tData.transactions)) {
                                this.transactions = tData.transactions.map(r => ({
                                    id: r.id,
                                    amount: Number(r.amount) || 0,
                                    type: r.type || 'expense',
                                    category: ['otomotif', 'automotive'].includes(String(r.category || '').toLowerCase()) ? 'Transport' : (r.category || 'Food'),
                                    account: r.account || this.availableAccounts[0],
                                    toAccount: r.to_account || r.toAccount || '',
                                    adminFee: Number(r.admin_fee || r.adminFee || 0),
                                    note: r.note || '',
                                    currency: r.currency || 'IDR',
                                    date: r.date || new Date().toISOString().slice(0, 16).replace('T', ' ')
                                }));
                            }
                        }
                        if (macroRes.ok) {
                            const mData = await macroRes.json();
                            if (Array.isArray(mData.macros)) {
                                this.macros = mData.macros;
                            }
                        }
                        this.loadLocalCollectionsOnly();
                    } catch (e) {
                        this.loadLocalStateOrSeed();
                    }
                },

                loadSavedBanksLocal() {
                    try {
                        const savedBanks = localStorage.getItem('dnd_banks');
                        if (savedBanks) {
                            const arr = JSON.parse(savedBanks);
                            if (Array.isArray(arr) && arr.length > 0) {
                                this.availableAccounts = arr.filter(b => b !== 'Corporate Bank');
                            }
                        }
                        const savedCats = localStorage.getItem('dnd_custom_categories');
                        if (savedCats) {
                            const arr = JSON.parse(savedCats);
                            if (Array.isArray(arr)) {
                                this.customCategories = arr.filter(c => !['otomotif', 'automotive'].includes(String(c).toLowerCase()));
                            }
                        }
                    } catch (e) {}
                },

                loadLocalCollectionsOnly() {
                    try {
                        const raw = localStorage.getItem(this.getUserStorageKey());
                        if (!raw) return;
                        const st = JSON.parse(raw);
                        if (Array.isArray(st.goals)) this.goals = st.goals;
                        if (Array.isArray(st.budgets)) this.budgets = st.budgets;
                        if (this.macros.length === 0 && Array.isArray(st.macros)) this.macros = st.macros;
                    } catch (e) {}
                },

                loadLocalStateOrSeed() {
                    try {
                        const raw = localStorage.getItem(this.getUserStorageKey());
                        if (raw) {
                            const st = JSON.parse(raw);
                            this.transactions = Array.isArray(st.transactions) ? st.transactions : [];

                            this.budgets = [];
                            this.macros = [];
                        }
                    } catch (e) {}

                saveLocalState() {
                    try {

                        localStorage.setItem('dnd_custom_categories', JSON.stringify(this.customCategories));
                        localStorage.setItem(this.getUserStorageKey(), JSON.stringify({
                            transactions: this.transactions,
                            goals: this.goals,
                            budgets: this.budgets,
                            macros: this.macros
                        }));

                    this.activeMenu = id;

                    }

                toggleTheme() {

                calculateTotal(metric) {
                    let inc = 0;
                    let exp = 0;
                    let wd = 0;
                    for (const tx of this.transactions) {
                        const amt = Number(tx.amount) || 0;
                        if (tx.type === 'income') inc += amt;
                        else if (tx.type === 'expense') exp += amt;
                        else if (tx.type === 'withdrawal') wd += amt;
                    }
                    if (metric === 'income') return inc;
                    if (metric === 'expense') return exp;
                    if (metric === 'withdrawal') return wd;
                    return inc - exp - wd;
                },

                formatCurrency(val) {
                    const num = Number(val) || 0;
                    const rate = this.rates[this.currency] || 1;
                    const converted = num * rate;
                    if (this.currency === 'IDR') {
                        return 'Rp ' + Math.round(converted).toLocaleString('id-ID');
                    }
                    if (this.currency === 'USD') {
                        return '$' + converted.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    }
                    return '€' + converted.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                },

                autoDetectCategory() {
                    if (this.isCategoryManualLock || this.txForm.type === 'transfer') return;
                    const txt = `${this.txForm.title || ''} ${this.txForm.note || ''}`.toLowerCase();
                    if (!txt.trim()) {
                        this.isCategoryAutoDetected = false;
                        return;
                    }
                    const rules = [
                        { keys: ['gaji', 'salary', 'upah', 'bonus'], cat: 'Salary' },
                        { keys: ['trading', 'saham', 'crypto', 'forex', 'profit'], cat: 'Trading' },
                        { keys: ['invest', 'reksadana', 'dividen', 'obligasi'], cat: 'Investment' },
                        { keys: ['makan', 'kopi', 'coffee', 'lunch', 'dinner', 'sarapan', 'resto', 'cafe', 'food'], cat: 'Food' },
                        { keys: ['gojek', 'grab', 'ojek', 'kereta', 'mrt', 'tol', 'parkir', 'tiket', 'transport'], cat: 'Transport' },
                        { keys: ['listrik', 'pln', 'air', 'pdam', 'internet', 'wifi', 'pulsa', 'kuota', 'tagihan'], cat: 'Utilities' },
                        { keys: ['tokopedia', 'shopee', 'lazada', 'blibli', 'online'], cat: 'Online Shopping' },
                        { keys: ['obat', 'dokter', 'rs', 'klinik', 'gym', 'vitamin'], cat: 'Health & Lifestyle' }
                    ];
                    for (const r of rules) {
                        if (r.keys.some(k => txt.includes(k))) {
                            this.txForm.category = r.cat;
                            this.isCategoryAutoDetected = true;
                            return;
                        }
                    }
                },

                async saveTransactionAPI(keepOpen = false) {
                    const amount = Number(this.txForm.amount);
                    if (!amount || amount <= 0) {
                        this.showToast(this.lang === 'ID' ? 'Masukkan nominal terlebih dahulu' : 'Please enter a valid amount');
                        return;
                    }
                    if (this.txForm.type === 'transfer' && this.txForm.account === this.txForm.toAccount) {
                        this.showToast(this.lang === 'ID' ? 'Wallet asal dan tujuan harus berbeda' : 'Source and destination wallets must differ');
                        return;
                    }

                    const combinedNote = [this.txForm.title, this.txForm.note].map(s => (s || '').trim()).filter(Boolean).join(' — ');
                    const fullDate = `${this.txForm.date} ${this.txForm.time || '00:00'}`;
                    const cleanCat = this.txForm.type === 'transfer'
                        ? 'Transfer'
                        : (['otomotif', 'automotive'].includes(String(this.txForm.category || '').toLowerCase()) ? 'Transport' : (this.txForm.category || 'Food'));

                    const newTx = {
                        id: Date.now(),
                        amount,
                        type: this.txForm.type,
                        category: cleanCat,
                        account: this.txForm.account,
                        toAccount: this.txForm.type === 'transfer' ? this.txForm.toAccount : '',
                        adminFee: this.txForm.type === 'transfer' ? (Number(this.txForm.adminFee) || 0) : 0,
                        note: combinedNote,
                        currency: this.currency,
                        date: fullDate
                    };

                    if (this.isBackendApiOnline) {
                        try {
                            const res = await fetch(`${this.apiBaseUrl}/api/transactions`, {
                                method: 'POST',
                                headers: this.getApiHeaders(true),
                                credentials: 'include',
                                body: JSON.stringify({
                                    amount: newTx.amount,
                                    type: newTx.type,
                                    category: newTx.category,
                                    account: newTx.account,
                                    to_account: newTx.toAccount,
                                    admin_fee: newTx.adminFee,
                                    note: newTx.note,
                                    currency: newTx.currency,
                                    date: newTx.date
                                })
                            });
                            if (res.ok) {
                                const data = await res.json();
                                if (data.id) newTx.id = data.id;
                            }
                        } catch (e) {}
                    }

                    this.transactions.unshift(newTx);
                    await this.executeAutomationsForTransaction(newTx);
                    await this.syncStateToServer();
                    this.updateAllCharts();

                    this.showToast(this.lang === 'ID' ? 'Transaksi berhasil dicatat' : 'Transaction recorded');

                    if (keepOpen) {
                        this.txForm.amount = '';
                        this.txForm.title = '';
                        this.txForm.note = '';
                        this.txForm.adminFee = '';
                    } else {
                        this.closeModal();
                    }
                },

                async deleteTransaction(id) {

                                method: 'DELETE',

                                credentials: 'include'
                            });
                        } catch (e) {}
                    }
                    this.transactions = this.transactions.filter(t => t.id !== id);
                    await this.syncStateToServer();
                    this.updateAllCharts();
                    this.showToast(this.lang === 'ID' ? 'Catatan dihapus' : 'Record deleted');
                },

                startVoiceInput() {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (!SpeechRecognition) {
                        this.showToast(this.lang === 'ID' ? 'Browser tidak mendukung pengenalan suara' : 'Speech recognition not supported');
                        return;
                    }
                    const recog = new SpeechRecognition();
                    recog.lang = this.lang === 'ID' ? 'id-ID' : 'en-US';
                    recog.interimResults = false;
                    this.isListening = true;
                    this.voiceText = '';

                    recog.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        this.voiceText = transcript;
                        this.parseVoiceTranscript(transcript);
                        this.isListening = false;
                    };
                    recog.onerror = () => {
                        this.isListening = false;
                        this.showToast(this.lang === 'ID' ? 'Suara tidak terdeteksi, coba lagi' : 'Voice not detected, try again');
                    };
                    recog.onend = () => { this.isListening = false; };
                    recog.start();
                },

                parseVoiceTranscript(text) {
                    const low = text.toLowerCase();
                    let mult = 1;
                    if (low.includes('juta') || low.includes('million')) mult = 1000000;
                    else if (low.includes('ribu') || low.includes('rb') || low.includes('thousand')) mult = 1000;

                    const numMatch = low.match(/(\d+(?:[.,]\d+)?)/);
                    if (numMatch) {
                        const rawNum = parseFloat(numMatch[1].replace(',', '.'));
                        this.txForm.amount = Math.round(rawNum * mult);
                    }
                    if (low.includes('gaji') || low.includes('masuk') || low.includes('income') || low.includes('salary')) {
                        this.txForm.type = 'income';
                    } else {
                        this.txForm.type = 'expense';
                    }
                    this.txForm.title = text;
                    this.autoDetectCategory();
                    this.formTab = 'manual';
                },

                async startCamera() {
                    try {
                        this.stopCamera();
                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: this.cameraFacingMode },
                            audio: false
                        });
                        this.videoStream = stream;
                        this.isCameraActive = true;
                        this.$nextTick(() => {
                            if (this.$refs.videoElement) {
                                this.$refs.videoElement.srcObject = stream;
                            }
                        });
                        this._autoScanInterval = setInterval(() => {
                            if (this.isCameraActive && this.isAutoScanEnabled && !this.isScanningReceipt) {
                                this.captureAndScan(true);
                            }
                        }, 2500);
                    } catch (e) {
                        this.showToast(this.lang === 'ID' ? 'Kamera tidak tersedia, gunakan unggah gambar struk' : 'Camera unavailable, upload receipt image instead');
                    }
                },

                stopCamera() {
                    if (this._autoScanInterval) {
                        clearInterval(this._autoScanInterval);
                        this._autoScanInterval = null;
                    }
                    if (this.videoStream) {
                        this.videoStream.getTracks().forEach(t => t.stop());
                        this.videoStream = null;
                    }
                    this.isCameraActive = false;
                },

                async switchCameraFacing() {
                    this.cameraFacingMode = this.cameraFacingMode === 'environment' ? 'user' : 'environment';
                    await this.startCamera();
                },

                async captureAndScan(isSilentAuto = false) {
                    const video = this.$refs.videoElement;
                    if (!video || !video.videoWidth) return;
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    if (!isSilentAuto) {
                        this.stopCamera();
                    }
                    const base64 = dataUrl.split(',')[1];
                    await this.processReceiptImageBase64(base64, 'image/jpeg', dataUrl, isSilentAuto);
                },

                async handleFileUpload(event) {
                    const file = event.target.files && event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const dataUrl = e.target.result;
                        const base64 = String(dataUrl).split(',')[1];
                        await this.processReceiptImageBase64(base64, file.type || 'image/jpeg', dataUrl, false);
                    };
                    reader.readAsDataURL(file);
                },

                async processReceiptImageBase64(base64, mimeType, dataUrl, isSilentAuto = false) {
                    this.isScanningReceipt = true;
                    try {
                        if (this.isBackendApiOnline) {
                            const res = await fetch(`${this.apiBaseUrl}/api/scan/receipt`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ image_base64: base64, mime_type: mimeType })
                            });
                            if (res.ok) {
                                const data = await res.json();
                                if (data.status === 'success' && Number(data.amount) > 0) {
                                    this.stopCamera();
                                    this.txForm.amount = Number(data.amount);
                                    this.txForm.type = 'expense';
                                    this.txForm.category = data.category || 'Food';
                                    this.txForm.title = data.note || 'Pindai Struk';
                                    this.formTab = 'manual';
                                    this.showToast(this.lang === 'ID' ? 'Struk berhasil dipindai otomatis via API' : 'Receipt auto-extracted via API');
                                    return;
                                }
                            }
                        }

                        if (!isSilentAuto && window.Tesseract && dataUrl) {
                            const result = await window.Tesseract.recognize(dataUrl, 'eng');
                            const text = (result && result.data && result.data.text) || '';
                            const matches = text.match(/\b\d{1,3}(?:[.,]\d{3})+\b/g) || [];
                            const nums = matches.map(m => parseInt(m.replace(/[.,]/g, ''), 10)).filter(n => n >= 1000);
                            if (nums.length > 0) {
                                this.stopCamera();
                                this.txForm.amount = Math.max(...nums);
                                this.txForm.type = 'expense';
                                this.txForm.title = 'Struk Belanja';
                                this.formTab = 'manual';
                                this.showToast(this.lang === 'ID' ? 'Nominal struk berhasil diekstrak' : 'Receipt amount extracted');
                                return;
                            }
                        }

                        if (!isSilentAuto) {
                            this.showToast(this.lang === 'ID' ? 'Nominal tidak terbaca jelas, isi manual' : 'Amount unclear, please enter manually');
                            this.formTab = 'manual';
                        }
                    } finally {
                        this.isScanningReceipt = false;
                    }
                },

                simulateReceiptScan() {
                    this.txForm.type = 'expense';
                    this.txForm.amount = 145000;
                    this.txForm.category = 'Food';
                    this.txForm.title = 'Kopi Kenangan & Makan Siang';

                    this.showToast(this.lang === 'ID' ? 'Contoh struk dimuat' : 'Sample receipt loaded');
