                describeRule(rule) {
                    const isId = this.lang === 'ID';
                    const act = rule.actionType;
                    if (act === 'auto_save_goal') {
                        return isId
                            ? `Sisihkan ${rule.percent}% dari pemasukan (min. ${this.formatCurrency(rule.minAmount)}) ke target "${rule.targetGoalName}".`
                            : `Allocate ${rule.percent}% of income (min. ${this.formatCurrency(rule.minAmount)}) to "${rule.targetGoalName}".`;
                    }
                    if (act === 'fixed_save_goal') {
                        return isId
                            ? `Sisihkan tetap ${this.formatCurrency(rule.fixedAmount)} setiap pemasukan ke target "${rule.targetGoalName}".`
                            : `Allocate fixed ${this.formatCurrency(rule.fixedAmount)} per income to "${rule.targetGoalName}".`;
                    }
                    if (act === 'auto_transfer_wallet') {
                        return isId
                            ? `Auto-transfer ${rule.percent}% pemasukan ke dompet ${rule.destWallet}.`
                            : `Auto-transfer ${rule.percent}% of income to ${rule.destWallet}.`;
                    }
                    if (act === 'expense_save_goal') {
                        return isId
                            ? `Sisihkan ${rule.percent}% dari pengeluaran ke target "${rule.targetGoalName}".`
                            : `Save ${rule.percent}% of expense into "${rule.targetGoalName}".`;
                    }
                    if (act === 'expense_transfer_wallet') {
                        return isId
                            ? `Auto-transfer ${rule.percent}% dari pengeluaran ke ${rule.destWallet}.`
                            : `Auto-transfer ${rule.percent}% of expense to ${rule.destWallet}.`;
                    }
                    if (act === 'category_spend_alert') {
                        return isId
                            ? `Peringatan otomatis jika pengeluaran ${rule.targetCategory} ≥ ${this.formatCurrency(rule.thresholdAmount)}.`
                            : `Alert when ${rule.targetCategory} expense ≥ ${this.formatCurrency(rule.thresholdAmount)}.`;
                    }
                    return isId
                        ? `Peringatan otomatis jika pengeluaran melebihi ${this.formatCurrency(rule.thresholdAmount)}.`
                        : `Alert when expense exceeds ${this.formatCurrency(rule.thresholdAmount)}.`;
                },

                allocateToGoalByName(goalName, amount) {
                    if (!amount || amount <= 0) return;
                    const cleanName = (goalName || 'Dana Darurat').trim();
                    let goal = this.goals.find(g => g.name.toLowerCase() === cleanName.toLowerCase());
                    if (!goal) {
                        goal = {
                            id: 'goal_' + Date.now() + Math.floor(Math.random() * 100),
                            name: cleanName,
                            target: Math.max(amount * 10, 5000000),
                            current: 0
                        };
                        this.goals.push(goal);
                    }
                    goal.current = Number(goal.current || 0) + amount;
                },

                executeAutomationRulesForTx(tx) {
                    const amt = Number(tx.amount || 0);
                    if (amt <= 0) return;

                    for (const rule of this.automationRules) {
                        if (!rule.enabled) continue;
                        const act = rule.actionType;
                        const minAmt = Number(rule.minAmount || 0);

                        if (tx.type === 'income' && amt >= minAmt) {
                            if (act === 'auto_save_goal') {
                                const saveAmt = Math.round(amt * (Number(rule.percent || 0) / 100));
                                this.allocateToGoalByName(rule.targetGoalName, saveAmt);
                                rule.runCount = (rule.runCount || 0) + 1;
                            } else if (act === 'fixed_save_goal') {
                                const saveAmt = Math.round(Number(rule.fixedAmount || 0));
                                this.allocateToGoalByName(rule.targetGoalName, saveAmt);
                                rule.runCount = (rule.runCount || 0) + 1;
                            } else if (act === 'auto_transfer_wallet') {
                                if (!rule.sourceWallet || rule.sourceWallet === tx.account) {
                                    const tfAmt = Math.round(amt * (Number(rule.percent || 0) / 100));
                                    if (tfAmt > 0 && rule.destWallet && rule.destWallet !== tx.account) {
                                        this.transactions.unshift({
                                            id: Date.now() + Math.floor(Math.random() * 1000),
                                            amount: tfAmt,
                                            type: 'transfer',
                                            category: 'Transfer',
                                            account: tx.account,
                                            toAccount: rule.destWallet,
                                            adminFee: 0,
                                            note: `Autopilot: ${rule.name}`,
                                            currency: this.currency,
                                            date: tx.date
                                        });
                                        rule.runCount = (rule.runCount || 0) + 1;
                                    }
                                }
                            }
                        } else if (tx.type === 'expense') {
                            if (act === 'expense_save_goal' && amt >= minAmt) {
                                const saveAmt = Math.round(amt * (Number(rule.percent || 0) / 100));
                                this.allocateToGoalByName(rule.targetGoalName, saveAmt);
                                rule.runCount = (rule.runCount || 0) + 1;
                            } else if (act === 'expense_transfer_wallet' && amt >= minAmt) {
                                const tfAmt = Math.round(amt * (Number(rule.percent || 0) / 100));
                                if (tfAmt > 0 && rule.destWallet && rule.destWallet !== tx.account) {
                                    this.transactions.unshift({
                                        id: Date.now() + Math.floor(Math.random() * 1000),
                                        amount: tfAmt,
                                        type: 'transfer',
                                        category: 'Transfer',
                                        account: tx.account,
                                        toAccount: rule.destWallet,
                                        adminFee: 0,
                                        note: `Autopilot: ${rule.name}`,
                                        currency: this.currency,
                                        date: tx.date
                                    });
                                    rule.runCount = (rule.runCount || 0) + 1;
                                }
                            } else if (act === 'spend_alert' && amt >= Number(rule.thresholdAmount || 0)) {
                                rule.runCount = (rule.runCount || 0) + 1;
                                setTimeout(() => {
                                    this.showToast(`Autopilot Alert: ${this.formatCurrency(amt)} (${rule.name})`);
                                }, 600);
                            } else if (act === 'category_spend_alert' && tx.category === rule.targetCategory && amt >= Number(rule.thresholdAmount || 0)) {
                                rule.runCount = (rule.runCount || 0) + 1;
                                setTimeout(() => {
                                    this.showToast(`Autopilot (${tx.category}): ${this.formatCurrency(amt)}`);
                                }, 600);
                            }
                        }
                    }
                },

                // ==========================================
                // SPLIT BILL & LIVE CAMERA SCANNER
                // ==========================================
                async recalculateSplitBillApi() {
                    const sub = Math.max(0, Number(this.splitSubtotal || 0));
                    const tax = Math.max(0, Number(this.splitTax || 0));
                    const ppl = Math.max(1, Math.round(Number(this.splitPeople || 1)));

                    const localGrand = sub + (sub * (tax / 100));
                    this.splitGrandTotal = Math.round(localGrand * 100) / 100;
                    this.splitPerPerson = Math.round((localGrand / ppl) * 100) / 100;

                    try {
                        const res = await fetch('/api/engine/split-bill', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ subtotal: sub, tax_percent: tax, people: ppl })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (typeof data.grand_total === 'number') this.splitGrandTotal = data.grand_total;
                            if (typeof data.per_person === 'number') this.splitPerPerson = data.per_person;
                        }
                    } catch (e) {}
                },

                async startSplitCamera() {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        this.showToast(this.lang === 'ID' ? 'Kamera tidak didukung di browser ini, gunakan Foto / Galeri.' : 'Camera not supported here, please use Photo / Gallery.');
                        return;
                    }
                    this.showSplitCameraModal = true;
                    this.$nextTick(async () => {
                        this.refreshIcons();
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({
                                video: { facingMode: { ideal: 'environment' } },
                                audio: false
                            });
                            this.splitCameraStream = stream;
                            if (this.$refs.splitVideo) {
                                this.$refs.splitVideo.srcObject = stream;
                            }
                        } catch (e) {
                            this.stopSplitCamera();
                            this.showToast(this.lang === 'ID' ? 'Izin kamera ditolak atau tidak tersedia.' : 'Camera permission denied or unavailable.');
                        }
                    });
                },

                stopSplitCamera() {
                    if (this.splitCameraStream) {
                        try {
                            this.splitCameraStream.getTracks().forEach(track => track.stop());
                        } catch (e) {}
                        this.splitCameraStream = null;
                    }
                    this.showSplitCameraModal = false;
                },

                async captureSplitCameraFrame() {
                    const video = this.$refs.splitVideo;
                    const canvas = this.$refs.splitCanvas;
                    if (!video || !canvas) return;

                    canvas.width = video.videoWidth || 720;
                    canvas.height = video.videoHeight || 960;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    const base64 = dataUrl.split(',')[1];
                    this.stopSplitCamera();
                    await this.scanSplitBillBase64(base64, 'image/jpeg');
                },

                async handleSplitBillScanUpload(event) {
                    const file = event && event.target && event.target.files ? event.target.files[0] : null;
                    if (!file) return;
                    try {
                        const { base64, mime } = await this.fileToBase64(file);
                        await this.scanSplitBillBase64(base64, mime);
                    } finally {
                        if (event && event.target) event.target.value = '';
                    }
                },

                async scanSplitBillBase64(base64Data, mimeType) {
                    this.isScanningSplitBill = true;
                    try {
                        const res = await fetch('/api/scan/receipt', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ image_base64: base64Data, mime_type: mimeType })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            const sub = Number(data.subtotal || data.amount || 0);
                            if (sub > 0) {
                                this.splitSubtotal = sub;
                                this.splitTax = Number(data.tax_percent || 0);
                                this.splitMerchant = data.note || '';
                                this.splitItems = Array.isArray(data.items) ? data.items : [];
                                await this.recalculateSplitBillApi();
                                this.showToast(this.lang === 'ID' ? 'Struk Split Bill berhasil dipindai!' : 'Split Bill receipt scanned!');
                            } else {
                                this.showToast(this.lang === 'ID' ? 'Nominal struk tidak terdeteksi, isi subtotal manual.' : 'Could not detect bill total.');
                            }
                        }
                    } catch (e) {
                        this.showToast(this.lang === 'ID' ? 'Gagal memindai struk.' : 'Receipt scan failed.');
                    } finally {
                        this.isScanningSplitBill = false;
                        this.$nextTick(() => this.refreshIcons());
                    }
                },

                clearSplitScan() {
                    this.splitMerchant = '';
                    this.splitItems = [];
                    this.splitSubtotal = 0;
                    this.splitTax = 0;
                    this.recalculateSplitBillApi();
                },

                recordMySplitShare() {
                    if (this.splitPerPerson <= 0) return;
                    this.openTxModal('expense');
                    this.txForm.amount = this.splitPerPerson;
                    this.txForm.category = this.categories.includes('Food') ? 'Food' : (this.categories[0] || 'Food');
                    this.txForm.note = this.splitMerchant
                        ? `Split Bill (${this.splitPeople}x) - ${this.splitMerchant}`
                        : `Split Bill (${this.splitPeople}x)`;
                },

                // ==========================================
                // REPORT IMPORT (EXCEL / CSV / PDF)
                // ==========================================
                async handleReportImport(event) {
                    const file = event && event.target && event.target.files ? event.target.files[0] : null;
                    if (!file) return;
                    this.isImportingReport = true;
                    try {
                        const formData = new FormData();
                        formData.append('file', file);
                        const defaultWallet = this.banks[0] || 'Bank BCA';
                        const userEmail = this.googleUser && this.googleUser.email ? this.googleUser.email : 'guest';

                        const res = await fetch('/api/import/report', {
                            method: 'POST',
                            headers: {
                                'X-Default-Wallet': defaultWallet,
                                'X-User-Email': userEmail
                            },
                            body: formData
                        });
                        if (res.ok) {
                            const data = await res.json();
                            const imported = Array.isArray(data.transactions) ? data.transactions : [];
                            if (imported.length > 0) {
                                for (const item of imported) {
                                    if (item.account && !this.banks.includes(item.account)) {
                                        this.banks.push(item.account);
                                    }
                                    if (item.category && item.category !== 'Transfer' && !this.categories.includes(item.category)) {
                                        this.categories.push(item.category);
                                    }
                                }
                                this.transactions = [...imported, ...this.transactions];
                                this.saveLocalState();
                                this.$nextTick(() => {
                                    this.refreshIcons();
                                    this.updateAllCharts();
                                });
                                this.showToast(
                                    this.lang === 'ID'
                                        ? `${imported.length} transaksi berhasil diimpor dari ${file.name}!`
                                        : `${imported.length} transactions imported from ${file.name}!`
                                );
                            } else {
                                this.showToast(
                                    this.lang === 'ID'
                                        ? 'Tidak ditemukan baris transaksi yang valid di dalam file.'
                                        : 'No valid transaction rows found in file.'
                                );
                            }
                        } else {
                            this.showToast(this.lang === 'ID' ? 'Gagal membaca file laporan.' : 'Failed to parse report file.');
                        }
                    } catch (e) {
                        this.showToast(this.lang === 'ID' ? 'Terjadi kesalahan saat mengimpor file.' : 'Error importing report file.');
                    } finally {
                        this.isImportingReport = false;
                        if (event && event.target) event.target.value = '';
                    }
                },

                // ==========================================
                // CHARTS & VISUALIZATION (API + CHART.JS)
                // ==========================================
                buildCashflowSeries(groupMode = 'date') {
                    if (this.apiChartData) {
                        const src = groupMode === 'tx'
                            ? this.apiChartData.cashflow_by_tx
                            : this.apiChartData.cashflow_by_date;
                        if (src && Array.isArray(src.labels) && src.labels.length > 0) {
                            return {
                                labels: src.labels,
                                incData: src.income || [],
                                expData: src.expense || [],
                                netData: src.net || []
                            };
                        }
                    }

                    const chronological = [...this.transactions].reverse();
                    if (chronological.length === 0) {
                        return {
                            labels: [this.t('income'), this.t('expense')],
                            incData: [0, 0],
                            expData: [0, 0],
                            netData: [0, 0]
                        };
                    }

                    if (groupMode === 'date') {
                        const map = new Map();
                        for (const tx of chronological) {
                            const dayKey = String(tx.date || '').slice(0, 10) || (tx.category || 'Tx');
                            if (!map.has(dayKey)) {
                                map.set(dayKey, { inc: 0, exp: 0 });
                            }
                            const entry = map.get(dayKey);
                            const amt = Number(tx.amount || 0);
                            if (tx.type === 'income') entry.inc += amt;
                            else if (tx.type === 'expense' || tx.type === 'withdrawal') entry.exp += amt;
                        }
                        const keys = Array.from(map.keys()).slice(-14);
                        const labels = keys.map(k => k.length >= 10 ? k.slice(5, 10) : k);
                        const incData = keys.map(k => map.get(k).inc);
                        const expData = keys.map(k => map.get(k).exp);
                        const netData = keys.map(k => map.get(k).inc - map.get(k).exp);
                        return { labels, incData, expData, netData };
                    }

                    const recent = chronological.slice(-14);
                    const labels = recent.map(t => (t.note || t.category || (t.date || '').slice(5, 10)).slice(0, 14));
                    const incData = recent.map(t => t.type === 'income' ? Number(t.amount || 0) : 0);
                    const expData = recent.map(t => (t.type === 'expense' || t.type === 'withdrawal') ? Number(t.amount || 0) : 0);
                    const netData = recent.map((_, i) => incData[i] - expData[i]);
                    return { labels, incData, expData, netData };
                },

                        : values.map(v => v >= 0 ? '#2563EB' : '#F43F5E');
                    const textColor = this.isDarkMode ? '#94A3B8' : '#64748B';
                    const gridColor = this.isDarkMode ? 'rgba(255,255,255,0.06)' : 'rgba(15,23,42,0.06)';

                    _dndChartInstances.wallet = new window.Chart(canvas, {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [{
                                label: this.t('wallet_distribution'),
                                data: values,
                                backgroundColor: barColors,
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: { duration: 250 },
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } },
                                y: { beginAtZero: true, ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor } }
                            }
                        }
                    });
                },

                // ==========================================
                // BUILT-IN SMART FINANCIAL ASSISTANT
                // ==========================================
                getAllWalletBalancesMap() {
                    const map = {};
                    for (const b of this.banks) {
                        map[b] = this.getWalletBalance(b);
                    }
                    return map;
                },

                buildFinancialContext() {
                    const walletMap = this.getAllWalletBalancesMap();
                    const walletSummary = Object.entries(walletMap)
                        .map(([b, val]) => `${b}: ${this.formatCurrency(val)}`)
                        .join(', ');
                    const goalsSummary = this.goals.length
                        ? this.goals.map(g => `${g.name} (${this.formatCurrency(g.current)} / ${this.formatCurrency(g.target)})`).join('; ')
                        : 'None';
                    const budgetsSummary = this.budgets.length
                        ? this.budgets.map(b => `${b.category} (Spent ${this.formatCurrency(this.getCategorySpent(b.category))} / Limit ${this.formatCurrency(b.limit)})`).join('; ')
                        : 'None';
                    const rulesSummary = this.automationRules.length
                        ? this.automationRules.map(r => `${r.name} (${r.enabled ? 'Active' : 'Paused'})`).join('; ')
                        : 'None';
                    return [
                        `Total Balance: ${this.formatCurrency(this.totalBalance)}`,
                        `Total Income: ${this.formatCurrency(this.totalIncome)}`,
                        `Total Expense: ${this.formatCurrency(this.totalExpense + this.totalWithdrawal)}`,
                        `Wallets: ${walletSummary}`,
                        `Savings Goals: ${goalsSummary}`,
                        `Category Budgets: ${budgetsSummary}`,
                        `Autopilot Rules: ${rulesSummary}`
                    ].join('\n');
                },

                async runQuickAudit() {
                    const prompt = this.lang === 'ID'
                        ? 'Lakukan analisis keuangan menyeluruh berdasarkan seluruh data transaksi, skor kesehatan finansial, burn rate, pembagian gaji, saldo setiap dompet, anggaran, aturan Autopilot, dan target tabungan saya.'
                        : 'Perform a comprehensive financial analysis across all my transactions, health score, burn rate, salary allocation, individual wallet balances, budgets, Autopilot rules, and savings goals.';
                    await this.sendAiRequest(prompt);
                },

                async askAiPreset(presetText) {
                    await this.sendAiRequest(presetText);
                },

                async submitAiPrompt() {
                    const q = (this.aiInput || '').trim();
                    if (!q) return;
                    this.aiInput = '';
                    await this.sendAiRequest(q);
                },

                async sendAiRequest(promptText) {
                    const priorHistory = this.aiMessages.slice(-6).map(m => ({ role: m.role, text: m.text }));
                    this.aiMessages.push({ role: 'user', text: promptText });
                    this.isAiLoading = true;
                    try {
                        const res = await fetch('/api/ai/analyze', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                prompt: promptText,
                                lang: this.lang,
                                currency: this.currency,
                                financial_context: this.buildFinancialContext(),
                                transactions: this.transactions,
                                wallets: this.getAllWalletBalancesMap(),
                                goals: this.goals,
                                budgets: this.budgets.map(b => ({
                                    ...b,
                                    spent: this.getCategorySpent(b.category)
                                })),
                                automation_rules: this.automationRules,
                                chat_history: priorHistory
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            this.aiMessages.push({
                                role: 'ai',
                                source: data.source || 'DND Smart AI',
                                text: data.analysis || (this.lang === 'ID' ? 'Analisis selesai.' : 'Analysis completed.')
                            });
                        } else {
                            this.aiMessages.push({
                                role: 'ai',
                                source: 'DND Financial Intelligence',
                                text: this.lang === 'ID'
                                    ? '### Ringkasan Kondisi Kas\n- **Total Saldo Bersih:** ' + this.formatCurrency(this.totalBalance) + '\n- **Total Pemasukan vs Pengeluaran:** ' + this.formatCurrency(this.totalIncome) + ' vs ' + this.formatCurrency(this.totalExpense + this.totalWithdrawal)
                                    : '### Cash Position Summary\n- **Net Total Balance:** ' + this.formatCurrency(this.totalBalance) + '\n- **Income vs Outflow:** ' + this.formatCurrency(this.totalIncome) + ' vs ' + this.formatCurrency(this.totalExpense + this.totalWithdrawal)
                            });
                        }
                    } catch (e) {
                        this.aiMessages.push({
                            role: 'ai',
                            source: 'DND Financial Intelligence',
                            text: this.lang === 'ID'
                                ? '### Ringkasan Kondisi Kas\n- **Total Saldo Bersih:** ' + this.formatCurrency(this.totalBalance)
                                : '### Cash Position Summary\n- **Net Total Balance:** ' + this.formatCurrency(this.totalBalance)
                        });
                    } finally {
                        this.isAiLoading = false;
                    }
                },

                formatMarkdownLight(text) {
                    return String(text || '')
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-cream-900 dark:text-white">$1</strong>')
                        .replace(/^### (.*$)/gm, '<div class="font-display font-bold text-sm sm:text-base text-royal-600 dark:text-royal-400 pt-2 pb-0.5 border-b border-cream-200/60 dark:border-obsidian-800">$1</div>')
                        .replace(/^## (.*$)/gm, '<div class="font-display font-bold text-base text-royal-600 dark:text-royal-400 pt-2 pb-0.5">$1</div>')
                        .replace(/^- (.*$)/gm, '<div class="pl-3 relative before:content-[\'•\'] before:absolute before:left-0 before:text-royal-600 dark:before:text-royal-400">$1</div>')
                        .replace(/^(\d+)\. (.*$)/gm, '<div class="pl-1"><span class="font-bold text-royal-600 dark:text-royal-400">$1.</span> $2</div>');
                },

                copyToClipboard(text) {
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(text);
                        this.showToast(this.lang === 'ID' ? 'Teks disalin!' : 'Copied to clipboard!');
                    }
                },

                // ==========================================
                // DIRECT EXCEL & PDF REPORT EXPORT
                // ==========================================
                async exportToExcel() {
                    try {
                        const res = await fetch('/api/export/excel', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                lang: this.lang,
                                currency: this.currency,
                                transactions: this.transactions,
                                wallets: this.getAllWalletBalancesMap(),
                                goals: this.goals
                            })
                        });
                        if (res.ok) {
                            const blob = await res.blob();
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `DND_Financial_Report_${this.lang}.xlsx`;
                            document.body.appendChild(a);
                            a.click();
                            a.remove();
                            URL.revokeObjectURL(url);
                            this.showToast(this.lang === 'ID' ? 'Laporan Excel diunduh!' : 'Excel report downloaded!');
                            return;
                        }
                    } catch (e) {}

                    if (window.XLSX) {
                        const ws = XLSX.utils.json_to_sheet(this.transactions);
                        const wb = XLSX.utils.book_new();
                        XLSX.utils.book_append_sheet(wb, ws, 'Transactions');
                        XLSX.writeFile(wb, `DND_Financial_Report_${this.lang}.xlsx`);
                        this.showToast(this.lang === 'ID' ? 'Laporan Excel diunduh!' : 'Excel report downloaded!');
                    }
                },

                async exportToPDF() {
                    try {
                        const res = await fetch('/api/export/pdf', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                lang: this.lang,
                                currency: this.currency,
                                transactions: this.transactions,
                                wallets: this.getAllWalletBalancesMap(),
                                goals: this.goals
                            })
                        });
                        if (res.ok) {
                            const blob = await res.blob();
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `DND_Financial_Report_${this.lang}.pdf`;
                            document.body.appendChild(a);
                            a.click();
                            a.remove();
                            URL.revokeObjectURL(url);
                            this.showToast(this.lang === 'ID' ? 'Laporan PDF diunduh!' : 'PDF report downloaded!');
                            return;
                        }
                    } catch (e) {}

                    if (window.jspdf && window.jspdf.jsPDF) {
                        const doc = new window.jspdf.jsPDF();
                        doc.text('DND Finance Financial Report', 14, 16);
                        if (typeof doc.autoTable === 'function') {
                            doc.autoTable({
                                startY: 22,
                                head: [['Date', 'Category', 'Type', 'Wallet', 'Amount']],
                                body: this.transactions.map(t => [t.date, t.category, t.type, t.account, this.formatCurrency(t.amount)])
                            });
                        }
                        doc.save(`DND_Financial_Report_${this.lang}.pdf`);
                        this.showToast(this.lang === 'ID' ? 'Laporan PDF diunduh!' : 'PDF report downloaded!');
                    }
                }
            };
        }
    </script>
</body>
</html>
