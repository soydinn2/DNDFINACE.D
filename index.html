                parseAmountShorthand(rawText) {
                    const lower = String(rawText || '').toLowerCase();
                    const unitMatch = lower.match(/(\d+(?:[.,]\d+)?)\s*(jt|juta|m|rb|ribu|k)\b/);
                    if (unitMatch) {
                        const num = parseFloat(unitMatch[1].replace(',', '.'));
                        const unit = unitMatch[2];
                        if (['jt', 'juta', 'm'].includes(unit)) return Math.round(num * 1000000);
                        if (['rb', 'ribu', 'k'].includes(unit)) return Math.round(num * 1000);
                    }
                    const plainMatch = String(rawText || '').replace(/\./g, '').match(/(\d{3,12})/);
                    if (plainMatch) return Number(plainMatch[1]);
                    const smallMatch = String(rawText || '').match(/\b(\d+(?:[.,]\d+)?)\b/);
                    if (smallMatch) return parseFloat(smallMatch[1].replace(',', '.'));
                    return 0;
                },

                parseNaturalLanguageTx() {
                    const raw = stripAllEmojis(this.smartTxInput || '').trim();
                    if (!raw) return;
                    this.isParsingSmartTx = true;

                    try {
                        const lower = raw.toLowerCase();
                        let type = 'expense';
                        if (/\b(gaji|salary|terima|dapat|masuk|income|bonus|profit|dividen)\b/.test(lower)) {
                            type = 'income';
                        } else if (/\b(transfer|tf|kirim|pindah)\b/.test(lower)) {
                            type = 'transfer';
                        }

                        const amount = this.parseAmountShorthand(raw);

                        let matchedWallet = this.txForm.account;
                        for (const b of this.banks) {
                            const bShort = b.toLowerCase().replace('bank ', '');
                            if (lower.includes(b.toLowerCase()) || lower.includes(bShort)) {
                                matchedWallet = b;
                                break;
                            }
                        }

                        let matchedCat = type === 'income' ? 'Salary' : 'Food';
                        if (/\b(kopi|makan|lunch|dinner|sarapan|minum|cafe|resto|bakso|ayam|nasi|coffee)\b/.test(lower)) matchedCat = 'Food';
                        else if (/\b(gojek|grab|bensin|parkir|tol|kereta|mrt|taxi|transport)\b/.test(lower)) matchedCat = 'Transport';
                        else if (/\b(shopee|tokopedia|lazada|beli|belanja|shopping)\b/.test(lower)) matchedCat = 'Online Shopping';
                        else if (/\b(saham|crypto|reksadana|invest|emas|trading)\b/.test(lower)) matchedCat = 'Investment';
                        else if (/\b(listrik|air|internet|wifi|pulsa|tagihan|pln)\b/.test(lower)) matchedCat = 'Utilities';

                        if (amount > 0) this.txForm.amount = amount;
                        this.txForm.type = type;
                        this.txForm.account = matchedWallet;
                        this.txForm.category = matchedCat;
                        this.txForm.note = raw;
                        this.showToast(this.lang === 'ID' ? 'Formulir terisi otomatis.' : 'Form auto-filled.');
                    } finally {
                        this.isParsingSmartTx = false;
                    }
                },

                sendScannedReceiptToSplitBill() {
                    this.splitMerchant = this.scannedReceiptMerchant;
                    this.splitItems = JSON.parse(JSON.stringify(this.scannedReceiptItems || []));
                    this.splitSubtotal = this.scannedReceiptSubtotal;
                    this.splitDiscount = this.scannedReceiptDiscount;
                    this.splitTax = this.scannedReceiptTaxPct;
                    this.recalculateSplitBillMath();

                    this.$nextTick(() => {

                recalculateSplitItemLine(idx) {
                    const item = this.splitItems[idx];
                    if (!item) return;
                    const qty = Math.max(1, Number(item.qty || 1));
                    const unit = Math.max(0, Number(item.unitPrice || item.price || 0));
                    item.qty = qty;
                    item.unitPrice = unit;
                    item.price = Math.round(qty * unit * 100) / 100;
                    this.recalculateSplitFromItems();
                },

                recalculateSplitFromItems() {
                    const itemsSum = this.splitItems.reduce((sum, it) => sum + Math.max(0, Number(it.price || 0)), 0);
                    if (this.splitItems.length > 0) {
                        this.splitSubtotal = Math.round(itemsSum * 100) / 100;
                    }
                    this.recalculateSplitBillMath();
                },

                recalculateSplitBillMath() {
                    const sub = Math.max(0, Number(this.splitSubtotal || 0));
                    const disc = Math.max(0, Number(this.splitDiscount || 0));
                    const taxPct = Math.max(0, Number(this.splitTax || 0));
                    const ppl = Math.max(1, Math.floor(Number(this.splitPeople || 1)));

                    const netBase = Math.max(0, sub - disc);
                    const taxNominal = netBase * (taxPct / 100);
                    const grand = netBase + taxNominal;
                    const perPerson = grand / ppl;

                    this.splitTaxAmount = Math.round(taxNominal * 100) / 100;
                    this.splitGrandTotal = Math.round(grand * 100) / 100;
                    this.splitPerPerson = Math.round(perPerson * 100) / 100;
                },

                },

                    this.splitItems.splice(idx, 1);

                recalculateExpenseReceiptMath(recomputeFromItems = true) {

                        this.scannedReceiptSubtotal = Math.round(sum * 100) / 100;

                    const sub = Math.max(0, Number(this.scannedReceiptSubtotal || 0));
                    const disc = Math.max(0, Number(this.scannedReceiptDiscount || 0));
                    const taxPct = Math.max(0, Number(this.scannedReceiptTaxPct || 0));
                    const netBase = Math.max(0, sub - disc);

                async preprocessImageForOcr(dataUrl) {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => {
                            try {
                                const maxDim = 1600;
                                const scale = Math.min(1.6, maxDim / Math.max(img.width, img.height));
                                const canvas = document.createElement('canvas');
                                canvas.width = Math.round(img.width * scale);
                                canvas.height = Math.round(img.height * scale);
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                                const d = imgData.data;
                                for (let i = 0; i < d.length; i += 4) {
                                    const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                                    const contrasted = gray > 142 ? Math.min(255, gray * 1.15) : Math.max(0, gray * 0.72);
                                    d[i] = d[i + 1] = d[i + 2] = contrasted;
                                }
                                ctx.putImageData(imgData, 0, 0);
                                resolve(canvas.toDataURL('image/png'));
                            } catch (err) {
                                resolve(dataUrl);
                            }
                        };
                        img.onerror = () => resolve(dataUrl);
                        img.src = dataUrl;
                    });
                },

                async processReceiptImageUniversal(imageDataUrl, mode = 'split') {
                    if (mode === 'split') this.isScanningSplitBill = true;
                    else this.isScanningReceipt = true;

                    try {
                        let ocrText = '';
                        let backendResult = null;

                        try {
                            const blobRes = await fetch(imageDataUrl);
                            const blob = await blobRes.blob();
                            const fd = new FormData();
                            fd.append('file', blob, 'receipt.jpg');
                            const apiRes = await fetchWithTimeout('/api/scan/receipt', { method: 'POST', body: fd }, 5000);
                            if (apiRes.ok) {
                                const json = await apiRes.json();
                                if (json.status === 'ok' && json.data && (json.data.amount > 0 || (json.data.items && json.data.items.length > 0))) {
                                    backendResult = json.data;
                                }
                            }
                        } catch (e) {}

                        if (!backendResult && window.Tesseract && typeof window.Tesseract.recognize === 'function') {
                            const enhancedUrl = await this.preprocessImageForOcr(imageDataUrl);
                            const ocrPromise = window.Tesseract.recognize(enhancedUrl, 'eng+ind');
                            const timeoutPromise = new Promise((_, rej) => setTimeout(() => rej(new Error('OCR_TIMEOUT')), 16000));
                            const result = await Promise.race([ocrPromise, timeoutPromise]);
                            ocrText = (result && result.data && result.data.text) ? result.data.text : '';
                        }

                        const parsed = backendResult
                            ? this.normalizeBackendReceiptResult(backendResult)
                            : this.parseAndReconcileReceiptText(ocrText);

                        const scanDbRecord = {
                            id: 'scan_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                            account_key: this.resolvedAccountKey,
                            scan_mode: mode,
                            merchant: parsed.merchant,
                            items: parsed.items,
                            subtotal: parsed.subtotal,
                            discount: parsed.discount,
                            tax_percent: parsed.taxPercent,
                            tax_amount: parsed.taxAmount,
                            grand_total: parsed.grandTotal,
                            people_count: mode === 'split' ? Math.max(1, Number(this.splitPeople || 1)) : 1,
                            per_person: mode === 'split'
                                ? Math.round((parsed.grandTotal / Math.max(1, Number(this.splitPeople || 1))) * 100) / 100
                                : parsed.grandTotal,
                            created_at: new Date().toISOString()
                        };
                        await _dndLocalDb.addReceiptScan(scanDbRecord);
                        this.receiptScanLogs = await _dndLocalDb.listReceiptScans(this.resolvedAccountKey);

                        fetchWithTimeout('/api/db/scan', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(scanDbRecord)
                        }, 4000).catch(() => {});

                        if (mode === 'split') {
                            this.splitMerchant = parsed.merchant;
                            this.splitItems = parsed.items;
                            this.splitSubtotal = parsed.subtotal;
                            this.splitDiscount = parsed.discount;
                            this.splitTax = parsed.taxPercent;
                            this.recalculateSplitBillMath();
                            this.showToast(
                                this.lang === 'ID'
                                    ? `Struk dipindai & dihitung otomatis (${parsed.items.length} item).`
                                    : `Receipt scanned & auto-calculated (${parsed.items.length} items).`
                            );
                        } else {
                            this.scannedReceiptMerchant = parsed.merchant;
                            this.scannedReceiptItems = parsed.items;
                            this.scannedReceiptSubtotal = parsed.subtotal;
                            this.scannedReceiptDiscount = parsed.discount;
                            this.scannedReceiptTaxPct = parsed.taxPercent;
                            this.recalculateExpenseReceiptMath(false);
                            if (parsed.grandTotal > 0) this.txForm.amount = parsed.grandTotal;
                            if (parsed.merchant) this.txForm.note = parsed.merchant;
                            if (parsed.suggestedCategory && this.categories.includes(parsed.suggestedCategory)) {
                                this.txForm.category = parsed.suggestedCategory;
                            }
                            this.showToast(
                                this.lang === 'ID'
                                    ? `Nota belanja dihitung otomatis: ${this.formatCurrency(parsed.grandTotal)}`
                                    : `Receipt auto-calculated: ${this.formatCurrency(parsed.grandTotal)}`
                            );
                        }
                    } catch (err) {
                        if (mode === 'split') {
                            this.splitMerchant = this.lang === 'ID' ? 'Struk Manual' : 'Manual Receipt';
                            if (this.splitItems.length === 0) this.addSplitItemRow();
                        } else {
                            this.scannedReceiptMerchant = this.lang === 'ID' ? 'Nota Manual' : 'Manual Receipt';
                            if (this.scannedReceiptItems.length === 0) this.addExpenseReceiptItemRow();
                        }
                        this.showToast(
                            this.lang === 'ID'
                                ? 'Gambar diterima. Silakan sesuaikan daftar item & nominal secara langsung.'
                                : 'Image loaded. You can adjust item rows and amounts directly.'
                        );
                    } finally {
                        this.isScanningSplitBill = false;
                        this.isScanningReceipt = false;
                        this.$nextTick(() => this.refreshIcons());
                    }
                },

                normalizeBackendReceiptResult(data) {
                    const items = Array.isArray(data.items)
                        ? data.items.map(it => {
                            const qty = Math.max(1, Number(it.qty || 1));
                            const price = Math.max(0, Number(it.price || 0));
                            return {
                                name: stripAllEmojis(it.name || 'Item'),
                                qty,
                                unitPrice: qty > 0 ? Math.round((price / qty) * 100) / 100 : price,
                                price
                            };
                        })
                        : [];
                    const itemsSum = items.reduce((s, it) => s + it.price, 0);
                    const subtotal = itemsSum > 0 ? itemsSum : Math.max(0, Number(data.subtotal || data.amount || 0));
                    const discount = Math.max(0, Number(data.discount || 0));
                    const taxPercent = Math.max(0, Number(data.tax_percent || 0));
                    const netBase = Math.max(0, subtotal - discount);
                    const taxAmount = Math.round(netBase * (taxPercent / 100) * 100) / 100;
                    const grandTotal = Math.round((netBase + taxAmount) * 100) / 100;

                    return {
                        merchant: stripAllEmojis(data.merchant || 'Struk Belanja'),
                        items,
                        subtotal,
                        discount,
                        taxPercent,
                        taxAmount,
                        grandTotal,
                        suggestedCategory: data.category || 'Food'
                    };
                },

                parseAndReconcileReceiptText(rawText) {
                    const lines = String(rawText || '')
                        .split(/\r?\n/)
                        .map(l => stripAllEmojis(l).trim())
                        .filter(Boolean);

                    let merchant = '';
                    for (let i = 0; i < Math.min(4, lines.length); i++) {
                        const line = lines[i];
                        if (line.length >= 3 && !/^\d+[\d\s\-/:.]*$/.test(line) && !/(struk|receipt|invoice|nota|kasir|cashier|npwp)/i.test(line)) {
                            merchant = line.slice(0, 48);
                            break;
                        }
                    }
                    if (!merchant) merchant = this.lang === 'ID' ? 'Struk Belanja Terpindai' : 'Scanned Receipt';

                    const items = [];
                    let printedSubtotal = 0;
                    let printedDiscount = 0;
                    let printedTaxNominal = 0;
                    let printedTaxPct = 0;
                    let printedTotal = 0;

                    const parseMoneyToken = (str) => {
                        const cleaned = str.replace(/[^\d.,]/g, '');
                        if (!cleaned) return 0;
                        if (/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(cleaned)) {
                            return parseFloat(cleaned.replace(/\./g, '').replace(',', '.'));
                        }
                        if (/^\d{1,3}(,\d{3})+(\.\d{1,2})?$/.test(cleaned)) {
                            return parseFloat(cleaned.replace(/,/g, ''));
                        }
                        const digitsOnly = cleaned.replace(/[.,]/g, '');
                        return Number(digitsOnly || 0);
                    };

                    for (const line of lines) {
                        const lower = line.toLowerCase();
                        const moneyMatches = line.match(/(?:rp\.?\s*)?\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?|\b\d{4,9}\b/gi);
                        const lastVal = moneyMatches && moneyMatches.length ? parseMoneyToken(moneyMatches[moneyMatches.length - 1]) : 0;

                        if (/(diskon|discount|voucher|hemat|potongan)/i.test(lower) && lastVal > 0) {
                            printedDiscount += lastVal;
                            continue;
                        }
                        if (/(ppn|pb1|tax|pajak|service|servis)/i.test(lower)) {
                            const pctMatch = line.match(/(\d+(?:[.,]\d+)?)\s*%/);
                            if (pctMatch) {
                                printedTaxPct += parseFloat(pctMatch[1].replace(',', '.'));
                            } else if (lastVal > 0) {
                                printedTaxNominal += lastVal;
                            }
                            continue;
                        }
                        if (/(sub\s*total|subtotal)/i.test(lower) && lastVal > 0) {
                            printedSubtotal = lastVal;
                            continue;
                        }
                        if (/(grand\s*total|total\s*bayar|total\s*belanja|total\s*tagihan|^total\b)/i.test(lower) && lastVal > 0) {
                            printedTotal = Math.max(printedTotal, lastVal);
                            continue;
                        }
                        if (/(tunai|cash|kembalian|change|debit|qris|kredit|card|edc|approval|trace)/i.test(lower)) {
                            continue;
                        }

                        if (lastVal >= 500 && lastVal < 500000000) {
                            let qty = 1;
                            const qtyMatch = line.match(/(?:^|\s)(\d{1,3})\s*[xX*]\s*/);
                            if (qtyMatch) qty = Math.max(1, parseInt(qtyMatch[1], 10));

                            let itemName = line
                                .replace(/(?:rp\.?\s*)?\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?/gi, '')
                                .replace(/\b\d{4,9}\b/g, '')
                                .replace(/(?:^|\s)\d{1,3}\s*[xX*]\s*/g, ' ')
                                .replace(/[^\w\s&\-/().]/g, '')
                                .trim();

                            if (itemName.length >= 2) {
                                const unitPrice = qty > 0 ? Math.round((lastVal / qty) * 100) / 100 : lastVal;
                                items.push({
                                    name: itemName.slice(0, 42),
                                    qty,
                                    unitPrice,
                                    price: lastVal
                                });
                            }
                        }
                    }

                    const itemsSum = items.reduce((acc, it) => acc + it.price, 0);
                    let subtotal = itemsSum > 0 ? itemsSum : (printedSubtotal > 0 ? printedSubtotal : printedTotal);
                    const discount = Math.max(0, printedDiscount);
                    const netBase = Math.max(0, subtotal - discount);

                    let taxPercent = printedTaxPct;
                    if (taxPercent <= 0 && printedTaxNominal > 0 && netBase > 0) {
                        taxPercent = Math.round((printedTaxNominal / netBase) * 1000) / 10;
                    }
                    const taxAmount = Math.round(netBase * (taxPercent / 100) * 100) / 100;
                    let grandTotal = Math.round((netBase + taxAmount) * 100) / 100;

                    if (grandTotal <= 0 && printedTotal > 0) {
                        subtotal = printedTotal;
                        grandTotal = printedTotal;
                    }

                    let suggestedCategory = 'Food';
                    const fullLower = (merchant + ' ' + rawText).toLowerCase();
                    if (/(indomaret|alfamart|superindo|hypermart|carrefour|tokopedia|shopee)/i.test(fullLower)) suggestedCategory = 'Online Shopping';
                    else if (/(pertamina|shell|bp|grab|gojek|bluebird|parkir)/i.test(fullLower)) suggestedCategory = 'Transport';
                    else if (/(pln|pdam|telkom|indihome|xl|telkomsel)/i.test(fullLower)) suggestedCategory = 'Utilities';

                    return {
                        merchant,
                        items,
                        subtotal,
                        discount,
                        taxPercent,
                        taxAmount,
                        grandTotal,
                        suggestedCategory
                    };
                },

                openGoalModal() {
                    this.goalForm = { name: '', target: '', current: 0 };
                    this.showGoalModal = true;
                },

                saveGoal() {
                    const name = stripAllEmojis(this.goalForm.name || '').trim();
                    const target = Number(this.goalForm.target || 0);
                    const current = Math.max(0, Number(this.goalForm.current || 0));
                    if (!name || target <= 0) return;

                    this.goals.push({
                        id: 'goal_' + Date.now(),
                        name,
                        target,
                        current,
                        updated_at: new Date().toISOString()
                    });
                    this.showGoalModal = false;
                    this.saveLocalState(true);
                    this.$nextTick(() => this.refreshIcons());
                    this.showToast(this.lang === 'ID' ? 'Target tabungan dibuat.' : 'Savings goal created.');
                },

                topUpGoal(goalId) {
                    const g = this.goals.find(item => item.id === goalId);
                    if (!g) return;
                    const step = Math.max(10000, Math.round(g.target * 0.1));
                    g.current = Number(g.current || 0) + step;
                    g.updated_at = new Date().toISOString();
                    this.saveLocalState(true);
                    this.showToast(
                        this.lang === 'ID'
                            ? `Menambahkan ${this.formatCurrency(step)} ke ${g.name}.`
                            : `Added ${this.formatCurrency(step)} to ${g.name}.`
                    );
                },

                deleteGoal(goalId) {
                    this.goals = this.goals.filter(g => g.id !== goalId);
                    if (!this.deletedGoalIds.includes(goalId)) this.deletedGoalIds.push(goalId);
                    this.saveLocalState(true);
                },

                openBudgetModal() {
                    this.budgetForm = { category: this.categories[0] || 'Food', limit: '' };
                    this.showBudgetModal = true;
                },

                saveBudget() {
                    const cat = this.budgetForm.category;
                    const limit = Number(this.budgetForm.limit || 0);
                    if (!cat || limit <= 0) return;

                    const existing = this.budgets.find(b => b.category === cat);
                    if (existing) {
                        existing.limit = limit;
                        existing.updated_at = new Date().toISOString();
                    } else {
                        this.budgets.push({
                            id: 'bud_' + Date.now(),
                            category: cat,
                            limit,
                            updated_at: new Date().toISOString()
                        });
                    }
                    this.showBudgetModal = false;
                    this.saveLocalState(true);
                    this.$nextTick(() => this.refreshIcons());
                    this.showToast(this.lang === 'ID' ? 'Batas anggaran disimpan.' : 'Category budget saved.');
                },

                deleteBudget(budgetId) {
                    this.budgets = this.budgets.filter(b => b.id !== budgetId);
                    if (!this.deletedBudgetIds.includes(budgetId)) this.deletedBudgetIds.push(budgetId);
                    this.saveLocalState(true);
                },

                activatePresetRule(presetKey) {

                    if (presetKey === 'save20') {

                            name: this.lang === 'ID' ? 'Sisihkan 20% Pemasukan ke Dana Darurat' : 'Save 20% of Income to Emergency Fund',

                            sourceWallet: '',
                            destWallet: this.banks[0] || 'Bank Jago',
                            thresholdAmount: 500000
                        };
                    } else {

                            minAmount: 0,
                            percent: 20,
                            fixedAmount: 50000,
                            targetGoalName: 'Dana Darurat',

                            sourceWallet: '',
                            destWallet: this.banks[0] || 'Bank Jago',

                saveAutomationRule() {
                    const name = stripAllEmojis(this.ruleForm.name || '').trim();
                    if (!name) return;

                    if (this.editingRuleId) {
                        const idx = this.automationRules.findIndex(r => r.id === this.editingRuleId);
                        if (idx !== -1) {
                            this.automationRules[idx] = {
                                ...this.automationRules[idx],
                                ...this.ruleForm,
                                name,
                                updated_at: new Date().toISOString()
                            };
                        }
                    } else {
                        this.automationRules.push({
                            id: 'rule_' + Date.now(),
                            ...this.ruleForm,
                            name,
                            enabled: true,
                            runCount: 0,
                            updated_at: new Date().toISOString()
                        });
                    }
                    this.showAutomationModal = false;
                    this.editingRuleId = null;
                    this.saveLocalState(true);
                    this.$nextTick(() => this.refreshIcons());
                    this.showToast(this.lang === 'ID' ? 'Aturan Autopilot disimpan.' : 'Autopilot rule saved.');
                },

                toggleRule(ruleId) {
                    const r = this.automationRules.find(item => item.id === ruleId);
                    if (r) {
                        r.enabled = !r.enabled;
                        r.updated_at = new Date().toISOString();
                        this.saveLocalState(true);
                    }
                },

                deleteRule(ruleId) {
                    this.automationRules = this.automationRules.filter(r => r.id !== ruleId);
                    if (!this.deletedRuleIds.includes(ruleId)) this.deletedRuleIds.push(ruleId);
                    this.saveLocalState(true);
                },

                describeRule(rule) {
                    const tType = rule.actionType;
                    if (tType === 'auto_save_goal') {
                        return this.lang === 'ID'
                            ? `Sisihkan ${rule.percent}% dari pemasukan ke target "${rule.targetGoalName}"`
                            : `Allocate ${rule.percent}% of income to goal "${rule.targetGoalName}"`;
                    }
                    if (tType === 'fixed_save_goal') {
                        return this.lang === 'ID'
                            ? `Sisihkan tetap ${this.formatCurrency(rule.fixedAmount)} dari pemasukan ke target "${rule.targetGoalName}"`
                            : `Save fixed ${this.formatCurrency(rule.fixedAmount)} from income to goal "${rule.targetGoalName}"`;
                    }
                    if (tType === 'auto_transfer_wallet') {
                        const fromText = rule.sourceWallet || (this.lang === 'ID' ? 'semua dompet' : 'any wallet');
                        return this.lang === 'ID'
                            ? `Auto-transfer ${rule.percent}% pemasukan dari ${fromText} ke ${rule.destWallet}`
                            : `Auto-transfer ${rule.percent}% of income from ${fromText} to ${rule.destWallet}`;
                    }
                    if (tType === 'expense_save_goal') {
                        return this.lang === 'ID'
                            ? `Sisihkan ${rule.percent}% dari pengeluaran ke target "${rule.targetGoalName}"`
                            : `Allocate ${rule.percent}% of expense to goal "${rule.targetGoalName}"`;
                    }
                    if (tType === 'expense_transfer_wallet') {
                        return this.lang === 'ID'
                            ? `Auto-transfer ${rule.percent}% dari pengeluaran ke dompet ${rule.destWallet}`
                            : `Auto-transfer ${rule.percent}% of expense to wallet ${rule.destWallet}`;
                    }
                    if (tType === 'spend_alert') {
                        return this.lang === 'ID'
                            ? `Peringatan otomatis jika pengeluaran melebihi ${this.formatCurrency(rule.thresholdAmount)}`
                            : `Alert when single expense exceeds ${this.formatCurrency(rule.thresholdAmount)}`;
                    }
                    if (tType === 'category_spend_alert') {
                        return this.lang === 'ID'
                            ? `Peringatan otomatis jika kategori "${rule.targetCategory}" melebihi ${this.formatCurrency(rule.thresholdAmount)}`
                            : `Alert when "${rule.targetCategory}" expense exceeds ${this.formatCurrency(rule.thresholdAmount)}`;
                    }
                    return tType;
                },

                upsertGoalByRule(goalName, addAmount) {
                    if (!addAmount || addAmount <= 0) return;
                    const cleanName = stripAllEmojis(goalName || 'Dana Darurat').trim();
                    let goal = this.goals.find(g => g.name.toLowerCase() === cleanName.toLowerCase());
                    if (!goal) {
                        goal = {
                            id: 'goal_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                            name: cleanName,
                            target: Math.max(1000000, addAmount * 10),
                            current: 0,
                            updated_at: new Date().toISOString()
                        };
                        this.goals.push(goal);
                    }
                    goal.current = Number(goal.current || 0) + addAmount;
                    goal.updated_at = new Date().toISOString();
                },

                executeAutopilotRules(tx) {
                    if (!tx || tx._isAutopilotGenerated) return;
                    for (const rule of this.automationRules) {
                        if (!rule.enabled) continue;
                        const tType = rule.actionType;
                        const minTrigger = Number(rule.minAmount || 0);

                        if (tType === 'auto_save_goal' && tx.type === 'income' && tx.amount >= minTrigger) {
                            const addAmt = Math.round(tx.amount * (Number(rule.percent || 0) / 100));
                            this.upsertGoalByRule(rule.targetGoalName, addAmt);
                            rule.runCount = Number(rule.runCount || 0) + 1;
                            rule.updated_at = new Date().toISOString();
                        } else if (tType === 'fixed_save_goal' && tx.type === 'income' && tx.amount >= minTrigger) {
                            const addAmt = Math.round(Number(rule.fixedAmount || 0));
                            this.upsertGoalByRule(rule.targetGoalName, addAmt);
                            rule.runCount = Number(rule.runCount || 0) + 1;
                            rule.updated_at = new Date().toISOString();
                        } else if (tType === 'auto_transfer_wallet' && tx.type === 'income' && tx.amount >= minTrigger) {
                            if (!rule.sourceWallet || rule.sourceWallet === tx.account) {
                                const tfAmt = Math.round(tx.amount * (Number(rule.percent || 0) / 100));
                                const dest = rule.destWallet || this.banks[0];
                                if (tfAmt > 0 && dest && dest !== tx.account) {
                                    this.transactions.unshift({
                                        id: 'tx_auto_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                                        amount: tfAmt,
                                        type: 'transfer',
                                        category: 'Transfer',
                                        account: tx.account,
                                        toAccount: dest,
                                        adminFee: 0,
                                        note: `Autopilot: ${rule.name}`,
                                        date: this.getLocalDateTimeInput().replace('T', ' '),
                                        updated_at: new Date().toISOString(),
                                        _isAutopilotGenerated: true
                                    });
                                    rule.runCount = Number(rule.runCount || 0) + 1;
                                    rule.updated_at = new Date().toISOString();
                                }
                            }
                        } else if (tType === 'expense_save_goal' && (tx.type === 'expense' || tx.type === 'withdrawal') && tx.amount >= minTrigger) {
                            const addAmt = Math.round(tx.amount * (Number(rule.percent || 0) / 100));
                            this.upsertGoalByRule(rule.targetGoalName, addAmt);
                            rule.runCount = Number(rule.runCount || 0) + 1;
                            rule.updated_at = new Date().toISOString();
                        } else if (tType === 'expense_transfer_wallet' && (tx.type === 'expense' || tx.type === 'withdrawal') && tx.amount >= minTrigger) {
                            const tfAmt = Math.round(tx.amount * (Number(rule.percent || 0) / 100));
                            const dest = rule.destWallet || this.banks[0];
                            if (tfAmt > 0 && dest && dest !== tx.account) {
                                this.transactions.unshift({
                                    id: 'tx_auto_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                                    amount: tfAmt,
                                    type: 'transfer',
                                    category: 'Transfer',
                                    account: tx.account,
                                    toAccount: dest,
                                    adminFee: 0,
                                    note: `Autopilot: ${rule.name}`,
                                    date: this.getLocalDateTimeInput().replace('T', ' '),
                                    updated_at: new Date().toISOString(),
                                    _isAutopilotGenerated: true
                                });
                                rule.runCount = Number(rule.runCount || 0) + 1;
                                rule.updated_at = new Date().toISOString();
                            }
                        } else if (tType === 'spend_alert' && (tx.type === 'expense' || tx.type === 'withdrawal') && tx.amount >= Number(rule.thresholdAmount || 0)) {
                            rule.runCount = Number(rule.runCount || 0) + 1;
                            rule.updated_at = new Date().toISOString();
                            this.showToast(
                                this.lang === 'ID'
                                    ? `Autopilot Alert: Pengeluaran ${this.formatCurrency(tx.amount)} melebihi batas!`
                                    : `Autopilot Alert: Expense ${this.formatCurrency(tx.amount)} exceeded limit!`
                            );
                        } else if (tType === 'category_spend_alert' && (tx.type === 'expense' || tx.type === 'withdrawal') && tx.category === rule.targetCategory && tx.amount >= Number(rule.thresholdAmount || 0)) {
                            rule.runCount = Number(rule.runCount || 0) + 1;
                            rule.updated_at = new Date().toISOString();
                            this.showToast(
                                this.lang === 'ID'
                                    ? `Autopilot Alert (${tx.category}): ${this.formatCurrency(tx.amount)} melebihi batas!`
                                    : `Autopilot Alert (${tx.category}): ${this.formatCurrency(tx.amount)} exceeded limit!`
                            );
                        }
                    }
                },

                async fetchReportHistory() {
                    this.reportFileLogs = await _dndLocalDb.listReportFiles(this.resolvedAccountKey);
                    this.receiptScanLogs = await _dndLocalDb.listReceiptScans(this.resolvedAccountKey);
                    try {
                        const res = await fetchWithTimeout(
                            `/api/db/history/${encodeURIComponent(this.resolvedAccountKey)}`,
                            {},
                            4000
                        );
                        if (res.ok) {
                            const data = await res.json();
                            if (Array.isArray(data.report_files) && data.report_files.length > 0) {
                                const mergedRep = new Map();
                                [...data.report_files, ...this.reportFileLogs].forEach(r => {
                                    if (r && r.id) mergedRep.set(r.id, r);
                                });
                                this.reportFileLogs = Array.from(mergedRep.values()).slice(0, 40);
                            }
                            if (Array.isArray(data.receipt_scans) && data.receipt_scans.length > 0) {
                                const mergedScan = new Map();
                                [...data.receipt_scans, ...this.receiptScanLogs].forEach(s => {
                                    if (s && s.id) mergedScan.set(s.id, s);
                                });
                                this.receiptScanLogs = Array.from(mergedScan.values()).slice(0, 30);
                            }
                        }
                    } catch (e) {}
                },

                async handleReportImport(event) {
                    const file = event.target.files && event.target.files[0];
                    event.target.value = '';
                    if (!file) return;

                    this.isImportingReport = true;
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const sha256 = await computeSha256Short(arrayBuffer);
                        const lowerName = file.name.toLowerCase();
                        let importedTxs = [];
                        let fileFormat = 'EXCEL';

                        if (lowerName.endsWith('.pdf')) {
                            fileFormat = 'PDF';
                            importedTxs = await this.parsePdfBufferToTransactions(arrayBuffer, file.name);
                        } else {
                            fileFormat = lowerName.endsWith('.csv') ? 'CSV' : 'EXCEL';
                            importedTxs = this.parseExcelBufferToTransactions(arrayBuffer, file.name);
                        }

                        if (importedTxs.length === 0) {
                            this.showToast(
                                this.lang === 'ID'
                                    ? 'Tidak ditemukan baris transaksi valid pada file tersebut.'
                                    : 'No valid transaction rows found in the uploaded file.'
                            );
                            return;
                        }

                        for (const tx of importedTxs) {
                            this.transactions.unshift(tx);
                            if (tx.account && !this.banks.includes(tx.account)) this.banks.push(tx.account);
                            if (tx.category && tx.category !== 'Transfer' && !this.categories.includes(tx.category)) {
                                this.categories.push(tx.category);
                            }
                        }

                        const impIncome = importedTxs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
                        const impExpense = importedTxs.filter(t => t.type !== 'income' && t.type !== 'transfer').reduce((s, t) => s + t.amount, 0);

                        const repRecord = {
                            id: 'rep_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                            account_key: this.resolvedAccountKey,
                            filename: stripAllEmojis(file.name),
                            file_format: fileFormat,
                            direction: 'IMPORT',
                            tx_count: importedTxs.length,
                            total_income: impIncome,
                            total_expense: impExpense,
                            net_balance: impIncome - impExpense,
                            checksum_sha256: sha256,
                            created_at: new Date().toISOString()
                        };
                        await _dndLocalDb.addReportFile(repRecord);
                        fetchWithTimeout('/api/db/report', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(repRecord)
                        }, 4000).catch(() => {});

                        await this.fetchReportHistory();
                        this.saveLocalState(true);
                        this.$nextTick(() => {
                            this.refreshIcons();
                            this.updateAllCharts();
                        });

                        this.showToast(
                            this.lang === 'ID'
                                ? `Berhasil mengimpor ${importedTxs.length} transaksi dari ${fileFormat}.`
                                : `Successfully imported ${importedTxs.length} transactions from ${fileFormat}.`
                        );
                    } catch (err) {
                        this.showToast(this.lang === 'ID' ? 'Gagal memproses file laporan.' : 'Failed to parse report file.');
                    } finally {
                        this.isImportingReport = false;
                    }
                },

                parseExcelBufferToTransactions(arrayBuffer, filename) {
                    if (!window.XLSX) return [];
                    const wb = window.XLSX.read(arrayBuffer, { type: 'array' });
                    let bestSheetName = wb.SheetNames[0];
                    for (const name of wb.SheetNames) {
                        if (/(transaksi|ledger|buku|kas|statement|mutasi)/i.test(name)) {
                            bestSheetName = name;
                            break;
                        }
                    }
                    const sheet = wb.Sheets[bestSheetName];
                    const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                    if (!rows || rows.length < 2) return [];

                    let headerIdx = 0;
                    for (let i = 0; i < Math.min(12, rows.length); i++) {
                        const joined = rows[i].map(c => String(c || '').toLowerCase()).join(' ');
                        if (/(tanggal|date|nominal|amount|jumlah|keterangan|note|kategori|category|debit|kredit)/i.test(joined)) {
                            headerIdx = i;
                            break;
                        }
                    }

                    const headers = rows[headerIdx].map(h => String(h || '').trim().toLowerCase());
                    const findCol = (patterns) => headers.findIndex(h => patterns.some(p => h.includes(p)));

                    const colDate = findCol(['tanggal', 'date', 'waktu', 'tgl']);
                    const colType = findCol(['jenis', 'type', 'tipe', 'arus']);
                    const colCat = findCol(['kategori', 'category']);
                    const colWallet = findCol(['dompet', 'wallet', 'rekening', 'account', 'bank']);
                    const colNote = findCol(['catatan', 'note', 'keterangan', 'deskripsi', 'description', 'uraian']);
                    const colAmount = findCol(['nominal', 'amount', 'jumlah', 'nilai', 'total']);
                    const colDebit = findCol(['debit', 'keluar', 'outflow', 'expense']);
                    const colCredit = findCol(['kredit', 'credit', 'masuk', 'inflow', 'income']);

                    const results = [];
                    for (let r = headerIdx + 1; r < rows.length; r++) {
                        const row = rows[r];
                        if (!row || row.every(cell => String(cell || '').trim() === '')) continue;

                        let amount = 0;
                        let type = 'expense';

                        if (colAmount !== -1 && row[colAmount] !== '') {
                            const rawAmt = String(row[colAmount]).replace(/[^\d.,-]/g, '');
                            const numVal = parseFloat(rawAmt.replace(/\./g, '').replace(',', '.')) || 0;
                            amount = Math.abs(numVal);
                            if (numVal < 0) type = 'expense';
                        } else if (colCredit !== -1 || colDebit !== -1) {
                            const cr = colCredit !== -1 ? Number(String(row[colCredit] || '').replace(/[^\d]/g, '')) || 0 : 0;
                            const db = colDebit !== -1 ? Number(String(row[colDebit] || '').replace(/[^\d]/g, '')) || 0 : 0;
                            if (cr > 0) {
                                amount = cr;
                                type = 'income';
                            } else if (db > 0) {
                                amount = db;
                                type = 'expense';
                            }
                        }

                        if (!amount || amount <= 0) continue;

                        if (colType !== -1 && row[colType]) {
                            const tStr = String(row[colType]).toLowerCase();
                            if (/(income|pemasukan|masuk|cr|kredit)/.test(tStr)) type = 'income';
                            else if (/(transfer|tf)/.test(tStr)) type = 'transfer';
                            else type = 'expense';
                        }

                        const rawDate = colDate !== -1 && row[colDate] ? String(row[colDate]).trim() : '';
                        const dateClean = /^\d{4}-\d{2}-\d{2}/.test(rawDate)
                            ? (rawDate.length === 10 ? `${rawDate} 12:00` : rawDate.slice(0, 16))
                            : this.getLocalDateTimeInput().replace('T', ' ');

                        const cat = colCat !== -1 && row[colCat]
                            ? stripAllEmojis(String(row[colCat])).trim()
                            : (type === 'income' ? 'Salary' : 'Food');

                        const wallet = colWallet !== -1 && row[colWallet]
                            ? stripAllEmojis(String(row[colWallet])).trim()
                            : (this.banks[0] || 'Bank BCA');

                        const note = colNote !== -1 && row[colNote]
                            ? stripAllEmojis(String(row[colNote])).trim()
                            : `Impor ${stripAllEmojis(filename)}`;

                        results.push({
                            id: 'tx_imp_' + Date.now() + '_' + r + '_' + Math.random().toString(36).slice(2, 5),
                            amount: Math.round(amount),
                            type,
                            category: cat || (type === 'income' ? 'Salary' : 'Food'),
                            account: wallet || this.banks[0],
                            toAccount: '',
                            adminFee: 0,
                            note,
                            date: dateClean,
                            updated_at: new Date().toISOString()
                        });
                    }
                    return results;
                },

                async parsePdfBufferToTransactions(arrayBuffer, filename) {
                    if (!window.pdfjsLib) return [];
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = '';
                    for (let p = 1; p <= pdf.numPages; p++) {
                        const page = await pdf.getPage(p);
                        const content = await page.getTextContent();
                        const strings = content.items.map(it => it.str);
                        fullText += strings.join(' ') + '\n';
                    }

                    const results = [];
                    const lineCandidates = fullText.split(/\n|(?=\d{4}-\d{2}-\d{2})|(?=\d{2}\/\d{2}\/\d{4})/);

                    for (let i = 0; i < lineCandidates.length; i++) {
                        const line = stripAllEmojis(lineCandidates[i]).trim();
                        if (line.length < 8) continue;
                        if (/(total|ringkasan|summary|saldo bersih|net balance|halaman|page)/i.test(line)) continue;

                        const moneyMatches = line.match(/(?:rp\.?\s*)?\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?/gi);
                        if (!moneyMatches || !moneyMatches.length) continue;

                        const lastMoney = moneyMatches[moneyMatches.length - 1].replace(/[^\d]/g, '');
                        const amount = Number(lastMoney || 0);
                        if (amount <= 0 || amount > 100000000000) continue;

                        const lower = line.toLowerCase();
                        let type = 'expense';
                        if (/(income|pemasukan|gaji|salary|masuk|\+\s*rp|kredit|\bcr\b)/i.test(lower)) type = 'income';
                        else if (/(transfer|tf)/i.test(lower)) type = 'transfer';

                        const dateMatch = line.match(/(\d{4}-\d{2}-\d{2})/);
                        const dateStr = dateMatch ? `${dateMatch[1]} 12:00` : this.getLocalDateTimeInput().replace('T', ' ');

                        let matchedWallet = this.banks[0] || 'Bank BCA';
                        for (const b of this.banks) {
                            if (lower.includes(b.toLowerCase())) {
                                matchedWallet = b;
                                break;
                            }
                        }

                        let matchedCat = type === 'income' ? 'Salary' : 'Food';
                        for (const c of this.categories) {
                            if (lower.includes(c.toLowerCase())) {
                                matchedCat = c;
                                break;
                            }
                        }

                        const noteClean = line
                            .replace(/\d{4}-\d{2}-\d{2}(?:\s+\d{2}:\d{2})?/g, '')
                            .replace(/(?:rp\.?\s*)?\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?/gi, '')
                            .replace(/\s{2,}/g, ' ')
                            .trim()
                            .slice(0, 60) || `PDF Import (${stripAllEmojis(filename)})`;

                        results.push({
                            id: 'tx_pdf_' + Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2, 5),
                            amount,
                            type,
                            category: matchedCat,
                            account: matchedWallet,
                            toAccount: '',
                            adminFee: 0,
                            note: noteClean,
                            date: dateStr,
                            updated_at: new Date().toISOString()
                        });
                    }
                    return results;
                },

                buildCorporateKpiReportData() {
                    this.computeQuantitativeIntelligenceLocal();
                    const now = new Date();
                    const pad = n => String(n).padStart(2, '0');
                    const reportPeriod = `${now.toLocaleString(this.lang === 'ID' ? 'id-ID' : 'en-US', { month: 'long', year: 'numeric' })}`;
                    const generatedAt = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
                    const docRef = `DND-FIN-KPI-${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${String(now.getHours())}${String(now.getMinutes())}`;

                    const totalIn = this.totalIncome;
                    const totalOut = this.totalExpense + this.totalWithdrawal;
                    const netCash = this.totalBalance;
                    const expenseRatio = totalIn > 0 ? Math.round((totalOut / totalIn) * 1000) / 10 : (totalOut > 0 ? 100 : 0);
                    const totalTransferVolume = this.transactions
                        .filter(tx => tx.type === 'transfer')
                        .reduce((sum, tx) => sum + Number(tx.amount || 0), 0);

                    const walletRows = this.banks.map((b, i) => {
                        const bal = this.getWalletBalance(b);
                        const sharePct = netCash > 0 ? Math.max(0, Math.round((bal / netCash) * 1000) / 10) : 0;
                        return {
                            no: i + 1,
                            account: b,
                            balance: bal,
                            sharePct
                        };
                    });

                    const budgetRows = this.budgets.map((b, i) => {
                        const spent = this.getCategorySpent(b.category);
                        const limit = Number(b.limit || 0);
                        const variance = limit - spent;
                        const utilPct = limit > 0 ? Math.round((spent / limit) * 1000) / 10 : 0;
                        const status = utilPct > 100
                            ? 'OVER BUDGET'
                            : (utilPct >= 80 ? 'WARNING' : 'ON TRACK');
                        return {
                            no: i + 1,
                            category: b.category,
                            limit,
                            spent,
                            variance,
                            utilPct,
                            status
                        };
                    });

                    const categoryRows = this.allCategorySummary.map((item, i) => {
                        const matchingTxs = this.transactions.filter(
                            tx => (tx.category || 'Other') === item.category &&
                                ((item.type === 'income' && tx.type === 'income') ||
                                 (item.type === 'expense' && (tx.type === 'expense' || tx.type === 'withdrawal')))
                        );
                        const count = matchingTxs.length;
                        const avgPerTx = count > 0 ? Math.round(item.amount / count) : 0;
                        return {
                            no: i + 1,
                            typeLabel: item.type === 'income' ? (this.lang === 'ID' ? 'Pemasukan (Revenue)' : 'Revenue (Inflow)') : (this.lang === 'ID' ? 'Pengeluaran (OPEX)' : 'Expense (Outflow)'),
                            category: item.category,
                            count,
                            total: item.amount,
                            avgPerTx,
                            sharePct: item.percent
                        };
                    });

                    const ledgerRows = this.transactions.map((tx, i) => {
                        const amt = Number(tx.amount || 0);
                        const fee = Number(tx.adminFee || tx.admin_fee || 0);
                        const isCredit = tx.type === 'income';
                        const isDebit = tx.type === 'expense' || tx.type === 'withdrawal';
                        const typeLabel = tx.type === 'income'
                            ? 'CREDIT / INFLOW'
                            : (tx.type === 'transfer' ? 'INTERNAL TRANSFER' : 'DEBIT / OUTFLOW');

                        return {
                            no: i + 1,
                            id: tx.id || `TX-${i + 1}`,
                            date: tx.date || '',
                            typeLabel,
                            category: tx.category || '-',
                            account: tx.account || '-',
                            toAccount: tx.toAccount || '-',
                            credit: isCredit ? amt : 0,
                            debit: isDebit ? amt : 0,
                            transferAmt: tx.type === 'transfer' ? amt : 0,
                            adminFee: fee,
                            note: stripAllEmojis(tx.note || tx.category || '-')
                        };
                    });

                    return {
                        docRef,
                        reportPeriod,
                        generatedAt,
                        entityName: this.displayUserName,
                        accountEmail: this.googleUser ? this.googleUser.email : 'Local / Shared Workspace',
                        currency: this.currency,
                        totalIn,
                        totalOut,
                        netCash,
                        expenseRatio,
                        totalTransferVolume,
                        walletRows,
                        budgetRows,
                        categoryRows,
                        ledgerRows
                    };
                },
