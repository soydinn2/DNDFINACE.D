<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DND Finance — Personal Wealth & Cashflow Ledger</title>
    
    <!-- PWA & Mobile App Meta -->
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        cream: {
                            50: '#FFFFFF',
                            100: '#F8FAFC',
                            200: '#E2E8F0',
                            300: '#CBD5E1',
                            400: '#94A3B8',
                            500: '#64748B',
                            700: '#334155',
                            900: '#0F172A',
                        },
                        obsidian: {
                            950: '#0A0D12',
                            900: '#10141B',
                            850: '#161C26',
                            800: '#1E2633',
                            700: '#2A3444',
                        },
                        royal: {
                            50: '#EFF6FF',
                            100: '#DBEAFE',
                            500: '#3B82F6',
                            600: '#2563EB',
                            700: '#1D4ED8',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(15, 23, 42, 0.05)',
                        'card': '0 2px 10px rgba(15, 23, 42, 0.03)',
                        'float': '0 10px 30px -5px rgba(37, 99, 235, 0.25)',
                    }
                }
            }
        }
    </script>

    <!-- Google Identity Services (Browser OAuth2 & One-Tap / FedCM) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <!-- SheetJS (Excel Export Fallback) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- jsPDF (PDF Export Fallback) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            background-color: #FFFFFF;
            color: #0F172A;
        }
        html.dark body {
            background-color: #0A0D12;
            color: #F8FAFC;
        }
        h1, h2, h3, .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .pt-safe {
            padding-top: env(safe-area-inset-top, 12px);
        }
        [x-cloak] {
            display: none !important;
        }
        .dnd-brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .dnd-brand-mark svg {
            width: 40px;
            height: 22px;
        }
    </style>
</head>
<body class="antialiased selection:bg-royal-600 selection:text-white transition-colors duration-200"
      x-data="dndFinanceApp()" 
      x-init="initApp()">

    <!-- ========================================== -->
    <!-- TOP HEADER NAVIGATION                      -->
    <!-- ========================================== -->
    <header class="sticky top-0 z-30 bg-white/95 dark:bg-obsidian-950/90 backdrop-blur-md border-b border-cream-200 dark:border-obsidian-800 pt-safe transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 h-16 flex items-center justify-between gap-1.5 sm:gap-2">
            <!-- Brand Logo (Custom Interlocking DND Monogram) -->
            <div class="flex items-center gap-2 cursor-pointer shrink-0" @click="setTab('dashboard')">
                <div class="dnd-brand-mark text-cream-900 dark:text-white">
                    <svg viewBox="0 0 320 175" xmlns="http://www.w3.org/2000/svg" aria-label="DND Logo">
                        <path fill="currentColor" d="M 10,12 C 26,18 32,28 32,48 L 32,126 C 32,146 26,156 10,162 L 66,162 C 110,162 132,138 132,108 C 132,90 124,76 112,66 L 112,92 C 115,99 116,105 116,112 C 116,138 98,155 64,155 L 36,155 C 45,147 49,136 49,120 L 49,20 L 66,20 C 78,20 89,24 98,32 L 185,144 C 194,155 206,162 224,162 L 244,162 C 288,162 312,131 312,87 C 312,43 288,12 244,12 L 210,12 L 210,20 L 242,20 C 276,20 293,48 293,87 C 293,126 276,154 242,154 L 224,154 C 213,154 205,149 197,139 L 111,29 C 100,16 86,12 66,12 Z" />
                        <path fill="currentColor" d="M 199,12 C 185,18 179,28 179,48 L 179,98 L 199,124 Z" />
                    </svg>
                </div>
                <span class="font-display font-bold text-xs sm:text-base tracking-tight text-cream-900 dark:text-white truncate max-w-[92px] sm:max-w-[180px]" x-text="pageTitle"></span>
            </div>

            <!-- Desktop Center Navigation -->
            <nav class="hidden md:flex items-center bg-cream-100 dark:bg-obsidian-900 p-1 rounded-xl border border-cream-200 dark:border-obsidian-800">
                <button @click="setTab('dashboard')" :class="activeTab === 'dashboard' ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-xs font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all" x-text="t('nav_home')"></button>
                <button @click="setTab('analytics')" :class="activeTab === 'analytics' ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-xs font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all" x-text="t('nav_analytics')"></button>
                <button @click="setTab('transactions')" :class="activeTab === 'transactions' ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-xs font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all" x-text="t('nav_records')"></button>
                <button @click="setTab('planning')" :class="activeTab === 'planning' ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-xs font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all" x-text="t('nav_goals')"></button>
                <button @click="setTab('automation')" :class="activeTab === 'automation' ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-xs font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all">Autopilot</button>
                <button @click="setTab('more')" :class="['more', 'tools', 'settings'].includes(activeTab) ? 'bg-white dark:bg-obsidian-800 text-royal-600 dark:text-royal-500 shadow-xs font-semibold' : 'text-cream-500 dark:text-slate-400 hover:text-cream-900 dark:hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-sm transition-all" x-text="t('nav_menu')"></button>
            </nav>

            <!-- Top Right Controls: Language ID/EN, Google Auth, Theme Toggle, Report Export -->
            <div class="flex items-center gap-1 sm:gap-2">
                <!-- Quick Bilingual ID / EN Switcher -->
                <button @click="toggleLanguage()"
                        :title="lang === 'ID' ? 'Switch to English' : 'Ganti ke Bahasa Indonesia'"
                        class="h-8 sm:h-9 px-2 sm:px-2.5 rounded-full bg-cream-100 dark:bg-obsidian-900 hover:bg-royal-50 dark:hover:bg-obsidian-800 border border-cream-200 dark:border-obsidian-700 flex items-center gap-1 text-[11px] font-bold tracking-wide text-cream-800 dark:text-slate-200 transition-colors shrink-0">
                    <span :class="lang === 'ID' ? 'text-royal-600 dark:text-royal-400' : 'opacity-45'">ID</span>
                    <span class="opacity-30">/</span>
                    <span :class="lang === 'EN' ? 'text-royal-600 dark:text-royal-400' : 'opacity-45'">EN</span>
                </button>

                <!-- Google Account Status Button (Direct In-Browser Sign In) -->
                <button @click="handleGoogleHeaderClick()" :disabled="isGoogleSigningIn"
                        class="flex items-center gap-1.5 px-2 sm:px-2.5 py-1.5 rounded-full bg-cream-100 dark:bg-obsidian-900 hover:bg-cream-200/70 dark:hover:bg-obsidian-800 border border-cream-200 dark:border-obsidian-700 text-[11px] sm:text-xs font-medium text-cream-900 dark:text-slate-200 transition-colors max-w-[125px] sm:max-w-[200px] disabled:opacity-60">
                    <template x-if="!googleUser">
                        <span class="flex items-center gap-1.5 truncate">
                            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
                                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24Z"/>
                                <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14Z"/>
                                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96Z"/>
                            </svg>
                            <span class="truncate" x-text="isGoogleSigningIn ? t('connecting_google') : t('sign_in_google')"></span>
                        </span>
                    </template>
                    <template x-if="googleUser">
                        <span class="flex items-center gap-1.5 truncate">
                            <img :src="googleUser.picture || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(displayUserName)" alt="Profile" class="w-4 h-4 rounded-full object-cover shrink-0">
                            <span class="truncate font-semibold" x-text="displayUserName"></span>
                        </span>
                    </template>
                </button>

                <!-- Theme Toggle Button -->
                <button @click="toggleTheme()" 
                        :title="isDarkMode ? t('theme_white') : t('theme_black')"
                        class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-cream-100 dark:bg-obsidian-900 hover:bg-cream-200 dark:hover:bg-obsidian-800 border border-cream-200 dark:border-obsidian-700 flex items-center justify-center text-cream-700 dark:text-slate-300 transition-colors shrink-0">
                    <i data-lucide="moon" x-show="!isDarkMode" class="w-4 h-4"></i>
                    <i data-lucide="sun" x-show="isDarkMode" class="w-4 h-4 text-amber-400"></i>
                </button>

                <!-- Export Report Menu Button -->
                <div class="relative" x-data="{ openExport: false }">
                    <button @click="openExport = !openExport" 
                            class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-royal-600 hover:bg-royal-700 text-white flex items-center justify-center shadow-xs transition-colors shrink-0" 
                            :title="t('export_report')">
                        <i data-lucide="download" class="w-4 h-4"></i>
                    </button>
                    <div x-show="openExport" @click.away="openExport = false" x-cloak
                         class="absolute right-0 mt-2 w-56 rounded-2xl bg-white dark:bg-obsidian-900 border border-cream-200 dark:border-obsidian-700 shadow-xl py-2 z-50">
                        <div class="px-3 py-1.5 text-[11px] font-semibold uppercase tracking-wider text-cream-400 dark:text-slate-500" x-text="t('export_report')"></div>
                        <button @click="exportToExcel(); openExport = false" class="w-full px-3.5 py-2.5 text-left text-xs font-medium text-cream-900 dark:text-slate-200 hover:bg-cream-100 dark:hover:bg-obsidian-800 flex items-center gap-2.5">
                            <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i>
                            <span x-text="t('export_excel')"></span>
                        </button>
                        <button @click="exportToPDF(); openExport = false" class="w-full px-3.5 py-2.5 text-left text-xs font-medium text-cream-900 dark:text-slate-200 hover:bg-cream-100 dark:hover:bg-obsidian-800 flex items-center gap-2.5">
                            <i data-lucide="file-text" class="w-4 h-4 text-rose-600"></i>
                            <span x-text="t('export_pdf')"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- MAIN CONTENT CONTAINER                     -->
    <!-- ========================================== -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-5 pb-28 md:pb-12">

        <!-- ========================================== -->
        <!-- 1. DASHBOARD VIEW                          -->
        <!-- ========================================== -->
        <div x-show="activeTab === 'dashboard'" x-transition.opacity.duration.200ms class="space-y-5">
            
            <!-- Minimalist Stacked Time Greeting (No Trailing Comma) & Edit Nickname Button -->
            <div class="flex items-center justify-between gap-3 px-0.5">
                <div @click="openNicknameModal()" class="min-w-0 cursor-pointer">
                    <p class="text-xs sm:text-sm font-medium text-cream-500 dark:text-slate-400" x-text="timeGreeting"></p>
                    <h2 class="font-display text-lg sm:text-xl font-bold tracking-tight text-cream-900 dark:text-white truncate" x-text="displayGreetingName"></h2>
                </div>
                <button @click="openNicknameModal()"
                        class="shrink-0 px-3.5 py-1.5 rounded-full bg-white dark:bg-obsidian-900 hover:bg-cream-50 dark:hover:bg-obsidian-800 border border-cream-200 dark:border-obsidian-700 text-xs font-medium text-cream-600 dark:text-slate-300 transition-colors"
                        x-text="t('edit_nickname')"></button>
            </div>

            <!-- Hero Net Balance Card -->
            <div class="relative overflow-hidden rounded-3xl bg-white dark:bg-obsidian-900 border border-cream-200 dark:border-obsidian-800 p-6 sm:p-7 shadow-soft">
                <div class="absolute -right-10 -top-10 w-44 h-44 rounded-full bg-royal-500/10 blur-2xl pointer-events-none"></div>
                <div class="relative z-10 flex flex-col md:flex-row md:items-center md:justify-between gap-6">
                    <div>
                        <div class="flex items-center gap-2 mb-1.5">
                            <span class="text-xs font-semibold uppercase tracking-wider text-cream-500 dark:text-slate-400" x-text="t('net_total_balance')"></span>
                            <button @click="hideBalances = !hideBalances" class="text-cream-400 hover:text-cream-700 dark:hover:text-slate-200">
                                <i data-lucide="eye" x-show="!hideBalances" class="w-3.5 h-3.5"></i>
                                <i data-lucide="eye-off" x-show="hideBalances" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                        <h1 class="font-display text-3xl sm:text-4xl font-extrabold tracking-tight text-cream-900 dark:text-white">
                            <span x-text="hideBalances ? '••••••••' : formatCurrency(totalBalance)"></span>
                        </h1>
                        <p class="text-xs text-cream-500 dark:text-slate-400 mt-1.5 flex items-center gap-1.5">
                            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
                            <span x-text="transactions.length + ' ' + t('recorded_transactions')"></span>
                        </p>
                    </div>

                    <!-- Income & Expense Mini Summary Pills -->
                    <div class="grid grid-cols-2 gap-3 sm:w-auto">
                        <div class="bg-cream-50 dark:bg-obsidian-850 border border-cream-200/80 dark:border-obsidian-800 rounded-2xl p-3.5 min-w-[140px]">
                            <div class="flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400 text-xs font-semibold mb-1">
                                <i data-lucide="arrow-down-left" class="w-3.5 h-3.5"></i>
                                <span x-text="t('income')"></span>
                            </div>
                            <p class="font-display font-bold text-sm sm:text-base text-cream-900 dark:text-white" x-text="hideBalances ? '••••••' : formatCurrency(totalIncome)"></p>
                        </div>
                        <div class="bg-cream-50 dark:bg-obsidian-850 border border-cream-200/80 dark:border-obsidian-800 rounded-2xl p-3.5 min-w-[140px]">
                            <div class="flex items-center gap-1.5 text-rose-600 dark:text-rose-400 text-xs font-semibold mb-1">
                                <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
                                <span x-text="t('expense')"></span>
                            </div>
                            <p class="font-display font-bold text-sm sm:text-base text-cream-900 dark:text-white" x-text="hideBalances ? '••••••' : formatCurrency(totalExpense + totalWithdrawal)"></p>
                        </div>
                    </div>
                </div>

                <!-- Quick Action Buttons Row -->
                <div class="relative z-10 grid grid-cols-3 gap-2.5 mt-6 pt-5 border-t border-cream-200/80 dark:border-obsidian-800">
                    <button @click="openTxModal('income')" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-royal-600 hover:bg-royal-700 text-white text-xs sm:text-sm font-semibold shadow-xs transition-all active:scale-[0.98]">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M8 12h8"></path>
                            <path d="M12 8v8"></path>
                        </svg>
                        <span x-text="t('btn_income')"></span>
                    </button>
                    <button @click="openTxModal('expense')" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-cream-100 dark:bg-obsidian-800 hover:bg-cream-200 dark:hover:bg-obsidian-700 text-cream-900 dark:text-white text-xs sm:text-sm font-semibold transition-all active:scale-[0.98]">
                        <svg class="w-4 h-4 shrink-0 text-rose-600 dark:text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M8 12h8"></path>
                        </svg>
                        <span x-text="t('btn_expense')"></span>
                    </button>
                    <button @click="openTxModal('transfer')" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-cream-100 dark:bg-obsidian-800 hover:bg-cream-200 dark:hover:bg-obsidian-700 text-cream-900 dark:text-white text-xs sm:text-sm font-semibold transition-all active:scale-[0.98]">
                        <svg class="w-4 h-4 shrink-0 text-royal-600 dark:text-royal-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M8 3 4 7l4 4"></path>
                            <path d="M4 7h16"></path>
                            <path d="m16 21 4-4-4-4"></path>
                            <path d="M20 17H4"></path>
                        </svg>
                        <span x-text="t('btn_transfer')"></span>
                    </button>
                </div>
            </div>

            <!-- Horizontal Wallets & Banks Strip -->
            <div>
                <div class="flex items-center justify-between mb-3">
                    <h2 class="font-display font-bold text-sm sm:text-base text-cream-900 dark:text-white" x-text="t('my_wallets')"></h2>
                    <button @click="openWalletModal()" class="text-xs font-semibold text-royal-600 dark:text-royal-500 hover:underline flex items-center gap-1">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span x-text="t('add_wallet')"></span>
                    </button>
                </div>
                <div class="flex gap-3 overflow-x-auto no-scrollbar pb-1">
                    <template x-for="bank in banks" :key="bank">
                        <div class="shrink-0 w-44 bg-white dark:bg-obsidian-900 border border-cream-200 dark:border-obsidian-800 rounded-2xl p-4 shadow-card hover:border-royal-500/50 transition-colors">
                            <div class="flex items-center justify-between mb-3">
                                <span class="w-8 h-8 rounded-xl bg-royal-50 dark:bg-royal-500/10 text-royal-600 dark:text-royal-500 flex items-center justify-center font-bold text-xs" x-text="bank.substring(0,2).toUpperCase()"></span>
                                <span class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-cream-100 dark:bg-obsidian-800 text-cream-500 dark:text-slate-400" x-text="currency"></span>
                            </div>
                            <p class="text-xs font-medium text-cream-500 dark:text-slate-400 truncate" x-text="bank"></p>
                            <p class="font-display font-bold text-sm text-cream-900 dark:text-white mt-0.5 truncate" x-text="hideBalances ? '••••••' : formatCurrency(getWalletBalance(bank))"></p>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Split Bill Calculator with Auto Camera & Receipt Scan -->
            <div id="dashboardSplitBill" class="bg-white dark:bg-obsidian-900 border border-cream-200 dark:border-obsidian-800 rounded-3xl p-5 sm:p-6 shadow-card space-y-4">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-2xl bg-royal-500/10 text-royal-600 dark:text-royal-400 flex items-center justify-center shrink-0">
                            <i data-lucide="users" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h3 class="font-display font-bold text-base text-cream-900 dark:text-white" x-text="t('split_bill')"></h3>
                            <p class="text-xs text-cream-500 dark:text-slate-400" x-text="t('split_bill_sub')"></p>
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <button type="button" @click="startSplitCamera()" :disabled="isScanningSplitBill"

                t(key) {
                    const dict = this.translations[this.lang] || this.translations.ID;
                    return dict[key] || this.translations.ID[key] || key;
                },

                get pageTitle() {
                    if (this.activeTab === 'dashboard') return 'DND Finance';
                    if (this.activeTab === 'analytics') return this.t('nav_analytics');
                    if (this.activeTab === 'transactions') return this.t('nav_records');
                    if (this.activeTab === 'planning') return this.t('nav_goals');
                    if (this.activeTab === 'automation') return 'Autopilot';
                    return this.t('nav_menu');
                },

                get timeGreeting() {
                    const h = this.currentHour;
                    if (h >= 4 && h < 11) return this.t('greet_morning');
                    if (h >= 11 && h < 15) return this.t('greet_afternoon');
                    if (h >= 15 && h < 18) return this.t('greet_evening');
                    return this.t('greet_night');
                },

                get displayUserName() {
                    if (this.customNickname && this.customNickname.trim()) {
                        return this.customNickname.trim();
                    }
                    if (this.googleUser) {
                        return this.googleUser.nickname || this.googleUser.name || (this.googleUser.email ? this.googleUser.email.split('@')[0] : this.t('default_guest_name'));
                    }
                    return this.t('default_guest_name');
                },

                get displayGreetingName() {
                    return this.displayUserName;
                },

                get totalIncome() {
                    return this.transactions
                        .filter(tx => tx.type === 'income')
                        .reduce((acc, tx) => acc + Number(tx.amount || 0), 0);
                },

                get totalExpense() {
                    return this.transactions
                        .filter(tx => tx.type === 'expense')
                        .reduce((acc, tx) => acc + Number(tx.amount || 0), 0);
                },

                get totalWithdrawal() {
                    return this.transactions
                        .filter(tx => tx.type === 'withdrawal')
                        .reduce((acc, tx) => acc + Number(tx.amount || 0), 0);
                },

                get totalBalance() {
                    return this.totalIncome - (this.totalExpense + this.totalWithdrawal);
                },

                get expenseTransactionsCount() {
                    return this.transactions.filter(tx => tx.type === 'expense').length;
                },

                get filteredTransactions() {
                    const q = (this.searchQuery || '').toLowerCase().trim();
                    return this.transactions.filter(tx => {
                        const matchType = this.filterType === 'all' || tx.type === this.filterType;
                        if (!matchType) return false;
                        if (!q) return true;
                        return (
                            (tx.note || '').toLowerCase().includes(q) ||
                            (tx.category || '').toLowerCase().includes(q) ||
                            (tx.account || '').toLowerCase().includes(q) ||
                            (tx.toAccount || '').toLowerCase().includes(q)
                        );
                    });
                },

                async initApp() {
                    this.restoreCachedGoogleUser();
                    this.loadLocalState();
                    this.applyThemeClass();

                    this.greetingInterval = setInterval(() => {
                        this.currentHour = new Date().getHours();
                    }, 30000);

                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.get('google_auth_success')) {
                        this.showToast(this.lang === 'ID' ? 'Berhasil masuk dengan Google!' : 'Signed in with Google!');
                        window.history.replaceState({}, document.title, '/');
                    } else if (urlParams.get('google_auth_error')) {
                        this.showToast('Google Auth: ' + urlParams.get('google_auth_error'));
                        window.history.replaceState({}, document.title, '/');
                    }

                    await this.fetchGoogleConfigAndSession();
                    await this.syncListsWithBackend();

                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });
                },

                refreshIcons() {
                    if (window.lucide && typeof window.lucide.createIcons === 'function') {
                        window.lucide.createIcons();
                    }
                },

                showToast(msg) {
                    this.toastMessage = msg;
                    if (this.toastTimer) clearTimeout(this.toastTimer);
                    this.toastTimer = setTimeout(() => {
                        this.toastMessage = '';
                    }, 3200);
                },

                restoreCachedGoogleUser() {
                    try {
                        const cached = localStorage.getItem(`${this.appId}_google_user`);
                        if (cached) {
                            const parsed = JSON.parse(cached);
                            if (parsed && parsed.email) {
                                this.googleUser = parsed;
                                if (parsed.nickname) {
                                    this.customNickname = parsed.nickname;
                                }
                            }
                        }
                    } catch (e) {}
                },

                persistCachedGoogleUser() {
                    try {
                        if (this.googleUser && this.googleUser.email) {
                            localStorage.setItem(`${this.appId}_google_user`, JSON.stringify({
                                ...this.googleUser,
                                nickname: this.customNickname || this.googleUser.nickname || ''
                            }));
                        } else {
                            localStorage.removeItem(`${this.appId}_google_user`);
                        }
                    } catch (e) {}
                },

                getStorageKey() {
                    const emailKey = this.googleUser && this.googleUser.email
                        ? this.googleUser.email.trim().toLowerCase()
                        : 'guest';
                    return `${this.appId}_state_${emailKey}`;
                },

                loadLocalState() {
                    try {
                        const prefsRaw = localStorage.getItem(`${this.appId}_prefs`);
                        if (prefsRaw) {
                            const prefs = JSON.parse(prefsRaw);
                            if (typeof prefs.isDarkMode === 'boolean') this.isDarkMode = prefs.isDarkMode;
                            if (prefs.lang) this.lang = prefs.lang;
                            if (prefs.currency) this.currency = prefs.currency;
                            if (typeof prefs.customNickname === 'string') this.customNickname = prefs.customNickname;
                        }

                        const raw = localStorage.getItem(this.getStorageKey());
                        if (raw) {
                            const data = JSON.parse(raw);
                            if (Array.isArray(data.banks) && data.banks.length) this.banks = data.banks;
                            if (Array.isArray(data.categories) && data.categories.length) this.categories = data.categories;
                            if (Array.isArray(data.transactions)) this.transactions = data.transactions;
                            if (Array.isArray(data.goals)) this.goals = data.goals;
                            if (Array.isArray(data.budgets)) this.budgets = data.budgets;
                            if (Array.isArray(data.automationRules)) this.automationRules = data.automationRules;
                            if (typeof data.customNickname === 'string' && data.customNickname.trim()) {
                                this.customNickname = data.customNickname.trim();
                            }
                        }
                    } catch (e) {
                        console.warn('Failed to load local state:', e);
                    }
                },

                saveLocalState() {
                    try {
                        localStorage.setItem(`${this.appId}_prefs`, JSON.stringify({
                            isDarkMode: this.isDarkMode,
                            lang: this.lang,
                            currency: this.currency,
                            customNickname: this.customNickname
                        }));

                        this.persistCachedGoogleUser();

                        const payload = {
                            banks: this.banks,
                            categories: this.categories,
                            transactions: this.transactions,
                            goals: this.goals,
                            budgets: this.budgets,
                            automationRules: this.automationRules,
                            customNickname: this.customNickname
                        };
                        localStorage.setItem(this.getStorageKey(), JSON.stringify(payload));

                        if (this.googleUser && this.googleUser.email) {
                            fetch('/api/sync/push', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    email: this.googleUser.email,
                                    state: payload
                                })
                            }).catch(() => {});
                        }
                    } catch (e) {
                        console.warn('Failed to save local state:', e);
                    }
                },

                applyThemeClass() {
                    if (this.isDarkMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                },

                toggleTheme() {
                    this.isDarkMode = !this.isDarkMode;
                    this.applyThemeClass();
                    this.saveLocalState();
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });
                },

                toggleLanguage() {
                    this.lang = this.lang === 'ID' ? 'EN' : 'ID';
                    document.documentElement.lang = this.lang.toLowerCase();
                    this.saveLocalState();
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });

                formatCurrency(val) {
                    const num = Number(val || 0);
                    const map = {
                        IDR: { locale: 'id-ID', currency: 'IDR', maxDigits: 0 },
                        USD: { locale: 'en-US', currency: 'USD', maxDigits: 2 },
                        SGD: { locale: 'en-SG', currency: 'SGD', maxDigits: 2 },
                        EUR: { locale: 'de-DE', currency: 'EUR', maxDigits: 2 },
                        JPY: { locale: 'ja-JP', currency: 'JPY', maxDigits: 0 }
                    };
                    const cfg = map[this.currency] || map.IDR;
                    try {
                        return new Intl.NumberFormat(cfg.locale, {
                            style: 'currency',
                            currency: cfg.currency,
                            maximumFractionDigits: cfg.maxDigits
                        }).format(num);
                    } catch (e) {
                        return `${this.currency} ${num.toLocaleString()}`;
                    }
                },

                formatDateShort(dateStr) {
                    if (!dateStr) return '';
                    return String(dateStr).replace('T', ' ').slice(0, 16);
                },

                getWalletBalance(bankName) {
                    let bal = 0;
                    for (const tx of this.transactions) {
                        const amt = Number(tx.amount || 0);
                        const fee = Number(tx.adminFee || 0);
                        if (tx.type === 'income' && tx.account === bankName) {
                            bal += amt;
                        } else if ((tx.type === 'expense' || tx.type === 'withdrawal') && tx.account === bankName) {
                            bal -= amt;
                        } else if (tx.type === 'transfer') {
                            if (tx.account === bankName) bal -= (amt + fee);
                            if (tx.toAccount === bankName) bal += amt;
                        }
                    }
                    return bal;
                },

                getCategorySpent(catName) {
                    return this.transactions
                        .filter(tx => tx.type === 'expense' && tx.category === catName)
                        .reduce((acc, tx) => acc + Number(tx.amount || 0), 0);
                },

                // ==========================================
                // GOOGLE OAUTH2 & FEDCM IN-BROWSER DETECTION
                // ==========================================
                parseJwtPayload(token) {
                    try {
                        const parts = String(token || '').split('.');
                        if (parts.length < 2) return null;
                        const base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                        const padded = base64 + '='.repeat((4 - (base64.length % 4)) % 4);
                        const binary = atob(padded);
                        const bytes = new Uint8Array(binary.length);
                        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                        return JSON.parse(new TextDecoder().decode(bytes));
                    } catch (e) {
                        return null;
                    }
                },

                async fetchGoogleConfigAndSession() {
                    try {
                        const [appRes, cfgRes] = await Promise.all([
                            fetch('/api/app/info'),
                            fetch('/api/auth/google/config')
                        ]);
                        if (appRes.ok) {
                            const info = await appRes.json();
                            if (info.platform) this.appMeta.platform = info.platform;
                            if (info.developer) this.appMeta.developer = info.developer;
                            if (info.instagram_handle) this.appMeta.instagram_handle = info.instagram_handle;
                            if (info.instagram_url) this.appMeta.instagram_url = info.instagram_url;
                            if (info.google_client_id) this.googleClientId = info.google_client_id;
                        }
                        if (cfgRes.ok) {
                            const cfg = await cfgRes.json();
                            if (cfg.client_id) this.googleClientId = cfg.client_id;
                        }
                    } catch (e) {}

                    try {
                        const meRes = await fetch('/api/auth/google/me', { credentials: 'include' });
                        if (meRes.ok) {
                            const me = await meRes.json();
                            if (me.authenticated && me.user) {
                                this.googleUser = me.user;
                                if (me.user.nickname) {
                                    this.customNickname = me.user.nickname;
                                }
                                this.persistCachedGoogleUser();
                                this.loadLocalState();
                                await this.pullWorkspaceFromServer(me.user.email);
                            }
                        }
                    } catch (e) {}

                    this.initGoogleOAuthClient();
                },

                initGoogleOAuthClient(retries = 0) {
                    if (this.googleInitialized) return;
                    if (window.google && window.google.accounts) {
                        try {
                            if (window.google.accounts.id) {
                                window.google.accounts.id.initialize({
                                    client_id: this.googleClientId,
                                    callback: async (response) => {
                                        if (response && response.credential) {
                                            await this.handleGoogleCredentialResponse(response.credential);
                                        }
                                    },
                                    auto_select: true,
                                    cancel_on_tap_outside: false,
                                    use_fedcm_for_prompt: true
                                });
                                if (!this.googleUser) {
                                    window.google.accounts.id.prompt();
                                }
                            }

                            if (window.google.accounts.oauth2) {
                                this.googleTokenClient = window.google.accounts.oauth2.initTokenClient({
                                    client_id: this.googleClientId,
                                    scope: 'openid email profile',
                                    callback: async (tokenResponse) => {
                                        if (this.googleWatchdogTimer) {
                                            clearTimeout(this.googleWatchdogTimer);
                                            this.googleWatchdogTimer = null;
                                        }
                                        if (tokenResponse && tokenResponse.access_token) {
                                            await this.handleGoogleAccessToken(tokenResponse.access_token);
                                        } else {
                                            this.isGoogleSigningIn = false;
                                        }
                                    },
                                    error_callback: (err) => {
                                        if (this.googleWatchdogTimer) {
                                            clearTimeout(this.googleWatchdogTimer);
                                            this.googleWatchdogTimer = null;
                                        }
                                        this.isGoogleSigningIn = false;
                                        if (err && err.type === 'popup_failed_to_open') {
                                            window.location.href = '/api/auth/google/login';
                                        }
                                    }
                                });
                            }
                            this.googleInitialized = true;
                        } catch (e) {
                            console.warn('GSI init error:', e);
                        }
                    } else if (retries < 15) {
                        setTimeout(() => this.initGoogleOAuthClient(retries + 1), 300);
                    }
                },

                async handleGoogleCredentialResponse(idToken) {
                    const decoded = this.parseJwtPayload(idToken);
                    if (decoded && decoded.email) {
                        this.googleUser = {
                            sub: decoded.sub || decoded.email,
                            email: decoded.email,
                            name: decoded.name || decoded.email.split('@')[0],
                            nickname: this.customNickname || '',
                            picture: decoded.picture || ''
                        };
                        this.persistCachedGoogleUser();
                        this.loadLocalState();
                    }

                    try {
                        const verifyRes = await fetch('/api/auth/google/verify-token', {
                            method: 'POST',
                            credentials: 'include',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id_token: idToken })
                        });
                        if (verifyRes.ok) {
                            const data = await verifyRes.json();
                            if (data.user) {
                                this.googleUser = data.user;
                                if (data.user.nickname) {
                                    this.customNickname = data.user.nickname;
                                }
                            }
                            this.loadLocalState();
                            if (data.workspace_state) {
                                this.applyWorkspaceSnapshot(data.workspace_state);
                            }
                        }
                    } catch (e) {}

                    if (this.googleUser) {
                        this.saveLocalState();
                        this.showToast(this.lang === 'ID' ? `Masuk sebagai ${this.displayUserName}` : `Signed in as ${this.displayUserName}`);
                        this.$nextTick(() => {
                            this.refreshIcons();
                            this.updateAllCharts();
                        });
                    }
                },

                handleGoogleHeaderClick() {
                    if (this.googleUser) {
                        this.setTab('more');
                    } else {
                        this.initiateGoogleLogin();
                    }
                },

                initiateGoogleLogin() {
                    if (this.isGoogleSigningIn) return;
                    this.isGoogleSigningIn = true;

                    const onFocusReset = () => {
                        setTimeout(() => {
                            if (this.isGoogleSigningIn && !this.googleUser) {
                                this.isGoogleSigningIn = false;
                            }
                        }, 1500);
                        window.removeEventListener('focus', onFocusReset);
                    };
                    window.addEventListener('focus', onFocusReset);

                    if (!this.googleInitialized) {
                        this.initGoogleOAuthClient();
                    }

                    if (this.googleTokenClient) {
                        try {
                            this.googleTokenClient.requestAccessToken({ prompt: 'select_account' });
                            return;
                        } catch (e) {
                            console.warn('Popup blocked, falling back to redirect:', e);
                        }
                    }

                    window.location.href = '/api/auth/google/login';
                },

                async handleGoogleAccessToken(accessToken) {
                    try {
                        this.googleAccessToken = accessToken;
                        const userInfoRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                            headers: { Authorization: `Bearer ${accessToken}` }
                        });
                        if (userInfoRes.ok) {
                            const info = await userInfoRes.json();
                            this.googleUser = {
                                sub: info.sub || info.email,
                                email: info.email,
                                name: info.name || info.email.split('@')[0],
                                nickname: this.customNickname || '',
                                picture: info.picture || ''
                            };
                            this.persistCachedGoogleUser();
                        }

                        const verifyRes = await fetch('/api/auth/google/verify-token', {
                            method: 'POST',
                            credentials: 'include',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ access_token: accessToken })
                        });
                        if (verifyRes.ok) {
                            const data = await verifyRes.json();
                            if (data.user) {
                                this.googleUser = data.user;
                                if (data.user.nickname) {
                                    this.customNickname = data.user.nickname;
                                }
                            }
                            this.loadLocalState();
                            if (data.workspace_state) {
                                this.applyWorkspaceSnapshot(data.workspace_state);
                            }
                        } else {
                            this.loadLocalState();
                        }

                        this.saveLocalState();
                        this.showToast(this.lang === 'ID' ? `Masuk sebagai ${this.displayUserName}` : `Signed in as ${this.displayUserName}`);
                        this.$nextTick(() => {
                            this.refreshIcons();
                            this.updateAllCharts();
                        });
                    } catch (e) {
                        console.error('Google token verification failed:', e);
                    } finally {
                        this.isGoogleSigningIn = false;
                    }
                },

                applyWorkspaceSnapshot(st) {
                    if (!st || typeof st !== 'object') return;
                    if (Array.isArray(st.banks) && st.banks.length) this.banks = st.banks;
                    if (Array.isArray(st.categories) && st.categories.length) this.categories = st.categories;
                    if (Array.isArray(st.transactions)) this.transactions = st.transactions;
                    if (Array.isArray(st.goals)) this.goals = st.goals;
                    if (Array.isArray(st.budgets)) this.budgets = st.budgets;
                    if (Array.isArray(st.automationRules)) this.automationRules = st.automationRules;
                    if (typeof st.customNickname === 'string' && st.customNickname.trim()) {
                        this.customNickname = st.customNickname.trim();
                    }
                },

                async pullWorkspaceFromServer(email) {
                    if (!email) return;
                    try {
                        const res = await fetch(`/api/sync/pull?email=${encodeURIComponent(email)}`);
                        if (res.ok) {
                            const data = await res.json();
                            if (data.status === 'ok' && data.state) {
                                this.applyWorkspaceSnapshot(data.state);
                                this.saveLocalState();
                            }
                        }
                    } catch (e) {}
                },

                async logoutGoogle() {
                    try {
                        await fetch('/api/auth/google/logout', { method: 'POST', credentials: 'include' });
                    } catch (e) {}
                    if (window.google && window.google.accounts && window.google.accounts.id) {
                        try {
                            window.google.accounts.id.disableAutoSelect();
                        } catch (e) {}
                    }
                    this.googleUser = null;
                    this.googleAccessToken = '';
                    this.persistCachedGoogleUser();
                    this.transactions = [];
                    this.goals = [];
                    this.budgets = [];
                    this.automationRules = [];
                    this.loadLocalState();
                    this.showToast(this.lang === 'ID' ? 'Berhasil keluar dari akun Google' : 'Signed out from Google');
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });
                },

                async syncListsWithBackend() {
                    try {
                        const [bRes, cRes] = await Promise.all([
                            fetch('/api/banks'),
                            fetch('/api/categories')
                        ]);
                        if (bRes.ok) {
                            const bData = await bRes.json();
                            if (Array.isArray(bData.banks) && bData.banks.length) {
                                this.banks = Array.from(new Set([...this.banks, ...bData.banks]));
                            }
                        }
                        if (cRes.ok) {
                            const cData = await cRes.json();
                            if (Array.isArray(cData.categories) && cData.categories.length) {
                                this.categories = Array.from(new Set([...this.categories, ...cData.categories]));
                            }
                        }
                    } catch (e) {}
                },

                // ==========================================
                // TRANSACTIONS & AUTOPILOT EXECUTION
                // ==========================================
                openTxModal(defaultType = 'expense') {
                    const now = new Date();
                    const localIso = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
                    this.txForm = {
                        amount: '',
                        type: defaultType,
                        category: defaultType === 'income' ? (this.categories.includes('Salary') ? 'Salary' : this.categories[0]) : (this.categories[0] || 'Food'),
                        account: this.banks[0] || 'Bank BCA',
                        toAccount: this.banks[1] || this.banks[0] || 'Bank Mandiri',
                        adminFee: 0,
                        note: '',
                        date: localIso
                    };
                    this.showTxModal = true;
                    this.$nextTick(() => this.refreshIcons());
                },

                async saveTransaction() {
                    const amt = Number(this.txForm.amount);
                    if (!amt || amt <= 0) return;

                    const formattedDate = (this.txForm.date || '').replace('T', ' ') || new Date().toISOString().slice(0, 16).replace('T', ' ');
                    const newTx = {
                        id: Date.now(),
                        amount: amt,
                        type: this.txForm.type,
                        category: this.txForm.type === 'transfer' ? 'Transfer' : this.txForm.category,
                        account: this.txForm.account,
                        toAccount: this.txForm.type === 'transfer' ? this.txForm.toAccount : '',
                        adminFee: this.txForm.type === 'transfer' ? Number(this.txForm.adminFee || 0) : 0,
                        note: (this.txForm.note || '').trim(),
                        currency: this.currency,
                        date: formattedDate
                    };

                    this.transactions.unshift(newTx);
                    this.showTxModal = false;

                    try {
                        const headers = { 'Content-Type': 'application/json' };
                        if (this.googleUser && this.googleUser.email) {
                            headers['X-User-Email'] = this.googleUser.email;
                        }
                        await fetch('/api/transactions', {
                            method: 'POST',
                            credentials: 'include',
                            headers,
                            body: JSON.stringify({
                                amount: newTx.amount,
                                type: newTx.type,
                                category: newTx.category,
                                account: newTx.account,
                                to_account: newTx.toAccount,
                                admin_fee: newTx.adminFee,
                                note: newTx.note,
                                currency: newTx.currency,
                                date: newTx.date
                            })
                        });
                    } catch (e) {}

                    await this.evaluateAutomationRules(newTx);
                    this.saveLocalState();
                    this.showToast(this.lang === 'ID' ? 'Transaksi tersimpan!' : 'Transaction saved!');
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });
                },

                async deleteTransaction(txId) {
                    this.transactions = this.transactions.filter(t => t.id !== txId);
                    this.saveLocalState();
                    try {
                        const headers = {};
                        if (this.googleUser && this.googleUser.email) {
                            headers['X-User-Email'] = this.googleUser.email;
                        }
                        await fetch(`/api/transactions/${txId}`, { method: 'DELETE', credentials: 'include', headers });
                    } catch (e) {}
                    this.showToast(this.lang === 'ID' ? 'Transaksi dihapus' : 'Transaction deleted');
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });
                },

                async evaluateAutomationRules(tx) {
                    const activeRules = this.automationRules.filter(r => r.enabled);
                    for (const rule of activeRules) {
                        const act = rule.actionType;
                        const minAmt = Number(rule.minAmount || 0);
                        const pct = Number(rule.percent || 20);
                        const fixedAmt = Number(rule.fixedAmount || 50000);
                        const threshold = Number(rule.thresholdAmount || 500000);

                        if ((act === 'auto_save_goal' || act === 'fixed_save_goal') && tx.type === 'income' && tx.amount >= minAmt) {
                            const alloc = act === 'auto_save_goal' ? Math.round(tx.amount * (pct / 100)) : Math.round(fixedAmt);
                            if (alloc > 0) {
                                const targetName = (rule.targetGoalName || 'Dana Darurat').trim();
                                let goal = this.goals.find(g => g.name.toLowerCase() === targetName.toLowerCase());
                                if (!goal) {
                                    goal = { id: 'goal_' + Date.now(), name: targetName, target: Math.max(alloc * 10, 5000000), current: 0 };
                                    this.goals.push(goal);
                                }
                                goal.current += alloc;
                                rule.runCount = (rule.runCount || 0) + 1;
                                this.showToast(`Autopilot: +${this.formatCurrency(alloc)} → ${goal.name}`);
                            }
                        } else if (act === 'auto_transfer_wallet' && tx.type === 'income' && tx.amount >= minAmt) {
                            if (!rule.sourceWallet || rule.sourceWallet === tx.account) {
                                const alloc = Math.round(tx.amount * (pct / 100));
                                const dst = rule.destWallet || this.banks[1] || this.banks[0];
                                if (alloc > 0 && dst && dst !== tx.account) {
                                    this.transactions.unshift({
                                        id: Date.now() + Math.floor(Math.random() * 1000),
                                        amount: alloc,
                                        type: 'transfer',
                                        category: 'Transfer',
                                        account: tx.account,
                                        toAccount: dst,
                                        adminFee: 0,
                                        note: `[Autopilot] ${rule.name}`,
                                        currency: this.currency,
                                        date: tx.date
                                    });
                                    rule.runCount = (rule.runCount || 0) + 1;
                                    this.showToast(`Autopilot Transfer: ${this.formatCurrency(alloc)} → ${dst}`);
                                }
                            }
                        } else if (act === 'expense_save_goal' && tx.type === 'expense' && tx.amount >= minAmt) {
                            const alloc = Math.round(tx.amount * (pct / 100));
                            if (alloc > 0) {
                                const targetName = (rule.targetGoalName || 'Dana Darurat').trim();
                                let goal = this.goals.find(g => g.name.toLowerCase() === targetName.toLowerCase());
                                if (!goal) {
                                    goal = { id: 'goal_' + Date.now(), name: targetName, target: 5000000, current: 0 };
                                    this.goals.push(goal);
                                }
                                goal.current += alloc;
                                rule.runCount = (rule.runCount || 0) + 1;
                                this.showToast(`Autopilot Round-up: +${this.formatCurrency(alloc)} → ${goal.name}`);
                            }
                        } else if (act === 'expense_transfer_wallet' && tx.type === 'expense' && tx.amount >= minAmt) {
                            const alloc = Math.round(tx.amount * (pct / 100));
                            const dst = rule.destWallet || this.banks[1] || this.banks[0];
                            if (alloc > 0 && dst && dst !== tx.account) {
                                this.transactions.unshift({
                                    id: Date.now() + Math.floor(Math.random() * 1000),
                                    amount: alloc,
                                    type: 'transfer',
                                    category: 'Transfer',
                                    account: tx.account,
                                    toAccount: dst,
                                    adminFee: 0,
                                    note: `[Autopilot] ${rule.name}`,
                                    currency: this.currency,
                                    date: tx.date
                                });
                                rule.runCount = (rule.runCount || 0) + 1;
                                this.showToast(`Autopilot: ${this.formatCurrency(alloc)} → ${dst}`);
                            }
                        } else if (act === 'spend_alert' && tx.type === 'expense' && tx.amount >= threshold) {
                            rule.runCount = (rule.runCount || 0) + 1;
                            this.showToast(`⚠️ Autopilot Alert: ${rule.name} (${this.formatCurrency(tx.amount)})`);
                        } else if (act === 'category_spend_alert' && tx.type === 'expense' && tx.category === rule.targetCategory && tx.amount >= threshold) {
                            rule.runCount = (rule.runCount || 0) + 1;
                            this.showToast(`⚠️ ${tx.category}: ${this.formatCurrency(tx.amount)}`);
                        }
                    }
                },

                // ==========================================
                // RECEIPT SCANNER & SPLIT BILL CAMERA
                // ==========================================
                fileToBase64(file) {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => {
                            const res = String(reader.result || '');
                            const base64 = res.includes(',') ? res.split(',')[1] : res;
                            resolve(base64);
                        };
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                },

                async handleReceiptUpload(event) {
                    const file = event.target.files && event.target.files[0];
                    if (!file) return;
                    this.isScanningReceipt = true;
                    try {
                        const b64 = await this.fileToBase64(file);
                        const res = await fetch('/api/scan/receipt', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                image_base64: b64,
                                mime_type: file.type || 'image/jpeg'
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data.status === 'success' && Number(data.amount) > 0) {
                                this.txForm.amount = Number(data.amount);
                                if (data.category && this.categories.includes(data.category)) {
                                    this.txForm.category = data.category;
                                }
                                if (data.note) {
                                    this.txForm.note = data.note;
                                }
                                this.showToast(this.lang === 'ID' ? 'Struk berhasil dipindai!' : 'Receipt scanned successfully!');
                            } else {
                                this.showToast(this.lang === 'ID' ? 'Nominal tidak terbaca otomatis, silakan isi manual.' : 'Could not detect amount automatically, please enter manually.');
                            }
                        }
                    } catch (e) {
                        this.showToast(this.lang === 'ID' ? 'Gagal memindai struk' : 'Failed to scan receipt');
                    } finally {
                        this.isScanningReceipt = false;
                        event.target.value = '';
                    }
                },

                async startSplitCamera() {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        this.showToast(this.lang === 'ID' ? 'Kamera tidak didukung di browser ini, gunakan Foto/Galeri.' : 'Camera not supported in this browser, please use Photo/Gallery.');
                        return;
                    }
                    this.showSplitCameraModal = true;
                    this.$nextTick(async () => {
                        this.refreshIcons();
                        try {
                            this.splitCameraStream = await navigator.mediaDevices.getUserMedia({
                                video: { facingMode: { ideal: 'environment' } },
                                audio: false
                            });
                            if (this.$refs.splitVideo) {
                                this.$refs.splitVideo.srcObject = this.splitCameraStream;
                            }
                        } catch (err) {
                            this.stopSplitCamera();
                            this.showToast(this.lang === 'ID' ? 'Izin kamera ditolak. Gunakan tombol Foto / Galeri.' : 'Camera permission denied. Use Photo / Gallery.');
                        }
                    });
                },

                stopSplitCamera() {
                    if (this.splitCameraStream) {
                        this.splitCameraStream.getTracks().forEach(track => track.stop());
                        this.splitCameraStream = null;
                    }
                    this.showSplitCameraModal = false;
                },

                async captureSplitCameraFrame() {
                    const video = this.$refs.splitVideo;
                    const canvas = this.$refs.splitCanvas;
                    if (!video || !canvas) return;
                    canvas.width = video.videoWidth || 1280;
                    canvas.height = video.videoHeight || 960;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    const b64 = dataUrl.split(',')[1];
                    this.stopSplitCamera();
                    await this.processSplitBillBase64(b64, 'image/jpeg');
                },

                async handleSplitBillScanUpload(event) {
                    const file = event.target.files && event.target.files[0];
                    if (!file) return;
                    const b64 = await this.fileToBase64(file);
                    await this.processSplitBillBase64(b64, file.type || 'image/jpeg');
                    event.target.value = '';
                },

                async processSplitBillBase64(b64, mimeType) {
                    this.isScanningSplitBill = true;
                    try {
                        const res = await fetch('/api/scan/receipt', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ image_base64: b64, mime_type: mimeType })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data.status === 'success' && (Number(data.subtotal) > 0 || Number(data.amount) > 0)) {
                                this.splitSubtotal = Number(data.subtotal || data.amount || 0);
                                this.splitTax = Number(data.tax_percent || 0);
                                this.splitMerchant = data.note || '';
                                this.splitItems = Array.isArray(data.items) ? data.items : [];
                                await this.recalculateSplitBillApi();
                                this.showToast(this.lang === 'ID' ? 'Struk Split Bill terdeteksi!' : 'Split Bill receipt detected!');
                            } else {
                                this.showToast(this.lang === 'ID' ? 'Struk kurang jelas, silakan masukkan nominal manual.' : 'Receipt unclear, please enter subtotal manually.');
                            }
                        }
                    } catch (e) {
                        this.showToast(this.lang === 'ID' ? 'Gagal memproses foto struk' : 'Failed to process receipt photo');
                    } finally {
                        this.isScanningSplitBill = false;
                    }
                },

                clearSplitScan() {
                    this.splitSubtotal = 0;
                    this.splitTax = 0;
                    this.splitPeople = 1;
                    this.splitGrandTotal = 0;
                    this.splitPerPerson = 0;
                    this.splitMerchant = '';
                    this.splitItems = [];
                },

                async recalculateSplitBillApi() {
                    const sub = Math.max(0, Number(this.splitSubtotal || 0));
                    const tax = Math.max(0, Number(this.splitTax || 0));
                    const ppl = Math.max(1, parseInt(this.splitPeople || 1, 10));

                    const localGrand = sub + (sub * (tax / 100));
                    this.splitGrandTotal = Math.round(localGrand);
                    this.splitPerPerson = Math.round(localGrand / ppl);

                    try {
                        const res = await fetch('/api/engine/split-bill', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ subtotal: sub, tax_percent: tax, people: ppl })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            this.splitGrandTotal = Math.round(Number(data.grand_total || localGrand));
                            this.splitPerPerson = Math.round(Number(data.per_person || (localGrand / ppl)));
                        }
                    } catch (e) {}
                },

                recordMySplitShare() {
                    if (this.splitPerPerson <= 0) return;
                    this.openTxModal('expense');
                    this.txForm.amount = this.splitPerPerson;
                    this.txForm.category = this.categories.includes('Food') ? 'Food' : this.categories[0];
                    this.txForm.note = this.splitMerchant
                        ? `Split Bill: ${this.splitMerchant} (${this.splitPeople} pax)`
                        : `Split Bill (${this.splitPeople} pax)`;
                },

                            });

                    }

                    try {
                        await fetch(`/api/categories/${encodeURIComponent(name)}`, { method: 'DELETE' });

                saveGoal() {

                    if (!this.budgetForm.category || limit <= 0) return;
                    const existing = this.budgets.find(b => b.category === this.budgetForm.category);

                // ==========================================

                // ==========================================
                openAutomationModal() {

                    this.ruleForm = {

                        actionType: 'auto_save_goal',

                        fixedAmount: 50000,

                        targetCategory: this.categories[0] || 'Food',

                    };
