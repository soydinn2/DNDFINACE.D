<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DND — Minimalist Financial Ledger & Analytics</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Export, OCR & Direct Google Identity Services OAuth 2.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'], 
                        mono: ['"JetBrains Mono"', 'monospace'], 
                        serif: ['"Playfair Display"', 'serif'] 
                    },
                    colors: { 
                        dndCanvas: 'var(--bg-canvas)',
                        dndSurface: 'var(--bg-card)',
                        dndMuted: 'var(--bg-muted)',
                        dndBorder: 'var(--border-hairline)',
                        dndInk: 'var(--ink-primary)',
                        dndSubtle: 'var(--ink-secondary)',
                        dndCobalt: 'var(--brand-cobalt)',
                        dndJade: 'var(--brand-jade)',
                        dndCrimson: 'var(--brand-crimson)',
                        dndOchre: 'var(--brand-ochre)'
                    }
                }
            }
        }
    </script>

    <style>
        :root, body.theme-light {
            --bg-canvas: #F7F6F2;
            --bg-card: #FFFFFF;
            --bg-muted: #EFEDE7;
            --border-hairline: #E5E3DC;
            --border-hover: #CFCBC0;
            --ink-primary: #141518;
            --ink-secondary: #686A6F;
            --brand-cobalt: #1D4ED8;
            --brand-ochre: #B45309;
            --brand-jade: #047857;
            --brand-crimson: #BE123C;
            --card-shadow: 0 1px 2px rgba(20, 21, 24, 0.03);
            --card-shadow-hover: 0 8px 24px rgba(20, 21, 24, 0.06);
            color-scheme: light;
        }

        body.theme-light.theme-business {
            --bg-canvas: #F2F4F7;
            --border-hairline: #DCE1E8;
        }

        /* Pure Black / OLED Night Theme */
        body.theme-black {
            --bg-canvas: #050507;
            --bg-card: #101014;
            --bg-muted: #191920;
            --border-hairline: #23232B;
            --border-hover: #363642;
            --ink-primary: #F4F4F6;
            --ink-secondary: #9CA3AF;
            --brand-cobalt: #3B82F6;
            --brand-ochre: #F59E0B;
            --brand-jade: #10B981;
            --brand-crimson: #F43F5E;
            --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            --card-shadow-hover: 0 10px 28px rgba(0, 0, 0, 0.7);
            color-scheme: dark;
        }

        body.theme-black.theme-business {
            --bg-canvas: #04060B;
            --bg-card: #0D111A;
            --bg-muted: #161D2B;
            --border-hairline: #212B3E;
        }

        html, body {
            height: 100dvh;
            background-color: var(--bg-canvas);
            color: var(--ink-primary);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-overflow-scrolling: touch;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }

        @media screen and (max-width: 768px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }

        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }

        .num-tabular {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        .dnd-card {
            background: var(--bg-card);
            border: 1px solid var(--border-hairline);
            box-shadow: var(--card-shadow);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease, background-color 0.25s ease;
        }
        .dnd-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--card-shadow-hover);
        }

        /* Bespoke Interlocking DND Monogram Logo */
        .brand-mark {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }
        .dnd-logo-svg {
            color: var(--ink-primary);
            transition: color 0.3s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: visible;
        }
        .brand-mark:hover .dnd-logo-svg {
            transform: scale(1.04);
        }
        .brand-mark:hover .dnd-part-n {
            fill: var(--brand-cobalt);
            transition: fill 0.3s ease;
        }
        body.theme-light.theme-business .dnd-logo-svg {
            color: var(--brand-cobalt);
        }
        /* Pure white DND logo & text in Night/Black mode */
        body.theme-black .dnd-logo-svg,
        body.theme-black.theme-business .dnd-logo-svg {
            color: #FFFFFF !important;
        }
        body.theme-black .dnd-brand-text {
            color: #FFFFFF !important;
        }

        @keyframes dndPartLeft {
            0% { opacity: 0; transform: translateX(-16px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes dndPartRibbon {
            0% { opacity: 0; transform: translate(-10px, -12px) scale(0.94); }
            100% { opacity: 1; transform: translate(0, 0) scale(1); }
        }
        @keyframes dndPartRight {
            0% { opacity: 0; transform: translateX(16px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes dndLogoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }
        @keyframes dndLogoSheen {
            0% { transform: translateX(-140%) skewX(-22deg); opacity: 0; }
            35% { opacity: 0.85; }
            70% { opacity: 0.85; }
            100% { transform: translateX(240%) skewX(-22deg); opacity: 0; }
        }
        @keyframes dndTextReveal {
            0% {
                opacity: 0;
                letter-spacing: 0.55em;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                letter-spacing: 0.28em;
                transform: translateY(0);
            }
        }
        @keyframes dndProgressSlide {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(0%); }
            100% { transform: translateX(100%); }
        }
        .animate-dnd-logo {
            animation: dndLogoFloat 2.6s ease-in-out 0.9s infinite;
        }
        .dnd-splash-left {
            animation: dndPartLeft 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
        }
        .dnd-splash-ribbon {
            animation: dndPartRibbon 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both;
        }
        .dnd-splash-right {
            animation: dndPartRight 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.28s both;
        }
        .dnd-sheen-bar {
            animation: dndLogoSheen 1.8s cubic-bezier(0.4, 0, 0.2, 1) 0.55s infinite;
        }
        .animate-dnd-title {
            animation: dndTextReveal 0.95s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
        }
        .animate-dnd-bar {
            animation: dndProgressSlide 1.4s ease-in-out infinite;
        }

        .btn-tactile {
            transition: all 0.18s cubic-bezier(0.2, 0, 0, 1);
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn-tactile:hover:not(:disabled) {
            transform: translateY(-1px);
        }
        .btn-tactile:active:not(:disabled) {
            transform: scale(0.985);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--ink-secondary); }

        [x-cloak] { display: none !important; }
        .chart-container { width: 100%; height: 100%; min-height: 260px; position: relative; }
    </style>

    <script>
        window.addEventListener('error', function(e) {
            if (e.message && (e.message.includes('ResizeObserver') || e.message.includes('undelivered'))) {
                e.stopImmediatePropagation();
            }
        });
    </script>
</head>

<body x-data="dndApp()" x-init="initApp()" :class="[isPersonalMode ? 'theme-personal' : 'theme-business', isDarkMode ? 'theme-black' : 'theme-light']" class="h-[100dvh] flex flex-col md:flex-row selection:bg-dndCobalt selection:text-white font-sans relative overflow-hidden transition-colors duration-300">
    
    <!-- Minimalist Toast Notification -->
    <div x-show="toastMsg !== ''" style="display: none;"
         x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-[-12px]" x-transition:enter-end="opacity-100 translate-y-0" 
         x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 translate-y-[-12px]" 
         class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[150] bg-dndInk text-dndCanvas px-5 py-2.5 rounded-full shadow-lg flex items-center gap-2.5 pointer-events-none max-w-[92vw]">
        <span class="w-2 h-2 rounded-full bg-dndCobalt flex-shrink-0"></span>
        <span x-text="toastMsg" class="text-xs font-semibold tracking-wide truncate"></span>
    </div>

    <!-- Animated DND FINANCE Splash Screen -->
    <div x-show="isDbLoading" 
         x-transition:leave="transition ease-in duration-300" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         class="fixed inset-0 z-[200] bg-dndCanvas flex flex-col items-center justify-center px-6 text-center">
        <div class="animate-dnd-logo relative flex items-center justify-center overflow-hidden px-4 py-2">
            <svg class="w-44 h-24 dnd-logo-svg mx-auto block" viewBox="30 12 200 98" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <g class="dnd-splash-left">
                    <path d="M36 18 H64 V101 H82 V104 H36 V103 C47 102 52 97 52 88 V33 C52 24 47 19 36 18 Z"/>
                    <path d="M82 101 C102 101 111 85 109 63 L113 68 C115 90 104 104 82 104 Z"/>
                </g>
                <g class="dnd-splash-ribbon">
                    <path d="M64 18 H84 C99 18 109 25 119 39 L154 86 C162 96 170 101 184 101 V104 H176 C162 104 152 97 142 83 L107 36 C99 25 91 20 78 20 H64 Z"/>
                    <path d="M139 25 C139 20 144 18 151 18 V73 L139 58 Z"/>
                </g>
                <g class="dnd-splash-right">
                    <path d="M156 18 H178 C209 18 225 37 225 61 C225 85 209 104 178 104 H175 V101 C199 101 210 84 210 61 C210 38 199 20 177 20 H156 Z"/>
                </g>
            </svg>
            <div class="dnd-sheen-bar pointer-events-none absolute inset-y-0 w-14 bg-gradient-to-r from-transparent via-white/30 to-transparent"></div>
        </div>
        <h1 class="dnd-brand-text animate-dnd-title mt-3 pl-[0.28em] text-sm md:text-base font-extrabold text-dndInk uppercase tracking-[0.28em] text-center">DND FINANCE</h1>
        <div class="w-36 h-[2px] bg-dndBorder rounded-full overflow-hidden mt-5 mx-auto">
            <div class="h-full bg-dndInk w-1/2 rounded-full animate-dnd-bar"></div>
        </div>
    </div>

    <!-- Minimalist Sidebar (Desktop & Mac) -->
    <aside class="hidden md:flex w-64 flex-col bg-dndSurface border-r border-dndBorder z-20 transition-colors duration-300">
        <div class="h-20 flex items-center justify-between px-6 border-b border-dndBorder">
            <div class="brand-mark cursor-pointer" @click="switchView('dashboard')">
                <svg class="w-16 h-8 dnd-logo-svg" viewBox="30 12 200 98" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M36 18 H64 V101 H82 V104 H36 V103 C47 102 52 97 52 88 V33 C52 24 47 19 36 18 Z"/>
                    <path d="M82 101 C102 101 111 85 109 63 L113 68 C115 90 104 104 82 104 Z"/>
                    <path class="dnd-part-n" d="M64 18 H84 C99 18 109 25 119 39 L154 86 C162 96 170 101 184 101 V104 H176 C162 104 152 97 142 83 L107 36 C99 25 91 20 78 20 H64 Z"/>
                    <path class="dnd-part-n" d="M139 25 C139 20 144 18 151 18 V73 L139 58 Z"/>
                    <path d="M156 18 H178 C209 18 225 37 225 61 C225 85 209 104 178 104 H175 V101 C199 101 210 84 210 61 C210 38 199 20 177 20 H156 Z"/>
                </svg>
                <span class="dnd-brand-text text-xs font-extrabold tracking-[0.18em] text-dndInk">FINANCE</span>
            </div>
            <span class="text-[10px] font-mono font-semibold uppercase px-2 py-0.5 rounded bg-dndMuted text-dndSubtle" x-text="isPersonalMode ? 'Ledger' : 'Corp'"></span>
        </div>

        <nav class="flex-1 py-5 flex flex-col gap-1 px-3 overflow-y-auto">
            <template x-for="item in currentMenuItems" :key="item.id">
                <a href="#" @click.prevent="switchView(item.id)" 
                   class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl transition-all text-sm"
                   :class="activeMenu === item.id ? 'bg-dndInk text-dndCanvas font-semibold shadow-sm' : 'text-dndSubtle hover:bg-dndMuted/70 hover:text-dndInk font-medium'">
                    <div x-html="item.icon" class="w-4 h-4 flex-shrink-0"></div>
                    <span class="tracking-tight" x-text="t(item.label_key)"></span>
                </a>
            </template>
        </nav>
        
        <!-- Direct One-Click Google OAuth 2.0 Section -->
        <div class="p-4 border-t border-dndBorder">
            <template x-if="!isGoogleLoggedIn">
                <button @click="loginWithGoogle()" :disabled="isGoogleAuthLoading" class="w-full bg-dndCanvas hover:bg-dndMuted disabled:opacity-60 border border-dndBorder rounded-xl p-2.5 flex items-center justify-center gap-2.5 transition-colors btn-tactile">
                    <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.58c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    <span class="text-xs font-semibold text-dndInk" x-text="isGoogleAuthLoading ? t('connecting_google') : t('sign_in_google')"></span>
                </button>
            </template>

            <template x-if="isGoogleLoggedIn">
                <div class="bg-dndCanvas rounded-xl p-2.5 flex items-center justify-between border border-dndBorder">
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        <img x-show="userPhoto" :src="userPhoto" alt="Profile" class="w-8 h-8 rounded-full border border-dndBorder object-cover">
                        <div x-show="!userPhoto" class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-dndCanvas bg-dndInk">
                            <span x-text="userName.charAt(0)"></span>
                        </div>
                        <div class="flex-1 overflow-hidden">
                            <p class="text-xs font-bold text-dndInk truncate" x-text="userName"></p>
                            <p class="text-[10px] text-dndSubtle truncate" x-text="userEmail"></p>
                        </div>
                    </div>
                    <button @click="logoutGoogle()" class="p-1.5 rounded-lg text-dndSubtle hover:text-dndCrimson hover:bg-dndCrimson/10 transition-colors" :title="t('sign_out')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </button>
                </div>
            </template>
        </div>
    </aside>

    <!-- Bottom Nav (Android & iPhone Safe-Area Native Bar) -->
    <nav class="md:hidden fixed bottom-0 left-0 w-full bg-dndSurface/95 backdrop-blur-md border-t border-dndBorder z-40 flex justify-around items-center pt-1.5 pb-safe px-1 transition-colors duration-300">
        <template x-for="item in currentMenuItems.slice(0, 4)" :key="item.id">
            <a href="#" @click.prevent="switchView(item.id); isMobileDrawerOpen = false" 
               class="flex flex-col items-center justify-center flex-1 py-1.5 min-h-[52px] transition-colors"
               :class="activeMenu === item.id ? 'text-dndInk font-bold' : 'text-dndSubtle hover:text-dndInk'">
                <div x-html="item.icon" class="w-4 h-4 mb-1"></div>
                <span class="text-[10px] tracking-tight truncate w-full text-center px-0.5" x-text="t(item.label_key)"></span>
            </a>
        </template>
        <button type="button" @click="isMobileDrawerOpen = !isMobileDrawerOpen"
                class="flex flex-col items-center justify-center flex-1 py-1.5 min-h-[52px] transition-colors"
                :class="isMobileDrawerOpen ? 'text-dndCobalt font-bold' : 'text-dndSubtle hover:text-dndInk'">
            <svg class="w-4 h-4 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            <span class="text-[10px] tracking-tight truncate w-full text-center px-0.5" x-text="t('more_menu')"></span>
        </button>
    </nav>

    <!-- Mobile Full Navigation & Preferences Drawer -->
    <div x-show="isMobileDrawerOpen" style="display: none;" class="md:hidden fixed inset-0 z-50 flex flex-col justify-end">
        <div x-show="isMobileDrawerOpen" x-transition.opacity class="absolute inset-0 bg-black/50 backdrop-blur-sm" @click="isMobileDrawerOpen = false"></div>
        <div x-show="isMobileDrawerOpen"
             x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0"
             x-transition:leave="transition ease-in duration-150" x-transition:leave-start="translate-y-0" x-transition:leave-end="translate-y-full"
             class="relative bg-dndSurface border-t border-dndBorder rounded-t-3xl p-5 pb-safe z-10 max-h-[84dvh] overflow-y-auto space-y-4">
            <div class="w-10 h-1 bg-dndBorder rounded-full mx-auto mb-1"></div>
            <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold uppercase tracking-widest text-dndSubtle" x-text="t('all_features')"></span>
                <button @click="isMobileDrawerOpen = false" class="p-1.5 rounded-lg bg-dndCanvas border border-dndBorder text-dndSubtle">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <template x-for="item in currentMenuItems" :key="item.id + '_mob'">
                    <button type="button" @click="switchView(item.id); isMobileDrawerOpen = false"
                            class="flex items-center gap-2.5 p-3 rounded-xl border text-left transition-colors"
                            :class="activeMenu === item.id ? 'bg-dndInk text-dndCanvas border-dndInk font-bold' : 'bg-dndCanvas border-dndBorder text-dndInk font-medium'">
                        <div x-html="item.icon" class="w-4 h-4 flex-shrink-0"></div>
                        <span class="text-xs truncate" x-text="t(item.label_key)"></span>
                    </button>
                </template>
            </div>

            <!-- Language & Currency Controls on Mobile -->
            <div class="pt-3 border-t border-dndBorder grid grid-cols-2 gap-2">
                <button type="button" @click="toggleLanguage()" class="bg-dndCanvas border border-dndBorder rounded-xl py-2.5 px-3 flex items-center justify-center gap-2 text-xs font-semibold text-dndInk">
                    <span class="font-mono font-bold text-dndCobalt" x-text="lang"></span>
                    <span x-text="lang === 'ID' ? 'Bahasa Indonesia' : 'English (US)'"></span>
                </button>
                <div class="bg-dndCanvas border border-dndBorder rounded-xl px-3 flex items-center justify-between">
                    <span class="text-[11px] font-semibold text-dndSubtle" x-text="t('currency_label')"></span>
                    <select x-model="currency" @change="updateAllCharts()" class="bg-transparent text-xs font-bold text-dndInk outline-none py-2 cursor-pointer">
                        <option value="IDR">IDR</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                    </select>
                </div>
            </div>

            <!-- Direct Google Auth on Mobile -->
            <div class="pt-1">
                <template x-if="!isGoogleLoggedIn">
                    <button @click="loginWithGoogle(); isMobileDrawerOpen = false" :disabled="isGoogleAuthLoading" class="w-full bg-dndCanvas border border-dndBorder rounded-xl p-3 flex items-center justify-center gap-2.5 text-xs font-semibold text-dndInk">
                        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.58c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        <span x-text="isGoogleAuthLoading ? t('connecting_google') : t('sign_in_google')"></span>
                    </button>
                </template>
                <template x-if="isGoogleLoggedIn">
                    <div class="bg-dndCanvas rounded-xl p-3 flex items-center justify-between border border-dndBorder">
                        <div class="truncate">
                            <p class="text-xs font-bold text-dndInk truncate" x-text="userName"></p>
                            <p class="text-[10px] text-dndSubtle truncate" x-text="userEmail"></p>
                        </div>
                        <button @click="logoutGoogle(); isMobileDrawerOpen = false" class="text-xs font-semibold text-dndCrimson px-3 py-1.5 rounded-lg bg-dndCrimson/10" x-text="t('sign_out')"></button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col relative h-full overflow-y-auto pb-28 md:pb-10">
        
        <!-- Refined Uncluttered Top Header -->
        <header class="pt-safe min-h-[64px] md:min-h-[76px] border-b border-dndBorder bg-dndSurface/90 backdrop-blur-md flex items-center justify-between px-4 sm:px-6 md:px-10 z-20 sticky top-0 gap-3 transition-colors duration-300">
            <!-- Left: Brand (Mobile) & Active Section Title -->
            <div class="flex items-center gap-3 min-w-0">
                <div class="md:hidden brand-mark cursor-pointer flex-shrink-0" @click="switchView('dashboard')">
                    <svg class="w-11 h-6 dnd-logo-svg" viewBox="30 12 200 98" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M36 18 H64 V101 H82 V104 H36 V103 C47 102 52 97 52 88 V33 C52 24 47 19 36 18 Z"/>
                        <path d="M82 101 C102 101 111 85 109 63 L113 68 C115 90 104 104 82 104 Z"/>
                        <path class="dnd-part-n" d="M64 18 H84 C99 18 109 25 119 39 L154 86 C162 96 170 101 184 101 V104 H176 C162 104 152 97 142 83 L107 36 C99 25 91 20 78 20 H64 Z"/>
                        <path class="dnd-part-n" d="M139 25 C139 20 144 18 151 18 V73 L139 58 Z"/>
                        <path d="M156 18 H178 C209 18 225 37 225 61 C225 85 209 104 178 104 H175 V101 C199 101 210 84 210 61 C210 38 199 20 177 20 H156 Z"/>
                    </svg>
                </div>
                <div class="min-w-0">
                    <h2 class="text-sm sm:text-base md:text-lg font-bold text-dndInk tracking-tight truncate" x-text="t(activeMenu)"></h2>
                </div>
            </div>

            <!-- Right: Clean Primary Controls -->
            <div class="flex items-center gap-2 flex-shrink-0">
                <!-- Workspace Mode Toggle -->
                <button @click="toggleMode()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-semibold btn-tactile"
                        :class="isPersonalMode ? 'bg-dndCanvas border-dndBorder text-dndInk hover:bg-dndMuted' : 'bg-dndCobalt/10 border-dndCobalt/30 text-dndCobalt'">
                    <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" :class="isPersonalMode ? 'bg-dndJade' : 'bg-dndCobalt'"></span>
                    <span x-text="isPersonalMode ? t('mode_personal') : t('mode_business')"></span>
                </button>

                <!-- Light / Black Theme Switcher -->
                <button @click="toggleTheme()" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border border-dndBorder bg-dndCanvas hover:bg-dndMuted text-xs font-semibold text-dndInk btn-tactile" :title="isDarkMode ? t('theme_black') : t('theme_light')">
                    <template x-if="!isDarkMode">
                        <svg class="w-3.5 h-3.5 text-dndOchre" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"></path></svg>
                    </template>
                    <template x-if="isDarkMode">
                        <svg class="w-3.5 h-3.5 text-dndCobalt" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
                    </template>
                    <span class="hidden sm:inline" x-text="isDarkMode ? t('theme_black') : t('theme_light')"></span>
                </button>

                <!-- Desktop-only Language & Currency -->
                <button @click="toggleLanguage()" class="hidden md:flex items-center justify-center w-8 h-8 rounded-xl bg-dndCanvas border border-dndBorder hover:bg-dndMuted text-xs font-bold text-dndInk uppercase btn-tactile">
                    <span x-text="lang"></span>
                </button>

                <select x-model="currency" @change="updateAllCharts()" class="hidden md:block bg-dndCanvas border border-dndBorder text-xs font-semibold rounded-xl px-2.5 py-1.5 text-dndInk outline-none cursor-pointer hover:bg-dndMuted">
                    <option value="IDR">IDR</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                </select>

                <!-- Export Report -->
                <div class="relative" x-data="{ exportOpen: false }">
                    <button @click="exportOpen = !exportOpen" @click.outside="exportOpen = false" class="bg-dndInk hover:opacity-90 text-dndCanvas font-semibold text-xs px-3 py-1.5 md:px-3.5 md:py-2 rounded-xl flex items-center gap-1.5 btn-tactile">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span class="hidden sm:inline" x-text="t('export_pro')"></span>
                    </button>
                    <div x-show="exportOpen" x-transition.opacity style="display: none;" class="absolute right-0 mt-2 w-48 bg-dndSurface border border-dndBorder rounded-xl shadow-lg overflow-hidden z-50">
                        <button @click="exportExcel(); exportOpen = false" class="w-full text-left px-4 py-2.5 text-xs font-medium text-dndInk hover:bg-dndCanvas flex items-center gap-2 border-b border-dndBorder">
                            <span class="w-2 h-2 rounded-full bg-dndJade"></span> Excel (FinSight BI)
                        </button>
                        <button @click="exportPDF(); exportOpen = false" class="w-full text-left px-4 py-2.5 text-xs font-medium text-dndInk hover:bg-dndCanvas flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-dndCrimson"></span> PDF (Executive Sheet)
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div class="p-4 sm:p-6 md:p-8 lg:p-10 max-w-7xl w-full mx-auto space-y-6">
            
            <!-- VIEW 1: DASHBOARD -->
            <div x-show="activeMenu === 'dashboard'" class="space-y-6">
                
                <!-- Clean Quick Action Bar -->
                <div class="flex items-center justify-between gap-2 overflow-x-auto no-scrollbar pb-0.5">
                    <div class="flex items-center gap-2">
                        <button @click="openModal('expense')" class="bg-dndInk text-dndCanvas px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 btn-tactile whitespace-nowrap">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                            <span x-text="t('quick_add')"></span>
                        </button>
                        <button @click="openSplitBillModal()" class="bg-dndSurface border border-dndBorder hover:bg-dndMuted text-dndInk px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 btn-tactile whitespace-nowrap">
                            <svg class="w-3.5 h-3.5 text-dndCobalt" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            <span x-text="t('split_bill_short')"></span>
                        </button>
                        <button @click="openModal('transfer')" class="bg-dndSurface border border-dndBorder hover:bg-dndMuted text-dndInk px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 btn-tactile whitespace-nowrap">
                            <svg class="w-3.5 h-3.5 text-dndOchre" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                            <span x-text="t('type_transfer')"></span>
                        </button>
                        <button @click="switchView('ai_analyst')" class="bg-dndSurface border border-dndCobalt/30 hover:bg-dndCobalt/10 text-dndCobalt px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 btn-tactile whitespace-nowrap">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                            <span x-text="t('ai_analyst')"></span>
                        </button>
                    </div>
                </div>

                <!-- Primary KPI Cards (Symmetrical 4-Column Grid) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 md:gap-5">
                    <div class="dnd-card rounded-2xl p-5 flex flex-col justify-between">
                        <div>
                            <p class="text-dndSubtle text-[11px] font-semibold uppercase tracking-wider mb-1.5" x-text="isPersonalMode ? t('balance') : t('net_capital')"></p>
                            <h3 class="text-xl sm:text-2xl font-bold text-dndInk num-tabular tracking-tight truncate" x-text="formatCurrency(calculateTotal('balance'))"></h3>
                        </div>
                        <div class="mt-4 flex items-center gap-2 text-[11px] text-dndJade font-semibold">
                            <span class="px-1.5 py-0.5 rounded bg-dndJade/10">+12.5%</span>
                            <span class="text-dndSubtle font-normal" x-text="'vs ' + t('last_month')"></span>
                        </div>
                    </div>
                    
                    <div class="dnd-card rounded-2xl p-5 flex flex-col justify-between">
                        <div>
                            <p class="text-dndSubtle text-[11px] font-semibold uppercase tracking-wider mb-1.5 flex justify-between items-center">
                                <span x-text="isPersonalMode ? t('income') : t('revenue')"></span>
                                <span class="text-dndCobalt text-xs">↗</span>
                            </p>
                            <h3 class="text-xl sm:text-2xl font-bold text-dndCobalt num-tabular tracking-tight truncate" x-text="formatCurrency(calculateTotal('income'))"></h3>
                        </div>
                        <p class="mt-4 text-[11px] text-dndSubtle" x-text="t('kpi_income_sub')"></p>
                    </div>

                    <div class="dnd-card rounded-2xl p-5 flex flex-col justify-between">
                        <div>
                            <p class="text-dndSubtle text-[11px] font-semibold uppercase tracking-wider mb-1.5 flex justify-between items-center">
                                <span x-text="isPersonalMode ? t('expense') : t('opex')"></span>
                                <span class="text-dndCrimson text-xs">↘</span>
                            </p>
                            <h3 class="text-xl sm:text-2xl font-bold text-dndCrimson num-tabular tracking-tight truncate" x-text="formatCurrency(calculateTotal('expense'))"></h3>
                        </div>
                        <p class="mt-4 text-[11px] text-dndSubtle" x-text="t('kpi_expense_sub')"></p>
                    </div>

                    <div class="dnd-card rounded-2xl p-4 flex flex-col items-center justify-center relative">
                        <p class="text-dndSubtle text-[11px] font-semibold uppercase tracking-wider mb-[-6px] z-10" x-text="isPersonalMode ? t('health_score') : t('profit_margin')"></p>
                        <div id="gaugeChart" class="w-full h-28 chart-container !min-h-[110px]"></div>
                    </div>
                </div>

                <!-- Account / Bank Balances Strip -->
                <div class="dnd-card rounded-2xl p-5">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3.5">
                        <span class="text-xs font-bold uppercase tracking-wider text-dndSubtle" x-text="t('bank_dist_title')"></span>
                        <div class="flex items-center gap-2.5">
                            <button @click="openBankManager()" class="text-xs font-semibold text-dndInk bg-dndCanvas hover:bg-dndMuted border border-dndBorder px-3 py-1.5 rounded-xl transition-colors btn-tactile" x-text="t('custom_bank_btn')"></button>
                            <button @click="openModal('transfer')" class="text-xs font-semibold text-dndCobalt bg-dndCobalt/10 hover:bg-dndCobalt/15 px-3 py-1.5 rounded-xl transition-colors btn-tactile" x-text="t('transfer_funds_btn')"></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                        <template x-for="acc in accountBalances" :key="acc.name">
                            <div class="bg-dndCanvas rounded-xl p-3.5 border border-dndBorder">
                                <p class="text-[11px] font-semibold text-dndSubtle truncate" x-text="acc.name"></p>
                                <p class="text-sm font-bold num-tabular mt-1.5 truncate" :class="acc.balance < 0 ? 'text-dndCrimson' : 'text-dndInk'" x-text="formatCurrency(acc.balance)"></p>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Analytical Charts -->
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    <div class="dnd-card rounded-2xl p-5 md:p-6 flex flex-col">
                        <div class="flex justify-between items-start gap-2 mb-4">
                            <div>
                                <h3 class="text-sm md:text-base font-bold text-dndInk" x-text="t('rev_vs_exp')"></h3>
                                <p class="text-xs text-dndSubtle mt-0.5" x-text="t('rev_vs_exp_sub')"></p>
                            </div>
                            <span class="text-[10px] font-mono font-semibold text-dndSubtle uppercase bg-dndCanvas border border-dndBorder px-2.5 py-1 rounded-lg">Live</span>
                        </div>
                        <div id="comboChart" class="chart-container flex-1 min-h-[280px]"></div>
                    </div>

                    <div class="dnd-card rounded-2xl p-5 md:p-6 flex flex-col">
                        <div class="flex justify-between items-start gap-2 mb-4">
                            <div>
                                <h3 class="text-sm md:text-base font-bold text-dndInk" x-text="t('ai_forecast')"></h3>
                                <p class="text-xs text-dndSubtle mt-0.5" x-text="t('ai_forecast_sub')"></p>
                            </div>
                            <span class="text-[10px] font-mono font-semibold text-dndCobalt uppercase bg-dndCobalt/10 px-2.5 py-1 rounded-lg" x-text="t('projection_badge')"></span>
                        </div>
                        <div id="forecastChart" class="chart-container flex-1 min-h-[280px]"></div>
                    </div>
                </div>

                <!-- Sankey Cash Flow -->
                <div class="dnd-card rounded-2xl p-5 md:p-6 flex flex-col">
                    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 mb-4">
                        <div>
                            <h3 class="text-sm md:text-base font-bold text-dndInk" x-text="t('cash_flow')"></h3>
                            <p class="text-xs text-dndSubtle mt-0.5" x-text="t('cash_flow_sub')"></p>
                        </div>
                        <div class="flex flex-wrap items-center gap-4 text-[11px] font-medium text-dndSubtle">
                            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-dndCobalt"></span> Income</span>
                            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-dndJade"></span> Saving</span>
                            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-dndCrimson"></span> Expense</span>
                            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-dndOchre"></span> WD</span>
                        </div>
                    </div>
                    <div id="sankeyChart" class="chart-container flex-1 min-h-[290px]"></div>
                </div>
            </div>

            <!-- VIEW 2: CATATAN KEUANGAN / GENERAL LEDGER -->
            <div x-show="activeMenu === 'transactions'" style="display: none;" class="dnd-card rounded-2xl p-5 md:p-6 space-y-5">
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                    <div>
                        <h3 class="text-base md:text-lg font-bold text-dndInk" x-text="t('records_title')"></h3>
                        <p class="text-xs text-dndSubtle mt-0.5" x-text="t('records_sub')"></p>
                    </div>
                    <div class="flex items-center gap-2 w-full lg:w-auto">
                        <div class="relative flex-1 lg:w-64">
                            <input type="text" x-model="searchQuery" :placeholder="t('search')" class="w-full bg-dndCanvas border border-dndBorder rounded-xl pl-9 pr-4 py-2 text-xs md:text-sm text-dndInk focus:border-dndInk outline-none">
                            <svg class="w-4 h-4 text-dndSubtle absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <button @click="openModal()" class="bg-dndInk text-dndCanvas px-4 py-2 rounded-xl text-xs font-semibold btn-tactile whitespace-nowrap" x-text="t('new_entry_btn')"></button>
                    </div>
                </div>

                <!-- Filter Chips -->
                <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                    <button @click="txFilterType = 'all'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors" :class="txFilterType === 'all' ? 'bg-dndInk text-dndCanvas' : 'bg-dndCanvas border border-dndBorder text-dndSubtle hover:text-dndInk'" x-text="t('filter_all')"></button>
                    <button @click="txFilterType = 'income'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors" :class="txFilterType === 'income' ? 'bg-dndCobalt text-white' : 'bg-dndCanvas border border-dndBorder text-dndSubtle hover:text-dndInk'" x-text="t('type_income')"></button>
                    <button @click="txFilterType = 'expense'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors" :class="txFilterType === 'expense' ? 'bg-dndCrimson text-white' : 'bg-dndCanvas border border-dndBorder text-dndSubtle hover:text-dndInk'" x-text="t('type_expense')"></button>
                    <button @click="txFilterType = 'transfer'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors" :class="txFilterType === 'transfer' ? 'bg-dndInk text-dndCanvas' : 'bg-dndCanvas border border-dndBorder text-dndSubtle hover:text-dndInk'" x-text="t('type_transfer')"></button>
                    <button @click="txFilterType = 'withdrawal'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors" :class="txFilterType === 'withdrawal' ? 'bg-dndOchre text-white' : 'bg-dndCanvas border border-dndBorder text-dndSubtle hover:text-dndInk'" x-text="t('type_withdrawal')"></button>
                </div>

                <div class="overflow-x-auto rounded-xl border border-dndBorder">
                    <table class="w-full text-left border-collapse min-w-[660px]">
                        <thead class="bg-dndCanvas border-b border-dndBorder">
                            <tr class="text-[11px] uppercase text-dndSubtle tracking-wider font-semibold">
                                <th class="p-3.5" x-text="t('col_date')"></th>
                                <th class="p-3.5" x-text="t('col_cat_note')"></th>
                                <th class="p-3.5" x-text="t('col_account')"></th>
                                <th class="p-3.5 text-right" x-text="t('col_amount')"></th>
                                <th class="p-3.5 text-center" x-text="t('col_action')"></th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-dndBorder">
                            <template x-if="filteredTransactions.length === 0">
                                <tr><td colspan="5" class="p-10 text-center text-dndSubtle text-sm" x-text="t('empty_records')"></td></tr>
                            </template>
                            <template x-for="tx in filteredTransactions" :key="tx.id">
                                <tr class="hover:bg-dndCanvas/70 transition-colors">
                                    <td class="p-3.5 text-xs font-mono text-dndSubtle whitespace-nowrap" x-text="tx.date"></td>
                                    <td class="p-3.5">
                                        <div class="flex items-center gap-2">
                                            <span class="px-2 py-0.5 rounded-md text-[10px] font-bold tracking-wide uppercase"
                                                  :class="{
                                                      'bg-dndCobalt/10 text-dndCobalt': tx.type === 'income',
                                                      'bg-dndCrimson/10 text-dndCrimson': tx.type === 'expense',
                                                      'bg-dndOchre/10 text-dndOchre': tx.type === 'withdrawal' || tx.type === 'transfer'
                                                  }"
                                                  x-text="tx.type === 'withdrawal' ? 'WD • ' + tx.category : (tx.type === 'transfer' ? 'TRANSFER' : tx.category)"></span>
                                        </div>
                                        <p x-show="tx.note" class="text-xs text-dndSubtle mt-1 line-clamp-1" x-text="tx.note"></p>
                                    </td>

                            <button type="button" @click="setTxType('income')" class="py-2 rounded-xl border text-[11px] font-bold transition-colors" :class="txForm.type === 'income' ? 'bg-dndCobalt text-white border-dndCobalt' : 'border-dndBorder text-dndSubtle bg-dndCanvas hover:text-dndInk'" x-text="t('type_income')"></button>

                            <button type="button" @click="setTxType('withdrawal')" class="py-2 rounded-xl border text-[11px] font-bold transition-colors" :class="txForm.type === 'withdrawal' ? 'bg-dndOchre text-white border-dndOchre' : 'border-dndBorder text-dndSubtle bg-dndCanvas hover:text-dndInk'" x-text="t('type_withdrawal')"></button>
                        </div>
                        
                        <div>
                            <label class="block text-[11px] font-semibold text-dndSubtle mb-1 uppercase tracking-wider" x-text="t('amount_label')"></label>
                            <div class="relative">
                                <span class="absolute left-3.5 top-2.5 text-dndSubtle font-mono font-bold text-sm" x-text="currency"></span>
                                <input type="number" inputmode="decimal" x-model="txForm.amount" class="w-full bg-dndCanvas border border-dndBorder rounded-xl py-2.5 pl-12 pr-4 text-dndInk num-tabular font-bold text-lg outline-none focus:border-dndInk" placeholder="0">
                            </div>
                        </div>

                        <!-- Dynamic Fields for Transfer vs Standard -->
                        <template x-if="txForm.type === 'transfer'">
                            <div class="space-y-3 bg-dndCanvas p-3.5 rounded-xl border border-dndBorder">
                                <div class="flex items-center justify-between">
                                    <span class="text-[10px] font-bold uppercase text-dndSubtle" x-text="t('transfer_route_label')"></span>
                                    <button type="button" @click="openBankManager()" class="text-[11px] font-bold text-dndCobalt hover:underline" x-text="t('add_new_bank_link')"></button>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-[10px] font-bold text-dndSubtle mb-1 uppercase" x-text="t('from_account_label')"></label>
                                        <select x-model="txForm.account" class="w-full bg-dndSurface border border-dndBorder rounded-lg py-2 px-2.5 text-xs font-semibold text-dndInk outline-none">
                                            <template x-for="accName in availableAccounts" :key="accName">
                                                <option :value="accName" x-text="accName"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold text-dndSubtle mb-1 uppercase" x-text="t('to_account_label')"></label>
                                        <select x-model="txForm.toAccount" class="w-full bg-dndSurface border border-dndBorder rounded-lg py-2 px-2.5 text-xs font-semibold text-dndInk outline-none">
                                            <template x-for="accName in availableAccounts" :key="accName + '_to'">
                                                <option :value="accName" x-text="accName"></option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-dndSubtle mb-1 uppercase" x-text="t('transfer_fee_label')"></label>
                                    <input type="number" inputmode="decimal" x-model="txForm.adminFee" class="w-full bg-dndSurface border border-dndBorder rounded-lg py-2 px-3 text-xs num-tabular font-semibold text-dndInk outline-none" placeholder="0">
                                </div>
                            </div>
                        </template>

                        <template x-if="txForm.type !== 'transfer'">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[11px] font-semibold text-dndSubtle mb-1 uppercase tracking-wider" x-text="t('category_label')"></label>
                                    <select x-model="txForm.category" class="w-full bg-dndCanvas border border-dndBorder rounded-xl py-2.5 px-3 text-xs font-semibold text-dndInk outline-none cursor-pointer">
                                        <template x-for="cat in activeCategoryOptions" :key="cat">
                                            <option :value="cat" x-text="cat"></option>
                                        </template>
                                    </select>
                                </div>
                                <div>
                                    <div class="flex items-center justify-between mb-1">
                                        <label class="block text-[11px] font-semibold text-dndSubtle uppercase tracking-wider" x-text="t('account_label')"></label>
                                        <button type="button" @click="openBankManager()" class="text-[10px] font-bold text-dndCobalt hover:underline" x-text="t('add_bank_short')"></button>
                                    </div>
                                    <select x-model="txForm.account" class="w-full bg-dndCanvas border border-dndBorder rounded-xl py-2.5 px-3 text-xs font-semibold text-dndInk outline-none cursor-pointer">
                                        <template x-for="accName in availableAccounts" :key="accName + '_std'">
                                            <option :value="accName" x-text="accName"></option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                        </template>

                        <div>
                            <label class="block text-[11px] font-semibold text-dndSubtle mb-1 uppercase tracking-wider" x-text="t('date_label')"></label>
                            <input type="date" x-model="txForm.date" class="w-full bg-dndCanvas border border-dndBorder rounded-xl py-2 px-3.5 text-dndInk text-xs font-mono outline-none focus:border-dndInk">
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold text-dndSubtle mb-1 uppercase tracking-wider"><span x-text="t('note_label')"></span> <span class="font-normal lowercase" x-text="t('optional_tag')"></span></label>
                            <input type="text" x-model="txForm.note" class="w-full bg-dndCanvas border border-dndBorder rounded-xl py-2.5 px-3.5 text-xs text-dndInk outline-none focus:border-dndInk" :placeholder="t('note_placeholder')">
                        </div>
                    </div>

                    <!-- TAB 2: SPLIT BILL OTOMATIS -->
                    <div x-show="formTab === 'split'" class="space-y-4">
                        <div>
                            <label class="block text-[11px] font-semibold text-dndSubtle mb-1 uppercase tracking-wider" x-text="t('bill_name_label')"></label>
                            <input type="text" x-model="splitForm.title" class="w-full bg-dndCanvas border border-dndBorder rounded-xl py-2 px-3.5 text-xs font-medium text-dndInk outline-none focus:border-dndInk" :placeholder="t('bill_name_placeholder')">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-dndSubtle mb-1 uppercase tracking-wider" x-text="t('total_bill_label')"></label>
                                <input type="number" inputmode="decimal" x-model="splitForm.totalAmount" class="w-full bg-dndCanvas border border-dndBorder rounded-xl py-2 px-3 text-sm num-tabular font-bold text-dndInk outline-none focus:border-dndInk" placeholder="0">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-dndSubtle mb-1 uppercase tracking-wider" x-text="t('tax_service_label')"></label>
                                <input type="number" inputmode="decimal" x-model="splitForm.taxPercent" class="w-full bg-dndCanvas border border-dndBorder rounded-xl py-2 px-3 text-sm num-tabular font-bold text-dndInk outline-none focus:border-dndInk" placeholder="0">
                            </div>
                        </div>

                        <div class="flex items-center justify-between bg-dndCanvas p-3 rounded-xl border border-dndBorder">
                            <div>
                                <p class="text-xs font-bold text-dndInk" x-text="t('people_count_label')"></p>
                                <p class="text-[11px] text-dndSubtle" x-text="t('people_count_sub')"></p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button type="button" @click="splitForm.people = Math.max(2, Number(splitForm.people) - 1)" class="w-8 h-8 rounded-lg bg-dndSurface border border-dndBorder font-bold text-dndInk hover:bg-dndMuted">-</button>
                                <span class="w-8 text-center font-mono font-bold text-sm" x-text="splitForm.people"></span>
                                <button type="button" @click="splitForm.people = Number(splitForm.people) + 1" class="w-8 h-8 rounded-lg bg-dndSurface border border-dndBorder font-bold text-dndInk hover:bg-dndMuted">+</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-dndSubtle mb-1 uppercase tracking-wider" x-text="t('payment_acc_label')"></label>
                                <select x-model="splitForm.account" class="w-full bg-dndCanvas border border-dndBorder rounded-xl py-2 px-3 text-xs font-semibold text-dndInk outline-none">
                                    <template x-for="accName in availableAccounts" :key="accName + '_split'">
                                        <option :value="accName" x-text="accName"></option>
                                    </template>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-dndSubtle mb-1 uppercase tracking-wider" x-text="t('category_label')"></label>
                                <select x-model="splitForm.category" class="w-full bg-dndCanvas border border-dndBorder rounded-xl py-2 px-3 text-xs font-semibold text-dndInk outline-none">
                                    <option value="Food">Food & Dining</option>
                                    <option value="Utilities">Utilities</option>
                                    <option value="Transport">Transport</option>
                                    <option value="Shopping">Shopping</option>
                                </select>
                            </div>
                        </div>

                        <!-- Live Split Bill Summary Card -->
                        <div class="bg-dndCanvas border border-dndBorder rounded-xl p-4 space-y-2">
                            <div class="flex justify-between text-xs text-dndSubtle">
                                <span x-text="t('grand_total_label')"></span>
                                <span class="font-mono font-semibold text-dndInk" x-text="formatCurrency(splitCalculated.grandTotal)"></span>
                            </div>
                            <div class="pt-2 border-t border-dndBorder flex justify-between items-center">
                                <span class="text-xs font-bold text-dndInk"><span x-text="t('per_person_label')"></span> (<span x-text="splitForm.people"></span> <span x-text="t('people_unit')"></span>)</span>
                                <span class="text-base font-bold font-mono text-dndCobalt" x-text="formatCurrency(splitCalculated.perPerson)"></span>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2.5 pt-1">
                            <button type="button" @click="copySplitBillText()" class="py-2.5 px-3 rounded-xl border border-dndBorder bg-dndCanvas hover:bg-dndMuted text-xs font-semibold text-dndInk btn-tactile" x-text="t('copy_split_btn')"></button>
                            <button type="button" @click="saveSplitBillShare()" class="py-2.5 px-3 rounded-xl bg-dndCobalt hover:opacity-90 text-white text-xs font-bold btn-tactile" x-text="t('record_my_share_btn')"></button>
                        </div>
                    </div>

                    <!-- TAB 3: VOICE AI INPUT -->
                    <div x-show="formTab === 'voice'" class="flex flex-col items-center text-center py-4 space-y-4">
                        <div class="bg-dndCanvas border border-dndBorder rounded-2xl p-6 w-full flex flex-col items-center">
                            <button type="button" @click="startVoiceInput()" class="w-16 h-16 rounded-full flex items-center justify-center transition-all btn-tactile mb-3"
                                    :class="isListening ? 'bg-dndCrimson text-white animate-pulse' : 'bg-dndInk text-dndCanvas'">
                                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                            </button>
                            <p class="text-xs font-bold text-dndInk" x-text="isListening ? t('voice_listening') : t('voice_tap_prompt')"></p>
                            <p class="text-[11px] text-dndSubtle mt-1 max-w-xs" x-text="t('voice_example')"></p>
                            <div x-show="voiceText" class="mt-3 px-3.5 py-2 rounded-xl bg-dndSurface border border-dndBorder text-xs font-medium text-dndCobalt" x-text="voiceText"></div>
                        </div>
                    </div>

                    <!-- TAB 4: CAMERA OCR & AI VISION -->
                    <div x-show="formTab === 'ocr'" class="flex flex-col space-y-3 py-1">
                        <div x-show="!isCameraActive" class="w-full space-y-3">
                            <div class="bg-dndCanvas border border-dndBorder rounded-xl p-5 flex flex-col items-center text-center">
                                <div class="w-11 h-11 rounded-full bg-dndSurface border border-dndBorder flex items-center justify-center mb-2.5 text-dndInk">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                </div>
                                <p class="text-xs font-semibold text-dndInk mb-1" x-text="t('scan_title')"></p>
                                <p class="text-[11px] text-dndSubtle mb-3.5" x-text="t('scan_sub')"></p>
                                <div class="flex gap-2 w-full">
                                    <button type="button" @click="startCamera()" class="flex-[2] bg-dndInk text-dndCanvas py-2.5 rounded-xl font-semibold text-xs btn-tactile" x-text="t('enable_cam_btn')"></button>
                                    <button type="button" @click="simulateReceiptScan()" class="flex-1 bg-dndSurface border border-dndBorder text-dndInk py-2.5 rounded-xl font-semibold text-xs hover:bg-dndMuted btn-tactile" x-text="t('sim_receipt_btn')"></button>
                                </div>
                            </div>
                            <input type="file" accept="image/*" @change="handleFileUpload($event)" class="w-full text-xs text-dndSubtle file:mr-3 file:py-2 file:px-3.5 file:rounded-lg file:border file:border-dndBorder file:bg-dndCanvas file:text-dndInk file:font-semibold cursor-pointer">
                        </div>
                        
                        <div x-show="isCameraActive" class="w-full space-y-3 flex flex-col items-center">
                            <div class="relative w-full rounded-xl overflow-hidden border border-dndBorder bg-black min-h-[220px] flex items-center justify-center">
                                <video x-ref="videoElement" autoplay playsinline muted class="w-full max-h-[280px] object-cover"></video>
                                <div class="absolute inset-4 border border-white/50 rounded-lg pointer-events-none"></div>
                                <button type="button" @click="switchCameraFacing()" class="absolute top-2.5 right-2.5 bg-black/60 text-white text-[10px] font-semibold px-2.5 py-1.5 rounded-lg backdrop-blur-sm" x-text="t('switch_cam_btn')"></button>
                            </div>
                            <div class="flex gap-2.5 w-full">
                                <button type="button" @click="stopCamera()" class="flex-1 bg-dndCanvas border border-dndBorder text-dndInk py-2.5 rounded-xl font-semibold text-xs" x-text="t('cancel_btn')"></button>
                                <button type="button" @click="captureAndScan()" class="flex-[2] bg-dndCobalt text-white py-2.5 rounded-xl font-semibold text-xs btn-tactile" x-text="t('capture_scan_btn')"></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div x-show="formTab === 'manual'" class="mt-4 pt-4 border-t border-dndBorder">
                    <button type="button" @click="saveTransactionAPI()" class="w-full bg-dndInk hover:opacity-90 text-dndCanvas font-bold py-3 rounded-xl text-xs uppercase tracking-wider btn-tactile" x-text="t('save_tx_btn')"></button>
                </div>
            </div>
        </div>

        <!-- Custom Bank / Account Manager Modal -->
        <div x-show="isBankModalOpen" style="display: none;" class="fixed inset-0 z-[240] flex items-center justify-center p-4">
            <div x-show="isBankModalOpen" x-transition.opacity class="absolute inset-0 bg-black/50 backdrop-blur-sm" @click="isBankModalOpen = false"></div>
            <div x-show="isBankModalOpen" class="relative bg-dndSurface border border-dndBorder rounded-2xl w-full max-w-md p-6 shadow-xl z-10 flex flex-col max-h-[85dvh]">
                <div class="flex items-center justify-between mb-1.5">
                    <h3 class="text-base font-bold text-dndInk" x-text="t('bank_mgr_title')"></h3>
                    <button @click="isBankModalOpen = false" class="text-dndSubtle hover:text-dndInk bg-dndCanvas border border-dndBorder rounded-lg p-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <p class="text-xs text-dndSubtle mb-4" x-text="t('bank_mgr_sub')"></p>

                <form @submit.prevent="addCustomBank()" class="flex gap-2 mb-4">
                    <input type="text" x-model="newBankName" :placeholder="t('bank_name_placeholder')" class="flex-1 bg-dndCanvas border border-dndBorder rounded-xl px-3.5 py-2 text-xs text-dndInk outline-none focus:border-dndInk">
                    <button type="submit" class="bg-dndInk text-dndCanvas px-4 py-2 rounded-xl text-xs font-bold btn-tactile" x-text="t('add_btn')"></button>
                </form>

                <div class="flex-1 overflow-y-auto space-y-1.5 pr-1">
                    <template x-for="bank in availableAccounts" :key="bank">
                        <div class="flex items-center justify-between bg-dndCanvas border border-dndBorder rounded-xl px-3.5 py-2.5">
                            <span class="text-xs font-semibold text-dndInk" x-text="bank"></span>
                            <button x-show="availableAccounts.length > 1" @click="removeCustomBank(bank)" class="text-[11px] font-semibold text-dndSubtle hover:text-dndCrimson" x-text="t('delete_btn')"></button>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Custom Input & Confirmation Modal -->
        <div x-show="modalConfig.isOpen" style="display: none;" class="fixed inset-0 z-[250] flex items-center justify-center p-4">
            <div x-show="modalConfig.isOpen" x-transition.opacity class="absolute inset-0 bg-black/50 backdrop-blur-sm" @click="modalConfig.isOpen = false"></div>
            
            <div x-show="modalConfig.isOpen" class="relative bg-dndSurface border border-dndBorder rounded-2xl w-full max-w-md p-6 shadow-xl z-10 flex flex-col">
                <h3 class="text-base font-bold text-dndInk mb-1.5" x-text="modalConfig.title"></h3>
                <p x-show="modalConfig.message" class="text-dndSubtle text-xs mb-4" x-text="modalConfig.message"></p>

                <div x-show="modalConfig.type === 'input'" class="space-y-3.5 mb-5">
                    <template x-for="field in modalConfig.fields" :key="field.id">
                        <div>
                            <label class="block text-[11px] font-semibold text-dndSubtle mb-1 uppercase" x-text="field.label"></label>
                            <input :type="field.type" x-model="field.value" @keyup.enter="submitModal()" class="w-full bg-dndCanvas border border-dndBorder rounded-xl py-2 px-3 text-dndInk text-sm outline-none focus:border-dndInk">
                        </div>
                    </template>
                </div>

                <div class="flex gap-2.5 justify-end mt-2">
                    <button @click="modalConfig.isOpen = false" class="px-4 py-2 rounded-xl border border-dndBorder bg-dndCanvas text-dndInk text-xs font-semibold" x-text="t('cancel_btn')"></button>
                    <button @click="submitModal()" class="px-4 py-2 rounded-xl bg-dndInk text-dndCanvas text-xs font-semibold"
                            x-text="modalConfig.type === 'confirm' ? t('continue_btn') : t('save_btn')"></button>
                </div>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('dndApp', () => ({
                appId: 'dnd-finance-enterprise',
                isDbLoading: true,
                isGoogleLoggedIn: false,
                isGoogleAuthLoading: false,
                isPersonalMode: true,
                isDarkMode: false,
                isMobileDrawerOpen: false,
                lang: 'ID',
                currency: 'IDR',
                activeMenu: 'dashboard',
                isModalOpen: false,
                formTab: 'manual',
                toastMsg: '',
                searchQuery: '',
                txFilterType: 'all',
                
                availableAccounts: ['Bank BCA', 'Bank Mandiri', 'Bank BNI', 'Bank Jago', 'Corporate Bank', 'Gopay', 'Cash'],
                isBankModalOpen: false,
                newBankName: '',

                isAiLoading: false,
                aiCustomInput: '',
                aiMessages: [],

                txForm: {
                    amount: '',
                    type: 'expense',
                    category: 'Food',
                    account: 'Bank BCA',
                    toAccount: 'Bank Mandiri',
                    adminFee: '',
                    note: '',
                    date: new Date().toISOString().split('T')[0]
                },

                splitForm: {
                    title: '',
                    totalAmount: '',
                    taxPercent: 0,
                    people: 2,
                    account: 'Bank BCA',
                    category: 'Food'
                },

                transactions: [],
                goals: [],
                budgets: [],
                employees: [],
                macros: [],
                
                modalConfig: { isOpen: false, type: 'input', title: '', message: '', fields: [], onConfirm: null },
                
                userId: 'local_user',
                userName: 'Guest',
                userEmail: '',
                userPhoto: '',
                googleClientId: (typeof window.__google_client_id !== 'undefined' && window.__google_client_id)
                    ? window.__google_client_id
                    : '764086051850-6qr4p6gpi6hn506pt8ejuq83di341hur.apps.googleusercontent.com',
                googleAccessToken: '',
                
                apiBaseUrl: 'http://127.0.0.1:8000',
                isBackendApiOnline: false,
                _finishSplash: null,
                
                isListening: false,
                voiceText: '',
                isCameraActive: false,
                videoStream: null,
                cameraFacingMode: 'environment',

                get activeCategoryOptions() {
                    if (this.txForm.type === 'income') {
                        return this.isPersonalMode
                            ? ['Salary', 'Bonus & Commission', 'Freelance', 'Investment Return', 'Gift / Deposit', 'Other Income']
                            : ['Client Payment', 'Salary', 'Product Sales', 'Retainer Fee', 'Investment / Capital', 'Other Revenue'];
                    }
                    if (this.txForm.type === 'withdrawal') {
                        return this.isPersonalMode
                            ? ['ATM Cash Withdrawal', 'Emergency Cash', 'Personal Allowance', 'Other Withdrawal']
                            : ['Owner Draw / Dividend', 'Petty Cash Withdrawal', 'Partner Distribution', 'Other Withdrawal'];
                    }
                    return this.isPersonalMode
                        ? ['Food', 'Transport', 'Utilities', 'Shopping', 'Salary', 'Health & Lifestyle', 'Education', 'Savings Allocation', 'Tax', 'Other']
                        : ['Salary', 'Office Rent', 'SaaS/Software', 'Marketing & Ads', 'Tax', 'Utilities', 'Equipment & Supplies', 'Travel & Transport', 'Other OPEX'];
                },

                get splitCalculated() {
                    const base = Math.max(0, Number(this.splitForm.totalAmount) || 0);
                    const taxPct = Math.max(0, Number(this.splitForm.taxPercent) || 0);
                    const people = Math.max(2, Number(this.splitForm.people) || 2);
                    const taxAmount = base * (taxPct / 100);
                    const grandTotal = base + taxAmount;
                    const perPerson = Math.round(grandTotal / people);
                    return { base, taxAmount, grandTotal, perPerson };
                },

                get accountBalances() {
                    const map = {};
                    this.availableAccounts.forEach(a => map[a] = 0);
                    const mult = this.currency === 'USD' ? 0.000065 : (this.currency === 'EUR' ? 0.000059 : 1);

                    this.transactions.forEach(tx => {
                        const amt = Number(tx.amount) || 0;
                        const fee = Number(tx.adminFee) || 0;
                        const src = tx.account || this.availableAccounts[0] || 'Bank BCA';
                        if (map[src] === undefined) map[src] = 0;

                        if (tx.type === 'income') {
                            map[src] += amt;
                        } else if (tx.type === 'expense' || tx.type === 'withdrawal') {
                            map[src] -= amt;
                        } else if (tx.type === 'transfer') {
                            const dst = tx.toAccount || this.availableAccounts[1] || 'Bank Mandiri';
                            if (map[dst] === undefined) map[dst] = 0;
                            map[src] -= (amt + fee);
                            map[dst] += amt;
                        }
                    });

                    return Object.entries(map).map(([name, val]) => ({
                        name,
                        balance: val * mult
                    }));
                },
