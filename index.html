                t(k) { return (this.translations[this.lang] && this.translations[this.lang][k]) || k; },
                
                get filteredTransactions() {
                    if (!this.transactions || this.transactions.length === 0) return [];
                    let list = this.transactions.slice().sort((a,b) => new Date(b.date) - new Date(a.date));
                    if (this.txFilterType && this.txFilterType !== 'all') {
                        list = list.filter(t => t.type === this.txFilterType);
                    }
                    if (!this.searchQuery) return list;
                    const q = this.searchQuery.toLowerCase();
                    return list.filter(t => 
                        (t.category && t.category.toLowerCase().includes(q)) || 
                        (t.account && t.account.toLowerCase().includes(q)) ||
                        (t.toAccount && t.toAccount.toLowerCase().includes(q)) ||
                        (t.note && t.note.toLowerCase().includes(q))
                    );
                },

                getBudgetSpent(category) {
                    return this.transactions.filter(t => t.type === 'expense' && t.category === category).reduce((sum, t) => sum + Number(t.amount), 0);
                },

                setTxType(type) {
                    this.txForm.type = type;
                    const opts = this.activeCategoryOptions;
                    if (opts && opts.length > 0 && !opts.includes(this.txForm.category)) {
                        this.txForm.category = opts[0];
                    }
                    if (type === 'transfer' && this.txForm.account === this.txForm.toAccount) {
                        this.txForm.toAccount = this.availableAccounts.find(a => a !== this.txForm.account) || 'Bank Mandiri';
                    }
                },

                showToast(msg) { this.toastMsg = msg; setTimeout(() => { this.toastMsg = ''; }, 3200); },
                toggleLanguage() {
                    this.lang = this.lang === 'ID' ? 'EN' : 'ID';
                    try { localStorage.setItem('dnd_lang', this.lang); } catch (e) {}
                    this.updateAllCharts();
                },
                toggleTheme() {
                    this.isDarkMode = !this.isDarkMode;
                    try { localStorage.setItem('dnd_theme', this.isDarkMode ? 'black' : 'light'); } catch (e) {}
                    this.showToast(this.isDarkMode ? (this.lang === 'ID' ? 'Tema Black Aktif' : 'Black Theme Enabled') : (this.lang === 'ID' ? 'Tema Light Aktif' : 'Light Theme Enabled'));
                    requestAnimationFrame(() => this.updateAllCharts());
                },
                
                toggleMode() {
                    if (this.isPersonalMode) {
                        this.openPinModal();
                    } else {
                        this.isPersonalMode = true;
                        if (['invoice', 'payroll'].includes(this.activeMenu)) {
                            this.activeMenu = 'dashboard';
                        }
                        this.showToast(this.lang === 'ID' ? "Beralih ke Mode Personal" : "Switched to Personal Mode");
                        this.updateAllCharts();
                    }
                },

                openPinModal() {
                    this.modalConfig = {
                        isOpen: true,
                        type: 'input',
                        title: 'Corporate Access Verification',
                        message: this.lang === 'ID' ? 'Masukkan PIN untuk mengaktifkan mode perusahaan:' : 'Enter PIN to unlock corporate mode:',
                        fields: [{ id: 'pin', label: 'Executive PIN', type: 'password' }],
                        onConfirm: (res) => {
                            if (res.pin === '369') {
                                this.isPersonalMode = false;
                                this.showToast(this.lang === 'ID' ? "Mode Business Aktif" : "Business Mode Enabled");
                                this.updateAllCharts();
                            } else {
                                this.showToast(this.lang === 'ID' ? "PIN tidak sesuai." : "Invalid PIN.");
                            }
                        }
                    };
                },

                    this.activeMenu = view;
                    if(['dashboard', 'savings'].includes(view)) {
                        requestAnimationFrame(() => { this.updateAllCharts(); });

                        this.txForm.account = this.availableAccounts[0] || 'Bank BCA';
                    }
                    this.setTxType(defaultType);
                    this.isModalOpen = true;

                async addCustomBank() {
                    const name = (this.newBankName || '').trim();
                    if (!name) return this.showToast(this.lang === 'ID' ? "Masukkan nama bank atau akun." : "Enter a bank or account name.");
                    if (this.availableAccounts.some(a => a.toLowerCase() === name.toLowerCase())) {
                        return this.showToast(this.lang === 'ID' ? "Bank atau akun tersebut sudah terdaftar." : "This bank or account already exists.");
                    }
                    this.availableAccounts.push(name);
                    this.txForm.account = name;
                    this.newBankName = '';
                    this.persistAllLocal();
                    if (this.isBackendApiOnline) {
                        try {
                            await fetch(`${this.apiBaseUrl}/api/banks`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ name })
                            });
                        } catch (e) {}
                    }
                    this.showToast(this.lang === 'ID' ? `Akun "${name}" ditambahkan.` : `Account "${name}" added.`);
                },
                async removeCustomBank(bankName) {
                    if (this.availableAccounts.length <= 1) return;
                    this.availableAccounts = this.availableAccounts.filter(a => a !== bankName);
                    if (this.txForm.account === bankName) this.txForm.account = this.availableAccounts[0];
                    if (this.txForm.toAccount === bankName) this.txForm.toAccount = this.availableAccounts[0];
                    this.persistAllLocal();
                    if (this.isBackendApiOnline) {
                        try {
                            await fetch(`${this.apiBaseUrl}/api/banks/${encodeURIComponent(bankName)}`, { method: 'DELETE' });
                        } catch (e) {}
                    }
                    this.showToast(this.lang === 'ID' ? `Akun "${bankName}" dihapus.` : `Account "${bankName}" removed.`);
                },
                persistAllLocal() {
                    try {
                        const storageKey = `dnd_state_${this.userId || 'local_user'}`;
                        localStorage.setItem(storageKey, JSON.stringify({
                            transactions: this.transactions,
                            goals: this.goals,
                            budgets: this.budgets,
                            employees: this.employees,
                            macros: this.macros,
                            availableAccounts: this.availableAccounts
                        }));
                        localStorage.setItem('dnd_custom_accounts', JSON.stringify(this.availableAccounts));
                    } catch (e) {}
                },
                loadSavedBanksLocal() {
                    try {
                        const saved = localStorage.getItem('dnd_custom_accounts');
                        if (saved) {
                            const parsed = JSON.parse(saved);
                            if (Array.isArray(parsed) && parsed.length > 0) this.availableAccounts = parsed;
                        }
                    } catch (e) {}
                },
                openSplitBillModal() {
                    this.splitForm = { title: '', totalAmount: '', taxPercent: 0, people: 2, account: this.availableAccounts[0] || 'Bank BCA', category: 'Food' };
                    this.isModalOpen = true;
                    this.switchTab('split');
                },
                closeModal() { this.isModalOpen = false; this.stopCamera(); },
                
                openInputModal(title, fields, callback) {
                    this.modalConfig = { isOpen: true, type: 'input', title, message: '', fields: fields.map(f => ({...f, value: ''})), onConfirm: callback };
                },
                openConfirmModal(title, message, callback) {
                    this.modalConfig = { isOpen: true, type: 'confirm', title, message, fields: [], onConfirm: callback };
                },
                submitModal() {
                    if (this.modalConfig.type === 'input') {
                        const result = {};
                        this.modalConfig.fields.forEach(f => result[f.id] = f.value);
                        if (this.modalConfig.onConfirm) this.modalConfig.onConfirm(result);
                    } else {
                        if (this.modalConfig.onConfirm) this.modalConfig.onConfirm();
                    }
                    this.modalConfig.isOpen = false;
                },

                calculateTotal(type) {
                    let total = 0;
                    this.transactions.forEach(tx => {
                        let amt = Number(tx.amount) || 0;
                        let fee = Number(tx.adminFee) || 0;
                        if (type === 'balance') {
                            if (tx.type === 'income') total += amt;
                            else if (tx.type === 'expense' || tx.type === 'withdrawal') total -= amt;
                            else if (tx.type === 'transfer') total -= fee;
                        } else if (tx.type === type) {
                            total += amt;
                        }
                    });
                    let multiplier = 1;
                    if (this.currency === 'USD') multiplier = 0.000065;
                    if (this.currency === 'EUR') multiplier = 0.000059;
                    return total * multiplier;
                },
                
                formatCurrency(val) { 
                    return new Intl.NumberFormat(this.lang === 'ID' ? 'id-ID' : 'en-US', { 
                        style: 'currency', currency: this.currency, maximumFractionDigits: this.currency === 'IDR' ? 0 : 2 
                    }).format(val); 
                },

                async initApp() {
                    try {
                        const savedTheme = localStorage.getItem('dnd_theme');
                        if (savedTheme === 'black') this.isDarkMode = true;
                        const savedLang = localStorage.getItem('dnd_lang');
                        if (savedLang === 'EN' || savedLang === 'ID') this.lang = savedLang;

                        // Check if returning from server-side Google OAuth callback hash/query
                        const urlParams = new URLSearchParams(window.location.search);
                        if (urlParams.get('google_auth') === 'success' && urlParams.get('email')) {
                            await this.applyGoogleUserProfile({
                                sub: urlParams.get('sub') || urlParams.get('email'),
                                name: urlParams.get('name') || 'DND Executive',
                                email: urlParams.get('email'),
                                picture: urlParams.get('picture') || ''
                            }, urlParams.get('access_token') || '');
                            window.history.replaceState({}, document.title, window.location.pathname);
                        } else {
                            const savedGoogleUser = localStorage.getItem('dnd_google_user');
                            if (savedGoogleUser) {
                                const u = JSON.parse(savedGoogleUser);
                                if (u && u.email) {
                                    this.isGoogleLoggedIn = true;
                                    this.userName = u.name || 'DND Executive';
                                    this.userEmail = u.email;
                                    this.userPhoto = u.picture || '';
                                    this.userId = u.sub || u.email;
                                }
                            }
                        }
                    } catch (e) {}

                    const splashStart = Date.now();
                    let splashDone = false;
                    const finishSplash = () => {
                        if (splashDone) return;
                        splashDone = true;
                        const elapsed = Date.now() - splashStart;
                        const minDuration = 850;
                        setTimeout(() => {
                            this.isDbLoading = false;
                            requestAnimationFrame(() => this.updateAllCharts());
                        }, Math.max(0, minDuration - elapsed));
                    };
                    this._finishSplash = finishSplash;
                    setTimeout(() => finishSplash(), 1800);

                    this.loadSavedBanksLocal();

                    window.addEventListener('resize', () => {
                        if (typeof echarts === 'undefined') return;
                        requestAnimationFrame(() => {
                            ['sankeyChart', 'forecastChart', 'gaugeChart', 'comboChart'].forEach(id => {
                                const el = document.getElementById(id);
                                const inst = el ? echarts.getInstanceByDom(el) : null;
                                if (inst) inst.resize();
                            });
                            this.goals.forEach(g => {
                                const el = document.getElementById('goalChart_' + g.id);
                                const inst = el ? echarts.getInstanceByDom(el) : null;
                                if (inst) inst.resize();
                            });
                        });
                    });

                    try {
                        const ctrl = new AbortController();
                        const timer = setTimeout(() => ctrl.abort(), 500);
                        const healthRes = await fetch(`${this.apiBaseUrl}/api/health`, { signal: ctrl.signal });
                        clearTimeout(timer);
                        if (healthRes.ok) {
                            this.isBackendApiOnline = true;
                        }
                    } catch (e) {
                        this.isBackendApiOnline = false;
                    }

                    if (this.isBackendApiOnline) {
                        await this.loadFastApiData();
                    } else {
                        this.loadLocalStateOrSeed();
                    }
                },

                async loadFastApiData() {
                    try {
                        const [txRes, bankRes, cfgRes] = await Promise.all([
                            fetch(`${this.apiBaseUrl}/api/transactions`),
                            fetch(`${this.apiBaseUrl}/api/banks`),
                            fetch(`${this.apiBaseUrl}/api/auth/config`).catch(() => null)
                        ]);
                        if (bankRes.ok) {
                            const bData = await bankRes.json();
                            if (Array.isArray(bData.banks) && bData.banks.length > 0) {
                                this.availableAccounts = bData.banks;
                            }
                        }
                        if (cfgRes && cfgRes.ok) {
                            const cData = await cfgRes.json();
                            if (cData.google_client_id) {
                                this.googleClientId = cData.google_client_id;
                            }
                        }
                        if (txRes.ok) {
                            const tData = await txRes.json();
                            this.transactions = (tData.transactions || []).map(row => ({
                                id: String(row.id),
                                amount: Number(row.amount),
                                type: row.type,
                                category: row.category,
                                account: row.account,
                                toAccount: row.to_account || '',
                                adminFee: Number(row.admin_fee || 0),
                                note: row.note || '',
                                currency: row.currency || 'IDR',
                                date: row.date
                            }));
                        }
                    } catch (e) {}

                    this.loadAuxLocalData();
                    if (this.transactions.length === 0) {
                        this.seedDefaultDemoData();
                    }
                    if (this._finishSplash) this._finishSplash();
                },

                loadAuxLocalData() {
                    try {
                        const storageKey = `dnd_state_${this.userId || 'local_user'}`;
                        const saved = localStorage.getItem(storageKey);
                        if (saved) {
                            const p = JSON.parse(saved);
                            if (Array.isArray(p.goals)) this.goals = p.goals;
                            if (Array.isArray(p.budgets)) this.budgets = p.budgets;
                            if (Array.isArray(p.employees)) this.employees = p.employees;
                            if (Array.isArray(p.macros)) this.macros = p.macros;
                        }
                    } catch (e) {}
                },

                loadLocalStateOrSeed() {
                    try {
                        const storageKey = `dnd_state_${this.userId || 'local_user'}`;
                        const saved = localStorage.getItem(storageKey);
                        if (saved) {
                            const p = JSON.parse(saved);
                            this.transactions = Array.isArray(p.transactions) ? p.transactions : [];
                            this.goals = Array.isArray(p.goals) ? p.goals : [];
                            this.budgets = Array.isArray(p.budgets) ? p.budgets : [];
                            this.employees = Array.isArray(p.employees) ? p.employees : [];
                            this.macros = Array.isArray(p.macros) ? p.macros : [];
                            if (Array.isArray(p.availableAccounts) && p.availableAccounts.length > 0) {
                                this.availableAccounts = p.availableAccounts;
                            }
                            if (this.transactions.length > 0 || this.goals.length > 0) {
                                if (this._finishSplash) this._finishSplash();
                                return;
                            }
                        }
                    } catch (e) {}

                    this.seedDefaultDemoData();
                    if (this._finishSplash) this._finishSplash();
                },

                // --- DIRECT ONE-CLICK GOOGLE OAUTH 2.0 API (NO MANUAL CLIENT ID POPUP) ---
                async loginWithGoogle() {
                    if (this.isGoogleAuthLoading) return;
                    this.isGoogleAuthLoading = true;

                    // 1. Direct Google Identity Services OAuth 2.0 Token Client
                    if (window.google && window.google.accounts && window.google.accounts.oauth2) {
                        try {
                            const tokenClient = window.google.accounts.oauth2.initTokenClient({
                                client_id: this.googleClientId,
                                scope: 'openid email profile',
                                callback: async (tokenResponse) => {
                                    if (tokenResponse && tokenResponse.access_token) {
                                        this.googleAccessToken = tokenResponse.access_token;
                                        try {
                                            const userInfoRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                                                headers: { Authorization: `Bearer ${tokenResponse.access_token}` }
                                            });
                                            if (!userInfoRes.ok) throw new Error('UserInfo API error');
                                            const profile = await userInfoRes.json();
                                            await this.applyGoogleUserProfile(profile, tokenResponse.access_token);
                                        } catch (err) {
                                            this.showToast(this.lang === 'ID' ? 'Gagal memverifikasi profil Google.' : 'Failed to verify Google profile.');
                                        } finally {
                                            this.isGoogleAuthLoading = false;
                                        }
                                    } else {
                                        this.isGoogleAuthLoading = false;
                                    }
                                },
                                error_callback: () => {
                                    this.isGoogleAuthLoading = false;
                                    // Fallback to server-side OAuth redirect if popup is blocked
                                    if (this.isBackendApiOnline) {
                                        window.location.href = `${this.apiBaseUrl}/api/auth/google/login`;
                                    } else {
                                        this.showToast(this.lang === 'ID' ? 'Pop-up Google diblokir browser. Izinkan pop-up untuk login.' : 'Google pop-up was blocked by browser. Allow pop-ups to sign in.');
                                    }
                                }
                            });
                            tokenClient.requestAccessToken({ prompt: 'select_account' });
                            return;
                        } catch (e) {
                            this.isGoogleAuthLoading = false;
                        }
                    }

                    // 2. Direct Backend OAuth 2.0 Redirect if GSI script unavailable
                    if (this.isBackendApiOnline) {
                        window.location.href = `${this.apiBaseUrl}/api/auth/google/login`;
                        return;
                    }

                    this.isGoogleAuthLoading = false;
                    this.showToast(this.lang === 'ID' ? 'Layanan Google OAuth sedang dimuat, silakan coba lagi.' : 'Google OAuth service is loading, please retry.');
                },

                async applyGoogleUserProfile(profile, accessToken = '') {
                    this.isGoogleLoggedIn = true;
                    this.userName = profile.name || 'DND Executive';
                    this.userEmail = profile.email || '';
                    this.userPhoto = profile.picture || '';
                    this.userId = profile.sub || profile.email || 'google_user';

                    try {
                        localStorage.setItem('dnd_google_user', JSON.stringify({
                            sub: this.userId,
                            name: this.userName,
                            email: this.userEmail,
                            picture: this.userPhoto
                        }));
                    } catch (e) {}

                    if (this.isBackendApiOnline) {
                        try {
                            await fetch(`${this.apiBaseUrl}/api/auth/google`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    access_token: accessToken,
                                    sub: this.userId,
                                    email: this.userEmail,
                                    name: this.userName,
                                    picture: this.userPhoto
                                })
                            });
                        } catch (e) {}
                    }

                    this.loadLocalStateOrSeed();
                    this.showToast(this.lang === 'ID' ? `Terhubung sebagai ${this.userName}` : `Signed in as ${this.userName}`);
                },

                logoutGoogle() {
                    if (this.googleAccessToken && window.google && window.google.accounts && window.google.accounts.oauth2) {
                        try { window.google.accounts.oauth2.revoke(this.googleAccessToken, () => {}); } catch (e) {}
                    }
                    this.googleAccessToken = '';
                    this.isGoogleLoggedIn = false;
                    this.userName = 'Guest';
                    this.userEmail = '';
                    this.userPhoto = '';
                    this.userId = 'local_user';
                    try { localStorage.removeItem('dnd_google_user'); } catch (e) {}
                    this.loadLocalStateOrSeed();
                    this.showToast(this.lang === 'ID' ? 'Berhasil keluar dari akun Google.' : 'Signed out from Google account.');
                },

                // --- TRANSACTION CRUD ---
                async saveTransactionAPI() {
                    const amountVal = Number(this.txForm.amount);
                    if (!amountVal || amountVal <= 0) {
                        return this.showToast(this.lang === 'ID' ? 'Masukkan nominal transaksi yang valid.' : 'Enter a valid transaction amount.');
                    }

                    const newTx = {
                        id: 'tx_' + Date.now(),
                        amount: amountVal,
                        type: this.txForm.type,
                        category: this.txForm.type === 'transfer' ? 'Transfer' : this.txForm.category,
                        account: this.txForm.account || this.availableAccounts[0] || 'Bank BCA',
                        toAccount: this.txForm.type === 'transfer' ? (this.txForm.toAccount || this.availableAccounts[1] || 'Bank Mandiri') : '',
                        adminFee: this.txForm.type === 'transfer' ? (Number(this.txForm.adminFee) || 0) : 0,
                        note: (this.txForm.note || '').trim(),
                        currency: this.currency,
                        date: this.txForm.date || new Date().toISOString().split('T')[0]
                    };

                    if (newTx.type === 'transfer' && newTx.account === newTx.toAccount) {
                        return this.showToast(this.lang === 'ID' ? 'Rekening asal dan tujuan tidak boleh sama.' : 'Source and destination accounts must differ.');
                    }

                    this.transactions.unshift(newTx);

                    if (newTx.type === 'income' && newTx.category === 'Salary' && this.goals.length > 0) {
                        const autoSaveMacro = this.macros.find(m => m.name.toLowerCase().includes('salary') || m.name.toLowerCase().includes('20%'));
                        if (autoSaveMacro) {
                            const alloc = Math.round(amountVal * 0.2);
                            this.goals[0].current = Number(this.goals[0].current) + alloc;
                        }
                    }

                    this.persistAllLocal();

                    if (this.isBackendApiOnline) {
                        try {
                            const res = await fetch(`${this.apiBaseUrl}/api/transactions`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    amount: newTx.amount,
                                    type: newTx.type,
                                    category: newTx.category,
                                    account: newTx.account,
                                    to_account: newTx.toAccount,
                                    admin_fee: newTx.adminFee,
                                    note: newTx.note,
                                    currency: newTx.currency,
                                    date: newTx.date
                                })
                            });
                            if (res.ok) {
                                const savedRes = await res.json();
                                if (savedRes.id) newTx.id = String(savedRes.id);
                            }
                        } catch (e) {}
                    }

                    this.txForm.amount = '';
                    this.txForm.note = '';
                    this.txForm.adminFee = '';
                    this.closeModal();
                    this.showToast(this.lang === 'ID' ? 'Transaksi berhasil dicatat.' : 'Transaction recorded successfully.');
                    requestAnimationFrame(() => this.updateAllCharts());
                },

                deleteTransaction(txId) {
                    this.openConfirmModal(
                        this.lang === 'ID' ? 'Hapus Transaksi?' : 'Delete Transaction?',
                        this.lang === 'ID' ? 'Data transaksi ini akan dihapus permanen dari catatan keuangan.' : 'This transaction will be permanently removed from your ledger.',
                        async () => {
                            this.transactions = this.transactions.filter(t => String(t.id) !== String(txId));
                            this.persistAllLocal();
                            if (this.isBackendApiOnline && /^\d+$/.test(String(txId))) {
                                try {
                                    await fetch(`${this.apiBaseUrl}/api/transactions/${txId}`, { method: 'DELETE' });
                                } catch (e) {}
                            }
                            this.showToast(this.lang === 'ID' ? 'Transaksi dihapus.' : 'Transaction deleted.');
                            requestAnimationFrame(() => this.updateAllCharts());
                        }
                    );
                },

                // --- GOALS, BUDGETS, PAYROLL & MACROS ---
                promptNewGoal() {
                    this.openInputModal(
                        this.lang === 'ID' ? 'Target Tabungan Baru' : 'New Savings Goal',
                        [
                            { id: 'name', label: this.lang === 'ID' ? 'Nama Target' : 'Goal Name', type: 'text' },
                            { id: 'target', label: this.lang === 'ID' ? 'Nominal Target' : 'Target Amount', type: 'number' }
                        ],
                        (res) => {
                            const target = Number(res.target);
                            if (!res.name || target <= 0) return;
                            const goal = { id: 'g_' + Date.now(), name: res.name.trim(), target, current: 0 };
                            this.goals.push(goal);
                            this.persistAllLocal();
                            this.showToast(this.lang === 'ID' ? 'Target tabungan ditambahkan.' : 'Savings goal added.');
                            requestAnimationFrame(() => this.renderGoalDonut(goal));
                        }
                    );
                },

                addFundsToGoal(goal) {
                    this.openInputModal(
                        `${this.t('add_funds_btn')}: ${goal.name}`,
                        [{ id: 'amount', label: this.t('amount_label'), type: 'number' }],
                        (res) => {
                            const add = Number(res.amount);
                            if (add <= 0) return;
                            goal.current = Number(goal.current) + add;
                            this.persistAllLocal();
                            if (goal.current >= goal.target && typeof confetti === 'function') {
                                confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
                            }
                            this.showToast(this.lang === 'ID' ? 'Saldo target diperbarui!' : 'Goal balance updated!');
                            requestAnimationFrame(() => this.renderGoalDonut(goal));
                        }
                    );
                },

                deleteGoal(id) {

                    this.persistAllLocal();
                    this.showToast(this.lang === 'ID' ? 'Target dihapus.' : 'Goal removed.');
                },

                promptNewBudget() {
                    this.openInputModal(
                        this.lang === 'ID' ? 'Anggaran Kategori Baru' : 'New Category Budget',
                        [
                            { id: 'category', label: this.t('category_label'), type: 'text' },
                            { id: 'limit', label: this.lang === 'ID' ? 'Batas Bulanan' : 'Monthly Limit', type: 'number' }
                        ],
                        (res) => {
                            const limit = Number(res.limit);
                            if (!res.category || limit <= 0) return;

                // --- VOICE INPUT ---
                startVoiceInput() {
                    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (!SpeechRec) {
                        return this.showToast(this.lang === 'ID' ? 'Browser ini tidak mendukung Voice Recognition.' : 'Speech recognition is not supported in this browser.');
                    }
                    const recognition = new SpeechRec();
                    recognition.lang = this.lang === 'ID' ? 'id-ID' : 'en-US';
                    recognition.interimResults = false;
                    this.isListening = true;
                    this.voiceText = '';

                    recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        this.voiceText = `"${transcript}"`;
                        this.isListening = false;
                        this.parseVoiceTranscript(transcript);
                    };
                    recognition.onerror = () => {
                        this.isListening = false;
                        this.showToast(this.lang === 'ID' ? 'Suara tidak terdeteksi, silakan coba lagi.' : 'Voice not detected, please retry.');
                    };
                    recognition.onend = () => { this.isListening = false; };
                    recognition.start();
                },

                parseVoiceTranscript(text) {
                    const lower = text.toLowerCase();
                    let detectedType = 'expense';
                    if (lower.includes('gaji') || lower.includes('salary') || lower.includes('pemasukan') || lower.includes('income') || lower.includes('terima')) {
                        detectedType = 'income';
                    } else if (lower.includes('tarik') || lower.includes('withdraw') || lower.includes('wd')) {
                        detectedType = 'withdrawal';
                    }

                    let amount = 0;
                    const jutaMatch = lower.match(/(\d+(?:[.,]\d+)?)\s*(juta|million|jt)/);
                    const ribuMatch = lower.match(/(\d+(?:[.,]\d+)?)\s*(ribu|thousand|rb|k)/);
                    const rawNumMatch = lower.match(/(\d+(?:[.,]\d+)*)/);

                    if (jutaMatch) {
                        amount = parseFloat(jutaMatch[1].replace(',', '.')) * 1000000;
                    } else if (ribuMatch) {
                        amount = parseFloat(ribuMatch[1].replace(',', '.')) * 1000;
                    } else if (rawNumMatch) {
                        amount = parseFloat(rawNumMatch[1].replace(/[.,]/g, ''));
                    }

                    this.setTxType(detectedType);
                    if (amount > 0) this.txForm.amount = Math.round(amount);
                    if (lower.includes('salary') || lower.includes('gaji')) this.txForm.category = 'Salary';
                    else if (lower.includes('makan') || lower.includes('kopi') || lower.includes('lunch')) this.txForm.category = 'Food';
                    else if (lower.includes('transport') || lower.includes('bensin') || lower.includes('grab') || lower.includes('gojek')) this.txForm.category = 'Transport';
                    this.txForm.note = text;
                    this.switchTab('manual');
                    this.showToast(this.lang === 'ID' ? 'Transaksi dari suara berhasil diisi!' : 'Transaction parsed from voice!');
                },

                // --- LIVE CAMERA & RECEIPT SCANNER ---
                async startCamera() {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        return this.showToast(this.lang === 'ID' ? 'Kamera tidak tersedia di perangkat/browser ini.' : 'Camera is unavailable on this device/browser.');
                    }
                    try {
                        this.stopCamera();
                        this.videoStream = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: this.cameraFacingMode },
                            audio: false
                        });
                        this.isCameraActive = true;
                        this.$nextTick(() => {
                            if (this.$refs.videoElement) {
                                this.$refs.videoElement.srcObject = this.videoStream;
                            }
                        });
                    } catch (err) {
                        this.showToast(this.lang === 'ID' ? 'Izin kamera ditolak atau tidak ditemukan.' : 'Camera permission denied or unavailable.');
                    }
                },

                switchCameraFacing() {
                    this.cameraFacingMode = this.cameraFacingMode === 'environment' ? 'user' : 'environment';
                    if (this.isCameraActive) this.startCamera();
                },

                stopCamera() {
                    if (this.videoStream) {
                        this.videoStream.getTracks().forEach(track => track.stop());
                        this.videoStream = null;
                    }
                    this.isCameraActive = false;
                },

                async captureAndScan() {
                    const video = this.$refs.videoElement;
                    if (!video) return;
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    this.stopCamera();
                    await this.processReceiptImage(dataUrl);
                },

                handleFileUpload(event) {
                    const file = event.target.files && event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        await this.processReceiptImage(e.target.result);
                    };
                    reader.readAsDataURL(file);
                },

                simulateReceiptScan() {
                    this.setTxType('expense');
                    this.txForm.amount = 148500;
                    this.txForm.category = 'Food';
                    this.txForm.note = 'Scanned Receipt — Artisan Roastery & Bistro';
                    this.switchTab('manual');
                    this.showToast(this.lang === 'ID' ? 'Simulasi struk berhasil diekstrak!' : 'Sample receipt extracted!');

                async processReceiptImage(dataUrl) {
                    this.showToast(this.lang === 'ID' ? 'Memindai struk dengan AI Vision & OCR...' : 'Scanning receipt with AI Vision & OCR...');
                    const base64Data = dataUrl.split(',')[1];

                    if (this.isBackendApiOnline) {
                        try {
                            const res = await fetch(`${this.apiBaseUrl}/api/scan/receipt`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ image_base64: base64Data, mime_type: 'image/jpeg', mode: this.isPersonalMode ? 'personal' : 'business' })
                            });
                            if (res.ok) {
                                const data = await res.json();
                                if (data.amount && Number(data.amount) > 0) {
                                    this.setTxType('expense');
                                    this.txForm.amount = Number(data.amount);
                                    if (data.category) this.txForm.category = data.category;
                                    this.txForm.note = data.note || 'Scanned Receipt';
                                    this.switchTab('manual');
                                    return this.showToast(this.lang === 'ID' ? 'Struk berhasil dipindai via API!' : 'Receipt scanned via API!');
                                }
                            }
                        } catch (e) {}
                    }

                    try {
                        const apiKey = "";
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                        const payload = {
                            contents: [{
                                role: "user",
                                parts: [
                                    { text: 'Extract the final total amount (number only), category (choose one: Food, Transport, Utilities, Shopping, Health & Lifestyle, Office Rent, SaaS/Software), and merchant/short note from this receipt image. Return valid JSON: {"amount": 0, "category": "Food", "note": "..."}' },
                                    { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                                ]
                            }],
                            generationConfig: { responseMimeType: "application/json" }
                        };
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (response.ok) {
                            const result = await response.json();
                            const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                            if (rawText) {
                                const parsed = JSON.parse(rawText);
                                if (Number(parsed.amount) > 0) {
                                    this.setTxType('expense');
                                    this.txForm.amount = Number(parsed.amount);
                                    if (parsed.category) this.txForm.category = parsed.category;
                                    this.txForm.note = parsed.note || 'AI Vision Receipt';
                                    this.switchTab('manual');
                                    return this.showToast(this.lang === 'ID' ? 'Struk berhasil diekstrak dengan AI!' : 'Receipt extracted with AI!');
                                }
                            }
                        }
                    } catch (e) {}

                    try {
                        if (typeof Tesseract !== 'undefined') {
                            const { data: { text } } = await Tesseract.recognize(dataUrl, 'eng');
                            const matches = text.match(/\b\d{1,3}(?:[.,]\d{3})+\b/g) || [];
                            const nums = matches.map(m => parseInt(m.replace(/[.,]/g, ''), 10)).filter(n => n >= 1000);
                            if (nums.length > 0) {
                                this.setTxType('expense');
                                this.txForm.amount = Math.max(...nums);
                                this.txForm.category = 'Food';
                                this.txForm.note = 'OCR Receipt Scan';
                                this.switchTab('manual');
                                return this.showToast(this.lang === 'ID' ? 'Nominal struk terdeteksi via OCR!' : 'Receipt total extracted via OCR!');
                            }
                        }
                    } catch (e) {}

                    this.showToast(this.lang === 'ID' ? 'Tidak dapat membaca angka otomatis, silakan input manual.' : 'Could not auto-read receipt, please enter manually.');
                },

                // --- DND AI FINANCIAL ANALYST ---
                buildFinancialContextSummary() {
                    const inc = this.calculateTotal('income');
                    const exp = this.calculateTotal('expense');
                    const bal = this.calculateTotal('balance');
                    const banks = this.accountBalances.map(b => `${b.name}: ${this.formatCurrency(b.balance)}`).join(', ');
                    const recentTx = this.transactions.slice(0, 12).map(t => `${t.date} | ${t.type} | ${t.category} | ${t.account} | ${this.formatCurrency(t.amount)} | ${t.note || ''}`).join('\n');
                    const goalsStr = this.goals.map(g => `${g.name}: ${this.formatCurrency(g.current)} / ${this.formatCurrency(g.target)}`).join(', ');
                    return `Mode: ${this.isPersonalMode ? 'Personal' : 'Business'} | Currency: ${this.currency}
Net Balance: ${this.formatCurrency(bal)} | Total Income: ${this.formatCurrency(inc)} | Total Expense: ${this.formatCurrency(exp)}
Bank Balances: ${banks}
Goals: ${goalsStr || 'None'}
Recent Transactions:\n${recentTx || 'None'}`;
                },

                async runFullAiAnalysis() {
                    const prompt = this.lang === 'ID'
                        ? 'Lakukan audit keuangan komprehensif terhadap seluruh saldo bank, pemasukan (Salary), pengeluaran, arus kas, anggaran, dan target tabungan saya. Berikan ringkasan eksekutif dan 3 rekomendasi strategis yang dapat langsung diterapkan.'
                        : 'Perform a comprehensive executive financial audit of my bank balances, income (Salary), expenses, cash flow, budgets, and savings goals. Provide an executive summary and 3 actionable strategic recommendations.';
                    await this.askAiPrompt(prompt, this.t('ai_full_audit_btn'));
                },

                async submitCustomAiQuery() {
                    const q = (this.aiCustomInput || '').trim();
                    if (!q) return;
                    this.aiCustomInput = '';
                    await this.askAiPrompt(q, q);
                },

                async askAiPrompt(promptText, displayQuestion) {
                    if (this.isAiLoading) return;
                    this.aiMessages.push({ role: 'user', text: displayQuestion });
                    this.isAiLoading = true;
                    const context = this.buildFinancialContextSummary();

                    if (this.isBackendApiOnline) {
                        try {
                            const res = await fetch(`${this.apiBaseUrl}/api/ai/analyze`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    prompt: promptText,
                                    financial_context: context,
                                    lang: this.lang,
                                    mode: this.isPersonalMode ? 'personal' : 'business'
                                })
                            });
                            if (res.ok) {
                                const data = await res.json();
                                if (data.analysis) {
                                    this.aiMessages.push({ role: 'ai', text: data.analysis });
                                    this.isAiLoading = false;
                                    return;
                                }
                            }
                        } catch (e) {}
                    }

                    const sysPrompt = this.lang === 'ID'
                        ? 'Anda adalah DND AI Financial Analyst eksekutif. Analisis seluruh data keuangan pengguna secara tajam, akurat, terstruktur menggunakan heading dan bullet points.'
                        : 'You are DND AI Financial Analyst. Analyze the user financial data sharply and accurately using clear headings and bullet points.';
                    const fullQuery = `DATA KEUANGAN:\n${context}\n\nPERMINTAAN ANALISIS:\n${promptText}`;

                    const delays = [1000, 2000, 4000];
                    for (let attempt = 0; attempt <= delays.length; attempt++) {
                        try {
                            const apiKey = "";
                            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                            const response = await fetch(apiUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: fullQuery }] }],
                                    systemInstruction: { parts: [{ text: sysPrompt }] }
                                })
                            });
                            if (response.ok) {
                                const result = await response.json();
                                const reply = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                                if (reply) {
                                    this.aiMessages.push({ role: 'ai', text: reply });
                                    this.isAiLoading = false;
                                    return;
                                }
                            }
                        } catch (e) {}
                        if (attempt < delays.length) {
                            await new Promise(r => setTimeout(r, delays[attempt]));
                        }
                    }

                    const inc = this.calculateTotal('income');
                    const exp = this.calculateTotal('expense');
                    const bal = this.calculateTotal('balance');
                    const savingsRate = inc > 0 ? Math.max(0, Math.round(((inc - exp) / inc) * 100)) : 0;
                    const topBank = this.accountBalances.slice().sort((a, b) => b.balance - a.balance)[0];

                    const fallbackReport = this.lang === 'ID'
                        ? `### Ringkasan Eksekutif DND AI\n- **Total Saldo Bersih:** ${this.formatCurrency(bal)} (Rasio Efisiensi Kas: **${savingsRate}%**)\n- **Arus Masuk vs Keluar:** Pemasukan ${this.formatCurrency(inc)} dibanding pengeluaran ${this.formatCurrency(exp)}.\n- **Konsentrasi Likuiditas:** Saldo terbesar berada di **${topBank ? topBank.name : 'Bank BCA'}** (${topBank ? this.formatCurrency(topBank.balance) : this.formatCurrency(0)}).\n### Rekomendasi Strategis\n- Pertahankan rasio tabungan minimal **20–30%** setiap kali pemasukan Salary masuk.\n- Gunakan fitur **Transfer** untuk memisahkan dana operasional harian dari dana cadangan jangka panjang.`
                        : `### DND AI Executive Summary\n- **Net Total Balance:** ${this.formatCurrency(bal)} (Cash Efficiency Ratio: **${savingsRate}%**)\n- **Cash Inflow vs Outflow:** Income of ${this.formatCurrency(inc)} against expenses of ${this.formatCurrency(exp)}.\n- **Primary Liquidity Hub:** Highest balance is held in **${topBank ? topBank.name : 'Bank BCA'}** (${topBank ? this.formatCurrency(topBank.balance) : this.formatCurrency(0)}).\n### Strategic Recommendations\n- Maintain at least a **20–30%** savings allocation whenever Salary income arrives.\n- Use **Transfer** to isolate daily operational spending from long-term capital reserves.`;

                    this.aiMessages.push({ role: 'ai', text: fallbackReport });
                    this.isAiLoading = false;
                },

                formatAiMarkdown(text) {
                    if (!text) return '';
                    return text
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                        .replace(/^###\s+(.*)$/gm, '<h4 class="font-bold text-dndInk text-sm mt-2 mb-1">$1</h4>')
                        .replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-dndInk">$1</strong>')
                        .replace(/^\-\s+(.*)$/gm, '<div class="flex items-start gap-2"><span class="text-dndCobalt font-bold">•</span><span>$1</span></div>')
                        .replace(/\n/g, '<br>');
                },

                copyAiResult(text) {
                    this.copyToClipboard(text);
                    this.showToast(this.lang === 'ID' ? 'Hasil analisis disalin!' : 'Analysis copied!');
                },

                copyToClipboard(text) {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy'); } catch (e) {}
                    document.body.removeChild(ta);
                },

                renderGaugeChart() {
                    const el = document.getElementById('gaugeChart');
                    if (!el) return;
                    const chart = echarts.getInstanceByDom(el) || echarts.init(el);
                    const inc = this.calculateTotal('income');
                    const exp = this.calculateTotal('expense');
                    const score = inc > 0 ? Math.max(0, Math.min(100, Math.round(((inc - exp) / inc) * 100))) : 75;
                    const inkColor = this.isDarkMode ? '#F4F4F6' : '#141518';
                    const trackColor = this.isDarkMode ? '#23232B' : '#E5E3DC';

                    chart.setOption({
                        series: [{
                            type: 'gauge',
                            startAngle: 200,
                            endAngle: -20,
                            min: 0,
                            max: 100,
                            progress: { show: true, width: 10, roundCap: true, itemStyle: { color: score >= 50 ? '#10B981' : '#F59E0B' } },
                            pointer: { show: false },
                            axisLine: { roundCap: true, lineStyle: { width: 10, color: [[1, trackColor]] } },
                            axisTick: { show: false },
                            splitLine: { show: false },
                            axisLabel: { show: false },
                            detail: { valueAnimation: true, offsetCenter: [0, '8%'], fontSize: 20, fontWeight: 700, fontFamily: 'JetBrains Mono', color: inkColor, formatter: '{value}%' },
                            data: [{ value: score }]
                        }]
                    });
                },

                renderComboChart() {
                    const el = document.getElementById('comboChart');
                    if (!el) return;
                    const chart = echarts.getInstanceByDom(el) || echarts.init(el);
                    const subColor = this.isDarkMode ? '#9CA3AF' : '#686A6F';
                    const gridColor = this.isDarkMode ? '#23232B' : '#EFECE6';

                    const grouped = {};
                    this.transactions.forEach(tx => {
                        const d = tx.date || new Date().toISOString().split('T')[0];
                        if (!grouped[d]) grouped[d] = { inc: 0, exp: 0 };
                        if (tx.type === 'income') grouped[d].inc += Number(tx.amount) || 0;
                        else if (tx.type === 'expense' || tx.type === 'withdrawal') grouped[d].exp += Number(tx.amount) || 0;
                    });

                    const dates = Object.keys(grouped).sort();
                    if (dates.length === 0) {
                        dates.push(new Date().toISOString().split('T')[0]);
                        grouped[dates[0]] = { inc: 0, exp: 0 };
                    }

                    const labels = dates.map(d => {
                        const dt = new Date(d);
                        return isNaN(dt) ? d : dt.toLocaleDateString(this.lang === 'ID' ? 'id-ID' : 'en-US', { day: '2-digit', month: 'short' });
                    });
                    const mult = this.currency === 'USD' ? 0.000065 : (this.currency === 'EUR' ? 0.000059 : 1);
                    const incSeries = dates.map(d => Math.round(grouped[d].inc * mult * 100) / 100);
                    const expSeries = dates.map(d => Math.round(grouped[d].exp * mult * 100) / 100);

                    chart.setOption({
                        animationDuration: 900,
                        tooltip: { trigger: 'axis' },
                        legend: { top: 0, right: 0, textStyle: { color: subColor, fontSize: 11 } },
                        grid: { left: '3%', right: '3%', bottom: '4%', top: '16%', containLabel: true },
                        xAxis: { type: 'category', data: labels, axisLine: { lineStyle: { color: gridColor } }, axisLabel: { color: subColor, fontSize: 11 } },
                        yAxis: { type: 'value', splitLine: { lineStyle: { color: gridColor, type: 'dashed' } }, axisLabel: { color: subColor, fontSize: 10 } },
                        series: [
                            { name: this.t('income'), type: 'bar', data: incSeries, barMaxWidth: 26, itemStyle: { color: '#3B82F6', borderRadius: [6, 6, 0, 0] } },
                            { name: this.t('expense'), type: 'line', smooth: true, data: expSeries, itemStyle: { color: '#F43F5E' }, lineStyle: { width: 2.5 }, symbolSize: 7 }
                        ]
                    }, true);
                },

                    const currentBal = this.calculateTotal('balance');
                    const netDaily = Math.max(0, (this.calculateTotal('income') - this.calculateTotal('expense')) / 30);
                    const labels = ['Now', '+7D', '+14D', '+21D', '+30D'];

                    chart.setOption({

                        xAxis: { type: 'category', data: labels, axisLine: { lineStyle: { color: gridColor } }, axisLabel: { color: subColor, fontSize: 11 } },
                        yAxis: { type: 'value', splitLine: { lineStyle: { color: gridColor, type: 'dashed' } }, axisLabel: { color: subColor, fontSize: 10 } },
                        series: [{
                            name: this.t('balance'),

                            }
                        }]
                    }, true);
                },

                renderSankeyChart() {
                    const el = document.getElementById('sankeyChart');
                    if (!el) return;
                    const chart = echarts.getInstanceByDom(el) || echarts.init(el);
                    const labelColor = this.isDarkMode ? '#F4F4F6' : '#141518';

                    const inc = Math.max(1, this.calculateTotal('income'));
                    const exp = Math.max(0.01, this.calculateTotal('expense'));
                    const wd = Math.max(0.01, this.calculateTotal('withdrawal'));
                    const sav = Math.max(0.01, inc - exp - wd);

                    chart.setOption({
                        tooltip: { trigger: 'item' },
                        series: [{
                            type: 'sankey',
                            layout: 'none',
                            nodeAlign: 'left',
                            emphasis: { focus: 'adjacency' },
                            data: [
                                { name: 'Income', itemStyle: { color: '#3B82F6' } },
                                { name: 'Savings', itemStyle: { color: '#10B981' } },
                                { name: 'Expenses', itemStyle: { color: '#F43F5E' } },
                                { name: 'Withdrawal', itemStyle: { color: '#F59E0B' } }
                            ],
                            links: [
                                { source: 'Income', target: 'Savings', value: sav },
                                { source: 'Income', target: 'Expenses', value: exp },
                                { source: 'Income', target: 'Withdrawal', value: wd }
                            ],
                            lineStyle: { color: 'source', curveness: 0.5, opacity: 0.35 },
                            label: { color: labelColor, fontWeight: 600, fontSize: 12 }
                        }]
                    }, true);
                },

                renderGoalDonut(goal) {
                    const el = document.getElementById('goalChart_' + goal.id);
                    if (!el || typeof echarts === 'undefined') return;
                    const chart = echarts.getInstanceByDom(el) || echarts.init(el);
                    const pct = Math.min(100, Math.round((Number(goal.current) / Math.max(1, Number(goal.target))) * 100));
                    const trackColor = this.isDarkMode ? '#23232B' : '#E5E3DC';
                    const inkColor = this.isDarkMode ? '#F4F4F6' : '#141518';

                    chart.setOption({
                        series: [{
                            type: 'pie',
                            radius: ['68%', '92%'],
                            silent: true,
                            label: { show: true, position: 'center', formatter: `${pct}%`, fontSize: 11, fontWeight: 700, color: inkColor, fontFamily: 'JetBrains Mono' },
                            data: [
                                { value: pct, itemStyle: { color: '#10B981' } },
                                { value: 100 - pct, itemStyle: { color: trackColor } }
                            ]
                        }]
                    });
                },

                // --- EXCEL & PDF REPORTS ---
                async exportExcel() {
                    if (typeof ExcelJS === 'undefined') return this.showToast('ExcelJS library not loaded.');
                    const wb = new ExcelJS.Workbook();
                    const wsOverview = wb.addWorksheet('Overview Analysis');
                    const wsTx = wb.addWorksheet('Transactions');

                    wsTx.columns = [
                        { header: 'Date', key: 'date', width: 15 },
                        { header: 'Type', key: 'type', width: 14 },
                        { header: 'Category', key: 'category', width: 22 },
                        { header: 'Account / Route', key: 'account', width: 26 },
                        { header: 'Note', key: 'note', width: 32 },
                        { header: 'Amount', key: 'amount', width: 18 },
                        { header: 'Fees (1.5%)', key: 'fees', width: 16 },
                        { header: 'Tax (11%)', key: 'tax', width: 16 }
                    ];
                    wsTx.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
                    wsTx.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1D4ED8' } };

                    this.transactions.forEach((tx, idx) => {
                        const r = idx + 2;
                        const acc = tx.type === 'transfer' ? `${tx.account} -> ${tx.toAccount}` : tx.account;
                        wsTx.addRow({
                            date: tx.date,
                            type: tx.type.toUpperCase(),
                            category: tx.category,
                            account: acc,
                            note: tx.note || '-',
                            amount: Number(tx.amount),
                            fees: { formula: `F${r}*0.015` },
                            tax: { formula: `F${r}*0.11` }
                        });
                    });

                    const lastR = Math.max(2, this.transactions.length + 1);
                    wsOverview.getCell('B2').value = 'DND FINANCE — FINSIGHT BI EXECUTIVE OVERVIEW';
                    wsOverview.getCell('B2').font = { bold: true, size: 14, color: { argb: 'FF1D4ED8' } };

                    wsOverview.getCell('B4').value = 'Total Transaction Volume';
                    wsOverview.getCell('B5').value = { formula: `SUM(Transactions!F2:F${lastR})` };
                    wsOverview.getCell('D4').value = 'Total Transactions';
                    wsOverview.getCell('D5').value = { formula: `COUNTA(Transactions!A2:A${lastR})` };
                    wsOverview.getCell('F4').value = 'Avg Transaction Value';
                    wsOverview.getCell('F5').value = { formula: `IFERROR(AVERAGE(Transactions!F2:F${lastR}), 0)` };

                    const buf = await wb.xlsx.writeBuffer();
                    saveAs(new Blob([buf]), `DND_FinSight_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
                    this.showToast(this.lang === 'ID' ? 'Laporan Excel FinSight BI berhasil diunduh!' : 'FinSight BI Excel report downloaded!');
                },

                exportPDF() {
                    if (!window.jspdf) return this.showToast('jsPDF library not loaded.');
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ orientation: 'landscape' });

                    doc.setFontSize(18);
                    doc.text('DND FINANCE — EXECUTIVE FINANCIAL REPORT', 14, 18);
                    doc.setFontSize(10);
                    doc.setTextColor(100);
                    doc.text(`Generated: ${new Date().toLocaleDateString()} | Mode: ${this.isPersonalMode ? 'Personal' : 'Corporate'} | Net Balance: ${this.formatCurrency(this.calculateTotal('balance'))}`, 14, 25);

                    const rows = this.transactions.map(tx => [
                        tx.date,
                        tx.type.toUpperCase(),
                        tx.category,
                        tx.type === 'transfer' ? `${tx.account} -> ${tx.toAccount}` : tx.account,
                        tx.note || '-',
                        this.formatCurrency(tx.amount)
                    ]);

                    doc.autoTable({
                        startY: 32,
                        head: [['Date', 'Type', 'Category', 'Account / Route', 'Note', 'Amount']],
                        body: rows,
                        theme: 'grid',
                        headStyles: { fillColor: [20, 21, 24] }
                    });

                    doc.save(`DND_Executive_Report_${new Date().toISOString().slice(0,10)}.pdf`);
                    this.showToast(this.lang === 'ID' ? 'Laporan PDF Eksekutif berhasil diunduh!' : 'Executive PDF report downloaded!');
                }
            }));
        });
    </script>
</body>
