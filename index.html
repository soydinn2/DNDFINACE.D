<!DOCTYPE html>
<html lang="id" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DND Finance — Manajemen Kekayaan Pribadi</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 260 128'%3E%3Crect width='260' height='128' rx='26' fill='%23ffffff'/%3E%3Cpath fill='%230f172a' d='M20 16H56V21H47V78C47 93 38 103 28 107H64C86 107 98 91 98 67L111 80C108 101 92 112 64 112H20C30 106 35 98 35 86V30C35 23 30 19 20 16Z'/%3E%3Cpath fill='%230f172a' d='M54 16C78 16 91 25 105 39L164 99C170 105 176 107 186 107V112H160L95 46C83 34 73 21 54 21V16Z'/%3E%3Cpath fill='%230f172a' d='M156 16V78L142 64V31C142 23 147 18 156 16Z'/%3E%3Cpath fill='%230f172a' d='M164 16H185C222 16 240 36 240 64C240 92 222 112 185 112H183V107H184C211 107 224 90 224 64C224 38 211 21 184 21H164V16Z'/%3E%3C/svg%3E">
    
    <!-- PWA & Mobile App Meta -->
    <meta name="theme-color" content="#090C12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        cream: {
                            50: '#FFFFFF',
                            100: '#F8FAFC',
                            200: '#E2E8F0',
                            300: '#CBD5E1',
                            400: '#94A3B8',
                            500: '#64748B',
                            700: '#334155',
                            900: '#0F172A',
                        },
                        obsidian: {
                            950: '#090C12',
                            900: '#10151F',
                            850: '#161D2B',
                            800: '#1D2638',
                            700: '#2A354D',
                        },
                        royal: {
                            50: '#EFF6FF',
                            100: '#DBEAFE',
                            500: '#3B82F6',
                            600: '#2563EB',
                            700: '#1D4ED8',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(15, 23, 42, 0.05)',
                        'card': '0 2px 10px rgba(15, 23, 42, 0.03)',
                        'float': '0 14px 34px -8px rgba(24, 52, 118, 0.45)',
                    }
                }
            }
        }
    </script>

    <!-- Direct Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer onload="window.dispatchEvent(new Event('dnd-gsi-loaded'))"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
            onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';document.head.appendChild(s);"></script>
    
    <!-- SheetJS (Excel .xlsx / .xls / .csv Import & Multi-Sheet Export) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- jsPDF & AutoTable (PDF Corporate KPI Report Export) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <!-- PDF.js (Client-Side PDF Report Parser & Importer) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- Tesseract.js (Client-Side Receipt & Split Bill OCR Engine) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            background-color: #FFFFFF;
            color: #0F172A;
        }
        html.dark body {
            background-color: #090C12;
            color: #F8FAFC;
        }
        h1, h2, h3, .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .pt-safe {
            padding-top: env(safe-area-inset-top, 12px);
        }
        [x-cloak] {
            display: none !important;
        }
        .dnd-brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .dnd-brand-mark svg {
            width: 54px;
            height: 27px;
        }

        /* ============================================================== */
        /* ANIMATED DND LOGO DISPLAY ENTRY SCREEN (FRONT SPLASH)          */
        /* ============================================================== */
        @keyframes dndSplashAuraPulse {
            0%, 100% {
                transform: scale(0.95);
                opacity: 0.45;
            }
            50% {
                transform: scale(1.08);
                opacity: 0.85;
            }
        }

        @keyframes dndMonogramLeftD {
            0% {
                opacity: 0;
                transform: translateX(-18px) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes dndMonogramDiagonalN {
            0% {
                opacity: 0;
                transform: translate(-14px, -14px) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
        }

        @keyframes dndMonogramPillar {
            0% {
                opacity: 0;
                transform: translateY(-16px) scaleY(0.85);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scaleY(1);
            }
        }

        @keyframes dndMonogramRightD {
            0% {
                opacity: 0;
                transform: translateX(18px) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes dndSplashSheenSweep {
            0% {
                transform: translateX(-140%) skewX(-22deg);
            }
            60%, 100% {
                transform: translateX(260%) skewX(-22deg);
            }
        }

        @keyframes dndSplashTextRise {
            0% {
                opacity: 0;
                transform: translateY(14px);
                letter-spacing: 0.36em;
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                letter-spacing: 0.24em;
            }
        }

        @keyframes dndSplashSubFade {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes dndSplashProgressFill {
            0% {
                transform: scaleX(0);
            }
            100% {
                transform: scaleX(1);
            }
        }

        .dnd-splash-aura {
            animation: dndSplashAuraPulse 3.6s ease-in-out infinite;
        }

        .dnd-logo-anim-p1 {
            animation: dndMonogramLeftD 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
        }

        .dnd-logo-anim-p2 {
            animation: dndMonogramDiagonalN 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.24s both;
        }

        .dnd-logo-anim-p3 {
            animation: dndMonogramPillar 0.58s cubic-bezier(0.22, 1, 0.36, 1) 0.38s both;
        }

        .dnd-logo-anim-p4 {
            animation: dndMonogramRightD 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.48s both;
        }

        .dnd-splash-sheen::after {
            content: '';
            position: absolute;
            top: -10%;
            left: 0;
            width: 42%;
            height: 120%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.22), rgba(255, 255, 255, 0.45), transparent);
            pointer-events: none;
            animation: dndSplashSheenSweep 1.65s cubic-bezier(0.22, 1, 0.36, 1) 0.65s both;
        }

        .dnd-splash-wordmark {
            animation: dndSplashTextRise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both;
        }

        .dnd-splash-subtitle {
            animation: dndSplashSubFade 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.72s both;
        }

        .dnd-splash-progress-bar {
            transform-origin: left center;
            animation: dndSplashProgressFill 1.85s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        /* ============================================================== */
        /* LIVE MOTION & MICRO-INTERACTIONS (DND FINANCE MOTION SYSTEM)   */
        /* ============================================================== */
        @keyframes dndFadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(14px) scale(0.99);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes dndHeroGradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes dndHeroSheen {
            0% {
                transform: translateX(-120%) skewX(-18deg);
            }
            45%, 100% {
                transform: translateX(260%) skewX(-18deg);
            }
        }

        @keyframes dndSoftPulseGlow {
            0%, 100% {
                box-shadow: 0 10px 28px -6px rgba(37, 99, 235, 0.35);
            }
            50% {
                box-shadow: 0 14px 36px -4px rgba(37, 99, 235, 0.55);
            }
        }

        .dnd-tab-view {
            animation: dndFadeSlideUp 0.38s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .dnd-motion-card {
            transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                        border-color 0.24s ease;
        }

        .dnd-motion-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px -8px rgba(15, 23, 42, 0.08);
        }

        html.dark .dnd-motion-card:hover {
            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.5);
        }

        .dnd-motion-btn {
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-color 0.2s ease,
                        box-shadow 0.2s ease,
                        opacity 0.2s ease;
        }

        .dnd-motion-btn:hover {
            transform: translateY(-1px);
        }

        .dnd-motion-btn:active {
            transform: scale(0.95);
        }

        .dnd-hero-animated {
            position: relative;
            overflow: hidden;
            background-size: 180% 180%;
            animation: dndHeroGradientShift 14s ease infinite;
        }

        .dnd-hero-animated::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 38%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
            pointer-events: none;
            animation: dndHeroSheen 8s ease-in-out infinite;
        }

        .dnd-fab-glow {
            animation: dndSoftPulseGlow 3.2s ease-in-out infinite;
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .dnd-fab-glow:hover {
            transform: scale(1.07) translateY(-2px);
        }

        .dnd-fab-glow:active {
            transform: scale(0.93);
        }

        .dnd-nav-item {
            transition: color 0.2s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .dnd-nav-item:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body class="antialiased selection:bg-royal-600 selection:text-white transition-colors duration-200"
      x-data="dndFinanceApp()" 
      x-init="initApp()">

    <!-- ================================================================== -->
    <!-- FRONT SPLASH SCREEN: ANIMATED DND MONOGRAM LOGO DISPLAY            -->
    <!-- ================================================================== -->
    <div x-show="showEntrySplash"
         x-transition:leave="transition ease-in-out duration-500"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-105"
         @click="dismissEntrySplash()"
         class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white dark:bg-obsidian-950 px-6 select-none cursor-pointer overflow-hidden">

        <!-- Ambient Radial Aura Glow -->
        <div class="dnd-splash-aura absolute w-80 h-80 sm:w-96 sm:h-96 rounded-full bg-royal-500/15 dark:bg-royal-500/20 blur-3xl pointer-events-none"></div>

        <!-- Subtle Decorative Concentric Ring -->
        <div class="relative flex flex-col items-center justify-center z-10 space-y-6">
            <div class="dnd-splash-sheen relative overflow-hidden px-8 py-6 rounded-[36px] bg-cream-50/90 dark:bg-obsidian-900/90 border border-cream-200/90 dark:border-white/[0.08] shadow-2xl backdrop-blur-xl">
                <svg :key="splashAnimKey" class="w-48 h-24 sm:w-60 sm:h-30 text-cream-900 dark:text-white drop-shadow-sm" viewBox="0 0 260 128" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="DND Monogram Logo">
                    <!-- Part 1: Left D Vertical Stem & Lower Bowl -->
                    <path class="dnd-logo-anim-p1" fill="currentColor" d="M20 16H56V21H47V78C47 93 38 103 28 107H64C86 107 98 91 98 67L111 80C108 101 92 112 64 112H20C30 106 35 98 35 86V30C35 23 30 19 20 16Z"/>
                    <!-- Part 2: Interlocking Diagonal N & Lower Connector -->
                    <path class="dnd-logo-anim-p2" fill="currentColor" d="M54 16C78 16 91 25 105 39L164 99C170 105 176 107 186 107V112H160L95 46C83 34 73 21 54 21V16Z"/>
                    <!-- Part 3: Center-Right Vertical Pillar -->
                    <path class="dnd-logo-anim-p3" fill="currentColor" d="M156 16V78L142 64V31C142 23 147 18 156 16Z"/>
                    <!-- Part 4: Right D Bold Crescent Bowl -->
                    <path class="dnd-logo-anim-p4" fill="currentColor" d="M164 16H185C222 16 240 36 240 64C240 92 222 112 185 112H183V107H184C211 107 224 90 224 64C224 38 211 21 184 21H164V16Z"/>
                </svg>
            </div>

            <!-- Brand Typography & Progress Line -->
            <div class="text-center space-y-2">
                <h1 :key="'title-' + splashAnimKey" class="dnd-splash-wordmark font-display font-extrabold text-lg sm:text-xl uppercase text-cream-900 dark:text-white tracking-[0.24em]">
                    DND FINANCE
                </h1>
                <p :key="'sub-' + splashAnimKey" class="dnd-splash-subtitle text-xs font-medium text-cream-500 dark:text-slate-400"
                   x-text="lang === 'ID' ? 'Manajemen Kekayaan & Arus Kas Pribadi' : 'Personal Wealth & Cashflow Management'"></p>
            </div>

            <!-- Animated Sleek Progress Indicator -->
            <div class="w-44 h-1 rounded-full bg-cream-200 dark:bg-obsidian-800 overflow-hidden">
                <div :key="'bar-' + splashAnimKey" class="dnd-splash-progress-bar w-full h-full rounded-full bg-gradient-to-r from-royal-600 via-sky-400 to-royal-500"></div>
            </div>

            <button type="button" @click.stop="dismissEntrySplash()"
                    class="dnd-splash-subtitle dnd-motion-btn px-5 py-2 rounded-full bg-cream-100 dark:bg-obsidian-900 hover:bg-royal-50 dark:hover:bg-obsidian-800 border border-cream-200 dark:border-white/10 text-[11px] font-semibold text-cream-700 dark:text-slate-300 flex items-center gap-1.5">
                <span x-text="lang === 'ID' ? 'Masuk ke Aplikasi' : 'Enter Application'"></span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5 text-royal-500"></i>
            </button>
        </div>
    </div>

    <!-- TOAST NOTIFICATION BANNER -->
    <div x-show="toastMessage"
         x-transition:enter="transition ease-out duration-250"
         x-transition:enter-start="opacity-0 -translate-y-3 scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0 scale-100"
         x-transition:leave-end="opacity-0 -translate-y-3 scale-95"
         x-cloak
         class="fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full bg-cream-900 dark:bg-white text-white dark:text-obsidian-950 text-xs font-semibold shadow-xl flex items-center gap-2 max-w-[90vw]">
        <span class="w-2 h-2 rounded-full bg-royal-500 animate-ping shrink-0"></span>
        <span class="truncate" x-text="toastMessage"></span>
    </div>

    <!-- TOP STICKY HEADER -->
    <header class="sticky top-0 z-30 bg-white/90 dark:bg-obsidian-950/90 backdrop-blur-md border-b border-cream-200/80 dark:border-white/[0.06] pt-safe transition-colors duration-200">
        <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
                <button type="button" @click="setTab('dashboard')" class="dnd-brand-mark dnd-motion-btn text-cream-900 dark:text-white shrink-0" aria-label="DND Finance">
                    <svg viewBox="0 0 260 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill="currentColor" d="M20 16H56V21H47V78C47 93 38 103 28 107H64C86 107 98 91 98 67L111 80C108 101 92 112 64 112H20C30 106 35 98 35 86V30C35 23 30 19 20 16Z"/>
                        <path fill="currentColor" d="M54 16C78 16 91 25 105 39L164 99C170 105 176 107 186 107V112H160L95 46C83 34 73 21 54 21V16Z"/>
                        <path fill="currentColor" d="M156 16V78L142 64V31C142 23 147 18 156 16Z"/>
                        <path fill="currentColor" d="M164 16H185C222 16 240 36 240 64C240 92 222 112 185 112H183V107H184C211 107 224 90 224 64C224 38 211 21 184 21H164V16Z"/>
                    </svg>
                </button>
                <span class="font-display font-bold text-sm sm:text-base text-cream-900 dark:text-white truncate transition-all" x-text="pageTitle"></span>
            </div>

            <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
                <button type="button" @click="toggleLanguage()"
                        class="dnd-motion-btn px-2.5 py-1.5 rounded-full border border-cream-200 dark:border-white/10 bg-cream-50 dark:bg-obsidian-900 text-[11px] font-bold tracking-tight flex items-center gap-1">
                    <span :class="lang === 'ID' ? 'text-royal-600 dark:text-royal-400' : 'text-cream-400'">ID</span>
                    <span class="text-cream-300 dark:text-obsidian-700">/</span>
                    <span :class="lang === 'EN' ? 'text-royal-600 dark:text-royal-400' : 'text-cream-400'">EN</span>
                </button>

                <button type="button" @click="handleGoogleHeaderClick()"
                        class="dnd-motion-btn px-3 py-1.5 rounded-full border border-cream-200 dark:border-white/10 bg-cream-50 dark:bg-obsidian-900 hover:bg-cream-100 dark:hover:bg-obsidian-800 text-xs font-semibold text-cream-900 dark:text-white flex items-center gap-1.5 max-w-[145px]">
                    <template x-if="googleUser && googleUser.picture">
                        <img :src="googleUser.picture" alt="Google" class="w-4 h-4 rounded-full object-cover shrink-0">
                    </template>
                    <template x-if="!googleUser || !googleUser.picture">
                        <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
                            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24Z"/>
                            <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14Z"/>
                            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96Z"/>
                        </svg>
                    </template>
                    <span class="truncate" x-text="googleUser ? displayUserName : t('sign_in_google')"></span>
                </button>

                <button type="button" @click="toggleTheme()"
                        class="dnd-motion-btn w-8 h-8 rounded-full border border-cream-200 dark:border-white/10 bg-cream-50 dark:bg-obsidian-900 flex items-center justify-center text-cream-700 dark:text-slate-300">
                    <i x-show="!isDarkMode" data-lucide="moon" class="w-4 h-4"></i>
                    <i x-show="isDarkMode" data-lucide="sun" class="w-4 h-4"></i>
                </button>

                <button type="button" @click="exportToExcel()"
                        class="dnd-motion-btn w-8 h-8 rounded-full bg-royal-600 hover:bg-royal-700 text-white flex items-center justify-center shadow-sm"
                        :title="t('export_excel')">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="max-w-3xl mx-auto px-4 pt-4 pb-28 space-y-5">

        <!-- ====================================== -->
        <!-- TAB 1: DASHBOARD (BERANDA)             -->
        <!-- ====================================== -->
        <section x-show="activeTab === 'dashboard'" class="dnd-tab-view space-y-5">
            <!-- Greeting Header -->
            <div class="flex items-center justify-between gap-3">
                <div>
                    <p class="text-xs font-medium text-cream-500 dark:text-slate-400" x-text="timeGreeting"></p>
                    <div class="flex items-center gap-2">
                        <h1 class="font-display font-bold text-xl text-cream-900 dark:text-white" x-text="displayGreetingName"></h1>
                        <button type="button" @click="openNicknameModal()" class="dnd-motion-btn p-1 rounded-lg text-cream-400 hover:text-royal-500">
                            <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                        </button>

        async function fetchWithTimeout(url, options = {}, timeoutMs = 4500) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { ...options, signal: controller.signal });
                return res;
            } finally {
                clearTimeout(timer);
            }
        }

        class DNDIndexedDatabase {
            constructor() {
                this.dbName = 'DND_Finance_Relational_DB_v12';
                this.version = 1;
                this.db = null;
            }

            async open() {
                if (this.db) return this.db;
                if (typeof indexedDB === 'undefined') return null;
                return new Promise((resolve) => {
                    try {
                        const req = indexedDB.open(this.dbName, this.version);
                        req.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains('workspaces')) {
                                db.createObjectStore('workspaces', { keyPath: 'account_key' });
                            }
                            if (!db.objectStoreNames.contains('receipt_scans')) {
                                const scanStore = db.createObjectStore('receipt_scans', { keyPath: 'id' });
                                scanStore.createIndex('account_key', 'account_key', { unique: false });
                            }
                            if (!db.objectStoreNames.contains('report_files')) {
                                const repStore = db.createObjectStore('report_files', { keyPath: 'id' });
                                repStore.createIndex('account_key', 'account_key', { unique: false });
                            }
                        };
                        req.onsuccess = (e) => {
                            this.db = e.target.result;
                            resolve(this.db);
                        };
                        req.onerror = () => resolve(null);
                    } catch (err) {
                        resolve(null);
                    }
                });
            }

            async saveWorkspace(accountKey, statePayload) {
                const db = await this.open();
                if (!db) return;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction(['workspaces'], 'readwrite');
                        tx.objectStore('workspaces').put({
                            account_key: accountKey,
                            state: statePayload,
                            updated_at: new Date().toISOString()
                        });
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    } catch (e) {
                        resolve(false);
                    }
                });
            }

            async loadWorkspace(accountKey) {
                const db = await this.open();
                if (!db) return null;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction(['workspaces'], 'readonly');
                        const req = tx.objectStore('workspaces').get(accountKey);
                        req.onsuccess = () => resolve(req.result ? req.result.state : null);
                        req.onerror = () => resolve(null);
                    } catch (e) {
                        resolve(null);
                    }
                });
            }

            async addReceiptScan(scanRecord) {
                const db = await this.open();
                if (!db) return;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction(['receipt_scans'], 'readwrite');
                        tx.objectStore('receipt_scans').put(scanRecord);
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    } catch (e) {
                        resolve(false);
                    }
                });
            }

            async listReceiptScans(accountKey) {
                const db = await this.open();
                if (!db) return [];
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction(['receipt_scans'], 'readonly');
                        const idx = tx.objectStore('receipt_scans').index('account_key');
                        const req = idx.getAll(accountKey);
                        req.onsuccess = () => {
                            const rows = Array.isArray(req.result) ? req.result : [];
                            rows.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
                            resolve(rows.slice(0, 30));
                        };
                        req.onerror = () => resolve([]);
                    } catch (e) {
                        resolve([]);
                    }
                });
            }

            async addReportFile(reportRecord) {
                const db = await this.open();
                if (!db) return;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction(['report_files'], 'readwrite');
                        tx.objectStore('report_files').put(reportRecord);
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    } catch (e) {
                        resolve(false);
                    }
                });
            }

            async listReportFiles(accountKey) {
                const db = await this.open();
                if (!db) return [];
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction(['report_files'], 'readonly');
                        const idx = tx.objectStore('report_files').index('account_key');
                        const req = idx.getAll(accountKey);
                        req.onsuccess = () => {
                            const rows = Array.isArray(req.result) ? req.result : [];
                            rows.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
                            resolve(rows.slice(0, 40));
                        };
                        req.onerror = () => resolve([]);
                    } catch (e) {
                        resolve([]);
                    }
                });
            }
        }

        function stripAllEmojis(text) {
            if (!text) return '';
            return String(text)
                .replace(/[\u{1F1E0}-\u{1F1FF}\u{1F300}-\u{1F9FF}\u{1FA00}-\u{1FAFF}\u{2600}-\u{27BF}\u{2300}-\u{23FF}\u{24C2}-\u{1F251}\u{FE00}-\u{FE0F}\u{200D}]/gu, '')
                .replace(/[ \t]{2,}/g, ' ')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
        }

        async function computeSha256Short(arrayBuffer) {
            try {
                if (window.crypto && window.crypto.subtle && arrayBuffer) {
                    const hashBuffer = await window.crypto.subtle.digest('SHA-256', arrayBuffer);
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 20).toUpperCase();
                }
            } catch (e) {}
            return 'DB-' + Date.now().toString(16).toUpperCase();
        }

                t(key) {
                    const dict = this.translations[this.lang] || this.translations.ID;
                    return dict[key] || this.translations.ID[key] || key;
                },

                get resolvedAccountKey() {
                    if (this.googleUser && this.googleUser.email) {
                        return this.googleUser.email.trim().toLowerCase();
                    }
                    return 'shared_default_ledger';
                },

                get pageTitle() {
                    if (this.activeTab === 'dashboard') return 'DND Finance';
                    if (this.activeTab === 'analytics') return this.t('nav_analytics');
                    if (this.activeTab === 'transactions') return this.t('nav_records');
                    if (this.activeTab === 'planning') return this.t('nav_goals');
                    if (this.activeTab === 'automation') return 'Autopilot';
                    return this.t('nav_menu');
                },

                get timeGreeting() {
                    const h = this.currentHour;
                    if (h >= 4 && h < 11) return this.t('greet_morning');
                    if (h >= 11 && h < 15) return this.t('greet_afternoon');
                    if (h >= 15 && h < 18) return this.t('greet_evening');
                    return this.t('greet_night');
                },

                get displayUserName() {
                    if (this.customNickname && this.customNickname.trim()) {
                        return this.customNickname.trim();
                    }
                    if (this.googleUser) {
                        return this.googleUser.nickname || this.googleUser.name || (this.googleUser.email ? this.googleUser.email.split('@')[0] : this.t('default_guest_name'));
                    }
                    return this.t('default_guest_name');
                },

                get displayGreetingName() {
                    return this.displayUserName;
                },

                get totalIncome() {
                    return this.transactions
                        .filter(tx => tx.type === 'income')
                        .reduce((acc, tx) => acc + Number(tx.amount || 0), 0);
                },

                get totalExpense() {
                    return this.transactions
                        .filter(tx => tx.type === 'expense')
                        .reduce((acc, tx) => acc + Number(tx.amount || 0), 0);
                },

                get totalWithdrawal() {
                    return this.transactions
                        .filter(tx => tx.type === 'withdrawal')
                        .reduce((acc, tx) => acc + Number(tx.amount || 0), 0);
                },

                get totalBalance() {
                    return this.totalIncome - (this.totalExpense + this.totalWithdrawal);
                },

                get expenseCategoryBreakdown() {
                    const palette = ['#2563EB', '#F43F5E', '#F59E0B', '#8B5CF6', '#06B6D4', '#EC4899', '#6366F1', '#14B8A6'];
                    const totals = {};
                    let grand = 0;
                    for (const tx of this.transactions) {
                        if (tx.type === 'expense' || tx.type === 'withdrawal') {
                            const amt = Number(tx.amount || 0);
                            if (amt > 0) {
                                const cat = tx.category || 'Other';
                                totals[cat] = (totals[cat] || 0) + amt;
                                grand += amt;
                            }
                        }
                    }
                    return Object.entries(totals)
                        .sort((a, b) => b[1] - a[1])
                        .map(([category, amount], idx) => ({
                            category,
                            amount,
                            percent: grand > 0 ? Math.max(1, Math.round((amount / grand) * 100)) : 0,
                            color: palette[idx % palette.length]
                        }));
                },

                get incomeCategoryBreakdown() {
                    const palette = ['#10B981', '#0EA5E9', '#8B5CF6', '#F59E0B', '#14B8A6', '#2563EB', '#EC4899', '#6366F1'];
                    const totals = {};
                    let grand = 0;
                    for (const tx of this.transactions) {
                        if (tx.type === 'income') {
                            const amt = Number(tx.amount || 0);
                            if (amt > 0) {
                                const cat = tx.category || 'Salary';
                                totals[cat] = (totals[cat] || 0) + amt;
                                grand += amt;
                            }
                        }
                    }
                    return Object.entries(totals)
                        .sort((a, b) => b[1] - a[1])
                        .map(([category, amount], idx) => ({
                            category,
                            amount,
                            percent: grand > 0 ? Math.max(1, Math.round((amount / grand) * 100)) : 0,
                            color: palette[idx % palette.length]
                        }));
                },

                get allCategorySummary() {
                    const inc = this.incomeCategoryBreakdown.map(i => ({ ...i, type: 'income' }));
                    const exp = this.expenseCategoryBreakdown.map(e => ({ ...e, type: 'expense' }));
                    return [...inc, ...exp].sort((a, b) => b.amount - a.amount);
                },

                get unifiedCategoryBreakdown() {
                    const mode = this.categoryChartFilter || 'all';
                    let list = [];
                    if (mode === 'income') {
                        list = this.incomeCategoryBreakdown.map(i => ({ ...i, type: 'income' }));
                    } else if (mode === 'expense') {
                        list = this.expenseCategoryBreakdown.map(e => ({ ...e, type: 'expense' }));
                    } else {
                        list = this.allCategorySummary;
                    }

                    const total = list.reduce((sum, item) => sum + Number(item.amount || 0), 0);
                    return list.map(item => ({
                        ...item,
                        percent: total > 0 ? Math.max(1, Math.round((Number(item.amount || 0) / total) * 100)) : 0
                    }));
                },

                get filteredTransactions() {
                    const q = (this.searchQuery || '').toLowerCase().trim();
                    return this.transactions.filter(tx => {
                        const matchType = this.filterType === 'all' || tx.type === this.filterType;
                        if (!matchType) return false;
                        if (!q) return true;
                        return (
                            (tx.note || '').toLowerCase().includes(q) ||
                            (tx.category || '').toLowerCase().includes(q) ||
                            (tx.account || '').toLowerCase().includes(q) ||
                            (tx.toAccount || '').toLowerCase().includes(q)
                        );
                    });
                },

                startEntrySplashTimer() {
                    if (this.splashTimer) clearTimeout(this.splashTimer);
                    this.splashTimer = setTimeout(() => {
                        this.dismissEntrySplash();
                    }, 2150);
                },

                dismissEntrySplash() {
                    if (this.splashTimer) {
                        clearTimeout(this.splashTimer);
                        this.splashTimer = null;
                    }
                    if (!this.showEntrySplash) return;
                    this.showEntrySplash = false;
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });
                },

                replayEntrySplash() {
                    this.splashAnimKey += 1;
                    this.showEntrySplash = true;
                    this.$nextTick(() => this.refreshIcons());
                    this.startEntrySplashTimer();
                },

                async initApp() {
                    this.startEntrySplashTimer();
                    this.isGoogleSigningIn = false;
                    if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) {
                        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                    }

                    this.restoreCachedGoogleUser();
                    this.loadLocalState();
                    await this.loadFromIndexedDB();
                    this.applyThemeClass();

                    window.addEventListener('dnd-gsi-loaded', () => {
                        this.initGoogleIdentityServices();
                        this.renderOfficialGoogleButton();
                    });

                    await this.handleOAuthRedirectHash();

                    this.greetingInterval = setInterval(() => {
                        this.currentHour = new Date().getHours();
                    }, 30000);

                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.setupChartResizeObservers();
                        this.updateAllCharts();
                    });

                    this.fetchGoogleConfigAndSession().then(() => {
                        this.syncWithServer();
                    });

                    this.computeQuantitativeIntelligenceLocal();
                    this.fetchReportHistory();

                    document.addEventListener('visibilitychange', () => {
                        if (document.visibilityState === 'visible') {
                            this.isGoogleSigningIn = false;
                            this.syncWithServer();
                        }
                    });
                },

                async loadFromIndexedDB() {
                    try {
                        const idbState = await _dndLocalDb.loadWorkspace(this.resolvedAccountKey);
                        if (idbState && typeof idbState === 'object') {
                            if ((!this.transactions || this.transactions.length === 0) && Array.isArray(idbState.transactions)) {
                                this.transactions = idbState.transactions;
                            }
                            if ((!this.goals || this.goals.length === 0) && Array.isArray(idbState.goals)) {
                                this.goals = idbState.goals;
                            }
                            if ((!this.budgets || this.budgets.length === 0) && Array.isArray(idbState.budgets)) {
                                this.budgets = idbState.budgets;
                            }
                            if ((!this.automationRules || this.automationRules.length === 0) && Array.isArray(idbState.automationRules)) {
                                this.automationRules = idbState.automationRules;
                            }
                        }
                        this.reportFileLogs = await _dndLocalDb.listReportFiles(this.resolvedAccountKey);
                        this.receiptScanLogs = await _dndLocalDb.listReceiptScans(this.resolvedAccountKey);
                    } catch (e) {}
                },

                setupChartResizeObservers() {
                    if (typeof ResizeObserver === 'undefined') return;
                    const ids = [
                        'dashboardTrendChart',
                        'analyticsCashflowChart',
                        'unifiedCategoryChart',
                        'walletBarChart'
                    ];
                    ids.forEach(id => {
                        const canvas = document.getElementById(id);
                        if (canvas && canvas.parentElement && !canvas.parentElement._dndObserved) {
                            canvas.parentElement._dndObserved = true;
                            const ro = new ResizeObserver((entries) => {
                                for (const entry of entries) {
                                    if (entry.contentRect.width > 20 && entry.contentRect.height > 20) {
                                        this.renderSingleChartById(id);
                                    }
                                }
                            });
                            ro.observe(canvas.parentElement);
                        }
                    });
                },

                renderSingleChartById(id) {
                    if (id === 'dashboardTrendChart') this.renderTrendChart();
                    else if (id === 'analyticsCashflowChart') this.renderAnalyticsCashflowChart();
                    else if (id === 'unifiedCategoryChart') this.renderUnifiedCategoryChart();
                    else if (id === 'walletBarChart') this.renderWalletChart();
                },

                refreshIcons() {
                    if (window.lucide && typeof window.lucide.createIcons === 'function') {
                        window.lucide.createIcons();
                    }
                },

                showToast(msg) {
                    this.toastMessage = stripAllEmojis(msg);
                    if (this.toastTimer) clearTimeout(this.toastTimer);
                    this.toastTimer = setTimeout(() => {
                        this.toastMessage = '';
                    }, 3400);
                },

                restoreCachedGoogleUser() {
                    try {
                        const savedListRaw = localStorage.getItem(`${this.appId}_saved_google_accounts`);
                        if (savedListRaw) {
                            const list = JSON.parse(savedListRaw);
                            if (Array.isArray(list)) this.savedGoogleAccounts = list.filter(a => a && a.email);
                        }
                        const cached = localStorage.getItem(`${this.appId}_google_user`);
                        if (cached) {
                            const parsed = JSON.parse(cached);
                            if (parsed && parsed.email) {
                                this.googleUser = parsed;
                                if (parsed.nickname) {
                                    this.customNickname = parsed.nickname;
                                }
                            }
                        }
                    } catch (e) {}
                },

                persistCachedGoogleUser() {
                    try {
                        if (this.googleUser && this.googleUser.email) {
                            const profileObj = {
                                ...this.googleUser,
                                nickname: this.customNickname || this.googleUser.nickname || ''
                            };
                            localStorage.setItem(`${this.appId}_google_user`, JSON.stringify(profileObj));

                            const filtered = this.savedGoogleAccounts.filter(
                                a => a.email.toLowerCase() !== profileObj.email.toLowerCase()
                            );
                            this.savedGoogleAccounts = [profileObj, ...filtered].slice(0, 5);
                            localStorage.setItem(`${this.appId}_saved_google_accounts`, JSON.stringify(this.savedGoogleAccounts));
                        } else {
                            localStorage.removeItem(`${this.appId}_google_user`);
                        }
                    } catch (e) {}
                },

                getStorageKey() {
                    return `${this.appId}_state_${this.resolvedAccountKey}`;
                },

                loadLocalState() {
                    try {
                        const prefsRaw = localStorage.getItem(`${this.appId}_prefs`);
                        if (prefsRaw) {
                            const prefs = JSON.parse(prefsRaw);
                            if (typeof prefs.isDarkMode === 'boolean') this.isDarkMode = prefs.isDarkMode;
                            if (prefs.lang) this.lang = prefs.lang;
                            if (prefs.currency) this.currency = prefs.currency;
                            if (typeof prefs.customNickname === 'string') this.customNickname = prefs.customNickname;
                        }

                        const raw = localStorage.getItem(this.getStorageKey());
                        if (raw) {
                            const data = JSON.parse(raw);
                            if (Array.isArray(data.banks) && data.banks.length) this.banks = data.banks;
                            if (Array.isArray(data.categories) && data.categories.length) this.categories = data.categories;
                            if (Array.isArray(data.transactions)) this.transactions = data.transactions;
                            if (Array.isArray(data.goals)) this.goals = data.goals;
                            if (Array.isArray(data.budgets)) this.budgets = data.budgets;
                            if (Array.isArray(data.automationRules)) this.automationRules = data.automationRules;
                            if (Array.isArray(data.deletedTxIds)) this.deletedTxIds = data.deletedTxIds;
                            if (Array.isArray(data.deletedGoalIds)) this.deletedGoalIds = data.deletedGoalIds;
                            if (Array.isArray(data.deletedBudgetIds)) this.deletedBudgetIds = data.deletedBudgetIds;
                            if (Array.isArray(data.deletedRuleIds)) this.deletedRuleIds = data.deletedRuleIds;
                            if (Array.isArray(data.deletedBanks)) this.deletedBanks = data.deletedBanks;
                            if (Array.isArray(data.deletedCategories)) this.deletedCategories = data.deletedCategories;
                            if (typeof data.customNickname === 'string' && data.customNickname.trim()) {
                                this.customNickname = data.customNickname.trim();
                            }
                        }
                    } catch (e) {}
                },

                buildClientStatePayload() {
                    return {
                        banks: this.banks,
                        categories: this.categories,
                        transactions: this.transactions,
                        goals: this.goals,
                        budgets: this.budgets,
                        automationRules: this.automationRules,
                        customNickname: this.customNickname,
                        deletedTxIds: this.deletedTxIds.slice(-500),
                        deletedGoalIds: this.deletedGoalIds.slice(-200),
                        deletedBudgetIds: this.deletedBudgetIds.slice(-200),
                        deletedRuleIds: this.deletedRuleIds.slice(-200),
                        deletedBanks: this.deletedBanks.slice(-100),
                        deletedCategories: this.deletedCategories.slice(-100)
                    };
                },

                persistToLocalStorageOnly() {
                    try {
                        localStorage.setItem(`${this.appId}_prefs`, JSON.stringify({
                            isDarkMode: this.isDarkMode,
                            lang: this.lang,
                            currency: this.currency,
                            customNickname: this.customNickname
                        }));
                        this.persistCachedGoogleUser();
                        const payload = this.buildClientStatePayload();
                        localStorage.setItem(this.getStorageKey(), JSON.stringify(payload));
                        _dndLocalDb.saveWorkspace(this.resolvedAccountKey, payload);
                    } catch (e) {}
                },

                saveLocalState(triggerServerSync = true) {
                    this.persistToLocalStorageOnly();
                    if (triggerServerSync) {
                        this.syncWithServer();
                    }
                    this.computeQuantitativeIntelligenceLocal();
                },

                async syncWithServer() {
                    if (this.isSyncing) return;
                    this.isSyncing = true;
                    try {
                        const headers = { 'Content-Type': 'application/json' };
                        if (this.googleAccessToken) {
                            headers['Authorization'] = `Bearer ${this.googleAccessToken}`;
                        }
                        const res = await fetchWithTimeout('/api/sync/merge', {
                            method: 'POST',
                            headers,
                            body: JSON.stringify({
                                account_key: this.resolvedAccountKey,
                                google_email: this.googleUser ? this.googleUser.email : '',
                                google_sub: this.googleUser ? this.googleUser.sub : '',
                                client_revision: this.serverRevision,
                                state: this.buildClientStatePayload()
                            })
                        }, 5500);
                        if (res.ok) {
                            const data = await res.json();
                            if (data.status === 'ok' && data.state) {
                                if (typeof data.revision === 'number') this.serverRevision = data.revision;
                                this.applyCanonicalServerState(data.state);
                                this.$nextTick(() => {
                                    this.refreshIcons();
                                    this.updateAllCharts();
                                });
                            }
                        }
                    } catch (e) {
                    } finally {
                        this.isSyncing = false;
                    }
                },

                applyCanonicalServerState(st) {
                    if (!st || typeof st !== 'object') return;
                    if (Array.isArray(st.banks) && st.banks.length) this.banks = st.banks;
                    if (Array.isArray(st.categories) && st.categories.length) this.categories = st.categories;
                    if (Array.isArray(st.transactions)) this.transactions = st.transactions;
                    if (Array.isArray(st.goals)) this.goals = st.goals;
                    if (Array.isArray(st.budgets)) this.budgets = st.budgets;
                    if (Array.isArray(st.automationRules)) this.automationRules = st.automationRules;
                    if (Array.isArray(st.deletedTxIds)) this.deletedTxIds = st.deletedTxIds;
                    if (Array.isArray(st.deletedGoalIds)) this.deletedGoalIds = st.deletedGoalIds;
                    if (Array.isArray(st.deletedBudgetIds)) this.deletedBudgetIds = st.deletedBudgetIds;
                    if (Array.isArray(st.deletedRuleIds)) this.deletedRuleIds = st.deletedRuleIds;
                    if (Array.isArray(st.deletedBanks)) this.deletedBanks = st.deletedBanks;
                    if (Array.isArray(st.deletedCategories)) this.deletedCategories = st.deletedCategories;
                    if (typeof st.customNickname === 'string' && st.customNickname.trim() && !this.customNickname) {
                        this.customNickname = st.customNickname.trim();
                    }
                    this.persistToLocalStorageOnly();
                },

                applyThemeClass() {
                    if (this.isDarkMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                },

                toggleTheme() {
                    this.isDarkMode = !this.isDarkMode;
                    this.applyThemeClass();
                    this.saveLocalState(false);
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });
                },

                toggleLanguage() {
                    this.lang = this.lang === 'ID' ? 'EN' : 'ID';
                    document.documentElement.lang = this.lang.toLowerCase();
                    this.saveLocalState(false);
                    this.computeQuantitativeIntelligenceLocal();
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });
                },

                setTab(tab) {
                    this.activeTab = tab;
                    this.$nextTick(() => {
                        this.refreshIcons();
                        if (tab === 'dashboard' || tab === 'analytics') {
                            this.updateAllCharts();
                            requestAnimationFrame(() => this.updateAllCharts());
                            setTimeout(() => this.updateAllCharts(), 150);
                        }
                        if (tab === 'analytics') {
                            this.computeQuantitativeIntelligenceLocal();
                        }
                        if (tab === 'transactions') {
                            this.fetchReportHistory();
                        }
                    });
                },

                formatCurrency(amount) {
                    const num = Number(amount || 0);
                    const safeNum = Number.isFinite(num) ? num : 0;
                    const curr = (this.currency || 'IDR').toUpperCase();
                    const isNeg = safeNum < 0;
                    const absVal = Math.abs(safeNum);
                    const sign = isNeg ? '-' : '';

                    if (curr === 'IDR') {
                        return `${sign}Rp ${Math.round(absVal).toLocaleString('id-ID')}`;
                    }
                    if (curr === 'JPY') {
                        return `${sign}¥${Math.round(absVal).toLocaleString('en-US')}`;
                    }
                    const symbols = { USD: '$', SGD: 'S$', EUR: '€' };
                    const sym = symbols[curr] || `${curr} `;
                    return `${sign}${sym}${absVal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                },

                formatDateShort(dateStr) {
                    if (!dateStr) return '';
                    const clean = String(dateStr).replace('T', ' ').trim();
                    return clean.length >= 16 ? clean.slice(5, 16) : clean;
                },

                getLocalDateTimeInput(d = new Date()) {
                    const pad = n => String(n).padStart(2, '0');
                    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
                },

                getWalletBalance(bankName) {
                    let bal = 0;
                    for (const tx of this.transactions) {
                        const amt = Number(tx.amount || 0);
                        const fee = Number(tx.adminFee || tx.admin_fee || 0);
                        if (tx.type === 'income' && tx.account === bankName) {
                            bal += amt;
                        } else if ((tx.type === 'expense' || tx.type === 'withdrawal') && tx.account === bankName) {
                            bal -= amt;
                        } else if (tx.type === 'transfer') {
                            if (tx.account === bankName) bal -= (amt + fee);
                            if (tx.toAccount === bankName) bal += amt;
                        }
                    }
                    return bal;
                },

                getCategorySpent(categoryName) {
                    return this.transactions
                        .filter(tx => (tx.type === 'expense' || tx.type === 'withdrawal') && tx.category === categoryName)
                        .reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
                },

                computeQuantitativeIntelligenceLocal() {
                    const inc = this.totalIncome;
                    const exp = this.totalExpense + this.totalWithdrawal;
                    const bal = this.totalBalance;

                    const uniqueDates = new Set(
                        this.transactions
                            .filter(tx => tx.type === 'expense' || tx.type === 'withdrawal')
                            .map(tx => String(tx.date || '').slice(0, 10))
                            .filter(Boolean)
                    );
                    const activeDays = Math.max(1, uniqueDates.size);
                    const dailyBurn = exp / activeDays;
                    const monthlyBurnEst = dailyBurn * 30;
                    const emergencyIdeal = Math.round(monthlyBurnEst * 6);
                    const emergencyGap = Math.max(0, emergencyIdeal - Math.max(0, bal));
                    const savingsRate = inc > 0 ? Math.max(-100, Math.min(100, Math.round(((inc - exp) / inc) * 100))) : 0;
                    const runwayDays = dailyBurn > 0 ? Math.max(0, Math.round(Math.max(0, bal) / dailyBurn)) : 999;

                    let score = 50;
                    if (inc > 0) {
                        score += Math.min(30, Math.max(-25, Math.round(savingsRate * 0.8)));
                    }
                    if (bal > 0) score += 10;
                    if (this.goals.length > 0) score += 5;
                    if (this.automationRules.some(r => r.enabled)) score += 5;
                    score = Math.max(5, Math.min(100, score));

                    let grade = this.lang === 'ID' ? 'Stabil / Bertumbuh' : 'Stable / Growing';
                    if (score >= 80) grade = this.lang === 'ID' ? 'Sangat Sehat (Prima)' : 'Excellent Health';
                    else if (score >= 60) grade = this.lang === 'ID' ? 'Sehat & Terkendali' : 'Healthy & Controlled';
                    else if (score < 40) grade = this.lang === 'ID' ? 'Perlu Penghematan' : 'Needs Optimization';

                    const monthlyNet = inc - exp;
                    const monthlySmartSave = inc > 0 ? inc * 0.20 : Math.max(0, monthlyNet);

                    this.quantIntel = {
                        health_score: score,
                        health_grade: grade,
                        savings_rate_pct: savingsRate,
                        daily_burn_rate: Math.round(dailyBurn),
                        monthly_burn_est: Math.round(monthlyBurnEst),
                        runway_days: runwayDays,
                        emergency_fund_ideal: emergencyIdeal,
                        emergency_fund_gap: emergencyGap,
                        top_category: this.expenseCategoryBreakdown[0] ? this.expenseCategoryBreakdown[0].category : '-',
                        top_category_amount: this.expenseCategoryBreakdown[0] ? this.expenseCategoryBreakdown[0].amount : 0,
                        forecast: {
                            current_pace_6m: Math.round(bal + Math.max(0, monthlyNet) * 6),
                            current_pace_12m: Math.round(bal + Math.max(0, monthlyNet) * 12),
                            smart_20pct_6m: Math.round(bal + monthlySmartSave * 6),
                            smart_20pct_12m: Math.round(bal + monthlySmartSave * 12)
                        }
                    };
                },

                async fetchGoogleConfigAndSession() {
                    try {
                        const infoRes = await fetchWithTimeout('/api/app/info', {}, 3500);
                        if (infoRes.ok) {
                            const info = await infoRes.json();
                            if (info.google_client_id) this.googleClientId = info.google_client_id;
                            this.appMeta = {
                                platform: info.platform || this.appMeta.platform,
                                developer: info.developer || this.appMeta.developer,
                                instagram_handle: info.instagram_handle || this.appMeta.instagram_handle,
                                instagram_url: info.instagram_url || this.appMeta.instagram_url
                            };
                        }
                    } catch (e) {}

                    try {
                        const meRes = await fetchWithTimeout('/api/auth/google/me', {}, 3500);
                        if (meRes.ok) {
                            const meData = await meRes.json();
                            if (meData.authenticated && meData.user && meData.user.email) {
                                this.googleUser = meData.user;
                                if (meData.user.nickname) {
                                    this.customNickname = meData.user.nickname;
                                }
                                this.persistCachedGoogleUser();
                            }
                        }
                    } catch (e) {}

                    this.initGoogleIdentityServices();
                },

                initGoogleIdentityServices(attempt = 0) {
                    if (this.googleInitialized) return;
                    if (!window.google || !window.google.accounts) {
                        if (attempt < 20) {
                            setTimeout(() => this.initGoogleIdentityServices(attempt + 1), 300);
                        }
                        return;
                    }
                    try {
                        this.googleInitialized = true;
                        window.google.accounts.id.initialize({
                            client_id: this.googleClientId,
                            callback: (resp) => this.handleGoogleCredentialResponse(resp),
                            auto_select: false,
                            use_fedcm_for_prompt: false
                        });

                        if (window.google.accounts.oauth2) {
                            this.googleTokenClient = window.google.accounts.oauth2.initTokenClient({
                                client_id: this.googleClientId,
                                scope: 'openid email profile',
                                callback: (tokenResp) => this.handleGoogleOAuthTokenResponse(tokenResp),
                                error_callback: (err) => {
                                    this.isGoogleSigningIn = false;
                                    if (this.googleWatchdogTimer) clearTimeout(this.googleWatchdogTimer);
                                    const errType = (err && err.type) ? err.type : 'popup_closed';
                                    this.googleAuthError = this.lang === 'ID'
                                        ? `Jendela Google ditutup (${errType}). Silakan gunakan masuk dengan Email Google di atas.`
                                        : `Google popup closed (${errType}). Please use Google Email sign-in above.`;
                                }
                            });
                        }
                    } catch (e) {}
                },

                renderOfficialGoogleButton() {
                    if (!window.google || !window.google.accounts || !window.google.accounts.id) return;
                    const container = document.getElementById('dndGoogleBtnContainer');
                    if (!container) return;
                    try {
                        container.innerHTML = '';
                        window.google.accounts.id.renderButton(container, {
                            type: 'standard',
                            theme: this.isDarkMode ? 'filled_black' : 'outline',
                            size: 'large',
                            text: 'signin_with',
                            shape: 'pill',
                            width: 300
                        });
                    } catch (e) {}
                },

                async handleOAuthRedirectHash() {
                    try {
                        const hash = window.location.hash || '';
                        if (!hash || (!hash.includes('access_token=') && !hash.includes('id_token='))) return;
                        const params = new URLSearchParams(hash.replace(/^#/, ''));
                        const accessToken = params.get('access_token');
                        const idToken = params.get('id_token');
                        window.history.replaceState({}, document.title, window.location.pathname + window.location.search);
                        if (idToken) {
                            await this.handleGoogleCredentialResponse({ credential: idToken });
                        } else if (accessToken) {
                            await this.handleGoogleOAuthTokenResponse({ access_token: accessToken });
                        }
                    } catch (e) {}
                },

                parseJwtPayload(token) {
                    try {
                        const parts = String(token || '').split('.');
                        if (parts.length < 2) return null;
                        const base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                        const padded = base64 + '='.repeat((4 - (base64.length % 4)) % 4);
                        const jsonStr = decodeURIComponent(
                            atob(padded)
                                .split('')
                                .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                                .join('')
                        );
                        return JSON.parse(jsonStr);
                    } catch (e) {
                        return null;
                    }
                },

                async verifyGoogleSessionWithBackend(payload) {
                    try {
                        const res = await fetchWithTimeout('/api/auth/google/verify', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        }, 4000);
                        if (res.ok) {
                            const data = await res.json();
                            if (data.status === 'ok' && data.user && data.user.email) {
                                this.googleUser = {
                                    ...data.user,
                                    nickname: this.customNickname || data.user.nickname || ''
                                };
                                this.persistCachedGoogleUser();
                            }
                        }
                    } catch (e) {}
                },

                async finalizeGoogleLoginSession(profile, backendPayload = null) {
                    if (this.googleWatchdogTimer) clearTimeout(this.googleWatchdogTimer);
                    this.isGoogleSigningIn = false;
                    this.googleAuthError = '';
                    this.googleUser = {
                        sub: profile.sub || profile.email,
                        email: profile.email.trim().toLowerCase(),
                        name: profile.name || profile.email.split('@')[0],
                        nickname: profile.nickname || this.customNickname || '',
                        picture: profile.picture || ''
                    };
                    if (this.googleUser.nickname) {
                        this.customNickname = this.googleUser.nickname;
                    }
                    this.persistCachedGoogleUser();
                    this.showGoogleAuthModal = false;

                    this.loadLocalState();
                    await this.loadFromIndexedDB();
                    this.computeQuantitativeIntelligenceLocal();
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateAllCharts();
                    });

                    this.showToast(
                        this.lang === 'ID'
                            ? `Berhasil masuk sebagai ${this.displayUserName}`
                            : `Signed in as ${this.displayUserName}`
                    );

                    if (backendPayload) {
                        this.verifyGoogleSessionWithBackend(backendPayload).then(() => this.syncWithServer());
                    } else {
                        fetchWithTimeout('/api/auth/google/email-session', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: this.googleUser.email, name: this.googleUser.name })
                        }, 4000).finally(() => this.syncWithServer());
                    }
                },

                async handleGoogleCredentialResponse(response) {
                    if (!response || !response.credential) return;
                    this.googleIdCredential = response.credential;
                    const decoded = this.parseJwtPayload(response.credential);
                    if (decoded && decoded.email) {
                        await this.finalizeGoogleLoginSession(
                            {
                                sub: decoded.sub || decoded.email,
                                email: decoded.email,
                                name: decoded.name || decoded.email.split('@')[0],
                                picture: decoded.picture || ''
                            },
                            { id_token: response.credential }
                        );
                    }
                },

                async handleGoogleOAuthTokenResponse(tokenResponse) {
                    if (this.googleWatchdogTimer) clearTimeout(this.googleWatchdogTimer);
                    if (!tokenResponse || !tokenResponse.access_token) {
                        this.isGoogleSigningIn = false;
                        return;
                    }
                    this.googleAccessToken = tokenResponse.access_token;
                    try {
                        const uRes = await fetchWithTimeout('https://www.googleapis.com/oauth2/v3/userinfo', {
                            headers: { Authorization: `Bearer ${tokenResponse.access_token}` }
                        }, 4500);
                        if (uRes.ok) {
                            const profile = await uRes.json();
                            if (profile && profile.email) {

                    } catch (e) {}
                    this.isGoogleSigningIn = false;
                    this.googleAuthError = this.lang === 'ID'

                triggerGoogleOAuthPopup() {
                    if (this.isGoogleSigningIn) return;
                    this.googleAuthError = '';
                    this.initGoogleIdentityServices();

                    if (!this.googleTokenClient) {
                        this.googleAuthError = this.lang === 'ID'
                            ? 'Layanan popup Google belum siap. Masukkan Email Google Anda di atas untuk masuk instan.'
                            : 'Google popup service not ready. Enter your Google Email above for instant sign-in.';
                        return;
                    }

                    this.isGoogleSigningIn = true;
                    if (this.googleWatchdogTimer) clearTimeout(this.googleWatchdogTimer);

                    const onWindowRefocus = () => {
                        window.removeEventListener('focus', onWindowRefocus);
                        setTimeout(() => {
                            if (this.isGoogleSigningIn && !this.googleUser) {
                                this.isGoogleSigningIn = false;
                                if (this.googleWatchdogTimer) clearTimeout(this.googleWatchdogTimer);
                                this.googleAuthError = this.lang === 'ID'
                                    ? 'Jendela Google ditutup atau domain belum terdaftar di Google Cloud Console. Gunakan Email Google di atas untuk masuk langsung.'
                                    : 'Google window closed or origin not registered in Google Cloud Console. Use Google Email above for instant login.';
                            }
                        }, 800);
                    };
                    window.addEventListener('focus', onWindowRefocus);

                    this.googleWatchdogTimer = setTimeout(() => {
                        window.removeEventListener('focus', onWindowRefocus);
                        if (this.isGoogleSigningIn) {
                            this.isGoogleSigningIn = false;
                            this.googleAuthError = this.lang === 'ID'
                                ? 'Koneksi OAuth selesai. Silakan masuk langsung menggunakan Email Google Anda di atas.'
                                : 'OAuth check completed. Please sign in directly with your Google Email above.';
                        }
                    }, 3500);

                    try {
                        this.googleTokenClient.requestAccessToken({ prompt: 'select_account' });
                    } catch (e) {
                        window.removeEventListener('focus', onWindowRefocus);
                        this.isGoogleSigningIn = false;
                        this.googleAuthError = this.lang === 'ID'
                            ? 'Popup diblokir browser. Gunakan Email Google di atas untuk masuk langsung.'
                            : 'Popup blocked by browser. Use Google Email above to sign in directly.';
