                },

                openEditAutomationModal(rule) {
                    this.editingRuleId = rule.id;
                    this.ruleForm = {
                        name: rule.name || '',
                        actionType: rule.actionType || 'auto_save_goal',
                        minAmount: Number(rule.minAmount || 0),
                        percent: Number(rule.percent || 20),
                        fixedAmount: Number(rule.fixedAmount || 50000),
                        targetGoalName: rule.targetGoalName || 'Dana Darurat',
                        targetCategory: rule.targetCategory || (this.categories[0] || 'Food'),
                        sourceWallet: rule.sourceWallet || '',
                        destWallet: rule.destWallet || (this.banks[1] || this.banks[0] || 'Bank Jago'),
                        thresholdAmount: Number(rule.thresholdAmount || 500000)
                    };
                    this.showAutomationModal = true;
                },

                activatePresetRule(presetKey) {
                    this.editingRuleId = null;
                    if (presetKey === 'save20') {
                        this.ruleForm = {
                            name: this.lang === 'ID' ? 'Sisihkan 20% Pemasukan' : 'Save 20% of Income',
                            actionType: 'auto_save_goal',
                            minAmount: 0,
                            percent: 20,
                            fixedAmount: 50000,
                            targetGoalName: 'Dana Darurat',
                            targetCategory: 'Food',
                            sourceWallet: '',
                            destWallet: this.banks[1] || this.banks[0] || 'Bank Jago',
                            thresholdAmount: 500000
                        };
                    } else {
                        this.ruleForm = {
                            name: this.lang === 'ID' ? 'Peringatan Pengeluaran > 500rb' : 'Expense Alert > 500k',
                            actionType: 'spend_alert',
                            minAmount: 0,
                            percent: 20,
                            fixedAmount: 50000,
                            targetGoalName: 'Dana Darurat',
                            targetCategory: 'Food',
                            sourceWallet: '',
                            destWallet: this.banks[1] || this.banks[0] || 'Bank Jago',
                            thresholdAmount: 500000
                        };
                    }
                    this.showAutomationModal = true;
                },

                async saveAutomationRule() {
                    const name = (this.ruleForm.name || '').trim();
                    if (!name) return;

                    let savedRule;
                    if (this.editingRuleId) {
                        const existing = this.automationRules.find(r => r.id === this.editingRuleId);
                        if (existing) {
                            Object.assign(existing, { ...this.ruleForm, name });
                            savedRule = existing;
                        }
                    } else {
                        savedRule = {
                            id: 'rule_' + Date.now(),
                            ...this.ruleForm,
                            name,
                            enabled: true,
                            runCount: 0
                        };
                        this.automationRules.push(savedRule);
                    }

                    this.saveLocalState();
                    this.showAutomationModal = false;
                    this.editingRuleId = null;

                    if (savedRule) {
                        try {
                            await fetch('/api/macros', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(savedRule)
                            });
                        } catch (e) {}
                    }
                    this.$nextTick(() => this.refreshIcons());
                },

                toggleRule(ruleId) {
                    const rule = this.automationRules.find(r => r.id === ruleId);
                    if (rule) {
                        rule.enabled = !rule.enabled;
                        this.saveLocalState();
                    }
                },

                async deleteRule(ruleId) {
                    this.automationRules = this.automationRules.filter(r => r.id !== ruleId);
                    this.saveLocalState();
                    try {
                        await fetch(`/api/macros/${encodeURIComponent(ruleId)}`, { method: 'DELETE' });
                    } catch (e) {}
                },

                describeRule(rule) {
                    const act = rule.actionType;
                    if (act === 'auto_save_goal') {
                        return this.lang === 'ID'
                            ? `Sisihkan ${rule.percent}% dari pemasukan ke target "${rule.targetGoalName || 'Dana Darurat'}"`
                            : `Allocate ${rule.percent}% of income to "${rule.targetGoalName || 'Dana Darurat'}"`;
                    }
                    if (act === 'fixed_save_goal') {
                        return this.lang === 'ID'
                            ? `Sisihkan ${this.formatCurrency(rule.fixedAmount)} setiap pemasukan ke "${rule.targetGoalName || 'Tabungan'}"`
                            : `Save ${this.formatCurrency(rule.fixedAmount)} per income to "${rule.targetGoalName || 'Savings'}"`;
                    }
                    if (act === 'auto_transfer_wallet') {
                        return this.lang === 'ID'
                            ? `Transfer otomatis ${rule.percent}% pemasukan ke ${rule.destWallet}`
                            : `Auto-transfer ${rule.percent}% of income to ${rule.destWallet}`;
                    }
                    if (act === 'expense_save_goal') {
                        return this.lang === 'ID'
                            ? `Sisihkan ${rule.percent}% dari setiap pengeluaran ke "${rule.targetGoalName}"`
                            : `Save ${rule.percent}% of every expense to "${rule.targetGoalName}"`;
                    }
                    if (act === 'expense_transfer_wallet') {
                        return this.lang === 'ID'
                            ? `Transfer ${rule.percent}% dari nominal pengeluaran ke ${rule.destWallet}`
                            : `Transfer ${rule.percent}% of expense amount to ${rule.destWallet}`;
                    }
                    if (act === 'category_spend_alert') {
                        return this.lang === 'ID'
                            ? `Peringatan jika pengeluaran ${rule.targetCategory} ≥ ${this.formatCurrency(rule.thresholdAmount)}`
                            : `Alert when ${rule.targetCategory} expense ≥ ${this.formatCurrency(rule.thresholdAmount)}`;
                    }
                    return this.lang === 'ID'
                        ? `Peringatan jika pengeluaran ≥ ${this.formatCurrency(rule.thresholdAmount)}`
                        : `Alert when single expense ≥ ${this.formatCurrency(rule.thresholdAmount)}`;
                },

                // ==========================================
                // CHARTS & VISUALIZATION (CHART.JS)
                // ==========================================
                updateAllCharts() {
                    this.renderTrendChart();
                    this.renderDoughnutChart();
                    this.renderWalletChart();
                },

                renderTrendChart() {
                    const canvas = document.getElementById('dashboardTrendChart');
                    if (!canvas || typeof Chart === 'undefined') return;

                    if (this.charts.trend) {
                        this.charts.trend.destroy();
                    }

                    const lastTx = [...this.transactions].slice(0, 10).reverse();
                    const labels = lastTx.length > 0
                        ? lastTx.map(t => (t.date || '').slice(5, 10) || t.category)
                        : [this.t('income'), this.t('expense')];
                    const incData = lastTx.length > 0
                        ? lastTx.map(t => t.type === 'income' ? Number(t.amount) : 0)
                        : [0, 0];
                    const expData = lastTx.length > 0
                        ? lastTx.map(t => (t.type === 'expense' || t.type === 'withdrawal') ? Number(t.amount) : 0)
                        : [0, 0];

                    const textColor = this.isDarkMode ? '#94A3B8' : '#64748B';
                    const gridColor = this.isDarkMode ? 'rgba(255,255,255,0.06)' : 'rgba(15,23,42,0.06)';

                    this.charts.trend = new Chart(canvas, {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [
                                {
                                    label: this.t('income'),
                                    data: incData,
                                    backgroundColor: '#10B981',
                                    borderRadius: 6
                                },
                                {
                                    label: this.t('expense'),
                                    data: expData,
                                    backgroundColor: '#2563EB',
                                    borderRadius: 6
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    labels: { color: textColor, font: { size: 11 } }
                                }
                            },
                            scales: {
                                x: { ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } },
                                y: { ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor } }
                            }
                        }
                    });
                },

                renderDoughnutChart() {
                    const canvas = document.getElementById('categoryDoughnutChart');
                    if (!canvas || typeof Chart === 'undefined') return;

                    if (this.charts.doughnut) {
                        this.charts.doughnut.destroy();
                    }

                    const catTotals = {};
                    for (const tx of this.transactions) {
                        if (tx.type === 'expense') {
                            catTotals[tx.category] = (catTotals[tx.category] || 0) + Number(tx.amount || 0);
                        }
                    }

                    const labels = Object.keys(catTotals);
                    const values = Object.values(catTotals);
                    const textColor = this.isDarkMode ? '#CBD5E1' : '#334155';

                    this.charts.doughnut = new Chart(canvas, {
                        type: 'doughnut',
                        data: {
                            labels: labels.length ? labels : ['No Data'],
                            datasets: [{
                                data: values.length ? values : [1],
                                backgroundColor: values.length
                                    ? ['#2563EB', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#06B6D4', '#EC4899']
                                    : ['#E2E8F0'],
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '68%',
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: textColor, font: { size: 11 }, padding: 12 }
                                }
                            }
                        }
                    });
                },

                renderWalletChart() {
                    const canvas = document.getElementById('walletBarChart');
                    if (!canvas || typeof Chart === 'undefined') return;

                    if (this.charts.wallet) {
                        this.charts.wallet.destroy();
                    }

                    const labels = this.banks;
                    const values = this.banks.map(b => this.getWalletBalance(b));
                    const textColor = this.isDarkMode ? '#94A3B8' : '#64748B';
                    const gridColor = this.isDarkMode ? 'rgba(255,255,255,0.06)' : 'rgba(15,23,42,0.06)';

                    this.charts.wallet = new Chart(canvas, {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [{
                                label: this.t('wallet_distribution'),
                                data: values,
                                backgroundColor: '#2563EB',
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } },
                                y: { ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor } }
                            }
                        }
                    });
                },

                // ==========================================
                // AI FINANCIAL INTELLIGENCE ASSISTANT
                // ==========================================
                buildFinancialContext() {
                    const walletSummary = this.banks.map(b => `${b}: ${this.formatCurrency(this.getWalletBalance(b))}`).join(', ');
                    return [
                        `Total Balance: ${this.formatCurrency(this.totalBalance)}`,
                        `Total Income: ${this.formatCurrency(this.totalIncome)}`,
                        `Total Expense: ${this.formatCurrency(this.totalExpense + this.totalWithdrawal)}`,
                        `Wallets: ${walletSummary}`,
                        `Goals Count: ${this.goals.length}, Budgets Count: ${this.budgets.length}, Autopilot Rules: ${this.automationRules.length}`
                    ].join('\n');
                },

                async runQuickAudit() {
                    const prompt = this.lang === 'ID'
                        ? 'Lakukan audit keuangan lengkap berdasarkan data transaksi, saldo dompet, dan target tabungan saya.'
                        : 'Perform a complete financial audit based on my transactions, wallet balances, and savings goals.';
                    await this.sendAiRequest(prompt);
                },

                async askAiPreset(presetText) {
                    await this.sendAiRequest(presetText);
                },

                async submitAiPrompt() {
                    const q = (this.aiInput || '').trim();
                    if (!q) return;
                    this.aiInput = '';
                    await this.sendAiRequest(q);
                },

                async sendAiRequest(promptText) {
                    this.aiMessages.push({ role: 'user', text: promptText });
                    this.isAiLoading = true;
                    try {
                        const res = await fetch('/api/ai/analyze', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                prompt: promptText,
                                lang: this.lang,
                                currency: this.currency,
                                financial_context: this.buildFinancialContext(),
                                transactions: this.transactions
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            this.aiMessages.push({
                                role: 'ai',
                                text: data.analysis || (this.lang === 'ID' ? 'Analisis selesai.' : 'Analysis completed.')
                            });
                        } else {
                            this.aiMessages.push({
                                role: 'ai',
                                text: this.lang === 'ID'
                                    ? 'Ringkasan: Saldo bersih Anda saat ini ' + this.formatCurrency(this.totalBalance) + '.'
                                    : 'Summary: Your current net balance is ' + this.formatCurrency(this.totalBalance) + '.'
                            });
                        }
                    } catch (e) {
                        this.aiMessages.push({
                            role: 'ai',
                            text: this.lang === 'ID'
                                ? 'Saldo bersih tercatat: ' + this.formatCurrency(this.totalBalance)
                                : 'Recorded net balance: ' + this.formatCurrency(this.totalBalance)
                        });
                    } finally {
                        this.isAiLoading = false;
                    }
                },

                formatMarkdownLight(text) {
                    return String(text || '')
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/^### (.*$)/gm, '<div class="font-bold text-sm mt-1 mb-1">$1</div>');
                },

                copyToClipboard(text) {
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(text);
                        this.showToast(this.lang === 'ID' ? 'Teks disalin!' : 'Copied to clipboard!');
                    }
                },

                // ==========================================
                // EXCEL & PDF REPORT EXPORT
                // ==========================================
                async exportToExcel() {
                    const emailParam = this.googleUser && this.googleUser.email ? `&email=${encodeURIComponent(this.googleUser.email)}` : '';
                    try {
                        const res = await fetch(`/api/export/excel?lang=${this.lang}${emailParam}`);
                        if (res.ok) {
                            const blob = await res.blob();
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `DND_Financial_Report_${this.lang}.xlsx`;
                            document.body.appendChild(a);
                            a.click();
                            a.remove();
                            URL.revokeObjectURL(url);
                            this.showToast(this.lang === 'ID' ? 'Laporan Excel diunduh!' : 'Excel report downloaded!');
                            return;
                        }
                    } catch (e) {}

                    if (window.XLSX) {
                        const ws = XLSX.utils.json_to_sheet(this.transactions);
                        const wb = XLSX.utils.book_new();
                        XLSX.utils.book_append_sheet(wb, ws, 'Transactions');
                        XLSX.writeFile(wb, `DND_Financial_Report_${this.lang}.xlsx`);
                    }
                },

                async exportToPDF() {
                    const emailParam = this.googleUser && this.googleUser.email ? `&email=${encodeURIComponent(this.googleUser.email)}` : '';
                    try {
                        const res = await fetch(`/api/export/pdf?lang=${this.lang}${emailParam}`);
                        if (res.ok) {
                            const blob = await res.blob();
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `DND_Financial_Report_${this.lang}.pdf`;
                            document.body.appendChild(a);
                            a.click();
                            a.remove();
                            URL.revokeObjectURL(url);
                            this.showToast(this.lang === 'ID' ? 'Laporan PDF diunduh!' : 'PDF report downloaded!');
                            return;
                        }
                    } catch (e) {}

                    if (window.jspdf && window.jspdf.jsPDF) {
                        const doc = new window.jspdf.jsPDF();
                        doc.text('DND Finance Financial Report', 14, 16);
                        if (typeof doc.autoTable === 'function') {
                            doc.autoTable({
                                startY: 22,
                                head: [['Date', 'Category', 'Type', 'Wallet', 'Amount']],
                                body: this.transactions.map(t => [t.date, t.category, t.type, t.account, this.formatCurrency(t.amount)])
                            });
                        }
                        doc.save(`DND_Financial_Report_${this.lang}.pdf`);
                    }
                }
            };
        }
    </script>
</body>
</html>
