                        this.showToast('Library PDF belum siap.');
                        return;
                    }
                    const rpt = this.buildCorporateKpiReportData();
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                    const pageW = doc.internal.pageSize.getWidth();
                    const pageH = doc.internal.pageSize.getHeight();
                    const margin = 14;

                    doc.setFillColor(15, 23, 42);
                    doc.rect(0, 0, pageW, 34, 'F');
                    doc.setFillColor(37, 99, 235);
                    doc.rect(0, 34, pageW, 2, 'F');

                    doc.setTextColor(255, 255, 255);
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(16);
                    doc.text('DND FINANCE', margin, 13);

                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(8.5);
                    doc.setTextColor(191, 219, 254);
                    doc.text('CORPORATE FINANCIAL & KPI PERFORMANCE STATEMENT', margin, 19);

                    doc.setFontSize(7.5);
                    doc.setTextColor(203, 213, 225);
                    doc.text(`Ref: ${rpt.docRef}`, pageW - margin, 12, { align: 'right' });
                    doc.text(`Periode: ${rpt.reportPeriod} | Currency: ${rpt.currency}`, pageW - margin, 17.5, { align: 'right' });
                    doc.text(`Dicetak: ${rpt.generatedAt}`, pageW - margin, 23, { align: 'right' });
                    doc.text(`Entitas: ${rpt.entityName} (${rpt.accountEmail})`, margin, 28);

                    let curY = 42;
                    const cardGap = 3.5;
                    const cardW = (pageW - margin * 2 - cardGap * 3) / 4;
                    const cardH = 19;

                    const kpiCards = [
                        {
                            title: 'TOTAL REVENUE (INFLOW)',
                            value: this.formatCurrency(rpt.totalIn),
                            sub: `${this.transactions.filter(t => t.type === 'income').length} Transaksi Masuk`,
                            border: [16, 185, 129],
                            bg: [236, 253, 245],
                            valColor: [6, 95, 70]
                        },
                        {
                            title: 'TOTAL OPEX (OUTFLOW)',
                            value: this.formatCurrency(rpt.totalOut),
                            sub: `Rasio Beban: ${rpt.expenseRatio}%`,
                            border: [244, 63, 94],
                            bg: [255, 241, 242],
                            valColor: [159, 18, 57]
                        },
                        {
                            title: 'NET OPERATING CASHFLOW',
                            value: this.formatCurrency(rpt.netCash),
                            sub: rpt.netCash >= 0 ? 'Status: Surplus Kas' : 'Status: Defisit Kas',
                            border: [37, 99, 235],
                            bg: [239, 246, 255],
                            valColor: [30, 64, 175]
                        },
                        {
                            title: 'COMPOSITE HEALTH KPI',
                            value: `${this.quantIntel.health_score} / 100`,
                            sub: `Savings Margin: ${this.quantIntel.savings_rate_pct}%`,
                            border: [245, 158, 11],
                            bg: [255, 251, 235],
                            valColor: [146, 64, 14]
                        }
                    ];

                    kpiCards.forEach((card, idx) => {
                        const x = margin + idx * (cardW + cardGap);
                        doc.setFillColor(...card.bg);
                        doc.setDrawColor(...card.border);
                        doc.setLineWidth(0.35);
                        doc.roundedRect(x, curY, cardW, cardH, 2, 2, 'FD');

                        doc.setFont('helvetica', 'bold');
                        doc.setFontSize(6.2);
                        doc.setTextColor(71, 85, 105);
                        doc.text(card.title, x + 2.5, curY + 5);

                        doc.setFontSize(8.8);
                        doc.setTextColor(...card.valColor);
                        doc.text(String(card.value).slice(0, 20), x + 2.5, curY + 11.5);

                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(6.2);
                        doc.setTextColor(100, 116, 139);
                        doc.text(card.sub, x + 2.5, curY + 16.2);
                    });

                    curY += cardH + 7;

                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(9.5);
                    doc.setTextColor(15, 23, 42);
                    doc.text('1. EXECUTIVE FINANCIAL KPI & LIQUIDITY SCORECARD', margin, curY);
                    curY += 2.5;

                    doc.autoTable({
                        startY: curY,
                        margin: { left: margin, right: margin },
                        head: [['Kode', 'Indikator Kinerja Utama (KPI)', 'Nilai Aktual', 'Benchmark Target', 'Status']],
                        body: [
                            ['KPI-01', 'Net Savings Margin (Rasio Tabungan Bersih)', `${this.quantIntel.savings_rate_pct}%`, '>= 20.0%', this.quantIntel.savings_rate_pct >= 20 ? 'OPTIMAL' : 'DEVELOPING'],
                            ['KPI-02', 'Expense-to-Income Ratio (Rasio Beban)', `${rpt.expenseRatio}%`, '<= 80.0%', rpt.expenseRatio <= 80 ? 'CONTROLLED' : 'HIGH OPEX'],
                            ['KPI-03', 'Daily Burn Rate (Tingkat Pengeluaran Harian)', this.formatCurrency(this.quantIntel.daily_burn_rate), 'Terkendali', 'MONITORED'],
                            ['KPI-04', 'Monthly Burn Run-Rate (Estimasi Beban Bulanan)', this.formatCurrency(this.quantIntel.monthly_burn_est), 'Baseline Bulanan', 'MONITORED'],
                            ['KPI-05', 'Cash Runway (Ketahanan Likuiditas Kas)', `${this.quantIntel.runway_days >= 999 ? '999+' : this.quantIntel.runway_days} Hari`, '>= 180 Hari', this.quantIntel.runway_days >= 180 ? 'STRONG' : 'BUILDING'],
                            ['KPI-06', 'Proyeksi Akumulasi Kas 6 Bulan (20% Pace)', this.formatCurrency(this.quantIntel.forecast.smart_20pct_6m), 'Target Pertumbuhan', 'PROJECTED']
                        ],
                        styles: { fontSize: 7.5, cellPadding: 2.2, textColor: [30, 41, 59] },
                        headStyles: { fillColor: [15, 23, 42], textColor: [255, 255, 255], fontStyle: 'bold' },
                        alternateRowStyles: { fillColor: [248, 250, 252] },
                        columnStyles: {
                            0: { cellWidth: 16, fontStyle: 'bold' },
                            2: { halign: 'right', fontStyle: 'bold' },
                            3: { halign: 'right' },
                            4: { halign: 'center', fontStyle: 'bold' }
                        }
                    });

                    curY = doc.lastAutoTable.finalY + 7;

                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(9.5);
                    doc.setTextColor(15, 23, 42);
                    doc.text('2. TREASURY & WALLET CASH POSITION (POSISI REKENING)', margin, curY);
                    curY += 2.5;

                    doc.autoTable({
                        startY: curY,
                        margin: { left: margin, right: margin },
                        head: [['No.', 'Nama Rekening / Dompet', 'Saldo Akhir', 'Porsi Kas (%)', 'Status Likuiditas']],
                        body: rpt.walletRows.map(w => [
                            w.no,
                            w.account,
                            this.formatCurrency(w.balance),
                            `${w.sharePct}%`,
                            w.balance >= 0 ? 'ACTIVE / LIQUID' : 'OVERDRAWN'
                        ]),
                        foot: [['', 'TOTAL SALDO LIKUIDITAS BERSIH', this.formatCurrency(rpt.netCash), '100%', 'VERIFIED']],
                        showFoot: 'lastPage',
                        styles: { fontSize: 7.5, cellPadding: 2.2, textColor: [30, 41, 59] },
                        headStyles: { fillColor: [37, 99, 235], textColor: [255, 255, 255], fontStyle: 'bold' },
                        footStyles: { fillColor: [239, 246, 255], textColor: [15, 23, 42], fontStyle: 'bold' },
                        alternateRowStyles: { fillColor: [248, 250, 252] },
                        columnStyles: {
                            0: { cellWidth: 12, halign: 'center' },
                            2: { halign: 'right', fontStyle: 'bold' },
                            3: { halign: 'right' },
                            4: { halign: 'center', fontStyle: 'bold' }
                        }
                    });

                    curY = doc.lastAutoTable.finalY + 7;

                    if (rpt.categoryRows.length > 0) {
                        if (curY > pageH - 45) {
                            doc.addPage();
                            curY = 18;
                        }
                        doc.setFont('helvetica', 'bold');
                        doc.setFontSize(9.5);
                        doc.setTextColor(15, 23, 42);
                        doc.text('3. CATEGORY PERFORMANCE & COST STRUCTURE BREAKDOWN', margin, curY);
                        curY += 2.5;

                        doc.autoTable({
                            startY: curY,
                            margin: { left: margin, right: margin },
                            head: [['No.', 'Klasifikasi', 'Kategori Akun', 'Frekuensi', 'Total Nominal', 'Porsi (%)']],
                            body: rpt.categoryRows.map(c => [
                                c.no,
                                c.typeLabel,
                                c.category,
                                `${c.count}x`,
                                this.formatCurrency(c.total),
                                `${c.sharePct}%`
                            ]),
                            styles: { fontSize: 7.5, cellPadding: 2.2, textColor: [30, 41, 59] },
                            headStyles: { fillColor: [30, 41, 59], textColor: [255, 255, 255], fontStyle: 'bold' },
                            alternateRowStyles: { fillColor: [248, 250, 252] },
                            columnStyles: {
                                0: { cellWidth: 12, halign: 'center' },
                                3: { halign: 'center' },
                                4: { halign: 'right', fontStyle: 'bold' },
                                5: { halign: 'right' }
                            }
                        });

                        curY = doc.lastAutoTable.finalY + 7;
                    }

                    if (curY > pageH - 45) {
                        doc.addPage();
                        curY = 18;
                    }
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(9.5);
                    doc.setTextColor(15, 23, 42);
                    doc.text('4. GENERAL LEDGER — RINCIAN BUKU BESAR TRANSAKSI', margin, curY);
                    curY += 2.5;

                    const ledgerBody = rpt.ledgerRows.length > 0
                        ? rpt.ledgerRows.map(r => [
                            r.no,
                            r.date,
                            r.category,
                            r.account + (r.toAccount && r.toAccount !== '-' ? ` -> ${r.toAccount}` : ''),
                            r.note,
                            r.credit > 0 ? this.formatCurrency(r.credit) : '-',
                            r.debit > 0 ? this.formatCurrency(r.debit) : (r.transferAmt > 0 ? this.formatCurrency(r.transferAmt) : '-')
                        ])
                        : [['-', '-', '-', '-', 'Belum ada transaksi tercatat', '-', '-']];

                    doc.autoTable({
                        startY: curY,
                        margin: { left: margin, right: margin, bottom: 18 },
                        head: [['No.', 'Tanggal', 'Kategori', 'Rekening', 'Keterangan / Uraian', 'Kredit (+)', 'Debit (-)']],
                        body: ledgerBody,
                        foot: [['', '', '', '', 'TOTAL MUTASI BUKU BESAR', this.formatCurrency(rpt.totalIn), this.formatCurrency(rpt.totalOut)]],
                        showFoot: 'lastPage',
                        styles: { fontSize: 7, cellPadding: 2, textColor: [30, 41, 59] },
                        headStyles: { fillColor: [15, 23, 42], textColor: [255, 255, 255], fontStyle: 'bold' },
                        footStyles: { fillColor: [241, 245, 249], textColor: [15, 23, 42], fontStyle: 'bold' },
                        alternateRowStyles: { fillColor: [248, 250, 252] },
                        columnStyles: {
                            0: { cellWidth: 9, halign: 'center' },
                            1: { cellWidth: 25 },
                            2: { cellWidth: 22 },
                            3: { cellWidth: 24 },
                            5: { halign: 'right', textColor: [5, 150, 105], fontStyle: 'bold' },
                            6: { halign: 'right', textColor: [225, 29, 72], fontStyle: 'bold' }
                        }
                    });

                    const totalPages = doc.internal.getNumberOfPages();
                    for (let p = 1; p <= totalPages; p++) {
                        doc.setPage(p);
                        doc.setDrawColor(203, 213, 225);
                        doc.setLineWidth(0.25);
                        doc.line(margin, pageH - 12, pageW - margin, pageH - 12);

                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(7);
                        doc.setTextColor(100, 116, 139);
                        doc.text(
                            `DND Finance Corporate KPI Statement • Ref: ${rpt.docRef} • Confidential`,
                            margin,
                            pageH - 7.5
                        );
                        doc.text(
                            `Halaman ${p} dari ${totalPages}`,
                            pageW - margin,
                            pageH - 7.5,
                            { align: 'right' }
                        );
                    }

                    const fileName = `DND_Finance_Corporate_KPI_Report_${new Date().toISOString().slice(0, 10)}.pdf`;
                    const pdfBuffer = doc.output('arraybuffer');
                    const sha256 = await computeSha256Short(pdfBuffer);

                    doc.save(fileName);

                    const repRecord = {
                        id: 'rep_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                        account_key: this.resolvedAccountKey,
                        filename: fileName,
                        file_format: 'PDF',
                        direction: 'EXPORT',
                        tx_count: this.transactions.length,
                        total_income: this.totalIncome,
                        total_expense: this.totalExpense + this.totalWithdrawal,
                        net_balance: this.totalBalance,
                        checksum_sha256: sha256,
                        created_at: new Date().toISOString()
                    };
                    await _dndLocalDb.addReportFile(repRecord);
                    fetchWithTimeout('/api/db/report', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(repRecord)
                    }, 4000).catch(() => {});
                    await this.fetchReportHistory();
                    this.showToast(this.lang === 'ID' ? 'Laporan Keuangan PDF KPI berhasil diunduh.' : 'Corporate PDF KPI Report downloaded.');
                },

                copyToClipboard(text) {
                    if (!text) return;
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(stripAllEmojis(text));
                        this.showToast(this.lang === 'ID' ? 'Teks disalin ke clipboard.' : 'Copied to clipboard.');
                    }
                },

                updateAllCharts() {
                    if (typeof Chart === 'undefined') return;
                    this.renderTrendChart();
                    this.renderAnalyticsCashflowChart();
                    this.renderUnifiedCategoryChart();
                    this.renderWalletChart();
                },

                buildCashflowSeries(groupMode = 'date') {
                    const sorted = [...this.transactions].sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
                    if (sorted.length === 0) {
                        const todayShort = new Date().toISOString().slice(5, 10);
                        return { labels: [todayShort], incomeData: [0], expenseData: [0] };
                    }

                    if (groupMode === 'tx') {
                        const recent = sorted.slice(-14);
                        return {
                            labels: recent.map((tx, idx) => {
                                const shortLabel = (tx.note || tx.category || `#${idx + 1}`).slice(0, 12);
                                return `${String(tx.date || '').slice(5, 10)} ${shortLabel}`;
                            }),
                            incomeData: recent.map(tx => tx.type === 'income' ? Number(tx.amount || 0) : 0),
                            expenseData: recent.map(tx => (tx.type === 'expense' || tx.type === 'withdrawal') ? Number(tx.amount || 0) : 0)
                        };
                    }

                    const dateMap = {};
                    for (const tx of sorted) {
                        const fullD = String(tx.date || '').slice(0, 10) || new Date().toISOString().slice(0, 10);
                        if (!dateMap[fullD]) dateMap[fullD] = { income: 0, expense: 0 };
                        if (tx.type === 'income') dateMap[fullD].income += Number(tx.amount || 0);
                        else if (tx.type === 'expense' || tx.type === 'withdrawal') dateMap[fullD].expense += Number(tx.amount || 0);
                    }
                    const fullKeys = Object.keys(dateMap).slice(-14);
                    return {
                        labels: fullKeys.map(d => d.length >= 10 ? d.slice(5, 10) : d),
                        incomeData: fullKeys.map(d => dateMap[d].income),
                        expenseData: fullKeys.map(d => dateMap[d].expense)
                    };
                },

                renderTrendChart() {
                    const canvas = document.getElementById('dashboardTrendChart');
                    if (!canvas || typeof Chart === 'undefined') return;
                    const rect = canvas.parentElement ? canvas.parentElement.getBoundingClientRect() : { width: 300, height: 190 };
                    if (rect.width < 10 || rect.height < 10) return;

                    if (_dndChartInstances.trend) {
                        try { _dndChartInstances.trend.destroy(); } catch (e) {}
                        _dndChartInstances.trend = null;
                    }

                    const series = this.buildCashflowSeries('date');
                    const textColor = this.isDarkMode ? '#94A3B8' : '#64748B';
                    const gridColor = this.isDarkMode ? 'rgba(255,255,255,0.06)' : 'rgba(15,23,42,0.06)';

                    _dndChartInstances.trend = new Chart(canvas.getContext('2d'), {
                        type: 'bar',
                        data: {
                            labels: series.labels,
                            datasets: [
                                {
                                    label: this.t('income'),
                                    data: series.incomeData,
                                    backgroundColor: '#10B981',
                                    hoverBackgroundColor: '#34D399',
                                    borderRadius: { topLeft: 8, topRight: 8, bottomLeft: 2, bottomRight: 2 },
                                    borderSkipped: false,
                                    barPercentage: 0.55,
                                    categoryPercentage: 0.65
                                },
                                {
                                    label: this.t('expense'),
                                    data: series.expenseData,
                                    backgroundColor: '#F43F5E',
                                    hoverBackgroundColor: '#FB7185',
                                    borderRadius: { topLeft: 8, topRight: 8, bottomLeft: 2, bottomRight: 2 },
                                    borderSkipped: false,
                                    barPercentage: 0.55,
                                    categoryPercentage: 0.65
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: { duration: 500 },
                            plugins: {
                                legend: {
                                    position: 'top',
                                    align: 'center',
                                    labels: {
                                        color: textColor,
                                        usePointStyle: false,
                                        boxWidth: 28,
                                        boxHeight: 11,
                                        padding: 14,
                                        font: { size: 11, weight: '600' }
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    ticks: { color: textColor, font: { size: 10 } },
                                    grid: { display: false }
                                },
                                y: {
                                    beginAtZero: true,
                                    ticks: { color: textColor, font: { size: 10 } },
                                    grid: { color: gridColor }
                                }
                            }
                        }
                    });
                },

                renderAnalyticsCashflowChart() {
                    const canvas = document.getElementById('analyticsCashflowChart');
                    if (!canvas || typeof Chart === 'undefined') return;
                    const rect = canvas.parentElement ? canvas.parentElement.getBoundingClientRect() : { width: 300, height: 220 };
                    if (rect.width < 10 || rect.height < 10) return;

                    if (_dndChartInstances.analyticsCashflow) {
                        try { _dndChartInstances.analyticsCashflow.destroy(); } catch (e) {}
                        _dndChartInstances.analyticsCashflow = null;
                    }

                    const series = this.buildCashflowSeries(this.cashflowChartGroup);
                    const textColor = this.isDarkMode ? '#94A3B8' : '#64748B';
                    const gridColor = this.isDarkMode ? 'rgba(255,255,255,0.06)' : 'rgba(15,23,42,0.06)';

                    _dndChartInstances.analyticsCashflow = new Chart(canvas.getContext('2d'), {
                        type: 'bar',
                        data: {
                            labels: series.labels,
                            datasets: [
                                {
                                    label: this.t('income'),
                                    data: series.incomeData,
                                    backgroundColor: '#10B981',
                                    borderRadius: 6
                                },
                                {
                                    label: this.t('expense'),
                                    data: series.expenseData,
                                    backgroundColor: '#F43F5E',
                                    borderRadius: 6
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: { duration: 480 },
                            plugins: {
                                legend: { labels: { color: textColor, font: { size: 11, weight: 'bold' } } }
                            },
                            scales: {
                                x: { ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } },
                                y: { beginAtZero: true, ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor } }
                            }
                        }
                    });
                },

                renderUnifiedCategoryChart() {
                    const canvas = document.getElementById('unifiedCategoryChart');
                    if (!canvas || typeof Chart === 'undefined') return;
                    const rect = canvas.parentElement ? canvas.parentElement.getBoundingClientRect() : { width: 170, height: 170 };
                    if (rect.width < 10 || rect.height < 10) return;

                    if (_dndChartInstances.unifiedCategory) {
                        try { _dndChartInstances.unifiedCategory.destroy(); } catch (e) {}
                        _dndChartInstances.unifiedCategory = null;
                    }

                    const items = this.unifiedCategoryBreakdown;
                    const labels = items.length ? items.map(i => i.category) : ['No Data'];
                    const values = items.length ? items.map(i => i.amount) : [1];
                    const colors = items.length ? items.map(i => i.color) : ['#CBD5E1'];

                    _dndChartInstances.unifiedCategory = new Chart(canvas.getContext('2d'), {
                        type: 'doughnut',
                        data: {
                            labels,
                            datasets: [{
                                data: values,
                                backgroundColor: colors,
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: { duration: 480 },
                            cutout: '66%',
                            plugins: { legend: { display: false } }
                        }
                    });
                },

                renderWalletChart() {
                    const canvas = document.getElementById('walletBarChart');
                    if (!canvas || typeof Chart === 'undefined') return;
                    const rect = canvas.parentElement ? canvas.parentElement.getBoundingClientRect() : { width: 300, height: 210 };
                    if (rect.width < 10 || rect.height < 10) return;

                    if (_dndChartInstances.wallet) {
                        try { _dndChartInstances.wallet.destroy(); } catch (e) {}
                        _dndChartInstances.wallet = null;
                    }

                    const balances = this.banks.map(b => this.getWalletBalance(b));
                    const textColor = this.isDarkMode ? '#94A3B8' : '#64748B';
                    const gridColor = this.isDarkMode ? 'rgba(255,255,255,0.06)' : 'rgba(15,23,42,0.06)';

                    _dndChartInstances.wallet = new Chart(canvas.getContext('2d'), {
                        type: 'bar',
                        data: {
                            labels: this.banks,
                            datasets: [{
                                label: this.t('wallet_label'),
                                data: balances,
                                backgroundColor: balances.map(v => v >= 0 ? '#2563EB' : '#F43F5E'),
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: { duration: 480 },
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } },
                                y: { ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor } }
                            }
                        }
                    });
                }
            };
        }
    </script>
</body>
</html>
